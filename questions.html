<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2f23">
<title>CSI 1 - Questions spécifiques</title>
<style>
:root{--green:#1f6f50;--deep:#0b2f23;--cream:#fbf7ed;--panel:#fff;--text:#1d261f;--muted:#66746b;--line:rgba(11,47,35,.14);--soft:#dceee3;--shadow:0 18px 45px rgba(11,47,35,.14)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 2%,rgba(119,184,146,.23),transparent 31%),radial-gradient(circle at 92% 28%,rgba(220,238,227,.7),transparent 35%),linear-gradient(180deg,var(--cream),#f3faf5)}
header{position:fixed;z-index:10;top:16px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100vw - 28px));height:48px;padding:7px 10px 7px 14px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;background:rgba(251,247,237,.94);box-shadow:0 12px 30px rgba(11,47,35,.1);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:950}.mark{width:30px;height:30px;border-radius:12px;background:linear-gradient(135deg,var(--deep),var(--green));position:relative}.mark:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;right:5px;top:5px}.actions{display:flex;gap:7px}.btn{border:0;border-radius:999px;padding:8px 13px;background:transparent;color:var(--text);font-weight:850;cursor:pointer}.btn:hover{background:var(--soft);color:var(--deep)}
main{height:100%;padding:96px clamp(34px,5vw,88px) 80px;display:flex;align-items:flex-start;justify-content:center}.slide{width:min(1480px,100%);min-height:calc(100vh - 176px);border:1px solid var(--line);border-radius:36px;background:rgba(255,255,255,.84);box-shadow:var(--shadow);padding:clamp(34px,5vw,74px);display:flex;flex-direction:column}.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:950;color:var(--green);margin-bottom:12px}.slide h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.4rem,5vw,5.2rem);line-height:.98;letter-spacing:-.045em;color:var(--deep);margin:0}.lead{font-size:1.05rem;color:var(--muted);margin:18px 0 0;max-width:900px}.blank{flex:1;min-height:300px;margin-top:34px;border:2px dashed rgba(31,111,80,.22);border-radius:28px;background:linear-gradient(145deg,rgba(220,238,227,.28),rgba(255,255,255,.48));display:grid;place-items:center;color:rgba(29,38,31,.34);font-size:.9rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(251,247,237,.94);font-size:.78rem;font-weight:850;color:var(--muted)}
@media(max-height:720px){main{padding-top:80px;padding-bottom:62px}.slide{min-height:calc(100vh - 142px);padding:30px}.blank{margin-top:22px;min-height:220px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark"></span><span>CSI 1 - Questions spécifiques</span></div><div class="actions"><button class="btn" id="back">Retour au diaporama</button></div></header>
<main><section class="slide" aria-label="Questions spécifiques"><div class="kicker">Slides cachées - espace de réserve</div><h1>Questions spécifiques</h1><p class="lead">Page volontairement laissée vierge. Les diapositives de réponse pourront être ajoutées ici au fur et à mesure des besoins du CSI.</p><div class="blank">Réserve de diapositives</div></section></main>
<div class="footer"><span>Hors séquence principale</span><span>•</span><span>01</span></div>
<script>document.getElementById('back').addEventListener('click',()=>location.href='presentation.html');</script>
</body>
</html>
