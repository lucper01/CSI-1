<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <title>CSI 1 - Luc Perroquin</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#143d2e,#07130f 58%);color:#edf8f0;transition:opacity .25s ease}
    #boot.hidden{opacity:0;pointer-events:none}
    .boot-card{width:min(520px,calc(100vw - 40px));padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
    .boot-kicker{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9ccbb0}.boot-card h1{margin:8px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.05}.boot-card p{margin:0;color:rgba(237,248,240,.72);line-height:1.5}.bar{height:5px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar span{display:block;width:38%;height:100%;border-radius:inherit;background:#77b892;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(165%)}}
    .boot-error{margin-top:16px;padding:12px 14px;border-radius:15px;background:#4a1f25;color:#ffe8ea;display:none;white-space:pre-wrap;font-size:.84rem}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="boot-kicker">CSI-1 - version actuelle</div><h1>Chargement de la présentation</h1><p>Préparation du support, des notes et des interactions.</p><div class="bar"><span></span></div><div class="boot-error" id="bootError"></div></div></div>
  <iframe id="presentation" title="CSI 1 - Luc Perroquin" allowfullscreen></iframe>
  <script>
  (()=>{
    const SOURCE='e3ec47385a42f318469eb06f72cf659f07fcdeae';
    const ROOT=`https://raw.githubusercontent.com/lucper01/CSI-1/${SOURCE}/`;
    const files=['csi-v11-core.js','csi-v11-doctoral.js','csi-v11-ui.js','csi-v11-enfix.js','csi-v11-polish.js','csi-v11-clean.js','csi-v12.js','csi-v13.js'];
    const frame=document.getElementById('presentation'),boot=document.getElementById('boot'),err=document.getElementById('bootError');
    const get=async path=>{const r=await fetch(ROOT+path,{cache:'force-cache'});if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);return r.text()};

    const portfolioPhotos={
      'Luc PERROQUIN':{src:'https://raw.githubusercontent.com/lucper01/Portfolio/main/assets/photo-profil.png',fit:'contain',position:'center'},
      'Renaud BROCHARD':{src:'https://raw.githubusercontent.com/lucper01/Portfolio/main/assets/renaud.jpg',fit:'contain',position:'center'},
      'Arnaud LELEU':{src:'https://raw.githubusercontent.com/lucper01/Portfolio/main/assets/arnaud.jpg',fit:'contain',position:'center'}
    };
    function ensurePortraitStyles(){
      try{
        const d=frame.contentDocument;if(!d||d.getElementById('csiPortraitFix'))return;
        const s=d.createElement('style');s.id='csiPortraitFix';s.textContent=`
          .csi-people-grid{align-items:stretch!important}
          .csi-person{min-height:315px!important}
          .csi-photo{height:154px!important;padding:0!important;overflow:hidden!important;border-style:solid!important;background:color-mix(in srgb,var(--white) 92%,var(--accent-pale))!important}
          .csi-person.primary .csi-photo{background:rgba(255,255,255,.94)!important}
          .csi-photo img{width:100%!important;height:100%!important;display:block!important;border-radius:15px!important}
          @media(max-width:1250px){.csi-person{min-height:300px!important}.csi-photo{height:170px!important}}
        `;d.head.appendChild(s);
      }catch(e){}
    }
    function applyPortfolioPhotos(){
      try{
        const d=frame.contentDocument;if(!d)return;ensurePortraitStyles();
        Object.entries(portfolioPhotos).forEach(([name,cfg])=>{
          d.querySelectorAll('.csi-person h3').forEach(h=>{
            if(h.textContent.trim().toLowerCase()!==name.toLowerCase())return;
            const card=h.closest('.csi-person'),slot=card&&card.querySelector('.csi-photo');
            if(!slot)return;
            const current=slot.querySelector('img');
            if(current&&current.dataset.portfolioPerson===name)return;
            slot.innerHTML=`<img data-portfolio-person="${name}" src="${cfg.src}" alt="${name}" style="object-fit:${cfg.fit};object-position:${cfg.position};">`;
            slot.dataset.photoApplied='1';
          });
        });
      }catch(e){console.warn('Portfolio photos',e)}
    }
    function keepPortfolioPhotosSynced(){
      applyPortfolioPhotos();
      try{
        const d=frame.contentDocument;if(!d||!d.body)return;
        const obs=new MutationObserver(()=>applyPortfolioPhotos());
        obs.observe(d.body,{childList:true,subtree:true});
        [100,250,500,900,1500,2500].forEach(ms=>setTimeout(applyPortfolioPhotos,ms));
      }catch(e){}
    }

    async function start(){
      try{
        const [base,...scripts]=await Promise.all([get('presentation-base.html'),...files.map(get)]);
        scripts.forEach((code,i)=>{try{(0,eval)(`${code}\n//# sourceURL=${files[i]}`)}catch(e){throw new Error(`${files[i]}: ${e.message}`)}});
        frame.addEventListener('load',()=>{keepPortfolioPhotosSynced();setTimeout(()=>boot.classList.add('hidden'),260)},{once:true});
        frame.srcdoc=base;
      }catch(e){console.error(e);err.style.display='block';err.textContent='Impossible de charger la présentation.\n'+e.message;document.querySelector('.bar').style.display='none'}
    }
    start();
  })();
  </script>
</body>
</html>
