<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <title>CSI 1 - Luc Perroquin</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#143d2e,#07130f 58%);color:#edf8f0;transition:opacity .25s ease}
    #boot.hidden{opacity:0;pointer-events:none}
    .boot-card{width:min(540px,calc(100vw - 40px));padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
    .boot-kicker{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9ccbb0}.boot-card h1{margin:8px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.05}.boot-card p{margin:0;color:rgba(237,248,240,.72);line-height:1.5}.bar{height:5px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar span{display:block;width:38%;height:100%;border-radius:inherit;background:#77b892;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(165%)}}
    .boot-error{margin-top:16px;padding:12px 14px;border-radius:15px;background:#4a1f25;color:#ffe8ea;display:none;white-space:pre-wrap;font-size:.84rem}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="boot-kicker">CSI-1 - base V17</div><h1>Chargement de la présentation</h1><p>Chargement de la version intermédiaire avec identité visuelle par étude, puis application des corrections CSI.</p><div class="bar"><span></span></div><div class="boot-error" id="bootError"></div></div></div>
  <iframe id="presentation" title="CSI 1 - Luc Perroquin" allowfullscreen></iframe>
  <script>
  (()=>{
    const BASE='101eac6c39fa9ab1c236b9203e0c77e56eda498c';
    const COREBASE='e3ec47385a42f318469eb06f72cf659f07fcdeae';
    const CORE=`https://raw.githubusercontent.com/lucper01/CSI-1/${COREBASE}/`;
    const HIST=`https://raw.githubusercontent.com/lucper01/CSI-1/${BASE}/`;
    const core=['csi-v11-core.js','csi-v11-doctoral.js','csi-v11-ui.js','csi-v11-enfix.js','csi-v11-polish.js','csi-v11-clean.js','csi-v12.js','csi-v13.js'];
    const historical=['csi-v14.js','csi-v15.js','csi-v16.js','csi-v17.js'];
    const frame=document.getElementById('presentation'),boot=document.getElementById('boot'),err=document.getElementById('bootError');
    const get=async(url,cache='force-cache')=>{const r=await fetch(url,{cache});if(!r.ok)throw new Error(`${url.split('/').pop()}: HTTP ${r.status}`);return r.text()};

    function forceFrenchAndCleanHeader(){
      try{
        localStorage.setItem('csi-lang','fr');
        const d=frame.contentDocument;
        if(!d)return;
        d.documentElement.lang='fr';

        d.querySelectorAll('.csi-lang,.language-toggle,.lang-toggle,#csiQOverlay,.csi-qbtn').forEach(el=>el.remove());

        d.querySelectorAll('.appbar button, header button').forEach(btn=>{
          const label=(btn.textContent||'').trim();
          const title=(btn.getAttribute('title')||'').toLowerCase();
          const aria=(btn.getAttribute('aria-label')||'').toLowerCase();
          const isLanguage=/^(en|fr)$/i.test(label)||title.includes('langue')||title.includes('language')||aria.includes('langue')||aria.includes('language');
          const isHelp=label==='?';
          const isQA=label.toUpperCase()==='Q&A';
          if(isLanguage||isHelp||isQA)btn.remove();
        });
      }catch(e){console.warn('Header cleanup',e)}
    }

    function integrateProjectSheets(){
      try{
        const d=frame.contentDocument;
        if(!d||!d.body)return false;
        if(d.documentElement.dataset.projectSheets==='1')return true;

        const style=d.createElement('style');
        style.id='csi-project-sheet-style';
        style.textContent=`
          .csi-sheet-actions{position:absolute;top:88px;right:clamp(24px,4vw,66px);z-index:18;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
          .csi-sheet-btn{border:1px solid var(--line);background:color-mix(in srgb,var(--white) 94%,transparent);color:var(--accent-strong);border-radius:999px;padding:8px 12px;font-size:.76rem;font-weight:950;cursor:pointer;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:7px}
          .csi-sheet-btn:hover{background:var(--accent-soft)}
          .csi-sheet-btn:before{content:'▤';font-size:.95rem}
          #csiSheetViewer{position:fixed;inset:0;z-index:200000;background:color-mix(in srgb,var(--cream) 96%,#000 4%);display:none;flex-direction:column;color:var(--text)}
          #csiSheetViewer.open{display:flex}
          .csi-sheet-head{height:66px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--cream) 95%,transparent);backdrop-filter:blur(16px)}
          .csi-sheet-head strong{font-family:Georgia,'Times New Roman',serif;color:var(--accent-strong);font-size:1.12rem}
          .csi-sheet-head-actions{display:flex;align-items:center;gap:8px}
          .csi-sheet-head a,.csi-sheet-close{border:1px solid var(--line);background:var(--white);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:900;text-decoration:none;cursor:pointer;font-size:.8rem}
          .csi-sheet-frame{width:100%;height:calc(100vh - 66px);border:0;background:#525659}
          @media(max-height:760px){.csi-sheet-actions{top:70px}.csi-sheet-btn{padding:6px 9px;font-size:.7rem}}
          @media(max-width:850px){.csi-sheet-actions{top:72px;right:18px}.csi-sheet-head strong{font-size:.92rem}.csi-sheet-head a{display:none}}
        `;
        d.head.appendChild(style);

        const viewer=d.createElement('div');
        viewer.id='csiSheetViewer';
        viewer.innerHTML=`<div class="csi-sheet-head"><strong id="csiSheetTitle">Fiche projet</strong><div class="csi-sheet-head-actions"><a id="csiSheetExternal" href="#" target="_blank" rel="noopener">Ouvrir le PDF</a><button class="csi-sheet-close" id="csiSheetClose" type="button">Retour au diapo</button></div></div><iframe class="csi-sheet-frame" id="csiSheetFrame" title="Fiche projet"></iframe>`;
        d.body.appendChild(viewer);

        const viewFrame=d.getElementById('csiSheetFrame');
        const viewTitle=d.getElementById('csiSheetTitle');
        const viewExternal=d.getElementById('csiSheetExternal');
        const closeViewer=()=>{viewer.classList.remove('open');viewFrame.removeAttribute('src')};
        d.getElementById('csiSheetClose').onclick=closeViewer;
        viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});
        d.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open')){e.preventDefault();closeViewer()}},true);

        const root='https://lucper01.github.io/CSI-1/affiches/';
        const configs=[
          {study:'TWIXAV',title:/^TWIXAV\b/i,files:[['Fiche projet','TWIXAV.pdf']]},
          {study:'TWIXOLF',title:/^TWIXOLF\b/i,files:[['Fiche projet','TWIXOLF.pdf']]},
          {study:'SOFT',title:/^SOFT\b/i,files:[['Fiche projet','SOFT.pdf']]},
          {study:'VIBEX',title:/^VIBEX\b/i,files:[['Fiche projet','VIBEX.pdf']]},
          {study:'OASIS',title:/^OASIS\b/i,files:[['Fiche projet','OASIS.pdf']]},
          {study:'FLUXOLF',title:/^FLUXOLF\b/i,files:[['Fiche 1','FLUXOLF_1.pdf'],['Fiche 2','FLUXOLF_2.pdf']]}
        ];

        const allSlides=[...d.querySelectorAll('#deck .slide,.slide')];
        configs.forEach(cfg=>{
          const slide=allSlides.find(el=>{
            const h=el.querySelector('h1,h2');
            return h&&cfg.title.test((h.textContent||'').trim());
          });
          if(!slide)return;
          if(getComputedStyle(slide).position==='static')slide.style.position='relative';
          const actions=d.createElement('div');
          actions.className='csi-sheet-actions';
          actions.setAttribute('aria-label',`Fiches ${cfg.study}`);
          cfg.files.forEach(([label,file])=>{
            const url=root+encodeURIComponent(file).replace(/%2F/g,'/');
            const btn=d.createElement('button');
            btn.type='button';
            btn.className='csi-sheet-btn';
            btn.textContent=label;
            btn.title=`Ouvrir ${label.toLowerCase()} ${cfg.study}`;
            btn.onclick=()=>{
              viewTitle.textContent=`${cfg.study} - ${label}`;
              viewExternal.href=url;
              viewFrame.src=url+'#view=FitH';
              viewer.classList.add('open');
            };
            actions.appendChild(btn);
          });
          slide.appendChild(actions);
        });

        d.documentElement.dataset.projectSheets='1';
        return true;
      }catch(e){console.warn('Project sheets',e);return false}
    }

    async function start(){
      try{
        localStorage.setItem('csi-lang','fr');
        const [base,...coreCode]=await Promise.all([get(CORE+'presentation-base.html'),...core.map(f=>get(CORE+f))]);
        const histCode=await Promise.all(historical.map(f=>get(HIST+f,'no-store')));
        const patch=await get('csi-v17-csi1.js?v=20260903-1','no-store');
        [...coreCode,...histCode,patch].forEach((code,i)=>{try{(0,eval)(code)}catch(e){throw new Error(`script ${i+1}: ${e.message}`)}});
        frame.addEventListener('load',()=>{
          forceFrenchAndCleanHeader();
          const d=frame.contentDocument;
          if(d&&d.body){
            const observer=new MutationObserver(()=>forceFrenchAndCleanHeader());
            observer.observe(d.body,{childList:true,subtree:true});
          }
          setTimeout(forceFrenchAndCleanHeader,450);
          setTimeout(forceFrenchAndCleanHeader,1000);
          setTimeout(forceFrenchAndCleanHeader,1800);
          setTimeout(integrateProjectSheets,900);
          setTimeout(integrateProjectSheets,1600);
          setTimeout(integrateProjectSheets,2600);
          setTimeout(()=>boot.classList.add('hidden'),900);
        },{once:true});
        frame.srcdoc=base;
      }catch(e){console.error(e);err.style.display='block';err.textContent='Impossible de charger la présentation.\n'+e.message;document.querySelector('.bar').style.display='none'}
    }
    start();
  })();
  </script>
</body>
</html>
