<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSI 1 - Luc Perroquin</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
  </style>
</head>
<body>
<iframe id="presentation" src="presentation-base.html?v=8" title="CSI 1 - Luc Perroquin" allowfullscreen></iframe>
<script>
const frame=document.getElementById('presentation');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=w.document;
    const slides=w.eval('slides');
    const orig=t=>slides.find(s=>s.title&&s.title.includes(t));
    const refs=t=>`<div class="refline"><strong>Références :</strong> ${t}</div>`;
    const figure=(title,note)=>`<div class="figure-slot"><div class="figure-title">${title}</div><div class="axis axis-x"></div><div class="axis axis-y"></div><div class="curve curve-a"></div><div class="curve curve-b"></div><div class="figure-note">${note}</div></div>`;
    const status=(kind,label)=>`<span class="status ${kind}">${label}</span>`;

    const css=`
      html[data-theme="dark"][data-accent="forest"]{--accent:#72c79c;--accent-strong:#d4f5e3;--accent-soft:#17372b;--accent-pale:#10271e;--white:#10251c;--muted:#c5d8cb;--line:rgba(212,245,227,.16)}
      html[data-theme="dark"][data-accent="blue"]{--accent:#7ec7f1;--accent-strong:#d7efff;--accent-soft:#16364b;--accent-pale:#0d2637;--white:#102434;--muted:#c4d8e6;--line:rgba(215,239,255,.16)}
      html[data-theme="dark"][data-accent="cassis"]{--accent:#da8dba;--accent-strong:#f6d7e9;--accent-soft:#3a1d31;--accent-pale:#291523;--white:#321829;--muted:#dec4d4;--line:rgba(246,215,233,.16)}
      html[data-theme="dark"][data-accent="ochre"]{--accent:#dfb65f;--accent-strong:#ffe6ae;--accent-soft:#3a2c13;--accent-pale:#291f0d;--white:#332711;--muted:#ddd0b1;--line:rgba(255,230,174,.16)}
      html[data-theme="dark"] body{color:var(--text)}
      html[data-theme="dark"] .card,html[data-theme="dark"] .axis-card,html[data-theme="dark"] .flow-card,html[data-theme="dark"] .result,html[data-theme="dark"] .roadmap-card,html[data-theme="dark"] .question,html[data-theme="dark"] .overview-card,html[data-theme="dark"] .timeline-box{background:var(--white);color:var(--text);border-color:var(--line)}
      html[data-theme="dark"] .card.soft,html[data-theme="dark"] .card.tint,html[data-theme="dark"] .callout,html[data-theme="dark"] .bridge,html[data-theme="dark"] .project-pill{background:var(--accent-pale);color:var(--muted);border-color:var(--line)}
      html[data-theme="dark"] .card.dark{background:linear-gradient(145deg,var(--hero-mid),var(--hero-start));color:#fff}
      html[data-theme="dark"] .card.dark h3,html[data-theme="dark"] .card.dark p,html[data-theme="dark"] .card.dark li,html[data-theme="dark"] .card.dark strong{color:#fff!important}
      html[data-theme="dark"] .status.done,html[data-theme="dark"] .status.progress,html[data-theme="dark"] .status.future,html[data-theme="dark"] .status.ready{background:var(--accent-pale);color:var(--accent-strong);border:1px solid var(--line)}
      .status.ready{background:var(--accent-soft);color:var(--accent-strong);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
      .slide h2{font-size:clamp(2.1rem,4.35vw,4.65rem)!important;line-height:1!important;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:1280px}
      .study-layout{display:grid;grid-template-columns:minmax(0,.82fr) minmax(420px,1.18fr);gap:20px;align-items:stretch}
      .figure-slot{min-height:310px;position:relative;border:1px solid var(--line);border-radius:26px;background:linear-gradient(to right,color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(to bottom,color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1px) 0 0/56px 56px,var(--white);box-shadow:var(--shadow-soft);overflow:hidden;padding:22px}
      .figure-title{position:relative;z-index:2;color:var(--accent-strong);font:800 1.3rem Georgia,serif}
      .axis{position:absolute;background:var(--muted);opacity:.42}.axis-x{left:54px;right:30px;bottom:50px;height:2px}.axis-y{left:54px;top:58px;bottom:50px;width:2px}
      .curve{position:absolute;left:75px;right:42px;height:92px;border-top:4px solid var(--accent);border-radius:50%;bottom:102px}.curve-b{bottom:82px;opacity:.48;border-width:3px}
      .figure-note{position:absolute;left:72px;right:28px;bottom:14px;color:var(--muted);font-size:.78rem;font-weight:800}
      .sequence{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
      .sequence-card{padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--white);box-shadow:var(--shadow-soft)}
      .sequence-card .n{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--accent);color:#fff;font-weight:950}.sequence-card h3{margin:10px 0 6px;color:var(--accent-strong);font-family:Georgia,serif}.sequence-card p{margin:0;color:var(--muted)}
      .sequence-arrow{display:grid;place-items:center;color:var(--accent);font-size:2rem;font-weight:950}
      .parallel-note{margin-top:16px;padding:14px 17px;border:1px dashed var(--accent);border-radius:18px;background:var(--accent-pale);color:var(--muted)}.parallel-note strong{color:var(--accent-strong)}
      .refline{margin-top:14px;padding-top:9px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}.refline strong{color:var(--accent-strong)}
      .chapter{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chapter .card{min-height:190px}
      .mini-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;font-weight:950;color:var(--accent)}
      .retro{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:stretch}
      .timeline-box{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--white);padding:17px;box-shadow:var(--shadow-soft)}
      .timeline-box::before{content:"";position:absolute;left:17px;right:17px;top:8px;height:5px;border-radius:999px;background:var(--accent)}
      .timeline-box h3{margin:12px 0 5px;color:var(--accent-strong);font:800 1.1rem Georgia,serif}.timeline-box p{margin:0;color:var(--muted);font-size:.86rem}
      .hardware{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hardware .callout{margin:0}
      .split-label{display:flex;gap:8px;align-items:center;margin-bottom:10px}.split-label span{padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:.75rem;font-weight:950}
      @media(max-width:1100px){.study-layout,.sequence,.chapter,.hardware{grid-template-columns:1fr}.sequence-arrow{transform:rotate(90deg)}.retro{grid-template-columns:repeat(2,1fr)}}
    `;
    const st=d.createElement('style'); st.textContent=css; d.head.appendChild(st);

    const cover=orig("Y a-t-il un espace-temps pour les odeurs ?");
    const parcours=orig("D'un parcours généraliste à une thèse multisensorielle");
    const cadre=orig("Un environnement qui combine cognition, olfaction et méthodologie");
    const axes=orig("Deux axes pour interroger l'espace et le temps multisensoriels");
    const olfTime=orig("L'olfaction complique le problème temporel");
    const twixav=orig("TWIXAV - établir une référence audiovisuelle");
    const twixavRes=orig("Un effet net de la durée et du décalage temporel");
    const twixolf=orig("Transposer la liaison temporelle à l'olfaction");
    const soft=orig("Mesurer le temps propre de chaque modalité");
    const futureTemporal=orig("Les études futures prolongent des mécanismes déjà testés");
    const vibex=orig("VIBEX - établir une référence visuelle de Boundary Extension");
    const oasis=orig("OASIS - relier odeur, approche-évitement et espace");
    const futureSpatial=orig("Trois prolongements possibles autour de l'extension et de la restriction");
    const tools=orig("Des développements logiciels conçus pour réduire la friction de recherche");
    const difficulties=orig("Les principales difficultés ont déjà modifié la manière de concevoir les études");
    const skills=orig("La première année a aussi construit un profil de chercheur");
    const teach=orig("Un développement doctoral qui ne se limite pas aux collectes");
    const comm=orig("Rendre la recherche visible, compréhensible et recrutante");
    const prod=orig("Passer de prototypes et prétests à des sorties scientifiques");
    const decisions=orig("Les décisions les plus utiles à discuter aujourd'hui");
    const conclusion=orig("Une première année passée de la question à l'infrastructure");
    const ref1=orig("Repères bibliographiques - Axe 1");
    const ref2=orig("Repères bibliographiques - Axe 2");

    parcours.section="Présentation"; parcours.kicker="01 - Présentation"; parcours.title="Mon parcours jusqu'au doctorat"; parcours.lead="Un parcours en psychologie cognitive et développementale, progressivement centré sur la perception multisensorielle et l'olfaction.";
    cadre.section="Présentation"; cadre.kicker="Cadre doctoral"; cadre.title="Mon doctorat au CSGA"; cadre.lead="Une thèse en psychologie cognitive au sein de l'équipe DOCC, dirigée par Renaud Brochard et co-dirigée par Arnaud Leleu.";
    axes.section="Projet de thèse"; axes.kicker="02 - Projet de thèse"; axes.title="Une question centrale, deux axes complémentaires"; axes.lead="Comprendre comment l'olfaction s'insère dans l'organisation spatio-temporelle multisensorielle, puis comment elle peut elle-même modifier cette organisation.";

    const theoryTime={section:"Projet de thèse",kicker:"Topographie théorique - temps",title:"Le temps multisensoriel n'est pas une simple simultanéité physique",lead:"Le cerveau tolère des décalages entre modalités. Cette tolérance forme une fenêtre temporelle d'intégration dont la largeur, le centre et l'asymétrie peuvent varier.",content:`<div class="grid three"><div class="card dark"><h3>Fenêtre temporelle</h3><p>Deux signaux séparés dans le temps peuvent malgré tout être perçus comme appartenant au même événement.</p></div><div class="card"><h3>Indices clés</h3><p>SOA, proportion de simultanéité, PSS et largeur de fenêtre permettent de décrire cette intégration.</p></div><div class="card"><h3>Asymétrie</h3><p>Les deux directions temporelles ne sont pas forcément équivalentes. C'est précisément le verrou qui motive la suite de l'Axe 1.</p></div></div>${refs("Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012 ; Vroomen & Keetels, 2010.")}`,notes:"Introduire la TBW de façon didactique. L'objectif est que le comité comprenne pourquoi TWIXAV mène à SOFT puis TWIXOLF."};

    olfTime.section="Projet de thèse"; olfTime.kicker="Topographie théorique - olfaction"; olfTime.title="L'olfaction ajoute un temps physiologique au temps perceptif"; olfTime.lead="La commande de l'olfactomètre, la délivrance, l'inspiration et l'apparition perceptive ne sont pas confondues : le temps olfactif doit être mesuré plutôt que supposé."; olfTime.content=`<div class="sequence"><div class="sequence-card"><div class="n">1</div><h3>Commande</h3><p>Instruction logicielle et ouverture de valve.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">2</div><h3>Inspiration</h3><p>Accès physiologique au stimulus.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">3</div><h3>Perception</h3><p>Onset et offset effectivement ressentis.</p></div></div><div class="parallel-note"><strong>Conséquence :</strong> respiration, débit, latence, habituation et durée deviennent des variables méthodologiques centrales.</div>${refs("Gotow & Kobayakawa, 2017.")}`;

    const theorySpace={section:"Projet de thèse",kicker:"Topographie théorique - espace",title:"L'espace perçu dépasse parfois l'information réellement présentée",lead:"La Boundary Extension illustre la reconstruction spatiale : après avoir vu une scène, on peut mémoriser un champ plus large que celui réellement présenté.",content:`<div class="grid three"><div class="card dark"><h3>Boundary Extension</h3><p>La mémoire d'une scène peut inclure de l'espace attendu au-delà des frontières visibles.</p></div><div class="card"><h3>Pourquoi l'odeur ?</h3><p>Une information olfactive peut fournir un contexte affectif, sémantique ou directionnel susceptible de modifier la représentation spatiale.</p></div><div class="card"><h3>Axe 2</h3><p>Partir d'une référence visuelle robuste, puis tester comment l'odeur déforme ou oriente cette représentation.</p></div></div>${refs("Intraub & Richardson, 1989 ; Intraub, 2012 ; Gagnier et al., 2013 ; Bainbridge & Baker, 2020.")}`,notes:"Cette slide sert de pont vers VIBEX puis OASIS et les extensions spatiales."};

    const axe1Intro={section:"Axe 1",kicker:"03 - Axe 1",title:"Axe 1 - de la référence audiovisuelle au temps olfactif",lead:"Ce qui a été fait permet de formuler la suite dans un ordre causal : caractériser l'asymétrie, comprendre son origine, puis étendre la fenêtre temporelle à l'olfaction.",content:`<div class="chapter"><div class="card dark"><div class="mini-label">Ce qui a été fait</div><h3>TWIXAV</h3><p>Prétest audiovisuel réalisé, analyses préliminaires disponibles, asymétrie temporelle à consolider.</p></div><div class="card"><div class="mini-label">Ce qui arrive</div><h3>SOFT → TWIXOLF</h3><p>SOFT dissocie onset/offset/durée ; TWIXOLF transpose ensuite la question de la fenêtre temporelle à l'olfaction.</p><div style="margin-top:14px">${status("ready","Prêtes à démarrer")}</div></div></div><div class="parallel-note"><strong>Envisagé ensuite :</strong> SORBET, si les résultats justifient une étude de recalibration temporelle olfactive.</div>`,notes:"Annonce claire de l'Axe 1 avant d'entrer dans les études."};

    twixav.section="Axe 1"; twixav.kicker="Axe 1 - réalisé"; twixav.lead="TWIXAV fournit la référence audiovisuelle et met en évidence la structure temporelle à expliquer."; twixav.content=`<div class="study-layout"><div class="card"><span class="status done">Prétest terminé</span><h3 style="margin-top:12px">Design</h3><ul><li>n = 19</li><li>Durées auditives et visuelles : 50, 150, 250 ms</li><li>SOA : -500 à +500 ms par pas de 100 ms</li><li>Jugement de simultanéité</li></ul><div class="callout" style="margin-top:14px"><strong>Objectif :</strong> largeur de fenêtre, PSS et asymétrie.</div><div class="callout" style="margin-top:10px"><strong>Mémoire de M1 :</strong> Alicia.</div></div>${figure("Courbes de simultanéité","Emplacement de la figure finale : p(same) × SOA × durée.")}</div>${refs("Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.")}`;
    twixavRes.section="Axe 1"; twixavRes.kicker="Axe 1 - résultat clé"; twixavRes.lead="Le prétest confirme une modulation temporelle nette et fait de l'asymétrie la question mécanistique suivante."; twixavRes.content=`<div class="study-layout"><div><div class="result-strip" style="grid-template-columns:1fr"><div class="result"><div class="pval">p = .001</div><p>Effet de la durée</p></div><div class="result"><div class="pval">p &lt; .001</div><p>Effet du SOA</p></div><div class="result"><div class="pval">p = .001</div><p>Interaction durée × SOA</p></div></div><div class="callout" style="margin-top:14px"><strong>Question :</strong> l'asymétrie vient-elle surtout de l'onset, de l'offset ou de la durée perçue ?</div></div>${figure("Résultats TWIXAV","Courbes finales, FWHM/PSS et asymétrie à insérer.")}</div>${refs("Powers et al., 2009 ; Stevenson et al., 2012 ; McGovern et al., 2022.")}`;
    soft.section="Axe 1"; soft.kicker="Axe 1 - prochaine étude"; soft.title="SOFT - dissocier onset, offset et durée"; soft.lead="SOFT est l'étude charnière : elle teste directement une explication possible de l'asymétrie observée avec TWIXAV."; soft.content=`<div class="grid two"><div class="card dark"><span class="status ready">Prête à démarrer</span><h3 style="margin-top:12px">Hypothèse</h3><p>Une partie de l'asymétrie peut refléter une précision différente pour le début et la fin d'un événement, plutôt que la seule largeur de la fenêtre de liaison.</p></div><div class="card"><h3>Mesures</h3><ul><li>onset perçu</li><li>offset perçu</li><li>durée perçue</li><li>audition, vision, olfaction</li><li>EEG/physiologie selon configuration</li></ul></div></div><div class="sequence" style="margin-top:18px"><div class="sequence-card"><div class="n">A</div><h3>Onset</h3><p>Début physique vs perçu.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">D</div><h3>Durée</h3><p>Intervalle physique vs perçu.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">O</div><h3>Offset</h3><p>Fin physique vs perçue.</p></div></div>${refs("Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.")}`;
    twixolf.section="Axe 1"; twixolf.kicker="Axe 1 - prochaine étude"; twixolf.title="TWIXOLF - construire la fenêtre temporelle olfactive"; twixolf.lead="Après SOFT, TWIXOLF transpose la logique de fenêtre temporelle à l'olfaction en intégrant respiration et latence de délivrance."; twixolf.content=`<div class="study-layout"><div class="card"><span class="status ready">Prête à démarrer</span><h3 style="margin-top:12px">Question</h3><p>À quelles relations temporelles une odeur et un signal visuel ou auditif sont-ils intégrés comme un même événement ?</p><ul><li>respiration</li><li>latence de délivrance</li><li>habituation</li><li>intensité / valence</li></ul></div>${figure("Commande → inspiration → perception","La chronologie logicielle doit être reliée à la chronologie physiologique et perceptive.")}</div>${refs("Gotow & Kobayakawa, 2017 ; Keetels & Vroomen, 2012.")}`;
    futureTemporal.section="Axe 1"; futureTemporal.kicker="Axe 1 - envisagé"; futureTemporal.title="SORBET - une extension conditionnelle"; futureTemporal.lead="Une étude de recalibration temporelle pourra être activée si SOFT et TWIXOLF fournissent un cadre suffisamment robuste."; futureTemporal.content=`<div class="grid two"><div class="card dark"><span class="status future">Envisagé</span><h3 style="margin-top:12px">SORBET</h3><p>Tester si une exposition répétée à des décalages intermodaux peut recalibrer le moment subjectif d'un événement impliquant l'olfaction.</p></div><div class="card"><h3>Condition de lancement</h3><p>Ne pas ajouter une nouvelle manipulation temporelle tant que les paramètres fondamentaux de SOFT et TWIXOLF ne sont pas stabilisés et interprétables.</p><div class="callout" style="margin-top:14px"><strong>Rôle :</strong> extension mécanistique, pas priorité immédiate.</div></div></div>${refs("Powers et al., 2009 ; Keetels & Vroomen, 2012.")}`;

    const axe2Intro={section:"Axe 2",kicker:"04 - Axe 2",title:"Axe 2 - de la représentation visuelle à l'influence olfactive",lead:"La stratégie est la même : établir d'abord une référence spatiale robuste, puis introduire l'olfaction avant d'ouvrir des branches plus exploratoires.",content:`<div class="chapter"><div class="card dark"><div class="mini-label">Ce qui a été fait</div><h3>VIBEX</h3><p>Prétest de Boundary Extension visuelle terminé et paradigme de référence disponible.</p></div><div class="card"><div class="mini-label">Ce qui arrive</div><h3>OASIS</h3><p>Étude olfactive spatiale avec comportement, EDA, ECG et respiration.</p><div style="margin-top:14px">${status("ready","Prête à démarrer")}</div></div></div><div class="parallel-note"><strong>Ensuite :</strong> SOLAR, COBEX, BRAUD et BRAUDOLF restent des extensions possibles selon les résultats et la faisabilité.</div>`,notes:"Annonce de l'Axe 2 avec distinction claire entre acquis, prochain projet et perspectives."};
    vibex.section="Axe 2"; vibex.kicker="Axe 2 - réalisé"; vibex.lead="VIBEX fournit la référence visuelle nécessaire avant d'introduire une influence olfactive sur la représentation spatiale."; vibex.content=`<div class="study-layout"><div class="card"><span class="status done">Prétest terminé</span><h3 style="margin-top:12px">Paradigme</h3><ul><li>24 scènes</li><li>image initiale 200 ms</li><li>délai 1000 ms</li><li>conditions LL, SS, LS, SL</li><li>réponse identique / différente</li></ul><div class="callout" style="margin-top:14px"><strong>Valorisation :</strong> préparation d'un <em>short paper</em>.</div><div class="callout" style="margin-top:10px"><strong>Mémoire de M1 :</strong> Olivia.</div></div>${figure("Boundary Extension","Figure finale : biais par condition/taille et indice global.")}</div>${refs("Intraub & Richardson, 1989 ; Gagnier et al., 2013 ; Bainbridge & Baker, 2020 ; Park et al., 2024.")}`;
    oasis.section="Axe 2"; oasis.kicker="Axe 2 - prochaine étude"; oasis.lead="OASIS est la prochaine étude spatiale, conçue pour exploiter l'infrastructure olfactive et physiologique désormais disponible."; oasis.content=`<div class="grid three"><div class="card"><h3>Question</h3><p>Comment une odeur module-t-elle des réponses spatiales d'approche ou d'évitement ?</p></div><div class="card"><h3>Mesures</h3><p>Comportement, EDA, ECG et respiration, avec contrôle du moment de stimulation.</p></div><div class="card tint"><span class="status ready">Prête à démarrer</span><h3 style="margin-top:12px">Démarrage</h3><p>Infrastructure, mesures et logique expérimentale suffisamment stabilisées pour engager les prétests puis la collecte.</p></div></div><div class="bridge">OASIS réutilise la même plateforme olfactive/physiologique que SOFT et TWIXOLF.</div>`;
    futureSpatial.section="Axe 2"; futureSpatial.kicker="Axe 2 - envisagé"; futureSpatial.title="Après OASIS - quatre extensions possibles"; futureSpatial.lead="Ces projets ne sont pas des obligations du doctorat : ils seront activés uniquement si les résultats précédents justifient une extension claire."; futureSpatial.content=`<div class="grid four"><div class="card"><span class="status future">Envisagé</span><h3 style="margin-top:12px">SOLAR</h3><p>Cueing spatial olfactif et réponses visuelles.</p></div><div class="card"><span class="status future">Envisagé</span><h3 style="margin-top:12px">COBEX</h3><p>Boundary Extension avec odeur congruente/incongruente.</p></div><div class="card"><span class="status future">Exploratoire</span><h3 style="margin-top:12px">BRAUD</h3><p>Boundary Restriction en audition.</p></div><div class="card"><span class="status future">Exploratoire</span><h3 style="margin-top:12px">BRAUDOLF</h3><p>Extension auditive avec composante olfactive.</p></div></div><div class="callout" style="margin-top:18px"><strong>Critère :</strong> une extension n'est lancée que si elle répond à une question issue des résultats précédents.</div>`;

    const retro={section:"Rétroplanning",kicker:"05 - Rétroplanning",title:"Rétroplanning des manipulations - priorité aux dépendances",lead:"Les trois études prêtes à démarrer ne sont pas lancées simultanément : SOFT réduit d'abord l'incertitude temporelle, puis TWIXOLF, puis OASIS.",content:`<div class="retro"><div class="timeline-box"><div class="mini-label">Sept-Oct 2026</div><h3>SOFT - pilote</h3><p>Pilote complet, charge participant, contrôle onset/offset, triggers et matériel.</p></div><div class="timeline-box"><div class="mini-label">Oct-Déc 2026</div><h3>SOFT - collecte</h3><p>Collecte prioritaire et analyses intermédiaires.</p></div><div class="timeline-box"><div class="mini-label">Jan-Mars 2027</div><h3>TWIXOLF</h3><p>Prétests courts puis collecte de la fenêtre temporelle olfactive.</p></div><div class="timeline-box"><div class="mini-label">Avr-Juin 2027</div><h3>OASIS</h3><p>Prétests odorants/physio puis lancement de la collecte spatiale.</p></div><div class="timeline-box"><div class="mini-label">En parallèle</div><h3>TWIXAV + VIBEX</h3><p>Analyses finales TWIXAV et rédaction du short paper VIBEX.</p></div><div class="timeline-box"><div class="mini-label">2027-2028</div><h3>Extensions</h3><p>SORBET ou extensions Axe 2 uniquement selon résultats, temps disponible et matériel.</p></div></div><div class="parallel-note"><strong>Règle :</strong> analyses et rédaction commencent pendant les collectes suivantes pour éviter un embouteillage en fin de thèse.</div>`,notes:"Présenter ce calendrier comme rétroplanning de travail, ajustable après les pilotes. L'ordre scientifique reste plus important que les dates exactes."};

    const year1Intro={section:"Première année",kicker:"06 - Bilan de première année",title:"Première année - ce qui a réellement été construit",lead:"Au-delà des prétests, l'année 1 a servi à rendre le programme exécutable : théorie, protocoles, matériel, analyses, documentation, enseignement et communication.",content:`<div class="grid four"><div class="card dark"><h3>Science</h3><p>TWIXAV et VIBEX testés ; SOFT, TWIXOLF et OASIS amenés jusqu'à un état prêt à démarrer.</p></div><div class="card"><h3>Méthodes</h3><p>Respiration, olfactométrie, EEG/TTL, physiologie, dashboards, logs et pipelines d'analyse.</p></div><div class="card"><h3>Doctorat</h3><p>64 HETD d'enseignement, 34,5 h de formations doctorales documentées et construction du projet MCF.</p></div><div class="card"><h3>Valorisation</h3><p>JDD 2026, prix de l'originalité, supports de recrutement, portfolio et préparation de productions scientifiques.</p></div></div>`,notes:"Slide de bilan général avant d'entrer dans les activités transversales."};

    teach.section="Première année"; teach.kicker="Enseignement et formation"; teach.title="Enseignement et formation doctorale en année 1"; teach.lead="La première année a aussi servi à construire le versant enseignant-chercheur du projet professionnel.";

    const year1Other={section:"Première année",kicker:"Autres travaux",title:"Ce que le bilan scientifique oublie facilement",lead:"Une part importante de l'année a été consacrée à des tâches moins visibles mais indispensables à la faisabilité et à la traçabilité du doctorat.",content:`<div class="grid four"><div class="card"><h3>Éthique et données</h3><p>Dossiers protocolaires, fiches d'information, consentements, organisation des données et documents de conformité.</p></div><div class="card"><h3>Prétests et calibration</h3><p>Stimuli, débits, respiration, triggers, affichage, matériel physiologique et validation de séquences.</p></div><div class="card"><h3>Analyses</h3><p>Structuration de pipelines comportementaux, EEG et physiologiques, avec exports reproductibles.</p></div><div class="card"><h3>Projet annexe</h3><p>FLUXOLF : analyses EDA, HR et HRV servant aussi de terrain méthodologique.</p></div></div>`,notes:"Cette slide couvre les tâches importantes qui disparaissent souvent des bilans centrés sur les collectes."};

    const futureActivity={section:"Année 2 et suite",kicker:"07 - Suite du doctorat",title:"Année 2 - poursuivre sans disperser l'effort",lead:"La priorité reste expérimentale, mais l'enseignement, la formation, les outils et la communication doivent continuer à soutenir le projet professionnel.",content:`<div class="grid four"><div class="card dark"><h3>Formations</h3><p>Sélectionner les formations de l'École doctorale utiles à la pédagogie universitaire, aux méthodes, à la science ouverte et à la carrière académique.</p></div><div class="card"><h3>Enseignement</h3><p>Poursuivre les TD et, si possible, diversifier progressivement niveaux et contenus sans compromettre les collectes.</p></div><div class="card"><h3>Outils</h3><p>Maintenance des outils existants et développements uniquement lorsqu'un besoin expérimental concret l'exige.</p></div><div class="card"><h3>Communications</h3><p>VIBEX short paper, valorisation TWIXAV, FJC/JDD 2027 selon maturité et communications liées aux nouvelles données.</p></div></div>`,notes:"Ne pas promettre d'intitulés précis de formations ou de volumes d'enseignement non encore attribués."};

    difficulties.section="Discussion"; difficulties.kicker="08 - Difficultés"; difficulties.title="Les difficultés rencontrées sont surtout matérielles et de synchronisation"; difficulties.lead="Le principal risque n'est pas la génération d'hypothèses, mais la capacité à faire fonctionner ensemble des dispositifs hétérogènes avec une précision suffisante."; difficulties.content=`<div class="hardware"><div class="callout"><div class="split-label"><span>Olfaction</span><strong>Latence et débit</strong></div>La commande de valve n'est pas l'onset perceptif. Il faut contrôler débit, temps de transit, flush et habituation.</div><div class="callout"><div class="split-label"><span>Respiration</span><strong>Déclenchement physiologique</strong></div>Le début d'inspiration doit être détecté de façon stable et intégré aux séquences sans bloquer l'expérience.</div><div class="callout"><div class="split-label"><span>EEG / TTL</span><strong>Codage limité</strong></div>Le BioSemi impose un codage 8 bits : les événements doivent rester lisibles tout en tenant dans 255 valeurs.</div><div class="callout"><div class="split-label"><span>PC expérimental</span><strong>Windows 7 hors ligne</strong></div>Compatibilité PsychoPy/Python, dépendances anciennes, absence de mises à jour et contraintes d'installation compliquent le déploiement.</div><div class="callout"><div class="split-label"><span>Multi-dispositifs</span><strong>Synchronisation</strong></div>PsychoPy, Sniffo, Spir0, Biopac et BioSemi doivent partager des événements cohérents malgré des interfaces et temporalités différentes.</div><div class="callout"><div class="split-label"><span>Passation</span><strong>Charge participant</strong></div>Préparation EEG, pauses, habituation olfactive et durée des tâches imposent de valider la faisabilité par des pilotes complets.</div></div>`; difficulties.notes="Être concret : ce sont les difficultés qui ont justifié une grande partie du développement logiciel et méthodologique de l'année 1.";
    decisions.section="Discussion"; decisions.kicker="09 - Décisions à discuter"; decisions.title="Les arbitrages les plus utiles à obtenir du comité"; decisions.lead="Le CSI peut surtout aider à sécuriser les choix qui conditionnent la faisabilité de l'année 2."; decisions.content=`<div class="question-list"><div class="question"><div><strong>Ordre des manipulations</strong><br>Valider SOFT → TWIXOLF → OASIS et préciser jusqu'où accepter des chevauchements de collecte/analyse.</div></div><div class="question"><div><strong>Périmètre de SOFT</strong><br>Durée maximale de session, place exacte de l'EEG/physiologie et critères pour simplifier si le pilote est trop lourd.</div></div><div class="question"><div><strong>Matériel</strong><br>Faut-il sécuriser du matériel dédié, des solutions de secours ou une évolution du PC expérimental pour réduire le risque de panne/compatibilité ?</div></div><div class="question"><div><strong>Valorisation</strong><br>Priorité au short paper VIBEX, puis TWIXAV : quel niveau de résultat justifie une soumission ou une communication ?</div></div><div class="question"><div><strong>Extensions</strong><br>Quels critères doivent déclencher SORBET, SOLAR, COBEX, BRAUD ou BRAUDOLF plutôt que les laisser hors du noyau de thèse ?</div></div><div class="question"><div><strong>Charge doctorale</strong><br>Quel équilibre maintenir entre collectes, enseignement, formations, outils et communications pour préserver la production scientifique ?</div></div></div>`;
