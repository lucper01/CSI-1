<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSI 1 - Luc Perroquin</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
  </style>
</head>
<body>
<iframe id="presentation" src="presentation-base.html?v=7" title="CSI 1 - Luc Perroquin" allowfullscreen></iframe>
<script>
const frame=document.getElementById('presentation');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=w.document;
    const slides=w.eval('slides');
    const find=t=>slides.find(s=>s.title&&s.title.includes(t));
    const refs=t=>`<div class="refline"><strong>Références :</strong> ${t}</div>`;
    const figure=(title,note)=>`<div class="figure-slot"><div class="figure-title">${title}</div><div class="axis axis-x"></div><div class="axis axis-y"></div><div class="curve curve-a"></div><div class="curve curve-b"></div><div class="figure-note">${note}</div></div>`;

    const css=`
      html[data-theme="dark"][data-accent="forest"]{--accent:#72c79c;--accent-strong:#d4f5e3;--accent-soft:#17372b;--accent-pale:#10271e;--white:#10251c;--muted:#c5d8cb;--line:rgba(212,245,227,.16)}
      html[data-theme="dark"][data-accent="blue"]{--accent:#7ec7f1;--accent-strong:#d7efff;--accent-soft:#16364b;--accent-pale:#0d2637;--white:#102434;--muted:#c4d8e6;--line:rgba(215,239,255,.16)}
      html[data-theme="dark"][data-accent="cassis"]{--accent:#da8dba;--accent-strong:#f6d7e9;--accent-soft:#3a1d31;--accent-pale:#291523;--white:#321829;--muted:#dec4d4;--line:rgba(246,215,233,.16)}
      html[data-theme="dark"][data-accent="ochre"]{--accent:#dfb65f;--accent-strong:#ffe6ae;--accent-soft:#3a2c13;--accent-pale:#291f0d;--white:#332711;--muted:#ddd0b1;--line:rgba(255,230,174,.16)}
      html[data-theme="dark"] body{color:var(--text)}
      html[data-theme="dark"] .card,html[data-theme="dark"] .axis-card,html[data-theme="dark"] .flow-card,html[data-theme="dark"] .result,html[data-theme="dark"] .roadmap-card,html[data-theme="dark"] .question,html[data-theme="dark"] .overview-card{background:var(--white);color:var(--text);border-color:var(--line)}
      html[data-theme="dark"] .card.soft,html[data-theme="dark"] .card.tint,html[data-theme="dark"] .callout,html[data-theme="dark"] .bridge,html[data-theme="dark"] .project-pill{background:var(--accent-pale);color:var(--muted);border-color:var(--line)}
      html[data-theme="dark"] .card.dark{background:linear-gradient(145deg,var(--hero-mid),var(--hero-start));color:#fff}
      html[data-theme="dark"] .card.dark h3,html[data-theme="dark"] .card.dark p,html[data-theme="dark"] .card.dark li,html[data-theme="dark"] .card.dark strong{color:#fff!important}
      html[data-theme="dark"] .status.done,html[data-theme="dark"] .status.progress,html[data-theme="dark"] .status.future,html[data-theme="dark"] .status.ready{background:var(--accent-pale);color:var(--accent-strong);border:1px solid var(--line)}
      .status.ready{background:var(--accent-soft);color:var(--accent-strong);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
      .slide h2{font-size:clamp(2.15rem,4.55vw,4.9rem)!important;line-height:.98!important;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:1260px}
      .study-layout{display:grid;grid-template-columns:minmax(0,.82fr) minmax(420px,1.18fr);gap:20px;align-items:stretch}
      .figure-slot{min-height:310px;position:relative;border:1px solid var(--line);border-radius:26px;background:linear-gradient(to right,color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(to bottom,color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1px) 0 0/56px 56px,var(--white);box-shadow:var(--shadow-soft);overflow:hidden;padding:22px}
      .figure-title{position:relative;z-index:2;color:var(--accent-strong);font:800 1.3rem Georgia,serif}
      .axis{position:absolute;background:var(--muted);opacity:.42}.axis-x{left:54px;right:30px;bottom:50px;height:2px}.axis-y{left:54px;top:58px;bottom:50px;width:2px}
      .curve{position:absolute;left:75px;right:42px;height:92px;border-top:4px solid var(--accent);border-radius:50%;bottom:102px}.curve-b{bottom:82px;opacity:.48;border-width:3px}
      .figure-note{position:absolute;left:72px;right:28px;bottom:14px;color:var(--muted);font-size:.78rem;font-weight:800}
      .sequence{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
      .sequence-card{padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--white);box-shadow:var(--shadow-soft)}
      .sequence-card .n{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--accent);color:#fff;font-weight:950}.sequence-card h3{margin:10px 0 6px;color:var(--accent-strong);font-family:Georgia,serif}.sequence-card p{margin:0;color:var(--muted)}
      .sequence-arrow{display:grid;place-items:center;color:var(--accent);font-size:2rem;font-weight:950}
      .parallel-note{margin-top:16px;padding:14px 17px;border:1px dashed var(--accent);border-radius:18px;background:var(--accent-pale);color:var(--muted)}.parallel-note strong{color:var(--accent-strong)}
      .refline{margin-top:14px;padding-top:9px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}.refline strong{color:var(--accent-strong)}
      @media(max-width:1050px){.study-layout,.sequence{grid-template-columns:1fr}.sequence-arrow{transform:rotate(90deg)}}
    `;
    const st=d.createElement('style'); st.textContent=css; d.head.appendChild(st);

    let s=find('TWIXAV - établir une référence audiovisuelle');
    if(s){
      s.lead="Référence audiovisuelle avant l'olfaction, avec l'asymétrie temporelle comme question centrale.";
      s.content=`<div class="study-layout"><div class="card"><span class="badge">Prétest AV</span><h3 style="margin-top:12px">Design</h3><ul><li>n = 19 participants</li><li>Stimuli auditifs et visuels : 50, 150, 250 ms</li><li>SOA : -500 à +500 ms, pas de 100 ms</li><li>Jugement de simultanéité</li></ul><div class="callout" style="margin-top:14px"><strong>Rôle :</strong> obtenir une référence pour la largeur de fenêtre, le PSS et surtout l'asymétrie avant l'extension olfactive.</div><div class="callout" style="margin-top:10px"><strong>Mémoire de M1 :</strong> Alicia.</div></div>${figure('Courbes de simultanéité','Emplacement de la figure finale : p(same) × SOA × durée.')}</div>${refs('Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.')}`;
    }

    s=find('Un effet net de la durée et du décalage temporel');
    if(s){
      s.lead="Le prétest reproduit une structure temporelle nette et fait émerger l'asymétrie à expliquer.";
      s.content=`<div class="study-layout"><div><div class="result-strip" style="grid-template-columns:1fr"><div class="result"><div class="pval">p = .001</div><p>Effet de la durée</p></div><div class="result"><div class="pval">p &lt; .001</div><p>Effet du SOA</p></div><div class="result"><div class="pval">p = .001</div><p>Interaction durée × SOA</p></div></div><div class="callout" style="margin-top:14px"><strong>Question suivante :</strong> l'asymétrie vient-elle d'une différence de précision pour l'onset, l'offset ou la durée perçue ?</div></div>${figure('Résultats TWIXAV','Emplacement de la figure finale : courbes, FWHM/PSS et asymétrie.')}</div>${refs('Powers et al., 2009 ; Stevenson et al., 2012 ; McGovern et al., 2022.')}`;
      s.notes="Faire de l'asymétrie la transition directe vers SOFT, sans surinterpréter sa direction tant que les indices finaux ne sont pas verrouillés.";
    }

    s=find('De la fenêtre audiovisuelle à la temporalité olfactive');
    if(s){
      s.title='Pourquoi SOFT doit précéder TWIXOLF';
      s.kicker='Séquence expérimentale';
      s.lead="L'asymétrie décrite dans la littérature et retrouvée dans TWIXAV doit être dissociée avant d'ajouter la complexité olfactive.";
      s.content=`<div class="sequence"><div class="sequence-card"><div class="n">1</div><h3>TWIXAV</h3><p>Identifier fenêtre, PSS et asymétrie.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">2</div><h3>SOFT</h3><p>Dissocier onset, offset et durée perçue.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">3</div><h3>TWIXOLF</h3><p>Construire la fenêtre olfactive sur une temporalité mieux définie.</p></div></div><div class="parallel-note"><strong>Étape spatiale suivante :</strong> OASIS, après stabilisation de la plateforme olfactive et physiologique.</div>${refs('Keetels & Vroomen, 2012 ; Stevenson et al., 2012 ; Gotow & Kobayakawa, 2017.')}`;
    }

    s=find('Mesurer le temps propre de chaque modalité');
    if(s){
      s.title="SOFT - dissocier onset et offset pour comprendre l'asymétrie";
      s.kicker='SOFT - étude charnière';
      s.lead='Mesurer séparément apparition, disparition et durée perçue en audition, vision et olfaction.';
      s.content=`<div class="grid two"><div class="card dark"><h3>Hypothèse</h3><p>Une partie de l'asymétrie observée avec TWIXAV peut refléter une précision différente pour l'onset et l'offset plutôt que la seule largeur de la fenêtre temporelle.</p></div><div class="card"><h3>Mesures</h3><ul><li>onset perçu</li><li>offset perçu</li><li>durée perçue</li><li>comportement + EEG/physiologie selon configuration</li></ul></div></div><div class="sequence" style="margin-top:18px"><div class="sequence-card"><div class="n">A</div><h3>Onset</h3><p>Début physique vs début perçu.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">D</div><h3>Durée</h3><p>Intervalle physique vs intervalle perçu.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">O</div><h3>Offset</h3><p>Fin physique vs fin perçue.</p></div></div>${refs('Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.')}`;
      s.notes="SOFT est prioritaire avant TWIXOLF car il teste directement une explication possible de l'asymétrie temporelle.";
    }

    s=find("Transposer la liaison temporelle à l'olfaction");
    if(s){
      s.kicker='TWIXOLF - après SOFT';
      s.lead="Après SOFT, transposer la fenêtre temporelle à l'olfaction avec une définition plus solide du temps perceptif.";
      s.content=`<div class="study-layout"><div class="card"><span class="status ready">Prête à démarrer</span><h3 style="margin-top:12px">Question</h3><p>Quand une odeur et un signal visuel ou auditif sont-ils intégrés comme appartenant au même événement ?</p><ul><li>respiration</li><li>latence de délivrance</li><li>habituation</li><li>intensité et valence</li></ul></div>${figure('Commande → inspiration → perception',"Schéma de la chaîne temporelle olfactive : le timestamp logiciel ne suffit pas à définir l'onset perceptif.")}</div>${refs('Gotow & Kobayakawa, 2017 ; Keetels & Vroomen, 2012.')}`;
    }

    s=find('VIBEX - établir une référence visuelle de Boundary Extension');
    if(s){
      s.lead="Référence visuelle de l'axe spatial et première valorisation courte autonome.";
      s.content=`<div class="study-layout"><div class="card"><span class="status done">Prétest terminé</span><h3 style="margin-top:12px">Paradigme</h3><ul><li>24 scènes</li><li>image initiale 200 ms</li><li>délai 1000 ms</li><li>conditions LL, SS, LS, SL</li><li>réponse identique / différente</li></ul><div class="callout" style="margin-top:14px"><strong>Valorisation :</strong> préparation d'un <em>short paper</em>.</div><div class="callout" style="margin-top:10px"><strong>Mémoire de M1 :</strong> Olivia.</div></div>${figure('Boundary Extension','Emplacement de la figure finale : biais par condition/taille et indice global.')}</div>${refs('Intraub & Richardson, 1989 ; Gagnier et al., 2013 ; Bainbridge & Baker, 2020 ; Park et al., 2024.')}`;
    }

    s=find('OASIS - relier odeur, approche-évitement et espace');
    if(s){
      s.kicker='OASIS - après TWIXOLF';
      s.lead='Étape spatiale prioritaire après SOFT puis TWIXOLF, en réutilisant la plateforme olfactive et physiologique stabilisée.';
      s.content=`<div class="grid three"><div class="card"><h3>Dimension cognitive</h3><p>Tester une modulation spatiale liée à l'odeur sans réduire l'effet à une simple évaluation consciente du stimulus.</p></div><div class="card"><h3>Mesures prévues</h3><p>Comportement, EDA, ECG et respiration, avec canules et contrôle du moment de stimulation.</p></div><div class="card tint"><span class="status ready">Prête à démarrer</span><h3 style="margin-top:12px">Étape actuelle</h3><p>Le protocole et l'infrastructure sont suffisamment stabilisés pour engager les premiers prétests et le lancement expérimental.</p></div></div><div class="bridge">OASIS réutilise les mêmes briques matérielles et physiologiques que TWIXOLF et SOFT, plutôt que de développer une infrastructure séparée.</div>`;
    }

    s=find('Un horizon court centré sur la consolidation');
    if(s){
      s.title='Priorités 2026-2027 - un ordre expérimental explicite';
      s.lead='Lever les dépendances dans le bon ordre plutôt que lancer plusieurs manipulations centrales en parallèle.';
      s.content=`<div class="sequence"><div class="sequence-card"><div class="n">1</div><h3>SOFT</h3><p>Pilote complet, onset/offset, asymétrie.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">2</div><h3>TWIXOLF</h3><p>Fenêtre temporelle olfactive.</p></div><div class="sequence-arrow">→</div><div class="sequence-card"><div class="n">3</div><h3>OASIS</h3><p>Axe spatial et physiologie.</p></div></div><div class="parallel-note"><strong>En parallèle :</strong> TWIXAV - analyses finales ; VIBEX - short paper.</div>`;
    }

    s=find("Une progression conditionnelle plutôt qu'un calendrier rigide");
    if(s){
      s.title='Feuille de route - SOFT, puis TWIXOLF, puis OASIS';
      s.lead='La progression suit les dépendances méthodologiques et scientifiques du programme.';
      s.content=`<div class="roadmap"><div class="roadmap-card"><div class="year">Étape 1</div><h3>SOFT</h3><ul><li>pilote complet</li><li>onset / offset / durée</li><li>asymétrie</li></ul></div><div class="roadmap-card"><div class="year">Étape 2</div><h3>TWIXOLF</h3><ul><li>respiration</li><li>latence</li><li>fenêtre temporelle</li></ul></div><div class="roadmap-card"><div class="year">Étape 3</div><h3>OASIS</h3><ul><li>prétests odorants</li><li>EDA / ECG / respiration</li><li>approche-évitement</li></ul></div></div><div class="parallel-note"><strong>Valorisation parallèle :</strong> VIBEX - short paper ; TWIXAV - analyses finales ; communications 2027 selon maturité.</div>`;
    }

    s=find('Un programme à plusieurs niveaux de maturité');
    if(s){
      s.lead="Les trois études centrales à venir sont maintenant techniquement suffisamment stabilisées pour entrer en phase de démarrage, tout en conservant leur ordre de priorité.";
      s.content=`<div class="status-table"><div class="status-row"><div class="proj">TWIXAV</div><span class="status done">Prétest terminé</span><div class="desc">n = 19 - analyses préliminaires disponibles.</div><div class="desc">Finaliser les indices temporels.</div></div><div class="status-row"><div class="proj">VIBEX</div><span class="status done">Prétest terminé</span><div class="desc">Paradigme fonctionnel.</div><div class="desc">Norming des images et short paper.</div></div><div class="status-row"><div class="proj">TWIXOLF</div><span class="status ready">Prête à démarrer</span><div class="desc">Architecture PsychoPy + Sniffo/Spir0 stabilisée.</div><div class="desc">Lancement après SOFT.</div></div><div class="status-row"><div class="proj">SOFT</div><span class="status ready">Prête à démarrer</span><div class="desc">Architecture multimodale, logs et calibration stabilisés.</div><div class="desc">Priorité immédiate : pilote puis collecte.</div></div><div class="status-row"><div class="proj">OASIS</div><span class="status ready">Prête à démarrer</span><div class="desc">Plan, mesures physiologiques et infrastructure définis.</div><div class="desc">Prétests puis lancement après TWIXOLF.</div></div><div class="status-row"><div class="proj">Autres</div><span class="status future">Conditionnels</span><div class="desc">SOLAR, COBEX, BRAUD, BRAUDOLF, SORBET.</div><div class="desc">Activation selon résultats et faisabilité.</div></div></div>`;
      s.notes="Insister sur la distinction entre maturité technique et ordre scientifique : SOFT, puis TWIXOLF, puis OASIS sont toutes prêtes à démarrer, mais ne sont pas lancées simultanément.";
    }

    s=find('Repères bibliographiques - Axe 1');
    if(s){s.content=`<div class="refs"><p><strong>Gotow, N. & Kobayakawa, T. (2017).</strong> <em>PLOS ONE</em>, 12(4), e0174958.</p><p><strong>Keetels, M. & Vroomen, J. (2012).</strong> Perception of synchrony between the senses. In <em>Neural Bases of Multisensory Processes</em>.</p><p><strong>McGovern et al. (2022).</strong> <em>Neuropsychologia</em>, 175, 108352.</p><p><strong>Powers et al. (2009).</strong> <em>Journal of Neuroscience</em>, 29(39), 12265-12274.</p><p><strong>Stevenson et al. (2012).</strong> <em>Journal of Experimental Psychology: Human Perception and Performance</em>, 38(6), 1517-1527.</p><p><strong>Zerr et al. (2019).</strong> <em>Frontiers in Psychology</em>, 10, 2489.</p></div>`;}

    s=find('Repères bibliographiques - Axe 2');
    if(s){s.content=`<div class="refs"><p><strong>Intraub, H. & Richardson, M. (1989).</strong> <em>Journal of Experimental Psychology: Learning, Memory, and Cognition</em>, 15(2), 179-187.</p><p><strong>Intraub, H. (2012).</strong> <em>WIREs Cognitive Science</em>, 3(1), 117-127.</p><p><strong>Gagnier et al. (2013).</strong> <em>Quarterly Journal of Experimental Psychology</em>, 66(11), 2161-2186.</p><p><strong>Bainbridge, W. A. & Baker, C. I. (2020).</strong> <em>Current Biology</em>, 30(3), 537-543.e3.</p><p><strong>Park et al. (2024).</strong> <em>Journal of Vision</em>, 24(1), 9.</p><p><strong>Hall, E. H. & Geng, J. J. (2025).</strong> <em>Memory & Cognition</em>, 53, 6-18.</p><p><strong>Hörberg et al. (2020).</strong> <em>Cerebral Cortex</em>, 30(7), 4220-4237.</p><p><strong>Rekow et al. (2022).</strong> <em>NeuroImage</em>, 255, 119181.</p></div>`;}

    const soft=slides.find(x=>x.title&&x.title.startsWith('SOFT -'));
    const twixolf=slides.find(x=>x.title&&x.title.includes("Transposer la liaison temporelle à l'olfaction"));
    if(soft&&twixolf&&slides.indexOf(soft)>slides.indexOf(twixolf)){
      slides.splice(slides.indexOf(soft),1);
      slides.splice(slides.indexOf(twixolf),0,soft);
    }

    if(typeof w.renderSlides==='function') w.renderSlides();
    if(typeof w.goTo==='function') w.goTo(0,false);

    [...d.querySelectorAll('.control-section')].forEach(sec=>{const l=sec.querySelector('.control-label');if(l&&l.textContent.trim()==='Raccourcis')sec.remove();});

    d.addEventListener('keydown',e=>{
      if(['INPUT','TEXTAREA'].includes(d.activeElement?.tagName)) return;
      const k=e.key;
      if(k==='ArrowRight'){e.preventDefault();e.stopImmediatePropagation();if(typeof w.move==='function')w.move(1);return;}
      if(k==='ArrowLeft'){e.preventDefault();e.stopImmediatePropagation();if(typeof w.move==='function')w.move(-1);return;}
      const blocked=[' ','Home','End','PageDown','PageUp','m','M','o','O','n','N','f','F','c','C'];
      if(blocked.includes(k)){e.preventDefault();e.stopImmediatePropagation();}
    },true);
  }catch(err){console.error('Patch CSI:',err);}
});
</script>
</body>
</html>
