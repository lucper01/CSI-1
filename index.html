{color:var(--accent-strong);font-family:Georgia,serif;margin:10px 0 6px}.stepx p{color:var(--muted);margin:0}.arr{display:grid;place-items:center;color:var(--accent);font-size:2rem;font-weight:950}.parallel{margin-top:16px;padding:14px 17px;border:1px dashed var(--accent);border-radius:18px;background:var(--accent-pale);color:var(--muted)}.parallel strong{color:var(--accent-strong)}.refline{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}.refline strong{color:var(--accent-strong)}@media(max-width:1050px){.study,.seq{grid-template-columns:1fr}.arr{transform:rotate(90deg)}}\n",p="\n(function(){const F=t=>slides.find(s=>s.title&&s.title.includes(t)),R=t=>`<div class=\"refline\"><strong>Références :</strong> ${t}</div>`,G=(t,n)=>`<div class=\"fig\"><b>${t}</b><span class=\"curve\"></span><span class=\"curve b\"></span><div class=\"fignote\">${n}</div></div>`;\nlet s=F('TWIXAV - établir une référence audiovisuelle');if(s){s.lead=\"Référence audiovisuelle avant l'olfaction, avec l'asymétrie temporelle comme question centrale.\";s.content=`<div class=\"study\"><div class=\"card\"><span class=\"badge\">Prétest AV</span><h3 style=\"margin-top:12px\">Design</h3><ul><li>n = 19</li><li>50, 150, 250 ms</li><li>SOA -500 à +500 ms</li><li>jugement de simultanéité</li></ul><div class=\"callout\" style=\"margin-top:14px\"><strong>Rôle :</strong> largeur, PSS et asymétrie avant extension olfactive.</div><div class=\"callout\" style=\"margin-top:10px\"><strong>M1 :</strong> Alicia.</div></div>${G('Courbes de simultanéité','Insérer les courbes finales p(same) × SOA × durée.')}</div>${R('Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.')}`};\ns=F('Un effet net de la durée et du décalage temporel');if(s){s.lead=\"Le prétest reproduit une structure temporelle nette et fait émerger l'asymétrie à expliquer.\";s.content=`<div class=\"study\"><div><div class=\"result-strip\" style=\"grid-template-columns:1fr\"><div class=\"result\"><div class=\"pval\">p = .001</div><p>Durée</p></div><div class=\"result\"><div class=\"pval\">p &lt; .001</div><p>SOA</p></div><div class=\"result\"><div class=\"pval\">p = .001</div><p>Durée × SOA</p></div></div><div class=\"callout\" style=\"margin-top:14px\"><strong>Question :</strong> l'asymétrie vient-elle de l'onset, de l'offset ou de la durée perçue ?</div></div>${G('Figure TWIXAV finale','Courbes, FWHM/PSS et asymétrie selon l’analyse finale.')}</div>${R('Powers et al., 2009 ; Stevenson et al., 2012 ; McGovern et al., 2022.')}`;s.notes=\"Utiliser l'asymétrie comme transition directe vers SOFT.\"};\ns=F('De la fenêtre audiovisuelle à la temporalité olfactive');if(s){s.title='Pourquoi SOFT doit précéder TWIXOLF';s.kicker='Séquence expérimentale';s.lead=\"L'asymétrie observée dans la littérature et retrouvée dans TWIXAV doit être dissociée avant d'ajouter la complexité olfactive.\";s.content=`<div class=\"seq\"><div class=\"stepx\"><i>1</i><h3>TWIXAV</h3><p>Identifier fenêtre et asymétrie.</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>2</i><h3>SOFT</h3><p>Dissocier onset, offset et durée.</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>3</i><h3>TWIXOLF</h3><p>Construire la fenêtre olfactive sur une temporalité mieux définie.</p></div></div><div class=\"parallel\"><strong>Étape suivante de l'axe spatial :</strong> OASIS, après stabilisation de la plateforme olfactive et physiologique.</div>${R('Keetels & Vroomen, 2012 ; Stevenson et al., 2012 ; Gotow & Kobayakawa, 2017.')}`};\ns=F('Mesurer le temps propre de chaque modalité');if(s){s.title='SOFT - dissocier onset et offset pour comprendre l\'asymétrie';s.kicker='SOFT - étude charnière';s.lead='Mesurer séparément apparition, disparition et durée perçue en audition, vision et olfaction.';s.content=`<div class=\"grid two\"><div class=\"card dark\"><h3>Hypothèse</h3><p>Une partie de l'asymétrie TWIXAV peut refléter une précision différente pour l'onset et l'offset plutôt que la seule largeur de la fenêtre.</p></div><div class=\"card\"><h3>Mesures</h3><ul><li>onset perçu</li><li>offset perçu</li><li>durée perçue</li><li>comportement + EEG/physio selon configuration</li></ul></div></div><div class=\"seq\" style=\"margin-top:18px\"><div class=\"stepx\"><i>A</i><h3>Onset</h3><p>Début physique vs perçu</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>D</i><h3>Durée</h3><p>Intervalle perçu</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>O</i><h3>Offset</h3><p>Fin physique vs perçue</p></div></div>${R('Powers et al., 2009 ; Stevenson et al., 2012 ; Keetels & Vroomen, 2012.')}`;s.notes='SOFT est prioritaire avant TWIXOLF car il teste directement une explication possible de l’asymétrie.'};\ns=F(\"Transposer la liaison temporelle à l'olfaction\");if(s){s.kicker='TWIXOLF - après SOFT';s.lead='Après SOFT, transposer la fenêtre temporelle à l’olfaction avec une définition plus solide du temps perceptif.';s.content=`<div class=\"study\"><div class=\"card\"><span class=\"status progress\">Étude suivante</span><h3 style=\"margin-top:12px\">Question</h3><p>Quand une odeur et un signal visuel ou auditif sont-ils intégrés comme un même événement ?</p><ul><li>respiration</li><li>latence de délivrance</li><li>habituation</li><li>intensité/valence</li></ul></div>${G('Commande → inspiration → perception','Le timestamp logiciel ne suffit pas à définir l’onset olfactif.')}</div>${R('Gotow & Kobayakawa, 2017 ; Keetels & Vroomen, 2012.')}`};\ns=F('VIBEX - établir une référence visuelle de Boundary Extension');if(s){s.lead='Référence visuelle de l’axe spatial et première valorisation courte autonome.';s.content=`<div class=\"study\"><div class=\"card\"><span class=\"status done\">Prétest terminé</span><h3 style=\"margin-top:12px\">Paradigme</h3><ul><li>24 scènes</li><li>200 ms + délai 1000 ms</li><li>LL, SS, LS, SL</li><li>identique / différent</li></ul><div class=\"callout\" style=\"margin-top:14px\"><strong>Valorisation :</strong> écriture d'un <em>short paper</em>.</div><div class=\"callout\" style=\"margin-top:10px\"><strong>M1 :</strong> Olivia.</div></div>${G('Boundary Extension','Insérer biais par condition/taille et indice global.')}</div>${R('Intraub & Richardson, 1989 ; Gagnier et al., 2013 ; Bainbridge & Baker, 2020 ; Park et al., 2024.')}`};\ns=F('OASIS - relier odeur, approche-évitement et espace');if(s){s.kicker='OASIS - après TWIXOLF';s.lead='Étape spatiale prioritaire après SOFT et TWIXOLF, en réutilisant la plateforme stabilisée.'};\ns=F('Un horizon court centré sur la consolidation');if(s){s.title='Priorités 2026-2027 - un ordre expérimental explicite';s.lead='Lever les dépendances dans le bon ordre plutôt que lancer plusieurs manipulations en parallèle.';s.content=`<div class=\"seq\"><div class=\"stepx\"><i>1</i><h3>SOFT</h3><p>Pilote, onset/offset, asymétrie.</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>2</i><h3>TWIXOLF</h3><p>Fenêtre temporelle olfactive.</p></div><div class=\"arr\">→</div><div class=\"stepx\"><i>3</i><h3>OASIS</h3><p>Axe spatial et physiologie.</p></div></div><div class=\"parallel\"><strong>En parallèle :</strong> TWIXAV - analyses finales ; VIBEX - short paper.</div>`};\ns=F(\"Une progression conditionnelle plutôt qu'un calendrier rigide\");if(s){s.title='Feuille de route - SOFT, puis TWIXOLF, puis OASIS';s.content=`<div class=\"roadmap\"><div class=\"roadmap-card\"><div class=\"year\">Étape 1</div><h3>SOFT</h3><ul><li>pilote complet</li><li>onset/offset/durée</li><li>asymétrie</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">Étape 2</div><h3>TWIXOLF</h3><ul><li>respiration</li><li>latence</li><li>fenêtre temporelle</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">Étape 3</div><h3>OASIS</h3><ul><li>prétests odorants</li><li>EDA/ECG/respiration</li><li>approche-évitement</li></ul></div></div><div class=\"parallel\"><strong>Valorisation parallèle :</strong> VIBEX - short paper ; TWIXAV - analyses finales ; communications 2027 s
