name: Clean SORBET COBEX buttons on slides 14 and 51
on:
  push:
    paths:
      - '.github/workflows/csi-clean-sorbet-cobex-buttons-14-51.yml'
      - '.github/scripts/csi_clean_sorbet_cobex_buttons_14_51.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean targeted slides
        run: python .github/scripts/csi_clean_sorbet_cobex_buttons_14_51.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove SORBET COBEX buttons from slides 14 and 51"
          git push
