name: CSI update SOFT synchronization
on:
  push:
    paths:
      - '.github/workflows/csi-update-soft-sync.yml'
      - '.github/scripts/csi_update_soft_sync.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SOFT synchronization wording
        run: python .github/scripts/csi_update_soft_sync.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update SOFT synchronization wording"
            git push
          fi
