name: Inspect result badges
on:
  push:
    paths:
      - '.github/workflows/inspect-result-badges.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect result badge markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(text[start:])
          for i,s in enumerate(slides,1):
              blobs=[]
              for label,h in [('root',s),('fr',s.get('_fr') or {}),('en',s.get('_en') or {})]:
                  c=h.get('content','')
                  if 'MÉMOIRE M1' in c.upper() or 'MASTER' in c.upper() and ('N =' in c.upper() or 'N=' in c.upper()):
                      print('\nSLIDE',i,s.get('study'),s.get('title'),label)
                      for m in re.finditer(r'.{0,220}(?:MÉMOIRE M1|Mémoire M1|MASTER.{0,80})(?:.{0,260})',c,re.I|re.S):
                          print(m.group(0).replace('\n',' '))
              
          PY
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-result-badges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/inspect-result-badges.yml
          git commit -m "Remove temporary result badge inspection" || true
          git push
