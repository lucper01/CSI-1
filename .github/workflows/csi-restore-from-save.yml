name: CSI restore from save
on:
  push:
    paths:
      - '.github/workflows/csi-restore-from-save.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index from save
        run: |
          cp index_save.html index.html
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already identical"
          else
            git commit -m "Restore index from save"
            git push
          fi
