name: Fix FLUXOLF apparatus
on:
  push:
    paths:
      - '.github/workflows/fix-fluxolf-apparatus.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make apparatus cards clickable
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html, hashlib

          path=Path('index.html')
          backup=Path('index_save.html')
          backup_hash=hashlib.sha256(backup.read_bytes()).hexdigest()
          text=path.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end

          card_re=re.compile(
            r'<(?P<tag>div|a|button)(?P<attrs>[^>]*class="(?P<cls>[^"]*\bfloat-card\b[^"]*)"[^>]*)>\s*<b>(?P<label>[^<]+)</b>\s*<span>(?P<items>.*?)</span>\s*</(?P=tag)>',
            re.I|re.S
          )
          allowed={'matériel','materiel','material','equipment','appareillage'}
          changed=[]

          def plain(s):
              return re.sub(r'<[^>]+>','',s).strip()

          for i,s in enumerate(slides):
              title_blob=' '.join([s.get('title',''),(s.get('_fr') or {}).get('title',''),(s.get('_en') or {}).get('title',''),s.get('section','')])
              study=s.get('study') or ('FLUXOLF' if 'FLUXOLF' in title_blob.upper() else (s.get('title','').split(' - ')[0] if s.get('title') else f'Étude {i+1}'))
              local=0
              for holder,lang in [(s,'fr'),(s.get('_fr') or {},'fr'),(s.get('_en') or {},'en')]:
                  c=holder.get('content')
                  if not c:
                      continue
                  counter=[0]
                  def repl(m):
                      label=plain(m.group('label')).lower()
                      if label not in allowed:
                          return m.group(0)
                      items=plain(m.group('items'))
                      cls=m.group('cls').split()
                      if 'apparatus-open' not in cls:
                          cls.append('apparatus-open')
                      cls=' '.join(x for x in cls if x not in {'poster','m1'})
                      btn_label='Appareillage' if lang=='fr' else 'Equipment'
                      counter[0]+=1
                      return f'<button class="{html.escape(cls,quote=True)}" type="button" data-apparatus-study="{html.escape(study,quote=True)}" data-apparatus-items="{html.escape(items,quote=True)}"><b>{btn_label}</b><span>{items}</span></button>'
                  holder['content']=card_re.sub(repl,c)
                  local+=counter[0]
              if local:
                  changed.append((i+1,study,local))

          fluxolf=[x for x in changed if str(x[1]).upper()=='FLUXOLF']
          if not fluxolf:
              raise RuntimeError(f'No FLUXOLF apparatus card found. Changed={changed}')

          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+new_json+text[end:]
          path.write_text(text,encoding='utf-8')

          if hashlib.sha256(backup.read_bytes()).hexdigest()!=backup_hash:
              raise RuntimeError('index_save.html changed')

          final=path.read_text(encoding='utf-8')
          if 'id="apparatusModal"' not in final or 'id="apparatusPopupScript"' not in final:
              raise RuntimeError('Apparatus popup infrastructure missing')

          # Verify that every visible French Appareillage label inside slide data is attached to apparatus-open.
          st=final.index(marker)+len(marker)
          chk,_=json.JSONDecoder().raw_decode(final[st:])
          bad=[]
          total=0
          for n,s in enumerate(chk,1):
              for holder in [s,s.get('_fr') or {}]:
                  c=holder.get('content','')
                  total+=c.count('<b>Appareillage</b>')
                  for m in re.finditer(r'<(?P<tag>div|a|button)(?P<attrs>[^>]*)>\s*<b>Appareillage</b>',c,re.I|re.S):
                      if 'apparatus-open' not in m.group('attrs'):
                          bad.append(n)
          if bad:
              raise RuntimeError(f'Non-clickable Appareillage cards remain on slides {bad}')
          print('Updated cards:',changed)
          print('FLUXOLF:',fluxolf)
          print('Clickable Appareillage labels checked:',total)
          print('Backup SHA256:',backup_hash)
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make FLUXOLF apparatus popup clickable"
          rm .github/workflows/fix-fluxolf-apparatus.yml
          git add .github/workflows/fix-fluxolf-apparatus.yml
          git commit -m "Remove temporary FLUXOLF apparatus workflow"
          git push
