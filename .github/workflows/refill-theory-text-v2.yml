name: Refill theory text v2
on:
  push:
    paths:
      - '.github/workflows/refill-theory-text-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refill theoretical slides robustly
        shell: python
        run: |
          from pathlib import Path
          import json

          def parse_slides(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, marker, start, start + rel_end, slides

          text, marker, start, end, slides = parse_slides('index.html')
          _, _, _, _, saved = parse_slides('index_save.html')

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title', '')
          def by_title(seq, t):
              return next(s for s in seq if title(s) == t)
          def set_localized(slide, lang, lead, content):
              key = '_fr' if lang == 'fr' else '_en'
              slide.setdefault(key, {})
              slide[key]['lead'] = lead
              slide[key]['content'] = content
              if lang == 'fr':
                  slide['lead'] = lead
                  slide['content'] = content

          # 1. Vision + audition reference slide.
          s = by_title(slides, 'Vision et audition - deux modalités de référence')
          set_localized(s, 'fr',
              'En vision comme en audition, l’espace et le temps constituent des dimensions fondamentales de la perception. Leur traitement a été décrit à de nombreux niveaux, depuis la localisation d’une source jusqu’aux jugements d’ordre, de simultanéité et de durée.',
              '<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>Une scène structurée dans l’espace et le temps</h3><p>La vision fournit des informations explicites sur la position, la profondeur et le mouvement des objets. Elle permet également de caractériser précisément leur apparition, leur disparition et leur durée.</p><p>Ces dimensions rendent possible l’étude de la sélection spatiale, de la dynamique temporelle et de la relation entre plusieurs événements visuels.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>Une source localisable et temporellement définie</h3><p>L’audition permet d’estimer la direction d’une source grâce aux indices binauraux et spectraux. Elle possède également une résolution temporelle élevée, adaptée aux jugements d’ordre, de rythme et de synchronie.</p><p>Vision et audition offrent ainsi deux systèmes de référence particulièrement bien caractérisés pour étudier l’espace-temps perceptif.</p></div></div><div class="callout" style="margin-top:16px"><strong>Point de départ :</strong> pour ces deux modalités, les notions de « où ? » et de « quand ? » disposent déjà d’un cadre théorique et expérimental robuste.</div><div class="csi-cite">Middlebrooks, J. C., & Green, D. M. (1991). Annual Review of Psychology, 42, 135-159. Vroomen, J., & Keetels, M. (2010). Attention, Perception, & Psychophysics, 72, 871-884.</div>')
          set_localized(s, 'en',
              'In both vision and audition, space and time are fundamental dimensions of perception. Their processing has been characterized at many levels, from source localization to judgments of order, simultaneity and duration.',
              '<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>A scene structured in space and time</h3><p>Vision provides explicit information about object position, depth and motion. It also allows precise characterization of appearance, disappearance and duration.</p><p>These dimensions support the study of spatial selection, temporal dynamics and relations between multiple visual events.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>A localizable and temporally defined source</h3><p>Audition allows source direction to be estimated from binaural and spectral cues. It also has high temporal resolution, suited to judgments of order, rhythm and synchrony.</p><p>Vision and audition therefore provide two particularly well-characterized reference systems for perceptual space-time.</p></div></div><div class="callout" style="margin-top:16px"><strong>Starting point:</strong> for these two modalities, the questions of “where?” and “when?” already rest on a robust theoretical and experimental framework.</div><div class="csi-cite">Middlebrooks & Green (1991); Vroomen & Keetels (2010).</div>')

          # 2. Time.
          s = by_title(slides, 'Le temps - des événements que l’on sait mesurer')
          set_localized(s, 'fr',
              'Le temps perceptif ne se réduit pas à la simultanéité physique. Il peut être décomposé en événements élémentaires - début, fin, durée - puis en relations entre événements ou entre modalités.',
              '<div class="grid three"><div class="card"><div class="mono">ÉVÉNEMENT</div><h3>Onset - durée - offset</h3><p>Un stimulus possède un début, une période de présence et une fin. Chacune de ces composantes peut être perçue et jugée séparément.</p></div><div class="card"><div class="mono">RELATION</div><h3>Ordre et simultanéité</h3><p>Lorsque deux événements surviennent, on peut mesurer leur ordre temporel ou demander s’ils sont perçus comme simultanés.</p></div><div class="card dark"><div class="mono">INTÉGRATION</div><h3>Temporal Binding Window</h3><p>La perception tolère une certaine asynchronie : deux signaux peuvent être intégrés comme appartenant au même événement sans être physiquement simultanés.</p></div></div><div class="callout" style="margin-top:16px"><strong>Conséquence :</strong> la synchronie perçue correspond à une fenêtre de tolérance, potentiellement asymétrique et susceptible de recalibration.</div><div class="csi-cite">Vroomen, J., & Keetels, M. (2010). Perception of intersensory synchrony: a tutorial review. Attention, Perception, & Psychophysics, 72, 871-884.</div>')
          set_localized(s, 'en',
              'Perceptual time cannot be reduced to physical simultaneity. It can be decomposed into elementary events - onset, offset and duration - and then into relations between events or modalities.',
              '<div class="grid three"><div class="card"><div class="mono">EVENT</div><h3>Onset - duration - offset</h3><p>A stimulus has a beginning, a period of presence and an end. Each component can be perceived and judged separately.</p></div><div class="card"><div class="mono">RELATION</div><h3>Order and simultaneity</h3><p>When two events occur, their temporal order can be measured or observers can judge whether they appear simultaneous.</p></div><div class="card dark"><div class="mono">INTEGRATION</div><h3>Temporal Binding Window</h3><p>Perception tolerates some asynchrony: two signals can be integrated as belonging to the same event without being physically simultaneous.</p></div></div><div class="callout" style="margin-top:16px"><strong>Consequence:</strong> perceived synchrony corresponds to a tolerance window that may be asymmetric and recalibrated.</div><div class="csi-cite">Vroomen & Keetels (2010).</div>')

          # 3. Space.
          s = by_title(slides, 'L’espace - des sources que l’on sait localiser')
          set_localized(s, 'fr',
              'L’espace perceptif repose sur la capacité à attribuer un signal à une position ou à une source. Vision et audition disposent pour cela d’indices sensoriels bien identifiés et largement étudiés.',
              '<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>Une localisation explicite</h3><p>La position d’un objet est directement disponible dans la scène visuelle. Les relations gauche-droite, haut-bas, profondeur et mouvement constituent des dimensions spatiales immédiatement exploitables.</p><p>La localisation visuelle sert ainsi de repère puissant pour organiser l’attention et relier plusieurs signaux à un même événement.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>Localiser une source sans la voir</h3><p>Les différences interaurales de temps et d’intensité, complétées par les indices spectraux, permettent d’estimer azimut et élévation d’une source sonore.</p><p>L’espace auditif peut donc être quantifié même en l’absence de support visuel.</p></div></div><div class="callout" style="margin-top:16px"><strong>Point clé :</strong> dans ces modalités, la localisation fournit un critère important pour décider si plusieurs signaux proviennent d’une cause commune.</div><div class="csi-cite">Middlebrooks, J. C., & Green, D. M. (1991). Annual Review of Psychology, 42, 135-159. Stein, B. E., & Stanford, T. R. (2008). Nature Reviews Neuroscience, 9, 255-266.</div>')
          set_localized(s, 'en',
              'Perceptual space relies on the ability to assign a signal to a position or source. Vision and audition provide well-identified and extensively studied sensory cues for doing so.',
              '<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>Explicit localization</h3><p>An object’s position is directly available within the visual scene. Left-right, up-down, depth and motion relations provide immediately usable spatial dimensions.</p><p>Visual localization therefore provides a strong reference for organizing attention and linking multiple signals to a single event.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>Localizing a source without seeing it</h3><p>Interaural time and level differences, supplemented by spectral cues, allow azimuth and elevation of a sound source to be estimated.</p><p>Auditory space can therefore be quantified even without visual support.</p></div></div><div class="callout" style="margin-top:16px"><strong>Key point:</strong> in these modalities, localization is an important criterion for deciding whether several signals originate from a common cause.</div><div class="csi-cite">Middlebrooks & Green (1991); Stein & Stanford (2008).</div>')

          # 4. Space + time.
          s = by_title(slides, 'Espace + temps - attribuer les signaux au même événement')
          set_localized(s, 'fr',
              'Dans un environnement multisensoriel, le cerveau doit décider si plusieurs signaux appartiennent au même événement. La proximité spatiale et la proximité temporelle constituent deux indices majeurs de cette inférence.',
              '<div class="grid three"><div class="card"><div class="mono">ÉVÉNEMENT</div><h3>Plusieurs entrées sensorielles</h3><p>Un même événement peut produire simultanément une image et un son. Le système perceptif doit déterminer si ces signaux doivent être regroupés.</p></div><div class="card"><div class="mono">ESPACE</div><h3>La co-localisation favorise le regroupement</h3><p>Des signaux provenant de positions compatibles sont plus facilement attribués à une même source.</p></div><div class="card dark"><div class="mono">TEMPS</div><h3>La proximité temporelle favorise l’intégration</h3><p>Des signaux suffisamment proches dans le temps ont davantage de chances d’être perçus comme appartenant au même événement.</p></div></div><div class="callout" style="margin-top:16px"><strong>Vision + audition :</strong> ce couple fournit un modèle particulièrement documenté de l’intégration multisensorielle et de l’inférence de cause commune.</div><div class="csi-cite">Stein, B. E., & Stanford, T. R. (2008). Nature Reviews Neuroscience, 9, 255-266. Körding, K. P., et al. (2007). PLoS ONE, 2, e943.</div>')
          set_localized(s, 'en',
              'In a multisensory environment, the brain must decide whether several signals belong to the same event. Spatial and temporal proximity are two major cues for this inference.',
              '<div class="grid three"><div class="card"><div class="mono">EVENT</div><h3>Multiple sensory inputs</h3><p>A single event may generate both an image and a sound. The perceptual system must determine whether those signals should be grouped.</p></div><div class="card"><div class="mono">SPACE</div><h3>Co-location promotes grouping</h3><p>Signals originating from compatible positions are more readily assigned to the same source.</p></div><div class="card dark"><div class="mono">TIME</div><h3>Temporal proximity promotes integration</h3><p>Signals occurring sufficiently close in time are more likely to be perceived as belonging to the same event.</p></div></div><div class="callout" style="margin-top:16px"><strong>Vision + audition:</strong> this pairing provides a particularly well-documented model of multisensory integration and common-cause inference.</div><div class="csi-cite">Stein & Stanford (2008); Körding et al. (2007).</div>')

          # Sela & Sobel: restore the fuller French saved version, and write a matching full English version.
          old = by_title(saved, '« No space, no time? » - le paradoxe de l’attention olfactive')
          cur = by_title(slides, '« No space, no time? » - le paradoxe de l’attention olfactive')
          old_fr = old.get('_fr', old)
          for k in ('lead','content','notes'):
              if k in old_fr:
                  cur.setdefault('_fr', {})[k] = old_fr[k]
                  cur[k] = old_fr[k]
          set_localized(cur, 'en',
              'Sela and Sobel (2010) describe a modality whose spatial and temporal constraints differ markedly from those of vision and audition. The thesis turns this asymmetry into an experimental question.',
              '<div class="grid three"><div class="card"><div class="mono">SPACE</div><h3>Limited spontaneous spatialization</h3><p>Human olfactory localization is less precise and less directly available to attention than visual or auditory localization.</p></div><div class="card"><div class="mono">TIME</div><h3>Sampling through sniffing</h3><p>Olfactory information is sampled discontinuously during inhalations, so respiratory dynamics participate in the temporal structure of the stimulus.</p></div><div class="card dark"><div class="mono">STOLF</div><h3>The constraint to test</h3><p>Do these constraints abolish spatio-temporal organization, or do they change how it becomes available to perception and attention?</p></div></div><div class="callout" style="margin-top:16px"><strong>Starting point:</strong> “No space, no time?” is a working question, not a claim that olfaction lacks spatial or temporal representations.</div><div class="csi-cite">Sela, L., & Sobel, N. (2010). Human olfaction: a constant state of change-blindness. Experimental Brain Research, 205, 13-29.</div>')

          # Post-axis slides: restore fuller saved material in French, with saved English when available.
          mapping = {
              'Axe 1 - Temps': 'Axe 1 - Le temps : intégrer des signaux aux dynamiques différentes',
              'Axe 1 - Espace': 'Axe 1 - L’espace : que signifie « localiser » une odeur ?',
              'Axe 2 - Odeur → Vision': 'Axe 2 - Vision : une odeur peut modifier ce qui devient perceptuellement saillant',
              'Axe 2 - Odeur → Audition': 'Axe 2 - Audition : un terrain encore moins caractérisé',
          }
          for cur_title, old_title in mapping.items():
              cur = by_title(slides, cur_title)
              old = by_title(saved, old_title)
              old_fr = old.get('_fr', old)
              old_en = old.get('_en')
              for k in ('lead','content','notes'):
                  if k in old_fr:
                      cur.setdefault('_fr', {})[k] = old_fr[k]
                      cur[k] = old_fr[k]
                  if old_en and k in old_en:
                      cur.setdefault('_en', {})[k] = old_en[k]

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          Path('index.html').write_text(text[:start] + new_json + text[end:], encoding='utf-8')

          # Validate order after update.
          _, _, _, _, check = parse_slides('index.html')
          titles = [title(x) for x in check]
          expected = [
              'Vision et audition - deux modalités de référence',
              'Le temps - des événements que l’on sait mesurer',
              'L’espace - des sources que l’on sait localiser',
              'Espace + temps - attribuer les signaux au même événement',
              '« No space, no time? » - le paradoxe de l’attention olfactive',
              'Deux axes',
              'Axe 1 - Temps',
              'Axe 1 - Espace',
              'Axe 2 - Odeur → Vision',
              'Axe 2 - Odeur → Audition',
          ]
          assert titles[1:11] == expected, titles[1:11]
          print('OK - fuller theory text restored')
      - name: Validate saved checkpoint untouched
        run: git diff --exit-code -- index_save.html
      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/refill-theory-text.yml .github/workflows/refill-theory-text-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refill-theory-text.yml .github/workflows/refill-theory-text-v2.yml
          git commit -m "Restore fuller theory text in reframed sequence"
          git push