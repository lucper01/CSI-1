name: Add year 3 activities
on:
  push:
    paths:
      - '.github/scripts/csi_add_year3_activities.py'
      - '.github/workflows/csi-add-year3-activities.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add year 3 slide
        run: python .github/scripts/csi_add_year3_activities.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add year 3 activities slide"
          git push
