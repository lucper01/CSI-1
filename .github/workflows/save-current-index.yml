name: Save current CSI index
on:
  push:
    paths:
      - '.github/workflows/save-current-index.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync save with current index
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
      - name: Commit save checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git commit -m "Save current presentation state"
          git push
