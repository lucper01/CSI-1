name: CSI save then planning labels

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/csi_save_then_planning_labels.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save working deck
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before planning labels update"
            git push
          fi
      - name: Patch requested labels
        run: python .github/scripts/csi_save_then_planning_labels.py
      - name: Verify save frozen after patch
        run: git diff --exit-code -- index_save.html
      - name: Commit working deck update
        run: |
          git add index.html
          git commit -m "Update CSI planning labels"
          git push
