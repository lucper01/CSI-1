name: Move CSI slide 53
on:
  push:
    paths:
      - '.github/workflows/csi-move-slide53.yml'
permissions:
  contents: write
jobs:
  move-slide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move doctoral activities 2027-2028 slide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from collections import Counter

          path = Path('index.html')
          before = path.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = before.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(before[start:])
          end = start + rel_end

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title') or ''

          visible = [s for s in slides if not s.get('appendix')]
          assert len(visible) >= 53, len(visible)
          current_titles = [title(s) for s in visible]
          target_title = 'Activités doctorales prévues - 2027-2028'
          matches = [s for s in visible if title(s) == target_title]
          assert len(matches) == 1, len(matches)

          anchor = visible[49]      # current slide 50
          old_51 = visible[50]      # current slide 51
          target = matches[0]
          assert target is not anchor and target is not old_51

          target_old_pos = visible.index(target) + 1
          print('Target old position:', target_old_pos)
          print('Current slide 50:', title(anchor))
          print('Current slide 51:', title(old_51))

          original_multiset = Counter(json.dumps(s, ensure_ascii=False, sort_keys=True, separators=(',', ':')) for s in slides)
          original_style = re.findall(r'<style\b[^>]*>(.*?)</style>', before, flags=re.S | re.I)
          prefix = before[:start]
          suffix = before[end:]

          target_index = next(i for i, s in enumerate(slides) if s is target)
          slides.pop(target_index)
          anchor_index = next(i for i, s in enumerate(slides) if s is anchor)
          slides.insert(anchor_index + 1, target)

          new_visible = [s for s in slides if not s.get('appendix')]
          assert new_visible[49] is anchor
          assert new_visible[50] is target
          assert new_visible[51] is old_51

          new_multiset = Counter(json.dumps(s, ensure_ascii=False, sort_keys=True, separators=(',', ':')) for s in slides)
          assert new_multiset == original_multiset

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          after = prefix + new_json + suffix
          assert re.findall(r'<style\b[^>]*>(.*?)</style>', after, flags=re.S | re.I) == original_style
          assert after.startswith(prefix)
          assert after.endswith(suffix)
          path.write_text(after, encoding='utf-8')

          print('New slide 50:', title(new_visible[49]))
          print('New slide 51:', title(new_visible[50]))
          print('New slide 52:', title(new_visible[51]))

          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', after, flags=re.S | re.I)
          for i, script in enumerate(scripts):
              Path(f'/tmp/csi-script-{i}.js').write_text(script, encoding='utf-8')
          print('Scripts:', len(scripts))
          PY

          for f in /tmp/csi-script-*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

          git diff --exit-code -- index_save.html
      - name: Commit reordered slide
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move 2027-2028 doctoral activities slide"
          git push
