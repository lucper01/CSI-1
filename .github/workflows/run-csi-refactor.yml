name: Apply CSI refactor
'on':
  push:
    paths:
      - '.github/workflows/run-csi-refactor.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run refactor
        run: python tools_temp/apply_csi_refactor_20260908.py
      - name: Commit result
        run: |
          rm .github/workflows/run-csi-refactor.yml
          rm tools_temp/apply_csi_refactor_20260908.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Year 1 summary and fix TWIXAV accent"
          git push
