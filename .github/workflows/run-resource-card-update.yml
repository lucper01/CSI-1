name: Run CSI resource card update

on:
  push:
    paths:
      - ".github/workflows/run-resource-card-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update CSI index
        run: python3 tools_temp/update_resource_cards.py
      - name: Commit result
        run: |
          rm -rf tools_temp
          rm -f .github/workflows/run-resource-card-update.yml
          rm -f .github/workflows/harmonize-hardware-cards.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align future-study resource cards and refine timeline"
          git push
