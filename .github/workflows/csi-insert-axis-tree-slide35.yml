name: CSI insert STOLF axis tree slide
on:
  push:
    paths:
      - '.github/workflows/csi-insert-axis-tree-slide35.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Insert slide between main slides 34 and 35
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = text.index(marker) + len(marker)
          slides, consumed = json.JSONDecoder().raw_decode(text[pos:])
          main_positions = [i for i,s in enumerate(slides) if not s.get('appendix', False)]
          before_count = len(main_positions)
          assert before_count >= 35
          insert_at = main_positions[34]
          prev_title = slides[main_positions[33]].get('_fr', {}).get('title', slides[main_positions[33]].get('title',''))
          next_title = slides[main_positions[34]].get('_fr', {}).get('title', slides[main_positions[34]].get('title',''))
          print('Before slide 34:', prev_title)
          print('Before slide 35:', next_title)

          css = '''<style>
          .stolf-axis-tree{--linec:color-mix(in srgb,var(--accent-strong) 58%,var(--muted));position:relative;width:min(1080px,94%);margin:2px auto 0;min-height:490px;padding-top:2px}
          .stolf-axis-tree .tree-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;pointer-events:none}
          .stolf-axis-tree .root{position:relative;z-index:2;width:330px;margin:0 auto 36px;padding:17px 26px;border-radius:999px;text-align:center;background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:#fff;font-size:2.15rem;font-weight:950;letter-spacing:.055em;box-shadow:0 12px 30px color-mix(in srgb,var(--accent-strong) 22%,transparent);border:1px solid color-mix(in srgb,#fff 18%,transparent)}
          .stolf-axis-tree .axes{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:190px;align-items:start}
          .stolf-axis-tree .axis{display:flex;flex-direction:column;align-items:center}
          .stolf-axis-tree .axis-head{min-width:205px;padding:11px 24px;border-radius:999px;text-align:center;background:color-mix(in srgb,var(--accent) 12%,var(--white));border:2px solid color-mix(in srgb,var(--accent) 62%,var(--line));color:var(--accent-strong);font-size:1.22rem;font-weight:950;box-shadow:0 7px 18px color-mix(in srgb,var(--accent-strong) 8%,transparent);margin-bottom:22px}
          .stolf-axis-tree .flow{display:grid;gap:19px;width:min(300px,100%)}
          .stolf-axis-tree .node{--c:var(--accent);position:relative;display:grid;place-items:center;min-height:56px;padding:10px 18px;border-radius:999px;text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,var(--white)),color-mix(in srgb,var(--c) 7%,var(--white)));border:2px solid color-mix(in srgb,var(--c) 52%,var(--line));color:var(--c);font-size:1.05rem;font-weight:950;letter-spacing:.015em;box-shadow:0 7px 18px color-mix(in srgb,var(--c) 11%,transparent)}
          .stolf-axis-tree .node:not(:last-child)::after{content:'';position:absolute;left:50%;bottom:-21px;width:2px;height:19px;background:var(--linec);transform:translateX(-50%)}
          .stolf-axis-tree .node:not(:last-child)::before{content:'';position:absolute;left:50%;bottom:-23px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--linec);transform:translateX(-50%);z-index:3}
          .stolf-axis-tree .faded{opacity:.38;filter:saturate(.58)}
          .stolf-axis-tree .focus{color:#fff;border-color:color-mix(in srgb,var(--c) 82%,#111);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));box-shadow:0 10px 24px color-mix(in srgb,var(--c) 25%,transparent)}
          .stolf-axis-tree .twixav{--c:#0072B2}.stolf-axis-tree .softn{--c:#7652A8}.stolf-axis-tree .twixolf{--c:#C36C32}.stolf-axis-tree .solar{--c:#009E73}
          .stolf-axis-tree .vibex{--c:#2F7D5A}.stolf-axis-tree .vibolf{--c:#B44E6C}.stolf-axis-tree .braud{--c:#D55E00}.stolf-axis-tree .braudolf{--c:#C43B55}
          .stolf-axis-tree .tree-note{position:relative;z-index:2;margin:17px auto 0;text-align:center;color:var(--muted);font-size:.74rem;font-weight:800}
          @media(max-width:900px){.stolf-axis-tree{width:100%;min-height:0}.stolf-axis-tree .tree-svg{display:none}.stolf-axis-tree .axes{gap:24px}.stolf-axis-tree .root{margin-bottom:18px}.stolf-axis-tree .axis-head{margin-bottom:14px}.stolf-axis-tree .flow{gap:13px}.stolf-axis-tree .node:not(:last-child)::after,.stolf-axis-tree .node:not(:last-child)::before{display:none}}
          </style>'''

          fr_content = css + '''<div class="stolf-axis-tree">
          <svg class="tree-svg" viewBox="0 0 1080 490" preserveAspectRatio="none" aria-hidden="true">
            <defs><marker id="stolf-arrow-fr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
            <g fill="none" stroke="currentColor" color="var(--linec)" stroke-width="3" stroke-linecap="round" marker-end="url(#stolf-arrow-fr)">
              <path d="M540 84 C500 110 405 128 290 154"/>
              <path d="M540 84 C580 110 675 128 790 154"/>
            </g>
          </svg>
          <div class="root">STOLF</div>
          <div class="axes">
            <section class="axis"><div class="axis-head">Axe 1</div><div class="flow">
              <div class="node twixav faded">TWIXAV</div>
              <div class="node softn faded">SOFT</div>
              <div class="node twixolf faded">TWIXOLF</div>
              <div class="node solar focus">SOLAR</div>
            </div></section>
            <section class="axis"><div class="axis-head">Axe 2</div><div class="flow">
              <div class="node vibex faded">VIBEX</div>
              <div class="node vibolf faded">VIBOLF</div>
              <div class="node braud focus">BRAUD</div>
              <div class="node braudolf focus">BRAUDOLF</div>
            </div></section>
          </div>
          </div>'''

          en_content = css + '''<div class="stolf-axis-tree">
          <svg class="tree-svg" viewBox="0 0 1080 490" preserveAspectRatio="none" aria-hidden="true">
            <defs><marker id="stolf-arrow-en" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
            <g fill="none" stroke="currentColor" color="var(--linec)" stroke-width="3" stroke-linecap="round" marker-end="url(#stolf-arrow-en)">
              <path d="M540 84 C500 110 405 128 290 154"/>
              <path d="M540 84 C580 110 675 128 790 154"/>
            </g>
          </svg>
          <div class="root">STOLF</div>
          <div class="axes">
            <section class="axis"><div class="axis-head">Axis 1</div><div class="flow">
              <div class="node twixav faded">TWIXAV</div>
              <div class="node softn faded">SOFT</div>
              <div class="node twixolf faded">TWIXOLF</div>
              <div class="node solar focus">SOLAR</div>
            </div></section>
            <section class="axis"><div class="axis-head">Axis 2</div><div class="flow">
              <div class="node vibex faded">VIBEX</div>
              <div class="node vibolf faded">VIBOLF</div>
              <div class="node braud focus">BRAUD</div>
              <div class="node braudolf focus">BRAUDOLF</div>
            </div></section>
          </div>
          </div>'''

          new_slide = {
            'chapter':'Projection',
            'study':'',
            'appendix':False,
            '_fr':{
              'section':'Projection',
              'kicker':'Architecture des études',
              'title':'STOLF - des axes aux études',
              'lead':'Deux trajectoires complémentaires structurent la suite du programme expérimental.',
              'content':fr_content,
              'notes':'Présenter la logique d’enchaînement au sein des deux axes. Les études déjà réalisées, engagées ou structurantes sont volontairement atténuées afin de mettre visuellement en avant SOLAR, BRAUD et BRAUDOLF comme extensions à discuter.'
            },
            '_en':{
              'section':'Projection',
              'kicker':'Study architecture',
              'title':'STOLF - from axes to studies',
              'lead':'Two complementary trajectories structure the next stages of the experimental programme.',
              'content':en_content,
              'notes':'Present the study sequence within both axes. Completed, ongoing or core studies are intentionally faded to visually emphasize SOLAR, BRAUD and BRAUDOLF as extensions for discussion.'
            },
            'section':'Projection',
            'kicker':'Architecture des études',
            'title':'STOLF - des axes aux études',
            'lead':'Deux trajectoires complémentaires structurent la suite du programme expérimental.',
            'content':fr_content,
            'notes':'Présenter la logique d’enchaînement au sein des deux axes. Les études déjà réalisées, engagées ou structurantes sont volontairement atténuées afin de mettre visuellement en avant SOLAR, BRAUD et BRAUDOLF comme extensions à discuter.'
          }

          slides.insert(insert_at, new_slide)
          new_array = json.dumps(slides, ensure_ascii=False, indent=2)
          out = text[:pos] + new_array + text[pos+consumed:]
          p.write_text(out, encoding='utf-8')
          print('Main slides:', before_count, '->', before_count + 1)
          PY
      - name: Validate inserted slide and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = '
          pos=text.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(text[pos:])
          main=[s for s in slides if not s.get('appendix',False)]
          assert main[34]['_fr']['title']=='STOLF - des axes aux études'
          c=main[34]['_fr']['content']
          assert c.index('TWIXAV') < c.index('SOFT') < c.index('TWIXOLF') < c.index('SOLAR')
          assert c.index('VIBEX') < c.index('VIBOLF') < c.index('BRAUD') < c.index('BRAUDOLF')
          assert 'node solar focus' in c and 'node braud focus' in c and 'node braudolf focus' in c
          assert 'node twixav faded' in c and 'node softn faded' in c and 'node twixolf faded' in c and 'node vibex faded' in c and 'node vibolf faded' in c
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          matches=[s for s in scripts if 'const slides = [' in s]
          assert len(matches)==1
          Path('/tmp/slides.js').write_text(matches[0],encoding='utf-8')
          print('New slide 35:',main[34]['_fr']['title'])
          print('New main count:',len(main))
          print('Adjacent 34:',main[33]['_fr']['title'])
          print('Adjacent 36:',main[35]['_fr']['title'])
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: test "$SAVE_SHA" = "$(git hash-object index_save.html)"
      - name: Commit update and remove helper
        run: |
          rm .github/workflows/csi-insert-axis-tree-slide35.yml
          git add index.html .github/workflows/csi-insert-axis-tree-slide35.yml
          git commit -m "Insert STOLF axis tree between slides 34 and 35"
          git push origin main
