name: Inspect CSI demo JS
on:
  push:
    paths:
      - '.github/workflows/inspect-csi-demo-js.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print demo scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index_save.html').read_text(encoding='utf-8')
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)):
              if 'demo' in s.lower() or 'vibex' in s.lower():
                  print(f'===== SCRIPT {i} =====')
                  print(s)
          PY
