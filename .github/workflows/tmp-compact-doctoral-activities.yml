name: CSI compact doctoral activities
on:
  push:
    paths:
      - '.github/workflows/tmp-compact-doctoral-activities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Freeze save hash
        run: |
          echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Compact doctoral activity slides
        run: python tools/tmp_compact_doctoral_activities.py
      - name: Validate presentation JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          target=next((s for s in scripts if 'const slides = [' in s), None)
          if target is None:
              raise SystemExit('Slides script not found')
          Path('/tmp/csi-slides-script.js').write_text(target, encoding='utf-8')
          PY
          node --check /tmp/csi-slides-script.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_SHA"
          grep -q "CSI_DOCTORAL_ACTIVITIES_COMPACT_V1" index.html
      - name: Commit working presentation
        run: |
          git add index.html
          git commit -m "Simplify doctoral activity cards and keep details in speaker notes"
          git push
      - name: Remove temporary helpers
        run: |
          git rm tools/tmp_compact_doctoral_activities.py .github/workflows/tmp-compact-doctoral-activities.yml
          git commit -m "Remove temporary doctoral activity helpers"
          git push
