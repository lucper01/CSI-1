name: CSI save then add laser pointer

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/csi_save_add_laser_pointer.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current working deck
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before laser pointer"
            git push
          fi
          echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"

      - name: Add red laser pointer
        run: python .github/scripts/csi_save_add_laser_pointer.py

      - name: Verify save remains frozen
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html

      - name: Commit working deck update and clean helpers
        run: |
          rm -f .github/scripts/csi_save_add_laser_pointer.py
          rm -f .github/workflows/csi-save-add-laser-pointer.yml
          git add index.html .github/scripts/csi_save_add_laser_pointer.py .github/workflows/csi-save-add-laser-pointer.yml
          git diff --cached --exit-code -- index_save.html
          git commit -m "Add toggleable red laser pointer"
          git push
