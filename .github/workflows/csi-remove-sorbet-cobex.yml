name: Remove SORBET and COBEX
on:
  push:
    paths:
      - '.github/scripts/csi_remove_sorbet_cobex.py'
      - '.github/workflows/csi-remove-sorbet-cobex.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove removed studies
        run: python .github/scripts/csi_remove_sorbet_cobex.py
      - name: Verify saved checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove SORBET and COBEX from CSI deck"
          git push
