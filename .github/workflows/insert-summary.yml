name: Insert summary slide
on:
  push:
    paths:
      - '.github/workflows/insert-summary.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert summary between slides 1 and 2
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib

          def parse(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, start, start + rel_end, slides

          before_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          text, start, end, slides = parse('index.html')

          titles = [(s.get('title') or s.get('_fr', {}).get('title','')) for s in slides]
          if 'Sommaire' in titles:
              raise SystemExit('A Sommaire slide already exists')

          fr_content = '''<div class="grid three"><div class="card"><div class="mono">PARTIE 1</div><h3>Contexte théorique</h3><p>De la caractérisation spatio-temporelle de la vision et de l’audition au contraste olfactif et aux deux axes de la thèse.</p></div><div class="card"><div class="mono">PARTIE 2</div><h3>Architecture de la thèse</h3><p>Organisation générale du programme, articulation des études structurantes et logique expérimentale.</p></div><div class="card"><div class="mono">PARTIE 3</div><h3>Ce qui a été fait en première année</h3><p>Études menées, résultats obtenus, développement méthodologique et activités doctorales.</p></div><div class="card"><div class="mono">PARTIE 4</div><h3>Ce qui sera fait en deuxième année</h3><p>Priorités expérimentales, études à venir et organisation de la prochaine année de doctorat.</p></div><div class="card"><div class="mono">PARTIE 5</div><h3>Ce qu’on envisage pour compléter</h3><p>Études complémentaires et exploratoires envisagées selon les résultats et la faisabilité.</p></div><div class="card dark"><div class="mono">PARTIE 6</div><h3>Rétroplanning global</h3><p>Calendrier des études, valorisation scientifique et progression jusqu’à la fin de la thèse.</p></div></div>'''
          en_content = '''<div class="grid three"><div class="card"><div class="mono">PART 1</div><h3>Theoretical context</h3><p>From the spatio-temporal characterization of vision and audition to the olfactory contrast and the two thesis axes.</p></div><div class="card"><div class="mono">PART 2</div><h3>Thesis architecture</h3><p>Overall programme organization, articulation of the core studies and experimental logic.</p></div><div class="card"><div class="mono">PART 3</div><h3>What was done in year 1</h3><p>Studies conducted, results obtained, methodological development and doctoral activities.</p></div><div class="card"><div class="mono">PART 4</div><h3>What will be done in year 2</h3><p>Experimental priorities, upcoming studies and organization of the next doctoral year.</p></div><div class="card"><div class="mono">PART 5</div><h3>What we are considering to complete the programme</h3><p>Complementary and exploratory studies depending on results and feasibility.</p></div><div class="card dark"><div class="mono">PART 6</div><h3>Global timeline</h3><p>Study schedule, scientific dissemination and progression through the end of the PhD.</p></div></div>'''

          summary = {
              'chapter':'Sommaire','study':'','appendix':False,
              '_fr':{
                  'section':'Sommaire','kicker':'Plan de la présentation','title':'Sommaire',
                  'lead':'La présentation suit six parties, du cadre théorique jusqu’au rétroplanning global.',
                  'content':fr_content,'notes':'Présenter rapidement la structure générale avant d’entrer dans le contexte théorique.'
              },
              '_en':{
                  'section':'Contents','kicker':'Presentation outline','title':'Contents',
                  'lead':'The presentation follows six parts, from the theoretical framework to the global timeline.',
                  'content':en_content,'notes':'Briefly present the overall structure before entering the theoretical context.'
              },
              'section':'Sommaire','kicker':'Plan de la présentation','title':'Sommaire',
              'lead':'La présentation suit six parties, du cadre théorique jusqu’au rétroplanning global.',
              'content':fr_content,'notes':'Présenter rapidement la structure générale avant d’entrer dans le contexte théorique.'
          }

          assert len(slides) >= 2
          slides.insert(1, summary)
          assert (slides[2].get('title') or slides[2].get('_fr',{}).get('title')) == 'Contexte théorique'
          assert 'PARTIE 1' in (slides[2].get('content') or slides[2].get('_fr',{}).get('content',''))

          new_text = text[:start] + json.dumps(slides, ensure_ascii=False, separators=(',',':')) + text[end:]
          Path('index.html').write_text(new_text, encoding='utf-8')

          after_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          assert before_save == after_save, 'index_save.html changed unexpectedly'
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/insert-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/insert-summary.yml
          git commit -m "Add presentation summary slide"
          git push
