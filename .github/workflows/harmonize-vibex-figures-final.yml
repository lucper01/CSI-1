name: Harmonize VIBEX figures final
on:
  push:
    paths:
      - '.github/workflows/harmonize-vibex-figures-final.yml'
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate VIBEX figure family
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          out=Path('assets/results'); FONT='Arial,Helvetica,sans-serif'
          def esc(x): return html.escape(str(x),quote=True)
          def facet_svg(title, facets, ylabel, ymin, ymax, errors=None, note=''):
              W,H=960,520; L,R,T,B,gap=64,24,62,70,18
              panel_w=(W-L-R-gap*2)/3; plot_top=T+38; plot_bottom=H-B; ph=plot_bottom-plot_top
              colors=['#173f5f','#6d8b7a','#2f7d5a','#9bbcaf']; labels=['LL','SS','SL','LS']
              def Y(v): return plot_top+(ymax-v)/(ymax-ymin)*ph
              s=[f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}"><rect width="100%" height="100%" rx="24" fill="#fff"/><text x="{L}" y="31" font-family="{FONT}" font-size="21" font-weight="700" fill="#173f32">{esc(title)}</text>']
              for pi,(facet,vals) in enumerate(facets):
                  x0=L+pi*(panel_w+gap)
                  s.append(f'<rect x="{x0:.1f}" y="{T:.1f}" width="{panel_w:.1f}" height="{plot_bottom-T:.1f}" rx="17" fill="#fbfcfb" stroke="#dfe7e3"/><text x="{x0+panel_w/2:.1f}" y="{T+23}" text-anchor="middle" font-family="{FONT}" font-size="16" font-weight="800" fill="#26342d">{esc(facet)}</text>')
                  for ti in range(5):
                      v=ymin+(ymax-ymin)*ti/4; y=Y(v)
                      s.append(f'<line x1="{x0+34:.1f}" y1="{y:.1f}" x2="{x0+panel_w-12:.1f}" y2="{y:.1f}" stroke="#e7ece9"/>')
                      if pi==0: s.append(f'<text x="{x0+28:.1f}" y="{y+5:.1f}" text-anchor="end" font-family="{FONT}" font-size="12" fill="#65736c">{v:.0f}</text>')
                  px0=x0+50; pw=panel_w-74; pts=[]
                  for j,v in enumerate(vals):
                      x=px0+pw*j/3; y=Y(v); pts.append((x,y))
                      if errors:
                          lo,hi=errors[pi][j]; ylo=Y(lo); yhi=Y(hi)
                          s.append(f'<line x1="{x:.1f}" y1="{yhi:.1f}" x2="{x:.1f}" y2="{ylo:.1f}" stroke="{colors[j]}" stroke-width="2"/><line x1="{x-5:.1f}" y1="{yhi:.1f}" x2="{x+5:.1f}" y2="{yhi:.1f}" stroke="{colors[j]}" stroke-width="2"/><line x1="{x-5:.1f}" y1="{ylo:.1f}" x2="{x+5:.1f}" y2="{ylo:.1f}" stroke="{colors[j]}" stroke-width="2"/>')
                      s.append(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="5.5" fill="#fff" stroke="{colors[j]}" stroke-width="3"/><text x="{x:.1f}" y="{plot_bottom+24}" text-anchor="middle" font-family="{FONT}" font-size="13" font-weight="700" fill="#34443c">{labels[j]}</text>')
                  s.append('<polyline points="'+' '.join(f'{x:.1f},{y:.1f}' for x,y in pts)+'" fill="none" stroke="#6f7d76" stroke-width="1.6" opacity=".35"/>')
                  yb=T+32
                  for a,b,col in [(0,1,'#6d8b7a'),(2,3,'#2f7d5a')]:
                      s.append(f'<line x1="{pts[a][0]:.1f}" y1="{yb:.1f}" x2="{pts[b][0]:.1f}" y2="{yb:.1f}" stroke="{col}" stroke-width="3" stroke-linecap="round"/>')
              s.append(f'<text x="19" y="{(plot_top+plot_bottom)/2:.1f}" transform="rotate(-90 19 {(plot_top+plot_bottom)/2:.1f})" text-anchor="middle" font-family="{FONT}" font-size="15" fill="#405149">{esc(ylabel)}</text>')
              if note: s.append(f'<text x="{W/2:.1f}" y="{H-17}" text-anchor="middle" font-family="{FONT}" font-size="12" fill="#69776f">{esc(note)}</text>')
              s.append('</svg>'); return ''.join(s)

          resp=[('Petite',[79.4,68.4,58.4,27.8]),('Moyenne',[77.5,77.6,50.5,25.2]),('Grande',[79.5,77.9,47.1,32.3])]
          ci=[[(74.3,84.5),(60.4,76.4),(49.7,67.2),(19.9,35.7)],[(71.6,83.5),(72.6,82.7),(41.1,59.9),(18.6,31.7)],[(73.4,85.6),(71.0,84.9),(39.4,54.8),(23.7,40.8)]]
          (out/'vibex_size_interaction.svg').write_text(facet_svg('VIBEX - condition × taille de l’image',resp,'Réponses « identique » (%)',0,100,ci,'IC95 - même ordre LL · SS · SL · LS'),encoding='utf-8')
          rt=[('Petite',[821,850,842,789]),('Moyenne',[838,808,848,811]),('Grande',[803,804,821,807])]
          (out/'vibex_rt_interaction.svg').write_text(facet_svg('VIBEX - temps de réaction par condition et taille',rt,'Temps de réaction (ms)',740,900,None,'Intervalles par taille indisponibles dans la source - aucune barre inventée'),encoding='utf-8')

          vals=[78.8,74.7,52.0,28.4]; cis=[(73.9,83.8),(68.7,80.6),(44.4,59.6),(21.4,35.4)]
          W,H,L,R,T,B=900,520,92,35,70,72
          def Y(v): return T+(100-v)/100*(H-T-B)
          xs=[190,355,565,730]; cols=['#173f5f','#6d8b7a','#2f7d5a','#9bbcaf']; labs=['LL','SS','SL','LS']
          z=[f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}"><rect width="100%" height="100%" rx="24" fill="#fff"/><text x="{L}" y="34" font-family="{FONT}" font-size="21" font-weight="700" fill="#173f32">VIBEX - réponses « identique » selon la condition</text>']
          for v in [0,20,40,60,80,100]:
              y=Y(v); z.append(f'<line x1="{L}" y1="{y:.1f}" x2="{W-R}" y2="{y:.1f}" stroke="#e7ece9"/><text x="{L-12}" y="{y+5:.1f}" text-anchor="end" font-family="{FONT}" font-size="13" fill="#65736c">{v}</text>')
          for x,v,(lo,hi),col,lab in zip(xs,vals,cis,cols,labs):
              y,ylo,yhi=Y(v),Y(lo),Y(hi)
              z.append(f'<line x1="{x}" y1="{yhi:.1f}" x2="{x}" y2="{ylo:.1f}" stroke="{col}" stroke-width="3"/><line x1="{x-8}" y1="{yhi:.1f}" x2="{x+8}" y2="{yhi:.1f}" stroke="{col}" stroke-width="3"/><line x1="{x-8}" y1="{ylo:.1f}" x2="{x+8}" y2="{ylo:.1f}" stroke="{col}" stroke-width="3"/><circle cx="{x}" cy="{y:.1f}" r="8" fill="#fff" stroke="{col}" stroke-width="4"/><text x="{x}" y="{H-B+29}" text-anchor="middle" font-family="{FONT}" font-size="17" font-weight="800" fill="#26342d">{lab}</text>')
          for xa,xb,col,txt in [(xs[0],xs[1],'#6d8b7a','LL ↔ SS · n.s.'),(xs[2],xs[3],'#2f7d5a','SL > LS · p < .001')]:
              z.append(f'<line x1="{xa}" y1="54" x2="{xb}" y2="54" stroke="{col}" stroke-width="4" stroke-linecap="round"/><text x="{(xa+xb)/2}" y="45" text-anchor="middle" font-family="{FONT}" font-size="14" font-weight="700" fill="{col}">{esc(txt)}</text>')
          z.append(f'<line x1="{L}" y1="{H-B}" x2="{W-R}" y2="{H-B}" stroke="#405149" stroke-width="2"/><line x1="{L}" y1="{T}" x2="{L}" y2="{H-B}" stroke="#405149" stroke-width="2"/><text x="24" y="{(T+H-B)/2}" transform="rotate(-90 24 {(T+H-B)/2})" text-anchor="middle" font-family="{FONT}" font-size="15" fill="#405149">Réponses « identique » (%)</text></svg>')
          (out/'vibex_conditions.svg').write_text(''.join(z),encoding='utf-8')
          PY
      - name: Validate and commit figures
        run: |
          grep -q 'Petite' assets/results/vibex_size_interaction.svg
          grep -q 'Moyenne' assets/results/vibex_size_interaction.svg
          grep -q 'Grande' assets/results/vibex_size_interaction.svg
          grep -q 'LL ↔ SS' assets/results/vibex_conditions.svg
          grep -q 'SL > LS' assets/results/vibex_conditions.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/vibex_conditions.svg assets/results/vibex_size_interaction.svg assets/results/vibex_rt_interaction.svg
          git commit -m "Harmonize VIBEX result figures"
          git push
