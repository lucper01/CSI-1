name: Expand CSI bibliography
on:
  push:
    paths:
      - '.github/scripts/csi_expand_bibliography.py'
      - '.github/workflows/csi-expand-bibliography.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand bibliography appendices
        run: python .github/scripts/csi_expand_bibliography.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          Path('/tmp/csi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/csi-inline.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand bibliography appendices"
          git push
