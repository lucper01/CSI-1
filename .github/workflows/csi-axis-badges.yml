name: Add study axis badges
on:
  push:
    paths:
      - '.github/workflows/csi-axis-badges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discreet axis badges
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify frozen backup
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add discreet axis badges to study slides"
          git push
