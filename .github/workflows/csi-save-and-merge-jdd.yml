name: Save then merge JDD into activities
on:
  push:
    paths:
      - '.github/scripts/csi_merge_jdd_into_activities.py'
      - '.github/workflows/csi-save-and-merge-jdd.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save current checkpoint
        shell: bash
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet || git commit -m "Save current CSI checkpoint"
          git push
      - name: Merge JDD into activities slide
        run: python .github/scripts/csi_merge_jdd_into_activities.py
      - name: Keep checkpoint frozen after merge
        shell: bash
        run: |
          test "$(git show HEAD:index_save.html | sha256sum | cut -d' ' -f1)" = "$(sha256sum index_save.html | cut -d' ' -f1)"
      - name: Commit merged slide
        shell: bash
        run: |
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Merge JDD 2026 into year 1 activities"
          git push
