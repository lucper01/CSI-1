name: Add Morgane Barret FLUXOLF M1
on:
  push:
    paths:
      - '.github/workflows/add-morgane-fluxolf.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update slide 16
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          p=pathlib.Path('index.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          if not m: raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))
          idx=next((i for i,s in enumerate(slides) if s.get('title')=='Enseignement, formation et encadrement'),None)
          if idx is None: raise SystemExit('activity slide not found')
          if idx != 15: raise SystemExit(f'activity slide is {idx+1}, expected 16')
          s=slides[idx]
          fr_old='<strong>VIBEX</strong> - Olivia Hiridjee. Un nouveau mémoire M1'
          fr_new='<strong>VIBEX</strong> - Olivia Hiridjee. <strong>FLUXOLF</strong> - Morgane Barret. Un nouveau mémoire M1'
          en_old='<strong>VIBEX</strong> - Olivia Hiridjee. A new Master 1 project'
          en_new='<strong>VIBEX</strong> - Olivia Hiridjee. <strong>FLUXOLF</strong> - Morgane Barret. A new Master 1 project'
          for target in (s, s.get('_fr',{})):
              c=target.get('content','')
              if 'Morgane Barret' not in c:
                  if fr_old not in c: raise SystemExit('French M1 anchor not found')
                  target['content']=c.replace(fr_old,fr_new,1)
          en=s.get('_en',{})
          c=en.get('content','')
          if 'Morgane Barret' not in c:
              if en_old not in c: raise SystemExit('English M1 anchor not found')
              en['content']=c.replace(en_old,en_new,1)
          newarr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          p.write_text(h[:m.start(1)]+newarr+h[m.end(1):],encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          if check.count('Morgane Barret') < 3: raise SystemExit('Morgane was not inserted in all language variants')
          print('Updated slide',idx+1,'with FLUXOLF - Morgane Barret')
          PY
      - name: Commit update
        run: |
          rm -f .github/workflows/add-morgane-fluxolf.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Morgane Barret FLUXOLF M1 to slide 16"
          git push