name: Restore active deck from save
on:
  push:
    paths:
      - '.github/workflows/csi-restore-save.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index from save
        shell: bash
        run: |
          cp index_save.html index.html
          cmp -s index.html index_save.html
      - name: Commit restore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore CSI deck from save"
          git push
