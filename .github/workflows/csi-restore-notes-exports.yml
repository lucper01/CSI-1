name: CSI restore notes and exports
on:
  push:
    paths:
      - '.github/workflows/csi-restore-notes-exports.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save hash
        run: git hash-object index_save.html > /tmp/save_hash_before
      - name: Apply notes and export controls
        run: python .github/scripts/csi_restore_notes_exports.py
      - name: Validate export JavaScript
        run: node --check assets/csi-export.js
      - name: Validate presentation JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = ['
          pos=t.find(marker)
          if pos<0: raise SystemExit('slides marker missing')
          a=t.rfind('<script',0,pos)
          b=t.find('>',a)+1
          c=t.find('</script>',pos)
          if min(a,b,c)<0: raise SystemExit('script bounds missing')
          Path('/tmp/csi-main.js').write_text(t[b:c],encoding='utf-8')
          PY
          node --check /tmp/csi-main.js
      - name: Verify protected save untouched
        run: |
          test "$(cat /tmp/save_hash_before)" = "$(git hash-object index_save.html)"
          git diff --exit-code -- index_save.html
      - name: Commit and clean helper files
        run: |
          git add index.html
          git commit -m "Restore presenter notes and add PDF PPTX export"
          git rm .github/scripts/csi_restore_notes_exports.py .github/workflows/csi-restore-notes-exports.yml
          git commit -m "Remove temporary notes export helpers"
          git push
