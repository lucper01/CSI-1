name: Update slide 5 organiser
on:
  push:
    paths:
      - '.github/workflows/update-slide5-organiser.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update slide 5 title only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='const slides = '
          st=t.index(marker)+len(marker)
          slides, rel=json.JSONDecoder().raw_decode(t[st:])
          assert len(slides) >= 5
          s=slides[4]
          old='Le temps - des événements que l’on sait mesurer'
          new='Le temps - des événements que l’on sait organiser'
          assert s.get('title')==old, s.get('title')
          assert (s.get('_fr') or {}).get('title')==old
          s['title']=new
          s['_fr']['title']=new
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          p.write_text(t[:st]+new_json+t[st+rel:],encoding='utf-8')
          assert Path('index_save.html').read_bytes()==Path('index_save.html').read_bytes()
          print(new)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update slide 5 title to organiser"
          git push
