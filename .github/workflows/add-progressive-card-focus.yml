name: Add progressive card focus
on:
  push:
    paths:
      - '.github/workflows/add-progressive-card-focus.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update index
        run: python3 .github/scripts/add_focus.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-progressive-card-focus.yml .github/scripts/add_focus.py
          git add index.html
          git commit -m "Add progressive study-aware card focus"
          git push
