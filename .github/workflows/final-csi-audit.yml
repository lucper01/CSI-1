name: Final CSI audit
on:
  push:
    paths:
      - '.github/workflows/final-csi-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural content and asset audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib,xml.etree.ElementTree as ET
          t=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = '; st=t.index(marker)+len(marker); slides,_=json.JSONDecoder().raw_decode(t[st:])
          main=[s for s in slides if not s.get('appendix')]; app=[s for s in slides if s.get('appendix')]
          assert (len(slides),len(main),len(app))==(64,60,4)
          assert hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()=='9948fe7ffbb327340129d83624a51611d7325f3c171fd0834e3e5f7f81c307fe'
          assert 'const mainSlides' in t and 'overview' in t.lower() and 'notes' in t.lower()
          assert 'data-theme="light"' in t and 'dark' in t.lower() and 'high' in t.lower()
          assert 'apparatusPopupScript' in t and 'apparatus-open' in t
          assert 'csiVibexManualDemo' in t and 'data-vibex-next' in t and 'data-vibex-reset' in t
          assert 'assets/demo/image_L_16.jpg' in t and 'assets/demo/Masque_SCR.webp' in t and 'assets/demo/image_S_16.jpg' in t
          assert 'mouvement oculaire stabilisé' not in t and 'mouvement oculaire maîtrisé' in t
          assert '—' not in t and '–' not in t
          assert 'À consolider' not in ' '.join(s.get('content','') for s in main)
          assert all('SORBET' not in (s.get('title','')+s.get('content','')) and 'COBEX' not in (s.get('title','')+s.get('content','')) for s in main)
          assert sum(s.get('study')=='SORBET' and s.get('appendix') for s in slides)==1
          assert sum(s.get('study')=='COBEX' and s.get('appendix') for s in slides)==1
          # F values must be absent from the fused TWIXAV results slide.
          tw=[s for s in main if s.get('study')=='TWIXAV' and 'Temporal Binding Window dépend' in s.get('title','')]
          assert len(tw)==1 and 'F(' not in tw[0].get('content','')
          # Local href/src paths used in slide content must exist.
          local=set()
          for s in slides:
              for h in [s,s.get('_fr') or {},s.get('_en') or {}]:
                  c=h.get('content','')
                  for x in re.findall(r'(?:src|href)="([^"]+)"',c):
                      if x.startswith(('assets/','affiches/')): local.add(x)
          missing=[x for x in sorted(local) if not Path(x).exists()]
          assert not missing, missing
          # All result SVGs referenced by VIBEX parse as XML.
          for x in ['assets/results/vibex_conditions.svg','assets/results/vibex_size_interaction.svg','assets/results/vibex_rt_interaction.svg']:
              ET.parse(x)
          # Key narrative invariants.
          for q in ["Limites spatio-temporelles de l'olfaction vs celles de la vision et de l'audition","Influence de l'olfaction sur la perception spatio-temporelle en audition et en vision",'Less space, less time','Nuit des Chercheurs 2026','Expérimentarium 2027','ISOT 2028','NOUS SOMMES ICI','TWIXAV + TWIXOLF','VIBEX + OASIS']:
              assert q in t, q
          print('STRUCTURE OK:',len(slides),'slides;',len(main),'main;',len(app),'appendices')
          print('LOCAL ASSETS OK:',len(local),'references')
          print('BACKUP OK')
          PY
      - name: JavaScript syntax audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          out=Path('/tmp/csi-js'); out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts): (out/f'script_{i:02d}.js').write_text(s,encoding='utf-8')
          print('INLINE SCRIPTS',len(scripts))
          PY
          for f in /tmp/csi-js/*.js; do node --check "$f"; done
      - name: Report
        run: |
          echo 'FINAL CSI AUDIT: SUCCESS'
