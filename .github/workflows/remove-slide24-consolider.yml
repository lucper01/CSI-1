name: Remove slide 24 consolidate block
on:
  push:
    paths:
      - '.github/workflows/remove-slide24-consolider.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested block from slide 24 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re

          p = Path('index.html')
          save = Path('index_save.html')
          save_before = hashlib.sha256(save.read_bytes()).hexdigest()

          t = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          st = t.index(marker) + len(marker)
          slides, rel = json.JSONDecoder().raw_decode(t[st:])
          assert len(slides) >= 24
          s = slides[23]

          targets = [s, s.get('_fr') or {}]
          removed = 0
          for holder in targets:
              c = holder.get('content','')
              before = c
              # Remove a card/block containing the exact user-requested text, preserving all surrounding content.
              patterns = [
                  r'<div class=\\?"card[^>]*>.*?À consolider.*?PSS, fenêtre, asymétrie.*?Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées\..*?</div>',
                  r'<article[^>]*>.*?À consolider.*?PSS, fenêtre, asymétrie.*?Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées\..*?</article>',
              ]
              for pat in patterns:
                  c2, n = re.subn(pat, '', c, count=1, flags=re.S)
                  if n:
                      c = c2
                      removed += n
                      break
              if c == before:
                  # Fallback: remove exact text fragments if not wrapped in a standard card/article.
                  c = c.replace('À consolider', '')
                  c = c.replace('PSS, fenêtre, asymétrie', '')
                  c = c.replace('Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées.', '')
                  if c != before:
                      removed += 1
              holder['content'] = c

          assert removed >= 2, removed
          if s.get('_fr'):
              s['_fr'] = targets[1]
              s.update(s['_fr'])

          for holder in (s, s.get('_fr') or {}):
              c = holder.get('content','')
              assert 'À consolider' not in c
              assert 'PSS, fenêtre, asymétrie' not in c
              assert 'Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées.' not in c

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          p.write_text(t[:st] + new_json + t[st+rel:], encoding='utf-8')
          assert hashlib.sha256(save.read_bytes()).hexdigest() == save_before
          print('Removed slide 24 consolidate block')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove slide 24 consolidate block"
          git push
