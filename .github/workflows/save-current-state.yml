name: Save current presentation state
on:
  push:
    paths:
      - '.github/workflows/save-current-state.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy active presentation to save file
        shell: bash
        run: |
          cp index.html index_save.html
          cmp --silent index.html index_save.html
      - name: Commit save point and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/save-current-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html .github/workflows/save-current-state.yml
          git commit -m "Save current presentation state"
          git push
