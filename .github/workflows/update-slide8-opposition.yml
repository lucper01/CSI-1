name: Update slide 8 opposition
on:
  push:
    paths:
      - '.github/workflows/update-slide8-opposition.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace wording on slide 8 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel
          s=slides[7]
          old='La thèse transforme cette asymétrie en question expérimentale.'
          new='La thèse transforme cette opposition en question expérimentale.'
          n=0
          for target in (s, s.get('_fr') or {}):
              if old in target.get('lead',''):
                  target['lead']=target['lead'].replace(old,new)
                  n+=1
          if s.get('_fr'):
              s.update(s['_fr'])
          if n < 1:
              raise SystemExit('Target sentence not found on slide 8')
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          out=text[:start]+new_json+text[end:]
          if old in slides[7].get('lead','') or old in (slides[7].get('_fr') or {}).get('lead',''):
              raise SystemExit('Replacement failed')
          p.write_text(out,encoding='utf-8')
          print('UPDATED',n)
          PY
      - name: Ensure backup untouched and commit
        run: |
          git diff --exit-code -- index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace asymétrie with opposition on slide 8"
          git push
