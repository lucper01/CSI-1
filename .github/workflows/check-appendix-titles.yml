name: Check appendix slide titles
on:
  push:
    paths:
      - '.github/workflows/check-appendix-titles.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print appendix slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(text[start:])
          aps=[(i+1,s.get('title','')) for i,s in enumerate(slides) if s.get('appendix')]
          print('TOTAL',len(slides))
          print('APPENDIX_COUNT',len(aps))
          for i,t in aps:
              print(f'APPENDIX {i}: {t}')
          print('VISIBLE',len(slides)-len(aps))
          PY
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/check-appendix-titles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/check-appendix-titles.yml
          git commit -m "Remove temporary appendix check workflow" || true
          git push
