name: Integrate hardware cards
on:
  push:
    paths:
      - '.github/workflows/integrate-hardware-cards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reposition hardware cards in slide flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',html,re.S)
          if not m: raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))

          targets={'SOFT','OASIS','TWIXOLF','SORBET','SOLAR','COBEX','BRAUD','BRAUDOLF'}
          methods={'SOFT','OASIS','TWIXOLF'}
          hw_re=re.compile(r'<div class="hardware-floating"[^>]*><b>.*?</b><div>.*?</div></div>',re.S)

          def containers(s):
              yield s
              for k in ('_fr','_en'):
                  if isinstance(s.get(k),dict): yield s[k]

          for s in slides:
              study=str(s.get('study','')).upper()
              if study not in targets: continue
              for c in containers(s):
                  content=c.get('content','')
                  if not isinstance(content,str): continue
                  found=hw_re.search(content)
                  if not found: continue
                  hw=found.group(0)
                  content=hw_re.sub('',content)

                  if study in methods:
                      # Hardware becomes a normal, right-aligned footer row after the method content.
                      # Keep the poster/resource card independent and floating lower in the slide.
                      marker='<div class="study-floating"'
                      pos=content.find(marker)
                      if pos>=0:
                          content=content[:pos]+hw+content[pos:]
                      else:
                          content+=hw
                  else:
                      # Extension studies: integrate hardware immediately above References,
                      # inside the study block, never on top of the last content card.
                      marker='<div class="v16-ref"'
                      pos=content.find(marker)
                      if pos>=0:
                          content=content[:pos]+hw+content[pos:]
                      else:
                          # fallback before final closing study div
                          p=content.rfind('</div>')
                          content=(content[:p]+hw+content[p:]) if p>=0 else content+hw
                  c['content']=content

          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          html=html[:m.start(1)]+arr+html[m.end(1):]

          # Override the first-generation absolute placement with a deliberate in-flow dock.
          css='''
          /* Hardware cards V2 - discrete, aligned and never overlapping study content */
          .hardware-floating{
            position:static !important;
            inset:auto !important;
            z-index:auto !important;
            width:max-content;
            max-width:min(100%,680px);
            margin:10px 0 4px auto;
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:7px;
            padding:5px 7px;
            border:1px solid color-mix(in srgb,var(--study,var(--accent)) 18%,var(--line));
            border-radius:12px;
            background:color-mix(in srgb,var(--white) 82%,transparent);
            backdrop-filter:blur(8px);
            box-shadow:0 5px 14px rgba(11,47,35,.055);
            font-size:.62rem;
            line-height:1.1;
            opacity:.94;
          }
          .hardware-floating>b{
            color:var(--study,var(--accent));
            font-size:.56rem;
            text-transform:uppercase;
            letter-spacing:.09em;
            white-space:nowrap;
          }
          .hardware-floating>div{
            display:flex;
            gap:4px;
            flex-wrap:wrap;
            justify-content:flex-end;
          }
          .hardware-floating span{
            display:inline-flex;
            align-items:center;
            min-height:20px;
            padding:2px 7px;
            border-radius:999px;
            background:color-mix(in srgb,var(--study,var(--accent)) 5%,var(--white));
            border:1px solid color-mix(in srgb,var(--study,var(--accent)) 16%,var(--line));
            font-weight:760;
            white-space:nowrap;
            color:var(--text);
          }
          .v16-study>.hardware-floating{
            margin-top:8px;
            margin-bottom:5px;
          }
          .slide:has(.study-floating) .hardware-floating{
            margin-top:11px;
            margin-right:0;
            margin-bottom:4px;
          }
          @media(max-width:900px){
            .hardware-floating{width:100%;max-width:none;margin:9px 0 4px 0;justify-content:flex-start;flex-wrap:wrap}
            .hardware-floating>div{justify-content:flex-start}
          }
          '''
          # Remove any prior V2 block if rerun, then append one final override.
          html=re.sub(r'/\* Hardware cards V2.*?@media\(max-width:900px\)\{.*?\}\s*\}', '', html, flags=re.S)
          html=html.replace('</style>',css+'\n</style>',1)
          path.write_text(html,encoding='utf-8')
          PY

      - name: Install browser validator
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Validate card integration on requested slides
        run: |
          python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
          cat > validate_hw.js <<'EOF'
          const { chromium }=require('playwright');
          const targets=['SOFT - Méthode','OASIS - Méthode','TWIXOLF - Méthode','SORBET','SOLAR','COBEX','BRAUD','BRAUDOLF'];
          function intersects(a,b){return a&&b&&Math.min(a.right,b.right)-Math.max(a.left,b.left)>2&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1920,height:1080},{width:1366,height:768}]){
              const page=await browser.newPage({viewport});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(700);
              for(const title of targets){
                const idx=await page.evaluate(t=>slides.findIndex(s=>s.title===t),title);
                if(idx<0) throw new Error('missing '+title);
                await page.evaluate(i=>goTo(i),idx); await page.waitForTimeout(80);
                const check=await page.evaluate(()=>{
                  const active=document.querySelector('.slide.active');
                  const hw=active&&active.querySelector('.hardware-floating');
                  if(!active||!hw)return {missing:true};
                  const box=e=>{const r=e.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
                  return {
                    missing:false,
                    hw:box(hw),slide:box(active),
                    obstacles:[...active.querySelectorAll('.card,.v16-study-card,.v16-ref,.study-floating')].filter(e=>e!==hw&&!hw.contains(e)).map(box)
                  };
                });
                if(check.missing) throw new Error('hardware missing '+title);
                if(check.hw.width<=0||check.hw.height<=0) throw new Error('hardware invisible '+title);
                if(check.hw.left<check.slide.left-2||check.hw.right>check.slide.right+2||check.hw.top<check.slide.top-2||check.hw.bottom>check.slide.bottom+2) throw new Error('hardware outside slide '+title);
                for(const o of check.obstacles){if(intersects(check.hw,o)) throw new Error('hardware overlaps content on '+title+' '+JSON.stringify({hw:check.hw,o}));}
              }
              if(errors.length) throw new Error(errors.join('\n'));
              await page.close();
            }
            await browser.close();
            console.log('HARDWARE INTEGRATION VALIDATION PASSED');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          EOF
          node validate_hw.js

      - name: Commit validated update and remove temporary workflow
        run: |
          rm -f .github/workflows/integrate-hardware-cards.yml validate_hw.js package.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate hardware cards cleanly into study slides"
          git push