name: CSI responsive stage V2
on:
  push:
    paths:
      - '.github/workflows/tmp-responsive-stage-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Freeze protected save hash
        run: echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"

      - name: Apply responsive stage V2
        run: python tools/tmp_responsive_stage_v2.py

      - name: Validate responsive assets
        run: |
          node --check assets/csi-responsive-stage.js
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/csi-responsive-stage.css').read_text(encoding='utf-8')
          js = Path('assets/csi-responsive-stage.js').read_text(encoding='utf-8')
          assert 'CSI_RESPONSIVE_STAGE_4K_V2' in css
          assert 'CSI_RESPONSIVE_STAGE_4K_V2' in js
          assert 'assets/csi-responsive-stage.css?v=2' in index
          assert 'assets/csi-responsive-stage.js?v=2' in index
          assert 'csi-stage-fit' in css and 'csi-stage-fit' in js
          assert "MIN_DESKTOP_WIDTH = 1100" in js
          assert "physicalLargeDisplay" in js

          def scale(w, h):
              return min(w / 1920, h / 1080)
          assert abs(scale(3840, 2160) - 2.0) < 1e-9
          assert abs(scale(2560, 1440) - (4/3)) < 1e-9
          assert scale(1920, 945) < 1.0
          print('V2 validation OK')
          PY

      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_SHA"

      - name: Commit responsive update
        run: |
          git add index.html assets/csi-responsive-stage.css assets/csi-responsive-stage.js
          git commit -m "Make CSI stage fit reliably across 4K and scaled displays"
          git push

      - name: Cleanup temporary helpers
        run: |
          git rm -f tools/tmp_responsive_stage_v2.py .github/workflows/tmp-responsive-stage-v2.yml
          git commit -m "Remove temporary responsive stage V2 helpers"
          git push
