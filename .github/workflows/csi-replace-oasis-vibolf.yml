name: Replace OASIS with VIBOLF
on:
  push:
    paths:
      - '.github/scripts/csi_replace_oasis_vibolf.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace OASIS with VIBOLF
        run: python .github/scripts/csi_replace_oasis_vibolf.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace OASIS with VIBOLF"
          git push
