name: Apply apparatus and style v2
on:
  push:
    paths:
      - '.github/workflows/apply-apparatus-and-style-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib, html

          p=Path('index.html')
          backup=Path('index_save.html')
          backup_hash=hashlib.sha256(backup.read_bytes()).hexdigest()
          text=p.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end

          # --- Slide 16: TWIXAV keeps its study-blue border/title, but no blue background and a black subtitle.
          def clean_twixav_card(c):
              c=c.replace('background:linear-gradient(180deg,color-mix(in srgb,#0072B2 8%, var(--white)), var(--white));','')
              c=c.replace('background:linear-gradient(180deg,color-mix(in srgb,#0072B2 8%,var(--white)),var(--white));','')
              c=c.replace('<div class="mono" style="color:#0072B2">Référence temporelle</div>','<div class="mono">Référence temporelle</div>')
              c=c.replace('<div class="mono" style="color:#0072B2">Temporal reference</div>','<div class="mono">Temporal reference</div>')
              return c
          s16=slides[15]
          for holder in [s16,s16.get('_fr') or {},s16.get('_en') or {}]:
              if holder.get('content'):
                  holder['content']=clean_twixav_card(holder['content'])

          # --- Technical-difficulty slides: same visual grammar as the study slides, sentence case only.
          data={
           'TWIXAV':{
            'fr':('Études de l’année 1','TWIXAV - Retour technique','TWIXAV - difficultés techniques rencontrées','Le principal enjeu a été de faire du timing audiovisuel une variable réellement contrôlée, et pas seulement une valeur programmée.',[
              ('Timing écran','Les durées et les SOA sont contraints par le rafraîchissement réel de l’écran.','Mesurer le refresh, convertir les durées en frames entières et contrôler les événements réellement présentés.'),
              ('Synchronisation audiovisuelle','Les chaînes visuelle et auditive n’introduisent pas exactement les mêmes délais.','Ordonner explicitement les onsets, multiplier les prétests et journaliser les événements pour vérifier le SOA réellement produit.'),
              ('Robustesse du protocole','Un changement de paramètres d’affichage ou de poste peut modifier un paradigme temporel.','Verrouiller les paramètres critiques, contrôler le poste au lancement et valider le protocole sur des essais pilotes.')],
              'Le timing est devenu une propriété mesurée et vérifiée du dispositif.'),
            'en':('Year 1 studies','TWIXAV - Technical feedback','TWIXAV - technical difficulties encountered','The main challenge was to make audiovisual timing genuinely controlled rather than merely programmed.',[
              ('Display timing','Durations and SOAs are constrained by the actual screen refresh rate.','Measure refresh rate, convert durations into integer frame counts and check the events actually presented.'),
              ('Audiovisual synchronization','Visual and auditory presentation chains do not introduce exactly the same delays.','Explicitly schedule onsets, run repeated pre-tests and log events to verify the SOA actually produced.'),
              ('Protocol robustness','Display or workstation changes can alter a temporal paradigm.','Lock critical parameters, check the workstation at launch and validate the protocol with pilot trials.')],
              'Timing became a measured and verified property of the setup.')},
           'VIBEX':{
            'fr':('Études de l’année 1','VIBEX - Retour technique','VIBEX - difficultés techniques rencontrées','Le verrou technique était de contrôler simultanément le temps d’exposition, la géométrie des scènes et la synchronisation des différents systèmes.',[
              ('Durée d’affichage','Présenter une scène pendant une durée précise dépend du rafraîchissement réel de l’écran.','Caler les durées sur le refresh, raisonner en frames lorsque nécessaire et contrôler les onsets et offsets lors des prétests.'),
              ('Tailles et cadrages','Les différentes conditions doivent varier sans introduire de différences parasites de résolution, de zoom ou de position.','Standardiser les stimuli et les gabarits d’affichage, conserver une zone de présentation fixe et vérifier les transformations d’image.'),
              ('Systèmes synchronisés','Affichage, réponses et systèmes de contrôle ou d’acquisition doivent coexister sans dérive temporelle.','Centraliser le déroulement dans PsychoPy, utiliser un horodatage commun et valider la chaîne complète sur des essais pilotes.')],
              'Le paradigme visuel est devenu une base technique suffisamment stable pour être réutilisée dans OASIS.'),
            'en':('Year 1 studies','VIBEX - Technical feedback','VIBEX - technical difficulties encountered','The technical challenge was to control exposure time, scene geometry and synchronization across the different systems at the same time.',[
              ('Display duration','Presenting a scene for a precise duration depends on the actual screen refresh rate.','Align durations with refresh rate, use frame-based timing when needed and check onsets and offsets during pre-tests.'),
              ('Sizes and crops','Conditions must vary without introducing unwanted differences in resolution, zoom or position.','Standardize stimuli and display templates, keep a fixed presentation area and verify image transformations.'),
              ('Synchronized systems','Display, responses and control or acquisition systems must coexist without temporal drift.','Centralize trial execution in PsychoPy, use common event timestamps and validate the complete chain with pilot trials.')],
              'The visual paradigm became a sufficiently stable technical basis for OASIS.')},
           'SOFT':{
            'fr':('Deuxième année','SOFT - Développement technique','SOFT - difficultés techniques rencontrées','SOFT concentre le principal verrou instrumental : faire fonctionner plusieurs modalités et plusieurs appareils sur une chronologie expérimentale commune.',[
              ('Affichage et timing','Le double écran et le plein écran sont instables dans l’environnement Windows 7 / PsychoPy, et les durées visuelles dépendent du refresh.','Utiliser un mode fenêtré quasi plein écran, mesurer le refresh au lancement et convertir les durées visuelles en frames en journalisant les durées obtenues.'),
              ('Coexistence des systèmes','PsychoPy doit piloter ou écouter simultanément Sniff-0, Spir-0, BIOPAC et l’EEG, avec des interfaces différentes.','Construire une architecture modulaire, avec activation indépendante des appareils, états visibles, initialisation contrôlée et journalisation centralisée.'),
              ('Respiration et triggers','La stimulation olfactive doit partir sur l’inspiration tout en respectant la polarité du Spir-0 et la limite 8 bits de l’EEG.','Utiliser le front d’inspiration comme référence, tester la polarité au démarrage et maintenir la cartographie des triggers sous 255.')],
              'Plusieurs appareils indépendants fonctionnent désormais comme une seule chaîne expérimentale pilotée et observable.'),
            'en':('Year 2','SOFT - Technical development','SOFT - technical difficulties encountered','SOFT concentrates the main instrumentation challenge: running several modalities and devices on a common experimental timeline.',[
              ('Display and timing','Dual-screen and fullscreen behavior are unstable in the Windows 7 / PsychoPy environment, and visual durations depend on refresh rate.','Use near-fullscreen windowed mode, measure refresh at startup and convert visual durations to frames while logging achieved durations.'),
              ('System coexistence','PsychoPy must simultaneously control or listen to Sniff-0, Spir-0, BIOPAC and EEG through different interfaces.','Build a modular architecture with independent device activation, visible states, controlled initialization and centralized logging.'),
              ('Respiration and triggers','Olfactory stimulation must start on inhalation while respecting Spir-0 polarity and the 8-bit EEG trigger limit.','Use the inhalation edge as reference, test polarity at startup and keep the trigger map below 255.')],
              'Several independent devices now operate as a single controlled and observable experimental chain.')},
           'OASIS':{
            'fr':('Deuxième année','OASIS - Développement technique','OASIS - difficultés techniques rencontrées','Le défi est d’ajouter l’olfaction au paradigme VIBEX sans perdre le contrôle temporel et visuel déjà obtenu.',[
              ('Vision et olfaction','La délivrance d’une odeur ne doit pas perturber la durée d’affichage des scènes ni les conditions visuelles héritées de VIBEX.','Conserver le cœur visuel de VIBEX et appeler le module olfactif depuis la même logique d’essai.'),
              ('Systèmes synchronisés','Affichage, olfactométrie, détection respiratoire et acquisition doivent partager une chronologie commune.','Réutiliser l’architecture modulaire de SOFT, centraliser les timestamps et déclencher les événements olfactifs à partir de l’état respiratoire détecté.'),
              ('Flush et résiduel olfactif','Une odeur peut persister entre deux essais et contaminer la condition suivante.','Prévoir calibration, tests de flux, purge / flush et fenêtres inter-essais avant une nouvelle stimulation.')],
              'OASIS réutilise deux briques déjà stabilisées : VIBEX pour le visuel et SOFT pour l’intégration olfactométrique.'),
            'en':('Year 2','OASIS - Technical development','OASIS - technical difficulties encountered','The challenge is to add olfaction to VIBEX without losing the temporal and visual control already achieved.',[
              ('Vision and olfaction','Odor delivery must not disturb scene exposure duration or the visual conditions inherited from VIBEX.','Keep the VIBEX visual core and call the olfactory module from the same trial logic.'),
              ('Synchronized systems','Display, olfactometry, respiratory detection and acquisition must share a common timeline.','Reuse the modular SOFT architecture, centralize timestamps and trigger olfactory events from the detected respiratory state.'),
              ('Flush and odor residual','Odor can persist between trials and contaminate the next condition.','Use calibration, flow checks, purge / flush and inter-trial windows before a new stimulation.')],
              'OASIS reuses two stabilized building blocks: VIBEX for vision and SOFT for olfactometer integration.')},
           'TWIXOLF':{
            'fr':('Deuxième année','TWIXOLF - Développement technique','TWIXOLF - difficultés techniques rencontrées','La difficulté centrale est de transformer une stimulation olfactive dépendante du sniff en un événement temporel suffisamment défini pour construire des SOA.',[
              ('Onset olfactif','L’ouverture d’une voie olfactive n’est pas équivalente à l’arrivée effective de l’odeur : transport et inspiration introduisent leur propre latence.','Utiliser l’inspiration détectée comme ancre temporelle, calibrer le flux et journaliser séparément la commande et les événements respiratoires.'),
              ('SOA intermodal','Le décalage avec l’autre modalité doit être construit à partir d’un repère réellement reproductible.','Fonder le SOA sur une chronologie commune liée à l’événement respiratoire et valider les délais instrumentaux avant la collecte principale.'),
              ('Purge et répétition','Le résiduel olfactif et l’adaptation rendent les essais successifs moins indépendants qu’en vision ou en audition.','Prévoir purge / flush, contrôle des flux et intervalles inter-essais adaptés afin de repartir d’un état aussi stable que possible.')],
              'L’objectif technique est de rendre l’odeur horodatable et répétable avant de lui appliquer la logique de fenêtre temporelle de TWIXAV.'),
            'en':('Year 2','TWIXOLF - Technical development','TWIXOLF - technical difficulties encountered','The central challenge is turning sniff-dependent olfactory stimulation into a sufficiently well-defined temporal event for constructing SOAs.',[
              ('Olfactory onset','Opening an olfactory channel is not equivalent to effective odor arrival: transport and inhalation add their own latency.','Use detected inhalation as the temporal anchor, calibrate flow and separately log commands and respiratory events.'),
              ('Crossmodal SOA','The delay relative to the other modality must be built from a genuinely reproducible reference.','Base SOA on a common timeline linked to the respiratory event and validate instrumental delays before the main data collection.'),
              ('Purge and repetition','Odor residual and adaptation make successive trials less independent than in vision or audition.','Use purge / flush, flow control and suitable inter-trial intervals to return to as stable a state as possible.')],
              'The technical goal is to make odor timing reproducible before applying the TWIXAV temporal-window logic.')}
          }

          def cards(items,take,english=False):
              out=[]
              for i,(ttl,prob,sol) in enumerate(items):
                  cls='card dark' if i==2 else 'card'
                  lab='Solution:' if english else 'Solution :'
                  out.append(f'<div class="{cls}"><h3>{ttl}</h3><p>{prob}</p><p><strong>{lab}</strong> {sol}</p></div>')
              label='Outcome:' if english else 'Résultat :'
              return '<div class="grid three">'+''.join(out)+f'</div><div class="callout" style="margin-top:16px"><strong>{label}</strong> {take}</div>'

          for study in data:
              candidates=[s for s in slides if s.get('study')==study and 'difficult' in ((s.get('title') or '')+' '+((s.get('_fr') or {}).get('title') or '')).lower()]
              if len(candidates)!=1:
                  raise RuntimeError(f'{study}: expected one technical-difficulty slide, found {len(candidates)}')
              s=candidates[0]
              fr=data[study]['fr']; en=data[study]['en']
              fro={'section':fr[0],'kicker':fr[1],'title':fr[2],'lead':fr[3],'content':cards(fr[4],fr[5],False),'notes':'Présenter ces points comme des verrous techniques résolus ou en cours de résolution.'}
              eno={'section':en[0],'kicker':en[1],'title':en[2],'lead':en[3],'content':cards(en[4],en[5],True),'notes':'Present these points as technical challenges solved or being solved.'}
              s['_fr']=fro; s['_en']=eno; s.update(fro)

          # --- Turn every Material/Matériel card on every Method/Méthode slide into an Appareillage button.
          block_re=re.compile(r'<(?P<tag>div|a|button)(?P<attrs>[^>]*class="(?P<cls>[^"]*\bfloat-card\b[^"]*)"[^>]*)>\s*<b>(?P<label>[^<]+)</b>\s*<span>(?P<items>.*?)</span>\s*</(?P=tag)>',re.I|re.S)
          changed=[]
          def norm(s):
              return re.sub(r'\s+',' ',re.sub('<[^>]+>','',s)).strip().lower()

          for idx,s in enumerate(slides):
              all_titles=' '.join([s.get('title',''),(s.get('_fr') or {}).get('title',''),(s.get('_en') or {}).get('title','')]).lower()
              if not ('méthode' in all_titles or 'method' in all_titles):
                  continue
              study=s.get('study') or (s.get('title','').split(' - ')[0] if s.get('title') else f'Study-{idx+1}')
              local_count=0
              for holder,lang in [(s,'fr'),(s.get('_fr') or {},'fr'),(s.get('_en') or {},'en')]:
                  c=holder.get('content')
                  if not c: continue
                  def repl(m):
                      nonlocal_dummy=None
                      label=norm(m.group('label'))
                      if label not in ['matériel','materiel','material','equipment','appareillage']:
                          return m.group(0)
                      items=re.sub('<[^>]+>','',m.group('items')).strip()
                      btn_label='Appareillage' if lang=='fr' else 'Equipment'
                      cls=m.group('cls')
                      # remove link-only resource classes but keep float-card styling
                      cls=' '.join(x for x in cls.split() if x not in ['poster','m1'])
                      return f'<button class="{html.escape(cls,quote=True)} apparatus-open" type="button" data-apparatus-study="{html.escape(study,quote=True)}" data-apparatus-items="{html.escape(items,quote=True)}"><b>{btn_label}</b><span>{items}</span></button>'
                  newc,n=block_re.subn(repl,c)
                  if n:
                      # subn counts all matched float cards; determine if actual apparatus button appeared
                      if 'apparatus-open' in newc and 'apparatus-open' not in c:
                          local_count+=1
                      holder['content']=newc
              if local_count:
                  changed.append((idx+1,study,local_count))

          if len(changed)<5:
              raise RuntimeError(f'Only {len(changed)} method slides received an Appareillage button: {changed}')
          print('Method slides updated:',changed)

          # Rebuild slide JSON before UI injection.
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+new_json+text[end:]

          css='''\n/* apparatus-popup-v2 */\n.apparatus-open{font:inherit;text-align:left;appearance:none;cursor:pointer;color:var(--text)}.apparatus-open:hover{transform:translateY(-2px)}.apparatus-modal[hidden]{display:none!important}.apparatus-modal{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px}.apparatus-backdrop{position:absolute;inset:0;background:rgba(8,20,16,.64);backdrop-filter:blur(7px)}.apparatus-panel{--apparatus:var(--accent);position:relative;width:min(1050px,94vw);max-height:88vh;overflow:auto;border:1px solid color-mix(in srgb,var(--apparatus) 34%,var(--line));border-radius:28px;background:var(--white);color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.28);padding:28px}.apparatus-panel:before{content:"";display:block;width:72px;height:5px;border-radius:999px;background:var(--apparatus);margin-bottom:18px}.apparatus-close{position:absolute;right:18px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--text);font-size:1.4rem;cursor:pointer}.apparatus-panel h2{margin:4px 52px 8px 0}.apparatus-lead{margin:0 0 20px;color:var(--muted)}.apparatus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}.apparatus-card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--white);min-height:255px}.apparatus-card-media{height:150px;display:grid;place-items:center;background:#fff;border-bottom:1px solid var(--line);padding:12px}.apparatus-card-media img{width:100%;height:100%;object-fit:contain}.apparatus-card-copy{padding:15px}.apparatus-card-copy h3{margin:0 0 7px;font-size:1.05rem;color:var(--apparatus)}.apparatus-card-copy p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}@media(max-width:700px){.apparatus-modal{padding:10px}.apparatus-panel{padding:20px;border-radius:22px}.apparatus-grid{grid-template-columns:1fr 1fr}.apparatus-card-media{height:110px}}\n'''
          if '/* apparatus-popup-v2 */' not in text:
              text=text.replace('</style>',css+'</style>',1)

          modal='''\n<div class="apparatus-modal" id="apparatusModal" hidden aria-hidden="true"><div class="apparatus-backdrop" data-apparatus-close></div><section class="apparatus-panel" id="apparatusPanel" role="dialog" aria-modal="true" aria-labelledby="apparatusTitle" tabindex="-1"><button class="apparatus-close" type="button" data-apparatus-close aria-label="Fermer">×</button><span class="eyebrow" id="apparatusEyebrow">Appareillage</span><h2 id="apparatusTitle">Appareillage</h2><p class="apparatus-lead" id="apparatusLead"></p><div class="apparatus-grid" id="apparatusGrid"></div></section></div>\n'''
          if 'id="apparatusModal"' not in text:
              text=text.replace('</body>',modal+'</body>',1)

          js=r'''\n<script id="apparatusPopupScript">\n(()=>{\n const modal=document.getElementById('apparatusModal'),panel=document.getElementById('apparatusPanel'),grid=document.getElementById('apparatusGrid'),title=document.getElementById('apparatusTitle'),lead=document.getElementById('apparatusLead'),eyebrow=document.getElementById('apparatusEyebrow');\n if(!modal)return;\n const studyColors={TWIXAV:'#0072B2',VIBEX:'#2f7d5a',SOFT:'#7652a8',OASIS:'#b44e6c',TWIXOLF:'#c36c32',FLUXOLF:'#a34d5d'};\n const equipment=[\n {keys:['psychopy'],name:'PsychoPy',img:'https://www.psychopy.org/_static/psychopyLogoType.png',fr:'Pilotage du paradigme, présentation des stimuli, réponses et horodatage des événements.',en:'Paradigm control, stimulus presentation, responses and event timestamps.'},\n {keys:['sniff-0','sniffo','sniff0','sniff-o'],name:'Sniff-0',img:'https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto1.jpg',fr:'Olfactomètre multicanal utilisé pour délivrer les odeurs et recevoir les commandes de stimulation.',en:'Multichannel olfactometer used to deliver odors and receive stimulation commands.'},\n {keys:['spir-0','spir0','spiro','spir-o'],name:'Spir-0',img:'https://www.cynexo.com/wp-content/uploads/2020/09/spir-O-foto2.jpg',fr:'Suivi du cycle respiratoire et détection du début de l’inspiration pour synchroniser la stimulation olfactive.',en:'Respiratory-cycle monitoring and inhalation-onset detection for olfactory synchronization.'},\n {keys:['biopac mp160','mp160','biopac'],name:'BIOPAC MP160',img:'https://upwards.com.tw/wp-content/uploads/2018/05/A01-Biopac-MP160-cover.jpg',fr:'Acquisition physiologique et gestion des marqueurs de synchronisation.',en:'Physiological acquisition and synchronization-marker management.'},\n {keys:['eeg biosemi','biosemi','eeg'],name:'EEG BioSemi',img:'https://www.biosemi.com/pics/module_active2_medium1.jpg',fr:'Système EEG utilisé pour l’acquisition électrophysiologique et les triggers expérimentaux.',en:'EEG system used for electrophysiological acquisition and experimental triggers.'},\n {keys:['écran','ecran','screen','display'],name:'Écran de stimulation',img:'',fr:'Présentation visuelle contrôlée avec un timing lié au taux de rafraîchissement mesuré.',en:'Controlled visual presentation with timing tied to the measured refresh rate.'},\n {keys:['audio','casque','sound','haut-parleur'],name:'Système audio',img:'',fr:'Présentation contrôlée des événements auditifs du paradigme.',en:'Controlled presentation of auditory events in the paradigm.'}\n ];\n const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));\n function fallback(label){const t=esc(label).slice(0,25);return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340"><rect width="600" height="340" rx="28" fill="#f5f2ea"/><rect x="140" y="55" width="320" height="190" rx="24" fill="#fff" stroke="#6c7671" stroke-width="7"/><circle cx="225" cy="150" r="34" fill="none" stroke="#6c7671" stroke-width="7"/><path d="M285 125h110M285 155h110M285 185h72" stroke="#6c7671" stroke-width="9" stroke-linecap="round"/><text x="300" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#24302b">${t}</text></svg>`)}\n function findInfo(raw){const k=raw.toLowerCase().trim();return equipment.find(e=>e.keys.some(x=>k.includes(x)))||{name:raw,img:'',fr:'Élément du dispositif expérimental utilisé dans cette étude.',en:'Component of the experimental setup used in this study.'}}\n function openApp(btn){const en=(btn.querySelector('b')?.textContent||'').trim().toLowerCase()==='equipment';const study=btn.dataset.apparatusStudy||'';const items=(btn.dataset.apparatusItems||'').split(/[·;]+/).map(x=>x.trim()).filter(Boolean);panel.style.setProperty('--apparatus',studyColors[study]||'var(--accent)');eyebrow.textContent=en?'Equipment':'Appareillage';title.textContent=`${study} - ${en?'Equipment':'Appareillage'}`;lead.textContent=en?'Devices and tools used in this experimental setup.':'Appareils et outils utilisés dans ce dispositif expérimental.';grid.innerHTML='';items.forEach(raw=>{const inf=findInfo(raw),card=document.createElement('article');card.className='apparatus-card';const src=inf.img||fallback(inf.name);card.innerHTML=`<div class="apparatus-card-media"><img src="${esc(src)}" alt="${esc(inf.name)}" loading="lazy" referrerpolicy="no-referrer"></div><div class="apparatus-card-copy"><h3>${esc(inf.name)}</h3><p>${esc(en?inf.en:inf.fr)}</p></div>`;const im=card.querySelector('img');im.addEventListener('error',()=>{im.src=fallback(inf.name)},{once:true});grid.appendChild(card)});modal.hidden=false;modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';panel.focus()}\n function closeApp(){modal.hidden=true;modal.setAttribute('aria-hidden','true');document.body.style.overflow=''}\n document.addEventListener('click',e=>{const btn=e.target.closest('.apparatus-open');if(btn){e.preventDefault();e.stopPropagation();openApp(btn);return}if(e.target.closest('[data-apparatus-close]'))closeApp()});\n document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeApp()}else if(['ArrowLeft','ArrowRight','PageUp','PageDown',' '].includes(e.key)){e.stopImmediatePropagation()}},true);\n})();\n</script>\n'''
          if 'id="apparatusPopupScript"' not in text:
              text=text.replace('</body>',js+'</body>',1)

          p.write_text(text,encoding='utf-8')
          if hashlib.sha256(backup.read_bytes()).hexdigest()!=backup_hash:
              raise RuntimeError('index_save.html was modified')

          # final validation
          final=p.read_text(encoding='utf-8')
          st=final.index(marker)+len(marker)
          chk,_=json.JSONDecoder().raw_decode(final[st:])
          assert 'background:linear-gradient' not in chk[15]['content']
          assert 'style="color:#0072B2">Référence temporelle' not in chk[15]['content']
          assert len([s for s in chk if s.get('study') in data and 'difficult' in (s.get('title') or '').lower()])==5
          assert final.count('apparatus-open')>=5
          assert 'id="apparatusModal"' in final and 'apparatus-popup-v2' in final
          print('Total slides:',len(chk))
          print('Backup SHA256:',backup_hash)
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align technical slides and add apparatus popups"
          rm .github/workflows/apply-apparatus-and-style-v2.yml
          git add .github/workflows/apply-apparatus-and-style-v2.yml
          git commit -m "Remove temporary apparatus workflow v2"
          git push
