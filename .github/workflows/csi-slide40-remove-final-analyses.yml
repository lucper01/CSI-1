name: CSI slide40 remove final analyses
on:
  push:
    paths:
      - '.github/workflows/csi-slide40-remove-final-analyses.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Remove final analyses from slide 40
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='const slides = '
          pos=text.index(marker)+len(marker)
          slides,consumed=json.JSONDecoder().raw_decode(text[pos:])
          main=[s for s in slides if not s.get('appendix',False)]
          target=main[39]
          if target.get('title')!='Planification - les trois années de thèse':
              raise RuntimeError(f'Unexpected slide 40: {target.get("title")}')
          for key in ['content']:
              for obj in [target, target.get('_fr',{}), target.get('_en',{})]:
                  if key in obj:
                      obj[key]=obj[key].replace('<div class="evt" style="grid-column:11/span 2;grid-row:1">Analyses<br>finales</div>','').replace('<div class="evt" style="grid-column:11/span 2;grid-row:1">Final<br>analyses</div>','')
          new_array=json.dumps(slides,ensure_ascii=False,indent=2)
          p.write_text(text[:pos]+new_array+text[pos+consumed:],encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'Analyses<br>finales' in s or 'Final<br>analyses' in s:
              raise RuntimeError('Final analyses block still present')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          target=[x for x in scripts if 'const slides = [' in x]
          if len(target)!=1: raise RuntimeError('slides script not found')
          Path('/tmp/slides.js').write_text(target[0],encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit update and remove helper
        run: |
          git rm .github/workflows/csi-slide40-remove-final-analyses.yml
          git add index.html
          git commit -m "Remove final analyses from slide 40 studies"
          git push
