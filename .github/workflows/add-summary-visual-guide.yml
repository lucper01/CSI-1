name: Add visual guide to summary
on:
  push:
    paths:
      - '.github/workflows/add-summary-visual-guide.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add visual guidance while preserving editorial layout
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib

          def parse(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, start, start + rel_end, slides

          before_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          text, start, end, slides = parse('index.html')

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title', '')

          s = next(x for x in slides if title(x) == 'Sommaire')

          fr = '''<div style="display:grid;grid-template-columns:138px 1fr;gap:28px;align-items:stretch;margin-top:8px">
            <div style="display:grid;grid-template-rows:repeat(3,1fr);gap:0;position:relative;padding:6px 0">
              <div style="position:absolute;left:31px;top:28px;bottom:28px;width:2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent));border-radius:999px"></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-weight:950;font-size:1.15rem;z-index:1">1</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">CADRER</span></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:2px solid var(--accent);color:var(--accent-strong);font-weight:950;font-size:1.15rem;z-index:1">2</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">AVANCER</span></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-strong);color:white;font-weight:950;font-size:1.15rem;z-index:1">3</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">PROJETER</span></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);column-gap:42px;row-gap:0">
              <article style="padding:16px 0 18px;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">01</strong><h3 style="margin:0">Contexte théorique</h3></div><p style="margin:8px 0 0;color:var(--muted)">Poser le cadre espace-temps et le contraste olfactif.</p></article>
              <article style="padding:16px 0 18px;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">02</strong><h3 style="margin:0">Architecture de la thèse</h3></div><p style="margin:8px 0 0;color:var(--muted)">Transformer le cadre théorique en programme expérimental.</p></article>
              <article style="padding:16px 0 18px;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">03</strong><h3 style="margin:0">Première année</h3></div><p style="margin:8px 0 0;color:var(--muted)">Études réalisées, résultats et développement méthodologique.</p></article>
              <article style="padding:16px 0 18px;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">04</strong><h3 style="margin:0">Deuxième année</h3></div><p style="margin:8px 0 0;color:var(--muted)">Priorités expérimentales et prochaines collectes.</p></article>
              <article style="padding:16px 0 18px;border-bottom:2px solid var(--accent)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">05</strong><h3 style="margin:0">Compléments</h3></div><p style="margin:8px 0 0;color:var(--muted)">Extensions envisagées selon résultats et faisabilité.</p></article>
              <article style="padding:16px 0 18px;border-bottom:2px solid var(--accent)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent-strong);line-height:1">06</strong><h3 style="margin:0">Rétroplanning global</h3></div><p style="margin:8px 0 0;color:var(--muted)">Calendrier, valorisation et trajectoire jusqu'à la fin de la thèse.</p></article>
            </div>
          </div>'''

          en = '''<div style="display:grid;grid-template-columns:138px 1fr;gap:28px;align-items:stretch;margin-top:8px">
            <div style="display:grid;grid-template-rows:repeat(3,1fr);gap:0;position:relative;padding:6px 0">
              <div style="position:absolute;left:31px;top:28px;bottom:28px;width:2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent));border-radius:999px"></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-weight:950;font-size:1.15rem;z-index:1">1</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">FRAME</span></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:2px solid var(--accent);color:var(--accent-strong);font-weight:950;font-size:1.15rem;z-index:1">2</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">ADVANCE</span></div>
              <div style="position:relative;display:flex;align-items:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-strong);color:white;font-weight:950;font-size:1.15rem;z-index:1">3</span><span style="font-size:.72rem;font-weight:950;letter-spacing:.12em;color:var(--accent-strong);writing-mode:vertical-rl;transform:rotate(180deg)">PROJECT</span></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);column-gap:42px;row-gap:0">
              <article style="padding:16px 0 18px;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">01</strong><h3 style="margin:0">Theoretical context</h3></div><p style="margin:8px 0 0;color:var(--muted)">Set the space-time framework and the olfactory contrast.</p></article>
              <article style="padding:16px 0 18px;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">02</strong><h3 style="margin:0">Thesis architecture</h3></div><p style="margin:8px 0 0;color:var(--muted)">Turn the theoretical framework into an experimental programme.</p></article>
              <article style="padding:16px 0 18px;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">03</strong><h3 style="margin:0">Year 1</h3></div><p style="margin:8px 0 0;color:var(--muted)">Completed studies, results and methodological development.</p></article>
              <article style="padding:16px 0 18px;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">04</strong><h3 style="margin:0">Year 2</h3></div><p style="margin:8px 0 0;color:var(--muted)">Experimental priorities and upcoming data collection.</p></article>
              <article style="padding:16px 0 18px;border-bottom:2px solid var(--accent)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent);line-height:1">05</strong><h3 style="margin:0">Extensions</h3></div><p style="margin:8px 0 0;color:var(--muted)">Additional studies depending on results and feasibility.</p></article>
              <article style="padding:16px 0 18px;border-bottom:2px solid var(--accent)"><div style="display:flex;align-items:baseline;gap:16px"><strong style="font-size:2.2rem;color:var(--accent-strong);line-height:1">06</strong><h3 style="margin:0">Global timeline</h3></div><p style="margin:8px 0 0;color:var(--muted)">Schedule, dissemination and trajectory through the end of the PhD.</p></article>
            </div>
          </div>'''

          s['_fr']['content'] = fr
          s['_en']['content'] = en
          s['content'] = fr
          s['_fr']['lead'] = 'Six parties organisées en trois temps : cadrer, avancer, puis projeter la suite.'
          s['_en']['lead'] = 'Six parts organized in three phases: frame, advance, then project the next steps.'
          s['lead'] = s['_fr']['lead']

          new_text = text[:start] + json.dumps(slides, ensure_ascii=False, separators=(',', ':')) + text[end:]
          Path('index.html').write_text(new_text, encoding='utf-8')

          after_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          assert before_save == after_save, 'index_save.html changed unexpectedly'
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          rm .github/workflows/add-summary-visual-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-summary-visual-guide.yml
          git commit -m "Add visual guidance to editorial summary"
          git push
