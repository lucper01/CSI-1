name: CSI slide40 publication timing
on:
  push:
    paths:
      - '.github/workflows/csi-slide40-publication-timing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Update slide 40 publication timing
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = text.index(marker) + len(marker)
          slides, consumed = json.JSONDecoder().raw_decode(text[pos:])
          main = [s for s in slides if not s.get('appendix', False)]
          if len(main) != 42:
              raise RuntimeError(f'Expected 42 main slides, found {len(main)}')
          target = main[39]
          if target.get('title') != 'Planification - les trois années de thèse':
              raise RuntimeError(f'Unexpected slide 40: {target.get("title")}')

          def replace_lane(content, label, next_label, replacement):
              pattern = rf'<div class="lane"><div class="lab">{re.escape(label)}</div>.*?(?=<div class="lane"><div class="lab">{re.escape(next_label)}</div>)'
              new, n = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Could not replace lane {label}: {n}')
              return new

          studies_fr = '''<div class="lane"><div class="lab">Études</div><div class="track"><div class="evt soft" style="grid-column:1/span 3;grid-row:1">TWIXAV<br>passations</div><div class="evt soft" style="grid-column:4;grid-row:1">TWIXAV<br>analyses</div><div class="evt soft" style="grid-column:1/span 3;grid-row:2">VIBEX<br>passations</div><div class="evt soft" style="grid-column:4;grid-row:2">VIBEX<br>analyses</div><div class="evt" style="grid-column:5/span 2;grid-row:1">SOFT<br>passations</div><div class="evt" style="grid-column:7;grid-row:1">SOFT<br>analyses</div><div class="evt" style="grid-column:5/span 2;grid-row:2">VIBOLF<br>passations</div><div class="evt" style="grid-column:7;grid-row:2">VIBOLF<br>analyses</div><div class="evt" style="grid-column:7/span 2;grid-row:3">TWIXOLF<br>passations</div><div class="evt" style="grid-column:9;grid-row:3">TWIXOLF<br>analyses</div></div></div>'''
          pubs_fr = '''<div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1">Revue - protocoles<br>pipelines</div><div class="evt" style="grid-column:8;grid-row:1">VIBEX + VIBOLF<br>rédaction</div><div class="evt" style="grid-column:9;grid-row:1">VIBEX + VIBOLF<br>publication</div><div class="evt" style="grid-column:8;grid-row:2">SOFT<br>rédaction</div><div class="evt" style="grid-column:9;grid-row:2">SOFT<br>publication</div><div class="evt" style="grid-column:8/span 2;grid-row:3">TWIXAV + TWIXOLF<br>rédaction</div><div class="evt" style="grid-column:10;grid-row:3">TWIXAV + TWIXOLF<br>publication</div></div></div>'''

          studies_en = '''<div class="lane"><div class="lab">Studies</div><div class="track"><div class="evt soft" style="grid-column:1/span 3;grid-row:1">TWIXAV<br>data collection</div><div class="evt soft" style="grid-column:4;grid-row:1">TWIXAV<br>analyses</div><div class="evt soft" style="grid-column:1/span 3;grid-row:2">VIBEX<br>data collection</div><div class="evt soft" style="grid-column:4;grid-row:2">VIBEX<br>analyses</div><div class="evt" style="grid-column:5/span 2;grid-row:1">SOFT<br>data collection</div><div class="evt" style="grid-column:7;grid-row:1">SOFT<br>analyses</div><div class="evt" style="grid-column:5/span 2;grid-row:2">VIBOLF<br>data collection</div><div class="evt" style="grid-column:7;grid-row:2">VIBOLF<br>analyses</div><div class="evt" style="grid-column:7/span 2;grid-row:3">TWIXOLF<br>data collection</div><div class="evt" style="grid-column:9;grid-row:3">TWIXOLF<br>analyses</div></div></div>'''
          pubs_en = '''<div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1">Review - protocols<br>pipelines</div><div class="evt" style="grid-column:8;grid-row:1">VIBEX + VIBOLF<br>writing</div><div class="evt" style="grid-column:9;grid-row:1">VIBEX + VIBOLF<br>publication</div><div class="evt" style="grid-column:8;grid-row:2">SOFT<br>writing</div><div class="evt" style="grid-column:9;grid-row:2">SOFT<br>publication</div><div class="evt" style="grid-column:8/span 2;grid-row:3">TWIXAV + TWIXOLF<br>writing</div><div class="evt" style="grid-column:10;grid-row:3">TWIXAV + TWIXOLF<br>publication</div></div></div>'''

          fr = target['_fr']['content']
          fr = replace_lane(fr, 'Études', 'Publications', studies_fr)
          fr = replace_lane(fr, 'Publications', 'Thèse', pubs_fr)
          en = target['_en']['content']
          en = replace_lane(en, 'Studies', 'Publications', studies_en)
          en = replace_lane(en, 'Publications', 'Thesis', pubs_en)

          target['_fr']['content'] = fr
          target['content'] = fr
          target['_en']['content'] = en
          target['_fr']['notes'] = 'Repérage continu T1 à T13. VIBEX : passations T1-T3, analyses T4. VIBOLF : passations T5-T6, analyses T7. Publication commune VIBEX + VIBOLF : rédaction T8, publication T9. SOFT : passations T5-T6, analyses T7, rédaction T8, publication T9. TWIXOLF : passations T7-T8, analyses T9. Publication commune TWIXAV + TWIXOLF : rédaction T8-T9, publication T10.'
          target['notes'] = target['_fr']['notes']
          target['_en']['notes'] = 'Continuous Q1-Q13 numbering. VIBEX: data collection Q1-Q3, analyses Q4. VIBOLF: data collection Q5-Q6, analyses Q7. Joint VIBEX + VIBOLF paper: writing Q8, publication Q9. SOFT: data collection Q5-Q6, analyses Q7, writing Q8, publication Q9. TWIXOLF: data collection Q7-Q8, analyses Q9. Joint TWIXAV + TWIXOLF paper: writing Q8-Q9, publication Q10.'

          new_array = json.dumps(slides, ensure_ascii=False, indent=2)
          p.write_text(text[:pos] + new_array + text[pos+consumed:], encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          js = [x for x in scripts if 'const slides = [' in x]
          if len(js) != 1: raise RuntimeError('slides script not found')
          Path('/tmp/slides.js').write_text(js[0], encoding='utf-8')
          required = [
            'TWIXOLF<br>passations', 'grid-column:7/span 2;grid-row:3',
            'TWIXOLF<br>analyses', 'grid-column:9;grid-row:3',
            'VIBEX + VIBOLF<br>rédaction', 'VIBEX + VIBOLF<br>publication',
            'SOFT<br>rédaction', 'SOFT<br>publication',
            'TWIXAV + TWIXOLF<br>rédaction', 'TWIXAV + TWIXOLF<br>publication'
          ]
          for x in required:
              if x not in s: raise RuntimeError(f'Missing {x}')
          forbidden = ['SOLAR<br>BRAUD - BRAUDOLF', 'VIBOLF - TWIXOLF<br>rédaction', 'VIBEX<br>soumission - révisions']
          for x in forbidden:
              if x in s: raise RuntimeError(f'Old planning remains: {x}')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit update and remove helper
        run: |
          git rm .github/workflows/csi-slide40-publication-timing.yml
          git add index.html
          git commit -m "Refine slide 40 publication timelines"
          git push
