name: Update slides 9 and 15 axis 1 wording
on:
  push:
    paths:
      - '.github/workflows/update-slides9-15-axis1-wording.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording on slides 9 and 15 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          p=Path('index.html')
          save=Path('index_save.html')
          save_before=hashlib.sha256(save.read_bytes()).hexdigest()
          t=p.read_text(encoding='utf-8')
          marker='const slides = '
          st=t.index(marker)+len(marker)
          slides, rel=json.JSONDecoder().raw_decode(t[st:])
          assert len(slides) >= 15

          old='Caractériser comment les informations olfactives, visuelles et auditives s’organisent et s’intègrent dans l’espace et dans le temps.'
          new='Caractériser précisément comment les informations olfactives, visuelles et auditives s’organisent dans l’espace et dans le temps...'

          changed=0
          for idx in (8,14):
              s=slides[idx]
              for holder in (s, s.get('_fr') or {}):
                  c=holder.get('content','')
                  if old in c:
                      holder['content']=c.replace(old,new,1)
                      changed += 1
              if s.get('_fr'):
                  s.update(s['_fr'])

          assert changed == 4, changed
          for idx in (8,14):
              s=slides[idx]
              assert new in s.get('content','')
              assert new in (s.get('_fr') or {}).get('content','')
              assert old not in s.get('content','')
              assert old not in (s.get('_fr') or {}).get('content','')

          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          p.write_text(t[:st]+new_json+t[st+rel:],encoding='utf-8')
          assert hashlib.sha256(save.read_bytes()).hexdigest()==save_before
          print('Updated slides 9 and 15')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update axis 1 wording on slides 9 and 15"
          git push
