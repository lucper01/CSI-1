name: Clean year 1 method slides
on:
  push:
    paths:
      - '.github/workflows/clean-year1-methods.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update method slides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          if not m: raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))
          changed=0
          for s in slides:
              if s.get('study') not in {'TWIXAV','VIBEX'}: continue
              # Only the method slide for each study.
              fr=s.get('_fr',{}) if isinstance(s.get('_fr'),dict) else {}
              is_method=('Méthode' in str(s.get('title','')) or 'Méthode' in str(fr.get('title','')) or 'Method' in str((s.get('_en') or {}).get('title','')))
              if not is_method: continue
              for container in [s, s.get('_fr',{}), s.get('_en',{})]:
                  if not isinstance(container,dict): continue
                  c=container.get('content','')
                  if not isinstance(c,str): continue
                  old=c
                  # Material card becomes PsychoPy only.
                  c=re.sub(r'(<b>Matériel</b><span>)(.*?)(</span>)',r'\1PsychoPy\3',c)
                  c=re.sub(r'(<b>Hardware</b><span>)(.*?)(</span>)',r'\1PsychoPy\3',c)
                  # TWIXAV method must contain no result strip or inferential result summary.
                  if s.get('study')=='TWIXAV':
                      c=re.sub(r'<div class="v16-resultline">.*?</div>(?=<div class="v16-ref">)','',c,flags=re.S)
                  if c!=old:
                      container['content']=c; changed+=1
              if s.get('study')=='TWIXAV':
                  s['notes']='Présenter uniquement le principe et la logique du paradigme. Réserver les résultats à la diapo suivante.'
                  if isinstance(s.get('_fr'),dict): s['_fr']['notes']=s['notes']
                  if isinstance(s.get('_en'),dict): s['_en']['notes']='Present only the principle and paradigm logic. Keep all results for the following slide.'
          if changed < 2: raise SystemExit(f'expected changes not applied: {changed}')
          new=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          h=h[:m.start(1)]+new+h[m.end(1):]
          p.write_text(h,encoding='utf-8')
          print('updated containers',changed,'slides',len(slides))
          PY
      - name: Validate content
        run: |
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          slides=json.loads(m.group(1))
          for study in ('TWIXAV','VIBEX'):
              s=next(x for x in slides if x.get('study')==study and ('Méthode' in str(x.get('title','')) or 'Méthode' in str((x.get('_fr') or {}).get('title',''))))
              txt=' '.join(str((s.get(k) or {}).get('content','')) for k in ('_fr','_en'))+' '+str(s.get('content',''))
              assert '>PsychoPy</span>' in txt, study
              if study=='TWIXAV':
                  assert 'v16-resultline' not in txt
                  assert 'Effet durée' not in txt and 'Effet SOA' not in txt and 'Interaction</strong><span>p' not in txt
          print('VALIDATION PASSED')
          PY
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/clean-year1-methods.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Simplify year 1 method slides"
          git push