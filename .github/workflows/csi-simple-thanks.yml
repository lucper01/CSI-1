name: CSI simplify thank-you slide
on:
  push:
    paths:
      - '.github/workflows/csi-simple-thanks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Simplify current main slide 41
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='const slides = ['
          start=text.index(marker)+len(marker)
          i=start; depth_sq=1; in_str=None; esc=False; end=None
          while i<len(text):
              ch=text[i]
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==in_str: in_str=None
              else:
                  if ch in ('"',"'",'`'): in_str=ch
                  elif ch=='[': depth_sq+=1
                  elif ch==']':
                      depth_sq-=1
                      if depth_sq==0:
                          end=i; break
              i+=1
          if end is None: raise RuntimeError('Could not locate slides array')
          body=text[start:end]
          objs=[]; i=0
          while i<len(body):
              if body[i] != '{': i+=1; continue
              a=i; depth=0; in_str=None; esc=False
              while i<len(body):
                  ch=body[i]
                  if in_str:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==in_str: in_str=None
                  else:
                      if ch in ('"',"'",'`'): in_str=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              objs.append((a,i+1,body[a:i+1])); i+=1; break
                  i+=1
          def is_appendix(o): return bool(re.search(r'"appendix"\s*:\s*true',o))
          main=[x for x in objs if not is_appendix(x[2])]
          if len(main)!=41: raise RuntimeError(f'Expected 41 main slides, found {len(main)}')
          a,b,obj=main[40]
          if 'Merci pour votre attention' not in obj and 'Merci de votre attention' not in obj:
              raise RuntimeError('Slide 41 is not the thank-you slide')

          centered_fr = r'<div style=\"min-height:58vh;display:grid;place-items:center;text-align:center\"><div style=\"font:800 clamp(3.6rem,7vw,7rem) Georgia,serif;color:var(--accent-strong);line-height:1.02;letter-spacing:-.04em\">Merci de votre attention</div></div>'
          centered_en = r'<div style=\"min-height:58vh;display:grid;place-items:center;text-align:center\"><div style=\"font:800 clamp(3.6rem,7vw,7rem) Georgia,serif;color:var(--accent-strong);line-height:1.02;letter-spacing:-.04em\">Thank you for your attention</div></div>'

          # Replace all three localized/root variants inside this slide object only.
          obj = re.sub(r'"section":\s*"Discussion"', '"section": ""', obj)
          obj = re.sub(r'"kicker":\s*"(?:Remerciements|Acknowledgements)"', '"kicker": ""', obj)
          obj = re.sub(r'"title":\s*"(?:Merci pour votre attention|Thank you for your attention)"', '"title": ""', obj)
          obj = re.sub(r'"lead":\s*"[^"]*"', '"lead": ""', obj)

          # Content occurs FR root + _fr, and once EN.
          contents=list(re.finditer(r'"content":\s*"((?:\\.|[^"\\])*)"',obj))
          if len(contents)!=3: raise RuntimeError(f'Expected 3 content fields in slide 41, found {len(contents)}')
          # Replace from back to front to preserve indices. First/third are FR depending structure; middle can be EN.
          repls=[]
          for m in contents:
              raw=m.group(0)
              val=m.group(1)
              is_en=('Team and supervision' in val or 'Collaborators and participants' in val or 'Thank you' in val)
              new='"content": "'+(centered_en if is_en else centered_fr)+'"'
              repls.append((m.start(),m.end(),new))
          for s,e,new in reversed(repls): obj=obj[:s]+new+obj[e:]

          obj=re.sub(r'"notes":\s*"[^"]*"','"notes": ""',obj)
          for forbidden in ('Fabrice Damon','Camille Ferdenzi-Lemaître','Questions et échanges','Questions and discussion'):
              if forbidden in obj: raise RuntimeError(f'Old thank-you content still present: {forbidden}')

          new_body=body[:a]+obj+body[b:]
          p.write_text(text[:start]+new_body+text[end:],encoding='utf-8')
          print('Slide 41 simplified to centered thank-you only')
          PY
      - name: Validate slides JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          target=[x for x in scripts if 'const slides = [' in x]
          if len(target)!=1: raise RuntimeError(f'Expected one slides script, found {len(target)}')
          Path('/tmp/slides.js').write_text(target[0],encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Keep save untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit and remove helper
        run: |
          git rm .github/workflows/csi-simple-thanks.yml
          git add index.html
          git commit -m "Simplify final thank-you slide"
          git push
