name: Add upcoming doctoral activities slide
on:
  push:
    paths:
      - '.github/workflows/add-upcoming-doctoral-activities.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert slide after current slide 33
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,copy

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',html,re.S)
          if not m:
              raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))

          assert len(slides)==40, len(slides)
          assert slides[14].get('title')=='Enseignement, formation et encadrement', slides[14].get('title')
          assert slides[32].get('title')=='Rétroplanning des études', slides[32].get('title')
          assert slides[33].get('title')=='Communications prévues', slides[33].get('title')

          content_fr='''<div class="v16-activity"><article><b>2026-2027</b><h3>Enseignement</h3><p>Poursuite des activités d’enseignement en méthodologie expérimentale, TER et interventions de Master selon le service attribué pour l’année universitaire.</p></article><article><b>Année 2</b><h3>Formation doctorale</h3><p>Poursuite du parcours de formation avec des modules ciblés sur les besoins de l’année 2, la pédagogie, les analyses, la reproductibilité et la valorisation scientifique.</p></article><article><b>Masters</b><h3>Encadrement</h3><p>Poursuite de l’encadrement de mémoires adossés aux études de la thèse et aux projets expérimentaux ouverts pendant l’année 2.</p></article><article class="tools"><b>Diffusion</b><h3>Valorisation et outils</h3><p>Maintien et évolution des outils de recherche, préparation des communications et accompagnement des premières valorisations scientifiques.</p><div class="v16-tool-pills"><span>Nuit des chercheurs</span><span>Expérimentarium</span><span>FJC</span><span>JDD</span></div><small>Diffusion scientifique, documentation des outils et soutien aux collectes 2026-2027.</small></article></div>'''
          content_en='''<div class="v16-activity"><article><b>2026-2027</b><h3>Teaching</h3><p>Continuation of teaching activities in experimental methodology, research tutorials and Master-level sessions according to the assigned teaching service.</p></article><article><b>Year 2</b><h3>Doctoral training</h3><p>Continuation of doctoral training with modules targeted to year-2 needs, pedagogy, analyses, reproducibility and scientific dissemination.</p></article><article><b>Masters</b><h3>Supervision</h3><p>Continuation of Master thesis supervision linked to the PhD studies and experimental projects opened during year 2.</p></article><article class="tools"><b>Dissemination</b><h3>Valorization and tools</h3><p>Maintenance and further development of research tools, preparation of communications and support for the first scientific outputs.</p><div class="v16-tool-pills"><span>Researchers’ Night</span><span>Experimentarium</span><span>FJC</span><span>JDD</span></div><small>Scientific dissemination, tool documentation and support for 2026-2027 data collection.</small></article></div>'''

          new_slide={
            'chapter':'Année 2',
            'study':'',
            'appendix':False,
            '_fr':{
              'section':'Année 2',
              'kicker':'Activités doctorales à venir',
              'title':'Activités doctorales prévues - 2026-2027',
              'lead':'Les activités doctorales se poursuivront en parallèle des collectes et des analyses de l’année 2.',
              'content':content_fr,
              'notes':'Présenter cette diapo comme le pendant prospectif de la diapo 15, sans figer des volumes horaires encore susceptibles d’évoluer.'
            },
            '_en':{
              'section':'Year 2',
              'kicker':'Upcoming doctoral activities',
              'title':'Planned doctoral activities - 2026-2027',
              'lead':'Doctoral activities will continue alongside year-2 data collection and analyses.',
              'content':content_en,
              'notes':'Present this slide as the prospective counterpart to slide 15 without fixing teaching-hour volumes that may still change.'
            },
            'section':'Année 2',
            'kicker':'Activités doctorales à venir',
            'title':'Activités doctorales prévues - 2026-2027',
            'lead':'Les activités doctorales se poursuivront en parallèle des collectes et des analyses de l’année 2.',
            'content':content_fr,
            'notes':'Présenter cette diapo comme le pendant prospectif de la diapo 15, sans figer des volumes horaires encore susceptibles d’évoluer.'
          }

          slides.insert(33,new_slide)
          assert len(slides)==41
          assert slides[32]['title']=='Rétroplanning des études'
          assert slides[33]['title']=='Activités doctorales prévues - 2026-2027'
          assert slides[34]['title']=='Communications prévues'
          assert slides[14]['title']=='Enseignement, formation et encadrement'

          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          html=html[:m.start(1)]+arr+html[m.end(1):]
          path.write_text(html,encoding='utf-8')
          PY
      - name: Validate structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          h=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          s=json.loads(m.group(1))
          assert len(s)==41
          assert s[14]['title']=='Enseignement, formation et encadrement'
          assert s[32]['title']=='Rétroplanning des études'
          assert s[33]['title']=='Activités doctorales prévues - 2026-2027'
          assert s[34]['title']=='Communications prévues'
          assert 'v16-activity' in s[33]['content']
          assert 'Nuit des chercheurs' in s[33]['content']
          assert 'Expérimentarium' in s[33]['content']
          assert 'FJC' in s[33]['content'] and 'JDD' in s[33]['content']
          print('validation passed')
          PY
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/add-upcoming-doctoral-activities.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add upcoming doctoral activities slide"
          git push