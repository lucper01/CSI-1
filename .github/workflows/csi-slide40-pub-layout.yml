name: CSI slide40 publication layout
on:
  push:
    paths:
      - '.github/workflows/csi-slide40-pub-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Update slide 40 publication timing and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='const slides = '
          pos=text.index(marker)+len(marker)
          slides,consumed=json.JSONDecoder().raw_decode(text[pos:])
          main=[s for s in slides if not s.get('appendix',False)]
          target=main[39]
          if target.get('title')!='Planification - les trois années de thèse':
              raise RuntimeError(f'Unexpected slide 40: {target.get("title")}')

          def patch_content(content, lang):
              # Add stacked event typography once in this slide-local style.
              old='.csi-plan12 .evt.muted{opacity:.76;border-style:dashed}'
              new=old+'\n.csi-plan12 .evt .ev-name{display:block;font-weight:900;line-height:1.03}\n.csi-plan12 .evt .ev-sub{display:block;margin-top:3px;font-size:.82em;font-weight:800;line-height:1.03;color:inherit}'
              if '.csi-plan12 .evt .ev-name' not in content:
                  content=content.replace(old,new,1)

              if lang=='fr':
                  start='<div class="lane"><div class="lab">Publications</div>'
                  end='<div class="lane"><div class="lab">Thèse</div>'
                  pubs='''<div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1"><span class="ev-name">Revue - protocoles</span><span class="ev-sub">pipelines</span></div><div class="evt" style="grid-column:7;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">rédaction</span></div><div class="evt" style="grid-column:8;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">publication</span></div><div class="evt" style="grid-column:8;grid-row:2"><span class="ev-name">SOFT</span><span class="ev-sub">rédaction</span></div><div class="evt" style="grid-column:9;grid-row:2"><span class="ev-name">SOFT</span><span class="ev-sub">publication</span></div><div class="evt" style="grid-column:8/span 2;grid-row:3"><span class="ev-name">TWIXAV + TWIXOLF</span><span class="ev-sub">rédaction</span></div><div class="evt" style="grid-column:10;grid-row:3"><span class="ev-name">TWIXAV +<br>TWIXOLF</span><span class="ev-sub">publication</span></div></div></div>'''
              else:
                  start='<div class="lane"><div class="lab">Publications</div>'
                  end='<div class="lane"><div class="lab">Thesis</div>'
                  pubs='''<div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1"><span class="ev-name">Review - protocols</span><span class="ev-sub">pipelines</span></div><div class="evt" style="grid-column:7;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">writing</span></div><div class="evt" style="grid-column:8;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">publication</span></div><div class="evt" style="grid-column:8;grid-row:2"><span class="ev-name">SOFT</span><span class="ev-sub">writing</span></div><div class="evt" style="grid-column:9;grid-row:2"><span class="ev-name">SOFT</span><span class="ev-sub">publication</span></div><div class="evt" style="grid-column:8/span 2;grid-row:3"><span class="ev-name">TWIXAV + TWIXOLF</span><span class="ev-sub">writing</span></div><div class="evt" style="grid-column:10;grid-row:3"><span class="ev-name">TWIXAV +<br>TWIXOLF</span><span class="ev-sub">publication</span></div></div></div>'''
              i=content.index(start)
              j=content.index(end,i)
              return content[:i]+pubs+content[j:]

          fr=patch_content(target['_fr']['content'],'fr')
          en=patch_content(target['_en']['content'],'en')
          target['_fr']['content']=fr
          target['content']=fr
          target['_en']['content']=en
          target['_fr']['notes']='Repérage continu T1 à T13. VIBEX : passations T1-T3, analyses T4. VIBOLF : passations T5-T6, analyses T7. Publication commune VIBEX + VIBOLF : rédaction T7, publication T8. SOFT : passations T5-T6, analyses T7, rédaction T8, publication T9. TWIXOLF : passations T7-T8, analyses T9. Publication commune TWIXAV + TWIXOLF : rédaction T8-T9, publication T10.'
          target['notes']=target['_fr']['notes']
          target['_en']['notes']='Continuous Q1-Q13 numbering. VIBEX: data collection Q1-Q3, analyses Q4. VIBOLF: data collection Q5-Q6, analyses Q7. Joint VIBEX + VIBOLF paper: writing Q7, publication Q8. SOFT: data collection Q5-Q6, analyses Q7, writing Q8, publication Q9. TWIXOLF: data collection Q7-Q8, analyses Q9. Joint TWIXAV + TWIXOLF paper: writing Q8-Q9, publication Q10.'
          new_array=json.dumps(slides,ensure_ascii=False,indent=2)
          p.write_text(text[:pos]+new_array+text[pos+consumed:],encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          js=[x for x in scripts if 'const slides = [' in x]
          if len(js)!=1: raise RuntimeError('slides script not found')
          Path('/tmp/slides.js').write_text(js[0],encoding='utf-8')
          required=[
            'grid-column:7;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">rédaction</span>',
            'grid-column:8;grid-row:1"><span class="ev-name">VIBEX +<br>VIBOLF</span><span class="ev-sub">publication</span>',
            '.csi-plan12 .evt .ev-sub',
            'TWIXOLF<br>passations',
            '>T13<'
          ]
          for x in required:
              if x not in s: raise RuntimeError(f'Missing {x}')
          if 'grid-column:8;grid-row:1">VIBEX + VIBOLF<br>rédaction' in s:
              raise RuntimeError('Old VIBEX/VIBOLF timing remains')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit update and remove helper
        run: |
          git rm .github/workflows/csi-slide40-pub-layout.yml
          git add index.html
          git commit -m "Fix slide 40 publication timing and label layout"
          git push
