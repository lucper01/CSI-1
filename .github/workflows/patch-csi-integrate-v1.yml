name: Patch CSI batch reserved-study cleanup
on:
  push:
    paths:
      - '.github/workflows/patch-csi-integrate-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible-slide cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/csi-integrate-batch-v1.yml')
          t = p.read_text(encoding='utf-8')
          anchor = "              if s.get('_fr'): s.update(s['_fr'])\n\n          # Remove measurement/output cards and overt apparatus buttons from all visible method/paradigm slides.\n"
          block = "              if s.get('_fr'): s.update(s['_fr'])\n\n          # Scrub reserved-study names from any remaining metadata or speaker notes on visible slides.\n          def scrub_reserved(obj):\n              if isinstance(obj, dict):\n                  return {k: scrub_reserved(v) for k,v in obj.items()}\n              if isinstance(obj, list):\n                  return [scrub_reserved(v) for v in obj]\n              if isinstance(obj, str):\n                  x = obj.replace('SORBET', '').replace('COBEX', '')\n                  x = re.sub(r'\\s+-\\s+-\\s+', ' - ', x)\n                  x = re.sub(r',\\s*,', ',', x)\n                  return x\n              return obj\n          main[:] = [scrub_reserved(s) for s in main]\n\n          # Remove measurement/output cards and overt apparatus buttons from all visible method/paradigm slides.\n"
          assert anchor in t
          p.write_text(t.replace(anchor, block, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/csi-integrate-batch-v1.yml
          git commit -m "Patch reserved study cleanup in CSI batch"
          git push
