name: Update CSI oral wording
on:
  push:
    paths:
      - '.github/workflows/run-update-oral-wording.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update wording
        run: python3 tools_temp/update_oral_wording.py
      - name: Validate backup untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools_temp/update_oral_wording.py
          rm -f .github/workflows/run-update-oral-wording.yml
          git add -A index.html tools_temp .github
          git commit -m "Refine CSI wording for oral presentation"
          git push
