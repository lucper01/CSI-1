name: CSI save then clean result graphs

on:
  push:
    paths:
      - '.github/scripts/csi_clean_result_graphs.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current working deck
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before cleaning result graphs"
            git push
          fi
          echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"

      - name: Clean result graphs and captions
        run: python .github/scripts/csi_clean_result_graphs.py

      - name: Verify save remains frozen
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html

      - name: Commit working deck update
        run: |
          git add index.html assets/results/twixav_tbw_width.svg assets/results/vibex_m1_olivia.svg assets/results/vibex_size_interaction.svg
          git commit -m "Clean TWIXAV and VIBEX result graphs"
          git push
