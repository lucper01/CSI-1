name: Restore CSI backup
on:
  push:
    paths:
      - '.github/workflows/restore-csi-backup.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore active presentation from frozen backup
        run: |
          cp index_save.html index.html
          cmp -s index_save.html index.html
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore presentation from saved backup"
          git push
