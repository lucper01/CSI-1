name: Save current presentation
on:
  push:
    paths:
      - '.github/workflows/save-current-presentation.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save current index
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
          sha256sum index.html index_save.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git commit -m "Save current presentation state"
          rm .github/workflows/save-current-presentation.yml
          git add .github/workflows/save-current-presentation.yml
          git commit -m "Remove temporary save workflow"
          git push
