name: Fix and expand axes slide
on:
  push:
    paths:
      - '.github/workflows/fix-and-expand-axes-slide.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental duplicate and expand axes slide
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title', '')

          # Remove the accidental duplicated axes slide inserted after slide 2.
          # It is the copy without study names and sits immediately before the Architecture divider.
          if len(slides) > 3 and title(slides[2]) == 'Deux axes' and slides[3].get('divider'):
              del slides[2]

          idx = next(i for i, s in enumerate(slides) if title(s) == 'Deux axes')
          assert idx == 3, f'Expected Deux axes on slide 4 after cleanup, got slide {idx+1}'
          slide = slides[idx]

          fr_content = '''<div class="v16-axes"><article><b>Axe 1</b><h3>Relations Spatio-Temporelles entre Olfaction, Vision et Audition</h3><p>Caractériser comment les informations olfactives, visuelles et auditives s’organisent et s’intègrent dans l’espace et dans le temps. Cet axe examine notamment les fenêtres temporelles d’intégration, la perception des débuts et fins de stimulation, la durée, la synchronie intermodale et les mécanismes d’orientation spatiale entre modalités.</p><div class="v16-pills"><span data-study="TWIXAV">TWIXAV</span><span data-study="SOFT">SOFT</span><span data-study="TWIXOLF">TWIXOLF</span><span data-study="SORBET">SORBET</span></div></article><article><b>Axe 2</b><h3>Influence des Odeurs sur la Perception Spatio-Temporelle en Vision et en Audition</h3><p>Déterminer dans quelle mesure la présence et les propriétés d’une odeur modifient la perception et la représentation de l’espace et du temps dans les autres modalités. Cet axe porte notamment sur la mémoire des limites spatiales, l’attention, la congruence multisensorielle et les biais perceptifs induits par le contexte olfactif.</p><div class="v16-pills"><span data-study="VIBEX">VIBEX</span><span data-study="OASIS">OASIS</span><span data-study="SOLAR">SOLAR</span><span data-study="COBEX">COBEX</span><span data-study="BRAUD">BRAUD</span><span data-study="BRAUDOLF">BRAUDOLF</span></div></article></div><div class="v16-ref"><strong>Références</strong><span>Vroomen & Keetels, 2010; Murray & Wallace, 2012; Intraub & Richardson, 1989; Mainland & Sobel, 2006.</span></div><div class="csi-extra-refs"><strong>Références complémentaires :</strong> Gotow & Kobayakawa, 2017 ; Gottfried, 2010 ; Sela & Sobel, 2010 ; Zhou et al., 2010.</div>'''
          en_content = '''<div class="v16-axes"><article><b>Axis 1</b><h3>Spatio-Temporal Relations between Olfaction, Vision and Audition</h3><p>Characterize how olfactory, visual and auditory information is organized and integrated across space and time. This axis examines temporal binding windows, perceived stimulus onset and offset, duration, crossmodal synchrony, and spatial orienting mechanisms across sensory modalities.</p><div class="v16-pills"><span data-study="TWIXAV">TWIXAV</span><span data-study="SOFT">SOFT</span><span data-study="TWIXOLF">TWIXOLF</span><span data-study="SORBET">SORBET</span></div></article><article><b>Axis 2</b><h3>Influence of Odors on Spatio-Temporal Perception in Vision and Audition</h3><p>Determine to what extent the presence and properties of an odor modify spatial and temporal perception and representations in other modalities. This axis focuses on spatial-boundary memory, attention, multisensory congruence, and perceptual biases induced by olfactory context.</p><div class="v16-pills"><span data-study="VIBEX">VIBEX</span><span data-study="OASIS">OASIS</span><span data-study="SOLAR">SOLAR</span><span data-study="COBEX">COBEX</span><span data-study="BRAUD">BRAUD</span><span data-study="BRAUDOLF">BRAUDOLF</span></div></article></div><div class="v16-ref"><strong>References</strong><span>Vroomen & Keetels, 2010; Murray & Wallace, 2012; Intraub & Richardson, 1989; Mainland & Sobel, 2006.</span></div>'''

          slide['lead'] = "La thèse s'organise autour de deux axes complémentaires : comprendre les relations spatio-temporelles entre modalités, puis tester comment l'olfaction peut modifier la perception visuelle et auditive."
          slide['content'] = fr_content
          slide['notes'] = "Présenter les deux axes avec leurs intitulés officiels, puis distinguer clairement l'étude des relations entre modalités de l'étude de l'influence des odeurs sur la vision et l'audition."

          fr = slide.setdefault('_fr', {})
          fr['title'] = 'Deux axes'
          fr['lead'] = slide['lead']
          fr['content'] = fr_content
          fr['notes'] = slide['notes']

          en = slide.setdefault('_en', {})
          en['title'] = 'Two axes'
          en['lead'] = 'The thesis is organized around two complementary axes: understanding spatio-temporal relations across modalities, then testing how olfaction can modify visual and auditory perception.'
          en['content'] = en_content
          en['notes'] = 'Present the two axes using their official titles, then clearly distinguish crossmodal relations from odor-driven influences on vision and audition.'

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          text = text[:start] + new_json + text[end:]
          p.write_text(text, encoding='utf-8')

          # Validation
          out = p.read_text(encoding='utf-8')
          s2 = out.index(marker) + len(marker)
          check, _ = json.JSONDecoder().raw_decode(out[s2:])
          assert title(check[3]) == 'Deux axes'
          assert 'Relations Spatio-Temporelles entre Olfaction, Vision et Audition' in check[3]['content']
          assert 'Influence des Odeurs sur la Perception Spatio-Temporelle en Vision et en Audition' in check[3]['content']
          print('OK - duplicate removed and slide 4 expanded')
      - name: Validate backup untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-and-expand-axes-slide.yml
          git add -A index.html .github
          git commit -m "Expand slide 4 with official thesis axes"
          git push