name: CSI slide40 subtitle writing labels
on:
  push:
    paths:
      - '.github/workflows/csi-slide40-subtitle-writing-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Update slide 40
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = text.index(marker) + len(marker)
          slides, consumed = json.JSONDecoder().raw_decode(text[pos:])
          main = [s for s in slides if not s.get('appendix', False)]
          target = main[39]
          if target.get('title') != 'Planification - les trois années de thèse':
              raise RuntimeError(f'Unexpected slide 40: {target.get("title")}')

          fr_lead = 'Treize trimestres pour visualiser les activités réalisées, en cours et prévues'
          en_lead = 'Thirteen quarters to visualize completed, ongoing and planned activities'
          target['lead'] = fr_lead
          target['_fr']['lead'] = fr_lead
          target['_en']['lead'] = en_lead

          def patch_css(content):
              old = '.csi-plan12 .lab{display:flex;align-items:center;padding:8px 10px;border-radius:13px;background:var(--accent-pale);border:1px solid var(--line);font-weight:950;color:var(--accent-strong)}'
              new = '.csi-plan12 .lab{display:flex;align-items:center;padding:8px 10px;border-radius:13px;background:var(--accent-pale);border:1px solid var(--line);font-weight:950;font-size:.82rem;line-height:1.1;color:var(--accent-strong)}'
              if old in content:
                  content = content.replace(old, new, 1)
              elif 'font-size:.82rem' not in content:
                  raise RuntimeError('Slide 40 lab CSS pattern not found')
              return content

          fr = patch_css(target['_fr']['content'])
          en = patch_css(target['_en']['content'])

          old_fr = '<div class="evt dark" style="grid-column:9/span 4;grid-row:2">Rédaction</div>'
          new_fr = '<div class="evt dark" style="grid-column:10/span 3;grid-row:2">Rédaction</div>'
          if old_fr not in fr:
              raise RuntimeError('French writing block not found')
          fr = fr.replace(old_fr, new_fr, 1)

          old_en = '<div class="evt dark" style="grid-column:9/span 4;grid-row:2">Writing</div>'
          new_en = '<div class="evt dark" style="grid-column:10/span 3;grid-row:2">Writing</div>'
          if old_en not in en:
              raise RuntimeError('English writing block not found')
          en = en.replace(old_en, new_en, 1)

          target['_fr']['content'] = fr
          target['content'] = fr
          target['_en']['content'] = en
          target['_fr']['notes'] = target['_fr']['notes'].replace('rédaction T9-T12', 'rédaction T10-T12')
          target['notes'] = target['_fr']['notes']
          target['_en']['notes'] = target['_en']['notes'].replace('writing Q9-Q12', 'writing Q10-Q12')

          new_array = json.dumps(slides, ensure_ascii=False, indent=2)
          p.write_text(text[:pos] + new_array + text[pos+consumed:], encoding='utf-8')
          PY
      - name: Validate requested changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s = Path('index.html').read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = s.index(marker) + len(marker)
          slides, _ = json.JSONDecoder().raw_decode(s[pos:])
          main = [x for x in slides if not x.get('appendix', False)]
          t = main[39]
          assert t['lead'] == 'Treize trimestres pour visualiser les activités réalisées, en cours et prévues'
          assert t['_fr']['lead'] == t['lead']
          assert t['_en']['lead'] == 'Thirteen quarters to visualize completed, ongoing and planned activities'
          assert 'grid-column:10/span 3;grid-row:2">Rédaction</div>' in t['_fr']['content']
          assert 'grid-column:9/span 4;grid-row:2">Rédaction</div>' not in t['_fr']['content']
          assert 'font-size:.82rem;line-height:1.1' in t['_fr']['content']
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          js = [x for x in scripts if 'const slides = [' in x]
          if len(js) != 1:
              raise RuntimeError('slides script not found')
          Path('/tmp/slides.js').write_text(js[0], encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit update and remove helper
        run: |
          git rm .github/workflows/csi-slide40-subtitle-writing-labels.yml
          git add index.html
          git commit -m "Refine slide 40 subtitle and thesis writing timeline"
          git push