name: Inspect CSI selected backup slides
on:
  push:
    paths:
      - '.github/workflows/inspect-csi-selected.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump selected slide JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          t=Path('index_save.html').read_text(encoding='utf-8')
          m='const slides = '; st=t.index(m)+len(m); slides,_=json.JSONDecoder().raw_decode(t[st:])
          for i in [1,4,8,9,15,16,21,22,23,24,26,27,28,29,30,31,36,38,39,40,41,43,44,46,47,50,52,53,54,55,56,57,59,60,61,62,63,64]:
              s=slides[i-1]
              print('\n===== SLIDE',i,'=====')
              print(json.dumps({k:s.get(k) for k in ['chapter','study','appendix','kicker','title','lead','content','notes']},ensure_ascii=False,indent=2))
          PY
