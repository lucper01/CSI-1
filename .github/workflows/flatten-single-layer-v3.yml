name: Build single-layer CSI v3
on:
  push:
    paths:
      - '.github/workflows/flatten-single-layer-v3.yml'
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make TWIXAV block deterministic
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools_flat/build_flat.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('  let twr=')
          end=s.index('\n\n  // VIBEX',start)
          new=r'''  const twMethodNow=idx(slides,/^TWIXAV - Méthode$/i);
          if(twMethodNow>=0){
            const twResults=makeSlide('Études de l’année 1','TWIXAV - Résultats','TWIXAV - Résultats',
              'Le prétest met en évidence un effet de la durée, un effet du décalage temporel et une interaction entre ces deux facteurs.',
              `<div class="result-strip"><div class="result"><div class="pval">n = 19</div><p>Prétest analysé</p></div><div class="result"><div class="pval">p = .001</div><p>Effet de la durée</p></div><div class="result"><div class="pval">p &lt; .001</div><p>Effet du SOA</p></div><div class="result"><div class="pval">p = .001</div><p>Interaction durée × SOA</p></div></div><div class="callout" style="margin-top:16px"><strong>Lecture :</strong> la synchronie audiovisuelle dépend conjointement du décalage temporel et de la durée des stimuli.</div>`,
              'TWIXAV');
            const twDisc=makeSlide('Études de l’année 1','TWIXAV - Discussion','TWIXAV - ce que les résultats changent pour la suite',
              'Les effets observés montrent que la synchronie audiovisuelle ne se résume pas à un seuil temporel unique. La durée et la direction du décalage doivent être prises en compte avant toute transposition à l’olfaction.',
              grid3(
                card('Résultat','Durée × SOA','Les effets de durée, de SOA et leur interaction indiquent que la fenêtre temporelle dépend des propriétés du stimulus.'),
                card('À consolider','PSS, fenêtre, asymétrie','Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées.'),
                card('Décision','SOFT puis TWIXOLF','SOFT teste directement onset et offset perceptifs, puis TWIXOLF transpose la question à l’olfaction.',true)
              ),'TWIXAV');
            slides.splice(twMethodNow+1,0,twResults,twDisc);
          }'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
      - name: Build flat index
        run: node tools_flat/build_flat.js
      - name: Validate desktop and mobile
        run: node tools_flat/validate_flat.js
      - name: Commit validated single-layer index
        run: |
          rm -rf tools_flat
          rm -rf .github
          rm -f package.json package-lock.json validate-desktop.png validate-mobile.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace layered CSI runtime with one validated standalone index"
          git push