name: Save presentation before slide refactor
on:
  push:
    paths:
      - '.github/workflows/save-before-slide-refactor.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save current active presentation
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
      - name: Commit save point and remove temporary workflow
        run: |
          rm .github/workflows/save-before-slide-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html .github/workflows/save-before-slide-refactor.yml
          git commit -m "Save presentation before slide refactor"
          git push
