name: CSI restore axis labels

on:
  push:
    paths:
      - '.github/trigger-csi-restore-axis-labels.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore graph axis labels only
        run: |
          git checkout 8f22f0fd6aee43fd5b10b10ccda9d63a5e49c430 -- \
            assets/results/twixav_empirical_curves.svg \
            assets/results/twixav_tbw_width.svg \
            assets/results/vibex_m1_olivia.svg \
            assets/results/vibex_size_interaction.svg

      - name: Verify protected save unchanged
        run: git diff --exit-code -- index_save.html

      - name: Commit restored axes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/twixav_empirical_curves.svg assets/results/twixav_tbw_width.svg assets/results/vibex_m1_olivia.svg assets/results/vibex_size_interaction.svg
          git commit -m "Restore axis values while keeping means hidden"
          git push
