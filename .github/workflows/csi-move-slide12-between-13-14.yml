name: Move CSI slide 12 between 13 and 14
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/csi_move_slide12_between_13_14.py'
      - '.github/workflows/csi-move-slide12-between-13-14.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move slide 12
        run: python .github/scripts/csi_move_slide12_between_13_14.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit working deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move slide 12 between slides 13 and 14"
          git push
