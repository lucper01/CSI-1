name: Move TWIXAV and VIBEX demos to method
on:
  push:
    paths:
      - '.github/workflows/run-move-demos-to-method.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move demos
        run: python3 tools_temp/move_demos_to_method.py
      - name: Validate
        run: |
          grep -q 'method-demo-wrap' index.html
          grep -q 'data-demo-open=\\"twixav\\"' index.html
          grep -q 'data-demo-open=\\"vibex\\"' index.html
          git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools_temp/move_demos_to_method.py
          rm -f .github/workflows/run-move-demos-to-method.yml
          git add -A index.html tools_temp .github
          git commit -m "Move TWIXAV and VIBEX demos to method slides"
          git push
