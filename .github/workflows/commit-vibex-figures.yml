name: Commit VIBEX figures
on:
  push:
    paths:
      - '.github/workflows/commit-vibex-figures.yml'
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse figure generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,textwrap
          src=Path('.github/workflows/harmonize-vibex-figures-final.yml').read_text(encoding='utf-8')
          marker="      - name: Generate VIBEX figure family"
          section=src[src.index(marker):]
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",section,re.S)
          if not m: raise RuntimeError('Figure generator not found')
          code=textwrap.dedent(m.group(1))
          exec(compile(code,'vibex_figure_generator.py','exec'),{'__name__':'__main__'})
          PY
      - name: Validate and commit
        run: |
          grep -q 'Petite' assets/results/vibex_size_interaction.svg
          grep -q 'Moyenne' assets/results/vibex_size_interaction.svg
          grep -q 'Grande' assets/results/vibex_size_interaction.svg
          grep -q 'LL ↔ SS' assets/results/vibex_conditions.svg
          grep -q 'SL &gt; LS' assets/results/vibex_conditions.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/vibex_conditions.svg assets/results/vibex_size_interaction.svg assets/results/vibex_rt_interaction.svg
          git commit -m "Harmonize VIBEX result figures"
          git push
