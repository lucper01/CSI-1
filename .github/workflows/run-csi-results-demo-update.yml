name: Run CSI results and demo update
on:
  push:
    paths:
      - '.github/workflows/run-csi-results-demo-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore CNRS logo
        run: |
          base64 -d assets/logos/cnrs-logo-source.b64.txt > assets/logos/cnrs-logo.png
          file assets/logos/cnrs-logo.png
      - name: Update CSI results and demos
        run: python3 tools_temp/finish_csi_results_demo.py
      - name: Validate update
        run: |
          grep -q 'TWIXAV - les courbes empiriques' index.html
          grep -q 'TWIXAV - la fenêtre se rétrécit avec la durée' index.html
          grep -q 'TWIXAV - PSS et asymétrie restent stables' index.html
          grep -q 'VIBEX - l.asymétrie SL-LS reproduit la Boundary Extension' index.html
          grep -q 'VIBEX - la taille module l.effet sans effet principal global' index.html
          grep -q 'VIBEX - les temps de réaction convergent avec les jugements' index.html
          grep -q 'studyDemoModal' index.html
          grep -q 'data-demo-open=\\"twixav\\"' index.html
          grep -q 'data-demo-open=\\"vibex\\"' index.html
          test -s assets/results/twixav_empirical_curves.svg
          test -s assets/results/twixav_tbw_width.svg
          test -s assets/results/twixav_pss_asymmetry.svg
          test -s assets/results/vibex_conditions.svg
          test -s assets/results/vibex_size_interaction.svg
          test -s assets/results/vibex_rt_interaction.svg
          file assets/logos/cnrs-logo.png | grep -q 'PNG image data'
          git diff --exit-code -- index_save.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(encoding='utf-8')
          marker='const slides = '
          start=s.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(s[start:])
          assert len(slides)==44, len(slides)
          assert sum(1 for x in slides if (x.get('study')=='TWIXAV')) >= 6
          assert sum(1 for x in slides if (x.get('study')=='VIBEX')) >= 6
          print('validated slides:',len(slides))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools_temp/update_csi_results_demo.py tools_temp/finish_csi_results_demo.py
          rm -f assets/logos/cnrs-logo-source.b64.txt
          rm -f .github/workflows/run-csi-results-demo-update.yml
          git add -A
          git commit -m "Expand TWIXAV and VIBEX results with interactive demos"
          git push
