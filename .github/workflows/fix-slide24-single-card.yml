name: Fix slide 24 single card
on:
  push:
    paths:
      - '.github/workflows/fix-slide24-single-card.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore slide 24 and remove only the consolidate card
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re, copy

          def load_slides(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              st = text.index(marker) + len(marker)
              slides, rel = json.JSONDecoder().raw_decode(text[st:])
              return text, st, rel, slides

          def remove_innermost_card(html, needles):
              needle = next((n for n in needles if n and n in html), None)
              if not needle:
                  return html, False

              tag_re = re.compile(r'<(/?)([A-Za-z][\w:-]*)([^>]*)>', re.S)
              stack = []
              candidates = []
              void = {'br','hr','img','input','meta','link','source','area','base','col','embed','param','track','wbr'}

              for m in tag_re.finditer(html):
                  closing, tag, rest = m.group(1), m.group(2).lower(), m.group(3)
                  if not closing:
                      if tag in void or rest.rstrip().endswith('/'):
                          continue
                      stack.append((tag, m.start(), m.end(), m.group(0)))
                  else:
                      # pop back to matching tag, tolerating nested markup
                      j = len(stack) - 1
                      while j >= 0 and stack[j][0] != tag:
                          j -= 1
                      if j < 0:
                          continue
                      entry = stack[j]
                      stack = stack[:j]
                      start, end_open, open_tag = entry[1], entry[2], entry[3]
                      end = m.end()
                      segment = html[start:end]
                      if needle in segment:
                          cls_card = bool(re.search(r'class\s*=\s*["\'][^"\']*\bcard\b', open_tag, re.I))
                          if cls_card or tag in {'article','div'}:
                              candidates.append((0 if cls_card else 1, end-start, start, end, open_tag))

              if not candidates:
                  raise AssertionError(f'Could not isolate card containing {needle!r}')
              candidates.sort()
              _, _, start, end, open_tag = candidates[0]
              removed = html[start:end]
              # Guard: the removed unit must contain the target and must not swallow unrelated neighboring cards.
              assert needle in removed
              assert len(removed) < len(html) * 0.75, (len(removed), len(html), open_tag)
              return html[:start] + html[end:], True

          current_text, st, rel, current = load_slides('index.html')
          _, _, _, saved = load_slides('index_save.html')
          save_hash_before = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          assert len(current) >= 24 and len(saved) >= 24

          # Restore slide 24 exactly from the latest checkpoint first.
          fixed = copy.deepcopy(saved[23])

          fr = fixed.get('_fr') or {}
          fr_content = fr.get('content', '')
          before_fr = fr_content
          fr_content, removed_fr = remove_innermost_card(fr_content, [
              'À consolider',
              'PSS, fenêtre, asymétrie',
              'Ces indicateurs sont consolidés dans les analyses finales sans ajouter de statistiques non encore verrouillées.'
          ])
          assert removed_fr
          assert 'À consolider' not in fr_content
          assert 'PSS, fenêtre, asymétrie' not in fr_content
          assert len(fr_content) < len(before_fr)
          fr['content'] = fr_content
          fixed['_fr'] = fr

          # Remove the corresponding English card when it is explicitly identifiable.
          en = fixed.get('_en') or {}
          if en.get('content'):
              en_content = en['content']
              for needles in ([
                  'To consolidate', 'PSS, window, asymmetry',
                  'These indicators are consolidated in the final analyses'
              ], [
                  'To be consolidated', 'PSS, window and asymmetry'
              ]):
                  if any(n in en_content for n in needles):
                      en_content, _ = remove_innermost_card(en_content, needles)
                      break
              en['content'] = en_content
              fixed['_en'] = en

          # Top-level display fields mirror French.
          fixed.update(fixed['_fr'])
          current[23] = fixed

          new_json = json.dumps(current, ensure_ascii=False, separators=(',', ':'))
          new_text = current_text[:st] + new_json + current_text[st+rel:]
          Path('index.html').write_text(new_text, encoding='utf-8')

          # Backup stays frozen.
          assert hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest() == save_hash_before

          # Final targeted checks.
          _, _, _, verify = load_slides('index.html')
          s = verify[23]
          assert 'À consolider' not in (s.get('_fr') or {}).get('content','')
          assert 'PSS, fenêtre, asymétrie' not in (s.get('_fr') or {}).get('content','')
          print('Slide 24 restored from save; only consolidate card removed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore slide 24 and remove only consolidate card"
          git push
