name: Inspect CSI before refactor
on:
  push:
    paths:
      - '.github/workflows/inspect-csi-before-refactor.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory current deck
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          text=Path('index.html').read_text(encoding='utf-8')
          save=Path('index_save.html').read_text(encoding='utf-8')
          print('INDEX==SAVE', text==save)
          print('index sha256',hashlib.sha256(text.encode()).hexdigest())
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(text[start:])
          print('TOTAL',len(slides),'MAIN',sum(not s.get('appendix') for s in slides),'APPENDIX',sum(bool(s.get('appendix')) for s in slides))
          print('--- SLIDE INVENTORY ---')
          for i,s in enumerate(slides,1):
              title=s.get('title','')
              section=s.get('section','')
              kicker=s.get('kicker','')
              study=s.get('study','')
              chapter=s.get('chapter','')
              app='APP' if s.get('appendix') else 'MAIN'
              content=re.sub('<[^>]+>',' ',s.get('content',''))
              content=re.sub(r'\s+',' ',content).strip()
              print(f'{i:02d}|{app}|chapter={chapter}|study={study}|section={section}|kicker={kicker}|title={title}|snippet={content[:180]}')
          print('--- KEY COUNTS ---')
          for q in ['COBEX','SORBET','SOLAR','Arnaud Leleu','Maître de conférences','mouvement oculaire stabilisé','mouvement oculaire maîtrisé','À consolider','Appareillage','Matériel','MÉMOIRE M1','Mémoire M1','Nuit des Chercheurs','Expérimentarium','ISOT','Rétroplanning','Bibliographie','No space','No time','Less space']:
              print(q, text.count(q))
          print('--- CSS/JS MARKERS ---')
          for q in ['apparatusPopupScript','vibex','overview','notes','appendix','mainSlides','timeline']:
              print(q, text.lower().count(q.lower()))
          PY
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-csi-before-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/inspect-csi-before-refactor.yml
          git commit -m "Remove temporary CSI inventory workflow" || true
          git push
