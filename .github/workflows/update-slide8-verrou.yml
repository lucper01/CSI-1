name: Update slide 8 verrou
on:
  push:
    paths:
      - '.github/workflows/update-slide8-verrou.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace wording on slide 8 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='const slides = '
          st=t.index(marker)+len(marker)
          slides,rel=json.JSONDecoder().raw_decode(t[st:])
          en=st+rel
          s=slides[7]
          old='Le verrou à tester'
          new='Le verrou à lever'
          hits=0
          for target in [s, s.get('_fr') or {}]:
              c=target.get('content','')
              if old in c:
                  target['content']=c.replace(old,new,1)
                  hits+=1
          if hits != 2:
              raise RuntimeError(f'Expected 2 French occurrences on slide 8, got {hits}')
          if s.get('_fr'):
              s.update(s['_fr'])
          slides[7]=s
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          out=t[:st]+new_json+t[en:]
          if old in slides[7].get('content',''):
              raise RuntimeError('Old wording remains on active French slide 8')
          if new not in slides[7].get('content',''):
              raise RuntimeError('New wording missing')
          p.write_text(out,encoding='utf-8')
          sha=hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          print('backup_sha256',sha)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename slide 8 constraint wording"
          git push
