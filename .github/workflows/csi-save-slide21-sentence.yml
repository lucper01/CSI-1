name: CSI save slide21 sentence
on:
  push:
    paths:
      - '.github/workflows/csi-save-slide21-sentence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current CSI working version
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before slide 21 sentence update"
            git push
          fi

      - name: Update slide 21 sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "Le paradigme doit être fonctionnel et stable sans odeur avant de pouvoir attribuer une modification ultérieure au contexte olfactif."
          new = "Tester plusieurs tailles d'images sert à choisir un paramètre robuste pour la suite, mais aussi à documenter théoriquement si la durée elle-même modifie la fenêtre."
          n = s.count(old)
          if n != 2:
              raise SystemExit(f'Expected 2 French occurrences, found {n}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify save stayed frozen
        run: git diff --exit-code -- index_save.html

      - name: Commit working update
        run: |
          git add index.html
          git commit -m "Update VIBEX slide 21 double objective text"
          git push
