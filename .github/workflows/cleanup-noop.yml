name: cleanup noop
on:
  push:
    paths:
      - '.github/workflows/cleanup-noop.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/workflows/noop-wait.yml .github/workflows/cleanup-noop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/noop-wait.yml .github/workflows/cleanup-noop.yml
          git commit -m "Clean temporary workflows" || true
          git push
