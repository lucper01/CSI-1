name: CSI save then delete slide 39
on:
  push:
    paths:
      - '.github/workflows/csi-save-delete-slide39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current presentation first
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
          git add index_save.html
          git commit -m "Save CSI before deleting slide 39"
          git push
          echo "SAVED_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Delete current main slide 39
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          marker = 'const slides = ['
          m = s.find(marker)
          if m < 0:
              raise SystemExit('slides array not found')
          arr_start = s.find('[', m)

          in_str = False
          esc = False
          square = 0
          brace = 0
          obj_start = None
          spans = []
          arr_end = None

          for i in range(arr_start, len(s)):
              ch = s[i]
              if in_str:
                  if esc:
                      esc = False
                  elif ch == '\\':
                      esc = True
                  elif ch == '"':
                      in_str = False
                  continue
              if ch == '"':
                  in_str = True
                  continue
              if ch == '[':
                  square += 1
              elif ch == ']':
                  square -= 1
                  if square == 0:
                      arr_end = i
                      break
              elif ch == '{':
                  if square == 1 and brace == 0:
                      obj_start = i
                  brace += 1
              elif ch == '}':
                  brace -= 1
                  if square == 1 and brace == 0 and obj_start is not None:
                      spans.append((obj_start, i + 1))
                      obj_start = None

          if arr_end is None:
              raise SystemExit('slides array end not found')

          parsed = []
          for a,b in spans:
              try:
                  obj = json.loads(s[a:b])
              except Exception as e:
                  raise SystemExit(f'Could not parse slide object at {a}:{b}: {e}')
              parsed.append((a,b,obj))

          main = [(a,b,o) for a,b,o in parsed if not o.get('appendix', False)]
          if len(main) < 39:
              raise SystemExit(f'Only {len(main)} main slides found')
          a,b,target = main[38]
          title = target.get('title') or target.get('_fr',{}).get('title')
          if title != 'Planification - jusqu’à la soutenance':
              raise SystemExit(f'Current main slide 39 is not the expected slide: {title!r}')
          print('Deleting main slide 39:', title)

          # Remove object plus its following comma and whitespace, preserving the rest verbatim.
          end = b
          j = end
          while j < len(s) and s[j] in ' \t\r\n':
              j += 1
          if j < len(s) and s[j] == ',':
              j += 1
              while j < len(s) and s[j] in ' \t\r\n':
                  j += 1
              new_s = s[:a] + s[j:]
          else:
              # Fallback for a last object: remove preceding comma.
              k = a - 1
              while k >= 0 and s[k] in ' \t\r\n':
                  k -= 1
              if k >= 0 and s[k] == ',':
                  new_s = s[:k] + s[b:]
              else:
                  raise SystemExit('Could not determine slide separator')

          path.write_text(new_s, encoding='utf-8')

          # Re-parse and verify the new main slide 39 is the quarterly planning slide.
          s2 = new_s
          m2 = s2.find(marker)
          arr2 = s2.find('[', m2)
          in_str=False; esc=False; square=0; brace=0; start=None; spans2=[]
          for i in range(arr2, len(s2)):
              ch=s2[i]
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': in_str=False
                  continue
              if ch=='"': in_str=True; continue
              if ch=='[': square+=1
              elif ch==']':
                  square-=1
                  if square==0: break
              elif ch=='{':
                  if square==1 and brace==0: start=i
                  brace+=1
              elif ch=='}':
                  brace-=1
                  if square==1 and brace==0 and start is not None:
                      spans2.append((start,i+1)); start=None
          objs2=[json.loads(s2[x:y]) for x,y in spans2]
          main2=[o for o in objs2 if not o.get('appendix',False)]
          new39=main2[38].get('title') or main2[38].get('_fr',{}).get('title')
          if new39 != 'Planification - les trois années de thèse':
              raise SystemExit(f'Unexpected new main slide 39: {new39!r}')
          if len(main2) != len(main)-1:
              raise SystemExit('Main slide count did not decrease by exactly one')
          print('New main slide 39:', new39)
          PY
      - name: Validate main slides JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)
          main=next((x for x in scripts if 'const slides = [' in x),None)
          if main is None:
              raise SystemExit('Main slides script not found')
          Path('/tmp/csi-main.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/csi-main.js
      - name: Verify saved version remains frozen after deletion
        run: |
          test "$(git hash-object index_save.html)" = "$SAVED_SHA"
          git diff --exit-code -- index_save.html
      - name: Commit deletion and remove helper
        run: |
          rm .github/workflows/csi-save-delete-slide39.yml
          git add index.html .github/workflows/csi-save-delete-slide39.yml
          git commit -m "Delete slide 39"
          git push
