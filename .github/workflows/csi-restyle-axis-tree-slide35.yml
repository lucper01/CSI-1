name: CSI restyle STOLF axis tree
on:
  push:
    paths:
      - .github/workflows/csi-restyle-axis-tree-slide35.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record save hash
        run: echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Apply restyle
        run: python tools/tmp_restlye_stolf_axis_tree.py
      - name: Verify save untouched
        run: test "$SAVE_SHA" = "$(git hash-object index_save.html)"
      - name: Commit and clean temporary files
        run: |
          rm tools/tmp_restlye_stolf_axis_tree.py
          rm .github/workflows/csi-restyle-axis-tree-slide35.yml
          git add index.html tools/tmp_restlye_stolf_axis_tree.py .github/workflows/csi-restyle-axis-tree-slide35.yml
          git commit -m "Restyle STOLF axis tree with CSI study palette"
          git push origin main
