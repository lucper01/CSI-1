name: CSI restyle STOLF axis tree
on:
  push:
    paths:
      - .github/workflows/csi-restyle-axis-tree-slide35.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record save hash
        run: |
          echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Restyle axis tree
        run: |
          echo '--study:#2f6f9f}.stolf-flow .soft{--study:#7652a8}.stolf-flow .twixolf{--study:#c36c32}.stolf-flow .solar{--study:#d09422}.stolf-flow .vibex{--study:#2f7d5a}.stolf-flow .vibolf{--study:#b44e6c}.stolf-flow .braud{--study:#4f7187}.stolf-flow .braudolf{--study:#875a7c}
@media(max-width:900px){.stolf-flow{width:100%}.stolf-flow .axes{gap:24px}.stolf-flow .axis-head h3{font-size:.92rem}.stolf-flow .chain{width:90%}.stolf-flow .study-node{font-size:.88rem;min-height:44px}}
</style>
<div class="stolf-flow">
  <div class="root-wrap"><div class="root">STOLF</div></div>
  <div class="axes">
    <section class="axis">
      <div class="axis-head"><span class="axis-tag">Axe 1</span><h3>Relations spatio-temporelles entre olfaction, vision et audition</h3></div>
      <div class="chain">
        <div class="study-node twixav faded">TWIXAV</div>
        <div class="study-node soft faded">SOFT</div>
        <div class="study-node twixolf faded">TWIXOLF</div>
        <div class="study-node solar focus">SOLAR</div>
      </div>
    </section>
    <section class="axis">
      <div class="axis-head"><span class="axis-tag">Axe 2</span><h3>Influence des odeurs sur la perception spatio-temporelle</h3></div>
      <div class="chain">
        <div class="study-node vibex faded">VIBEX</div>
        <div class="study-node vibolf faded">VIBOLF</div>
        <div class="study-node braud focus">BRAUD</div>
        <div class="study-node braudolf focus">BRAUDOLF</div>
      </div>
    </section>
  </div>
</div>'''' | base64 -d > /tmp/restyle.py
          python /tmp/restyle.py
      - name: Verify save untouched
        run: |
          test "$SAVE_SHA" = "$(git hash-object index_save.html)"
      - name: Commit and remove helper
        run: |
          rm .github/workflows/csi-restyle-axis-tree-slide35.yml
          git add index.html .github/workflows/csi-restyle-axis-tree-slide35.yml
          git commit -m "Restyle STOLF axis tree with CSI study palette"
          git push origin main
