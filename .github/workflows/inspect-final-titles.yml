name: Inspect final CSI slide titles
on:
  push:
    paths:
      - '.github/workflows/inspect-final-titles.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect final saved deck
        run: |
          python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
          cat > /tmp/inspect.js <<'EOF'
          const { chromium }=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto('http://127.0.0.1:8000/index_save.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(3200);const h=await p.$('#presentation');const f=await h.contentFrame();const x=await f.evaluate(()=>window.CSI11?.slides?.map((s,i)=>({i,title:s.title,kicker:s.kicker,section:s.section,lead:s.lead?.slice(0,120),text:(s.content||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,220)}))||[]);console.log('FINAL_TITLES',JSON.stringify(x,null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/inspect.js
      - name: Remove inspector
        if: always()
        run: |
          rm -f .github/workflows/inspect-final-titles.yml package.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Remove final title inspector"; git push; fi