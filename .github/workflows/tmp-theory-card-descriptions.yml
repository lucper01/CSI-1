name: CSI theory card descriptions to notes
on:
  push:
    paths:
      - '.github/workflows/tmp-theory-card-descriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current CSI state first
        run: |
          cp index.html index_save.html
          SAVED_SHA=$(git hash-object index_save.html)
          echo "SAVED_SHA=$SAVED_SHA" >> "$GITHUB_ENV"
          git add index_save.html
          git commit -m "Save CSI before theoretical card cleanup"
          git push
      - name: Move theoretical card descriptions to speaker notes
        run: python tools/tmp_theory_card_descriptions.py
      - name: Validate presentation JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          target=next((s for s in scripts if 'const slides = [' in s), None)
          if target is None:
              raise SystemExit('Slides script not found')
          Path('/tmp/csi-slides-script.js').write_text(target, encoding='utf-8')
          PY
          node --check /tmp/csi-slides-script.js
      - name: Verify save remains frozen
        run: |
          test "$(git hash-object index_save.html)" = "$SAVED_SHA"
          grep -q "CSI_THEORY_CARD_DESCRIPTIONS_TO_NOTES_V1" index.html
      - name: Commit working presentation
        run: |
          git add index.html
          git commit -m "Move theory card descriptions to speaker notes"
          git push
      - name: Remove temporary helpers
        run: |
          git rm tools/tmp_theory_card_descriptions.py .github/workflows/tmp-theory-card-descriptions.yml
          git commit -m "Remove temporary theoretical card helpers"
          git push
