name: Refactor slides 16 and 35 after save
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          # Slide 16: force TWIXAV card to use the study's own blue accent instead of portfolio green.
          s16 = slides[15]
          def fix_twixav(html):
              if not isinstance(html, str) or 'TWIXAV' not in html:
                  return html
              # Add a study-specific border/accent directly on the TWIXAV card only.
              import re
              pattern = r'(<div class="card(?: [^"]*)?"[^>]*>\s*(?:<[^>]+>)*[^<]*TWIXAV)'
              # More robust targeted replacement around first card containing TWIXAV.
              cards = list(re.finditer(r'<div class="card([^"]*)"([^>]*)>(.*?)</div>', html, flags=re.S))
              for m in cards:
                  if 'TWIXAV' in m.group(3):
                      full = m.group(0)
                      open_tag_end = full.find('>')
                      open_tag = full[:open_tag_end]
                      rest = full[open_tag_end:]
                      if 'style=' in open_tag:
                          open_tag = re.sub(r'style="([^"]*)"', lambda mm: 'style="'+mm.group(1).rstrip(';')+';border-color:#0072B2;box-shadow:inset 4px 0 0 #0072B2"', open_tag, count=1)
                      else:
                          open_tag += ' style="border-color:#0072B2;box-shadow:inset 4px 0 0 #0072B2"'
                      return html[:m.start()] + open_tag + rest + html[m.end():]
              return html
          for lang in ('_fr','_en'):
              if isinstance(s16.get(lang), dict):
                  s16[lang]['content'] = fix_twixav(s16[lang].get('content',''))
          s16['content'] = fix_twixav(s16.get('content',''))

          # Delete current slide 34.
          del slides[33]

          # The former slide 35 is now slide 34. Make it visually lighter, remove bottom dark banner,
          # and express the 2-foundations -> 3-Year-2-studies transition with a single compact layout.
          s = slides[33]
          fr = {
            'section':'Transition vers la deuxième année',
            'kicker':'PARTIE 3 - BILAN',
            'title':'Deux paradigmes stabilisés ouvrent la deuxième année',
            'lead':'TWIXAV et VIBEX constituent désormais deux socles expérimentaux suffisamment fixés pour engager les trois études prioritaires de l’année suivante.',
            'content':'''<div class="grid two" style="gap:22px;align-items:stretch">
<div class="card" style="border-color:#0072B2;box-shadow:inset 4px 0 0 #0072B2"><div class="mono">SOCLE TEMPOREL</div><h3>TWIXAV</h3><p>Paradigme, protocole, mesures et analyses sont stabilisés. Il fournit la référence temporelle nécessaire pour aller vers une caractérisation plus directe avec <strong>SOFT</strong> puis vers la transposition olfactive avec <strong>TWIXOLF</strong>.</p></div>
<div class="card"><div class="mono">SOCLE SPATIAL</div><h3>VIBEX</h3><p>Le paradigme de Boundary Extension, son protocole et ses analyses sont fixés. Il fournit la référence spatiale nécessaire pour tester l’influence olfactive avec <strong>OASIS</strong>.</p></div>
</div>
<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-top:24px">
<div style="text-align:center"><div class="mono">ANNÉE 1</div><h3 style="margin:6px 0 0">2 paradigmes opérationnels</h3></div>
<div style="font-size:34px;font-weight:800;opacity:.65">→</div>
<div style="text-align:center"><div class="mono">ANNÉE 2</div><h3 style="margin:6px 0 0">SOFT - OASIS - TWIXOLF</h3></div>
</div>''',
            'notes':'Insister sur la logique de transition : deux paradigmes désormais bien fixés en année 1 permettent d’ouvrir directement les trois études prioritaires de l’année 2.'
          }
          en = {
            'section':'Transition to Year 2',
            'kicker':'PART 3 - SUMMARY',
            'title':'Two stabilized paradigms open the way to Year 2',
            'lead':'TWIXAV and VIBEX now provide two sufficiently stabilized experimental foundations to launch the three priority studies of the following year.',
            'content':'''<div class="grid two" style="gap:22px;align-items:stretch">
<div class="card" style="border-color:#0072B2;box-shadow:inset 4px 0 0 #0072B2"><div class="mono">TEMPORAL FOUNDATION</div><h3>TWIXAV</h3><p>The paradigm, protocol, measures and analyses are stabilized. It provides the temporal reference needed for a more direct characterization with <strong>SOFT</strong>, then for the olfactory transposition with <strong>TWIXOLF</strong>.</p></div>
<div class="card"><div class="mono">SPATIAL FOUNDATION</div><h3>VIBEX</h3><p>The Boundary Extension paradigm, protocol and analyses are fixed. It provides the spatial reference needed to test olfactory influence with <strong>OASIS</strong>.</p></div>
</div>
<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-top:24px">
<div style="text-align:center"><div class="mono">YEAR 1</div><h3 style="margin:6px 0 0">2 operational paradigms</h3></div>
<div style="font-size:34px;font-weight:800;opacity:.65">→</div>
<div style="text-align:center"><div class="mono">YEAR 2</div><h3 style="margin:6px 0 0">SOFT - OASIS - TWIXOLF</h3></div>
</div>''',
            'notes':'Emphasize the transition logic: two well-established Year 1 paradigms directly support the three priority Year 2 studies.'
          }
          s.update(fr)
          s['_fr'] = fr.copy()
          s['_en'] = en

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          p.write_text(text[:start] + new_json + text[end:], encoding='utf-8')
          PY
      - name: Validate save remains untouched
        run: |
          test -f index_save.html
          git diff --exit-code -- index_save.html
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/refactor-slides-16-34-35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refactor-slides-16-34-35.yml
          git commit -m "Refine Year 1 to Year 2 transition and TWIXAV accent"
          git push
