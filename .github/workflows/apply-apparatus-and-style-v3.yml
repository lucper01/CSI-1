name: Apply apparatus and style v3
on:
  push:
    paths:
      - '.github/workflows/apply-apparatus-and-style-v3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html, hashlib

          path=Path('index.html')
          backup=Path('index_save.html')
          backup_hash=hashlib.sha256(backup.read_bytes()).hexdigest()
          text=path.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end

          # Slide 16 - TWIXAV: blue title/liseré only. Subtitle stays black, card background stays neutral.
          def clean_twixav(c):
              c=c.replace('background:linear-gradient(180deg,color-mix(in srgb,#0072B2 8%, var(--white)), var(--white));','')
              c=c.replace('background:linear-gradient(180deg,color-mix(in srgb,#0072B2 8%,var(--white)),var(--white));','')
              c=c.replace('<div class="mono" style="color:#0072B2">Référence temporelle</div>','<div class="mono">Référence temporelle</div>')
              c=c.replace('<div class="mono" style="color:#0072B2">Temporal reference</div>','<div class="mono">Temporal reference</div>')
              return c
          s16=slides[15]
          for h in [s16,s16.get('_fr') or {},s16.get('_en') or {}]:
              if h.get('content'): h['content']=clean_twixav(h['content'])

          # Difficulty slides - remove custom uppercase lock labels and tinted solution blocks.
          targets={'TWIXAV','VIBEX','SOFT','OASIS','TWIXOLF'}
          article_re=re.compile(
              r'<article class="card"[^>]*>\s*<div class="mono"[^>]*>.*?</div>\s*<h3>(.*?)</h3>\s*<p><strong>.*?</strong>\s*(.*?)</p>\s*<div[^>]*>\s*<strong[^>]*>.*?</strong><br>(.*?)</div>\s*</article>',
              re.I|re.S)
          callout_re=re.compile(r'<div class="callout"[^>]*><strong>(.*?)</strong>\s*(.*?)</div>\s*$',re.I|re.S)

          def sentence_case(s):
              s=re.sub(r'<[^>]+>','',s).strip()
              s=s.lower().capitalize()
              for a,b in [('Soa','SOA'),('Eeg','EEG'),('Biopac','BIOPAC'),('Psychopy','PsychoPy'),('Twixav','TWIXAV'),('Twixolf','TWIXOLF'),('Vibex','VIBEX'),('Oasis','OASIS'),('Soft','SOFT')]:
                  s=s.replace(a,b)
              return s

          diff_updated=[]
          for i,s in enumerate(slides):
              title_blob=' '.join([s.get('title',''),(s.get('_fr') or {}).get('title',''),(s.get('_en') or {}).get('title','')]).lower()
              if s.get('study') not in targets or 'difficult' not in title_blob:
                  continue
              for holder,english in [(s,False),(s.get('_fr') or {},False),(s.get('_en') or {},True)]:
                  c=holder.get('content')
                  if not c: continue
                  arts=article_re.findall(c)
                  if len(arts)!=3:
                      raise RuntimeError(f"Could not parse three difficulty cards on {s.get('study')} ({len(arts)} found)")
                  cm=callout_re.search(c)
                  if not cm:
                      raise RuntimeError(f"Could not parse difficulty callout on {s.get('study')}")
                  cards=[]
                  for n,(head,diff,sol) in enumerate(arts):
                      cls='card dark' if n==2 else 'card'
                      sol_label='Solution:' if english else 'Solution :'
                      cards.append(f'<div class="{cls}"><h3>{sentence_case(head)}</h3><p>{diff.strip()}</p><p><strong>{sol_label}</strong> {sol.strip()}</p></div>')
                  holder['content']='<div class="grid three">'+''.join(cards)+f'</div><div class="callout" style="margin-top:16px"><strong>{cm.group(1).strip()}</strong> {cm.group(2).strip()}</div>'
              diff_updated.append((i+1,s.get('study')))
          if len(diff_updated)!=5:
              raise RuntimeError(f'Expected five difficulty slides, got {diff_updated}')
          print('Difficulty slides restyled:',diff_updated)

          # All Method slides - Material/Matériel becomes clickable Appareillage/Equipment.
          card_re=re.compile(
              r'<(?P<tag>div|a|button)(?P<attrs>[^>]*class="(?P<cls>[^"]*\bfloat-card\b[^"]*)"[^>]*)>\s*<b>(?P<label>[^<]+)</b>\s*<span>(?P<items>.*?)</span>\s*</(?P=tag)>',
              re.I|re.S)
          allowed={'matériel','materiel','material','equipment','appareillage'}
          methods=[]

          def plain(s): return re.sub(r'<[^>]+>','',s).strip()
          for i,s in enumerate(slides):
              titles=' '.join([s.get('title',''),(s.get('_fr') or {}).get('title',''),(s.get('_en') or {}).get('title','')]).lower()
              if 'méthode' not in titles and 'method' not in titles:
                  continue
              study=s.get('study') or (s.get('title','').split(' - ')[0] if s.get('title') else f'Étude {i+1}')
              changed_this=0
              for holder,lang in [(s,'fr'),(s.get('_fr') or {},'fr'),(s.get('_en') or {},'en')]:
                  c=holder.get('content')
                  if not c: continue
                  counter=[0]
                  def repl(m):
                      label=plain(m.group('label')).lower()
                      if label not in allowed: return m.group(0)
                      counter[0]+=1
                      items=plain(m.group('items'))
                      cls=' '.join(x for x in m.group('cls').split() if x not in {'poster','m1'})
                      btn_label='Appareillage' if lang=='fr' else 'Equipment'
                      return f'<button class="{html.escape(cls,quote=True)} apparatus-open" type="button" data-apparatus-study="{html.escape(study,quote=True)}" data-apparatus-items="{html.escape(items,quote=True)}"><b>{btn_label}</b><span>{items}</span></button>'
                  holder['content']=card_re.sub(repl,c)
                  changed_this+=counter[0]
              if changed_this:
                  methods.append((i+1,study,changed_this))
          if len(methods)<5:
              raise RuntimeError(f'Expected at least five Method slides with apparatus cards, got {methods}')
          print('Method slides updated:',methods)

          # Re-serialize slides.
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+new_json+text[end:]

          css='''\n/* apparatus-popup-v3 */\n.apparatus-open{font:inherit;text-align:left;appearance:none;cursor:pointer;color:var(--text)}.apparatus-open:hover{transform:translateY(-2px)}.apparatus-modal[hidden]{display:none!important}.apparatus-modal{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px}.apparatus-backdrop{position:absolute;inset:0;background:rgba(8,20,16,.64);backdrop-filter:blur(7px)}.apparatus-panel{--apparatus:var(--accent);position:relative;width:min(1060px,94vw);max-height:88vh;overflow:auto;border:1px solid color-mix(in srgb,var(--apparatus) 34%,var(--line));border-radius:28px;background:var(--white);color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.28);padding:28px}.apparatus-panel:before{content:"";display:block;width:72px;height:5px;border-radius:999px;background:var(--apparatus);margin-bottom:18px}.apparatus-close{position:absolute;right:18px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--text);font-size:1.4rem;cursor:pointer}.apparatus-panel h2{margin:4px 52px 8px 0}.apparatus-lead{margin:0 0 20px;color:var(--muted)}.apparatus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}.apparatus-card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--white);min-height:255px}.apparatus-card-media{height:150px;display:grid;place-items:center;background:#fff;border-bottom:1px solid var(--line);padding:12px}.apparatus-card-media img{width:100%;height:100%;object-fit:contain}.apparatus-card-copy{padding:15px}.apparatus-card-copy h3{margin:0 0 7px;font-size:1.05rem;color:var(--apparatus)}.apparatus-card-copy p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}@media(max-width:700px){.apparatus-modal{padding:10px}.apparatus-panel{padding:20px;border-radius:22px}.apparatus-grid{grid-template-columns:1fr 1fr}.apparatus-card-media{height:110px}}\n'''
          if '/* apparatus-popup-v3 */' not in text:
              text=text.replace('</style>',css+'</style>',1)

          modal='''\n<div class="apparatus-modal" id="apparatusModal" hidden aria-hidden="true"><div class="apparatus-backdrop" data-apparatus-close></div><section class="apparatus-panel" id="apparatusPanel" role="dialog" aria-modal="true" aria-labelledby="apparatusTitle" tabindex="-1"><button class="apparatus-close" type="button" data-apparatus-close aria-label="Fermer">×</button><span class="eyebrow" id="apparatusEyebrow">Appareillage</span><h2 id="apparatusTitle">Appareillage</h2><p class="apparatus-lead" id="apparatusLead"></p><div class="apparatus-grid" id="apparatusGrid"></div></section></div>\n'''
          if 'id="apparatusModal"' not in text:
              text=text.replace('</body>',modal+'</body>',1)

          js=r'''\n<script id="apparatusPopupScript">\n(()=>{\n const modal=document.getElementById('apparatusModal'),panel=document.getElementById('apparatusPanel'),grid=document.getElementById('apparatusGrid'),title=document.getElementById('apparatusTitle'),lead=document.getElementById('apparatusLead'),eyebrow=document.getElementById('apparatusEyebrow');if(!modal)return;\n const studyColors={TWIXAV:'#0072B2',VIBEX:'#2f7d5a',SOFT:'#7652a8',OASIS:'#b44e6c',TWIXOLF:'#c36c32',FLUXOLF:'#a34d5d'};\n const equipment=[\n {keys:['psychopy'],name:'PsychoPy',img:'https://www.psychopy.org/_static/psychopyLogoType.png',fr:'Pilotage du paradigme, présentation des stimuli, réponses et horodatage des événements.',en:'Paradigm control, stimulus presentation, responses and event timestamps.'},\n {keys:['sniff-0','sniffo','sniff0','sniff-o'],name:'Sniff-0',img:'https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto1.jpg',fr:'Olfactomètre multicanal utilisé pour délivrer les odeurs et recevoir les commandes de stimulation.',en:'Multichannel olfactometer used to deliver odors and receive stimulation commands.'},\n {keys:['spir-0','spir0','spiro','spir-o'],name:'Spir-0',img:'https://www.cynexo.com/wp-content/uploads/2020/09/spir-O-foto2.jpg',fr:'Suivi du cycle respiratoire et détection du début de l’inspiration pour synchroniser la stimulation olfactive.',en:'Respiratory-cycle monitoring and inhalation-onset detection for olfactory synchronization.'},\n {keys:['biopac mp160','mp160','biopac'],name:'BIOPAC MP160',img:'https://upwards.com.tw/wp-content/uploads/2018/05/A01-Biopac-MP160-cover.jpg',fr:'Acquisition physiologique et gestion des marqueurs de synchronisation.',en:'Physiological acquisition and synchronization-marker management.'},\n {keys:['eeg biosemi','biosemi','eeg'],name:'EEG BioSemi',img:'https://www.biosemi.com/pics/module_active2_medium1.jpg',fr:'Système EEG utilisé pour l’acquisition électrophysiologique et les triggers expérimentaux.',en:'EEG system used for electrophysiological acquisition and experimental triggers.'},\n {keys:['écran','ecran','screen','display'],name:'Écran de stimulation',img:'',fr:'Présentation visuelle contrôlée avec un timing lié au taux de rafraîchissement mesuré.',en:'Controlled visual presentation with timing tied to the measured refresh rate.'},\n {keys:['audio','casque','sound','haut-parleur'],name:'Système audio',img:'',fr:'Présentation contrôlée des événements auditifs du paradigme.',en:'Controlled presentation of auditory events in the paradigm.'}\n ];\n const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));\n function fallback(label){const t=esc(label).slice(0,25);return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340"><rect width="600" height="340" rx="28" fill="#f5f2ea"/><rect x="140" y="55" width="320" height="190" rx="24" fill="#fff" stroke="#6c7671" stroke-width="7"/><circle cx="225" cy="150" r="34" fill="none" stroke="#6c7671" stroke-width="7"/><path d="M285 125h110M285 155h110M285 185h72" stroke="#6c7671" stroke-width="9" stroke-linecap="round"/><text x="300" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#24302b">${t}</text></svg>`)}\n function info(raw){const k=raw.toLowerCase().trim();return equipment.find(e=>e.keys.some(x=>k.includes(x)))||{name:raw,img:'',fr:'Élément du dispositif expérimental utilisé dans cette étude.',en:'Component of the experimental setup used in this study.'}}\n function openApp(btn){const en=(btn.querySelector('b')?.textContent||'').trim().toLowerCase()==='equipment',study=btn.dataset.apparatusStudy||'',items=(btn.dataset.apparatusItems||'').split(/[·;]+/).map(x=>x.trim()).filter(Boolean);panel.style.setProperty('--apparatus',studyColors[study]||'var(--accent)');eyebrow.textContent=en?'Equipment':'Appareillage';title.textContent=`${study} - ${en?'Equipment':'Appareillage'}`;lead.textContent=en?'Devices and tools used in this experimental setup.':'Appareils et outils utilisés dans ce dispositif expérimental.';grid.innerHTML='';items.forEach(raw=>{const inf=info(raw),card=document.createElement('article'),src=inf.img||fallback(inf.name);card.className='apparatus-card';card.innerHTML=`<div class="apparatus-card-media"><img src="${esc(src)}" alt="${esc(inf.name)}" loading="lazy" referrerpolicy="no-referrer"></div><div class="apparatus-card-copy"><h3>${esc(inf.name)}</h3><p>${esc(en?inf.en:inf.fr)}</p></div>`;const im=card.querySelector('img');im.addEventListener('error',()=>{im.src=fallback(inf.name)},{once:true});grid.appendChild(card)});modal.hidden=false;modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';panel.focus()}\n function closeApp(){modal.hidden=true;modal.setAttribute('aria-hidden','true');document.body.style.overflow=''}\n document.addEventListener('click',e=>{const b=e.target.closest('.apparatus-open');if(b){e.preventDefault();e.stopPropagation();openApp(b);return}if(e.target.closest('[data-apparatus-close]'))closeApp()});document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeApp()}else if(['ArrowLeft','ArrowRight','PageUp','PageDown',' '].includes(e.key)){e.stopImmediatePropagation()}},true);\n})();\n</script>\n'''
          if 'id="apparatusPopupScript"' not in text:
              text=text.replace('</body>',js+'</body>',1)

          path.write_text(text,encoding='utf-8')
          if hashlib.sha256(backup.read_bytes()).hexdigest()!=backup_hash:
              raise RuntimeError('index_save.html changed')

          # Lightweight validation only.
          final=path.read_text(encoding='utf-8')
          assert 'apparatus-popup-v3' in final and 'id="apparatusModal"' in final and 'id="apparatusPopupScript"' in final
          assert final.count('apparatus-open')>=5
          assert 'style="color:#0072B2">Référence temporelle</div>' not in final
          print('Total slides:',len(slides))
          print('Backup SHA256:',backup_hash)
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harmonize difficulty slides and add apparatus popups"
          rm .github/workflows/apply-apparatus-and-style-v3.yml
          git add .github/workflows/apply-apparatus-and-style-v3.yml
          git commit -m "Remove temporary apparatus workflow v3"
          git push
