name: Swap CSI slides 11 and 12
on:
  push:
    paths:
      - '.github/scripts/csi_swap_slides_11_12.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap slides 11 and 12
        run: python .github/scripts/csi_swap_slides_11_12.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit working deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Swap slides 11 and 12"
          git push
