name: Inspect final CSI titles v2
on:
  push:
    paths:
      - '.github/workflows/inspect-final-titles-v2.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect final saved deck
        run: |
          python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
          node tools_flat/inspect_titles.js
      - name: Cleanup inspector
        if: always()
        run: |
          rm -f .github/workflows/inspect-final-titles-v2.yml tools_flat/inspect_titles.js package.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Remove title inspector v2"; git push; fi