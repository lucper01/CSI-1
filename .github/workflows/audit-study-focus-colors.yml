name: Audit study focus colors
on:
  push:
    paths:
      - '.github/workflows/audit-study-focus-colors.yml'
      - '.github/scripts/audit_focus.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update and audit focus colors
        run: python3 .github/scripts/audit_focus.py
      - name: Commit working index only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/audit-study-focus-colors.yml .github/scripts/audit_focus.py
          git add index.html
          git diff --cached --name-only
          git commit -m "Preserve study colors throughout progressive focus"
          git push