name: Inspect VIBEX result slides
on:
  push:
    paths:
      - '.github/workflows/inspect-vibex-results.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          t=Path('index.html').read_text(encoding='utf-8'); m='const slides = '; st=t.index(m)+len(m); s,_=json.JSONDecoder().raw_decode(t[st:])
          for n in [20,21,22,23,24,27,28,29,30,31]:
            x=s[n-1]; print('\n###',n,x.get('title')); print(x.get('content',''))
          PY
      - run: |
          rm .github/workflows/inspect-vibex-results.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/inspect-vibex-results.yml
          git commit -m "Remove temporary VIBEX inspection" || true
          git push
