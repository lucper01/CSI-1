name: CSI slide40 thesis row
on:
  push:
    paths:
      - '.github/workflows/csi-slide40-thesis-row.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Update slide 40 thesis row
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = text.index(marker) + len(marker)
          slides, consumed = json.JSONDecoder().raw_decode(text[pos:])

          matches = [s for s in slides if not s.get('appendix', False) and s.get('title') == 'Planification - les trois années de thèse']
          if len(matches) != 1:
              raise RuntimeError(f'Expected one planning slide, found {len(matches)}')
          target = matches[0]

          def replace_lane(content, start_label, next_label, replacement):
              start = f'<div class="lane"><div class="lab">{start_label}</div>'
              end = f'<div class="lane"><div class="lab">{next_label}</div>'
              i = content.index(start)
              j = content.index(end, i)
              return content[:i] + replacement + content[j:]

          thesis_fr = '''<div class="lane"><div class="lab">Thèse</div><div class="track"><div class="evt dark" style="grid-column:1/span 4;grid-row:1">État de l’art</div><div class="evt dark" style="grid-column:3/span 2;grid-row:2">CER - DPD</div><div class="evt dark" style="grid-column:5;grid-row:2"><span class="ev-name">Soumission</span><span class="ev-sub">CER - DPD</span></div><div class="evt dark" style="grid-column:9/span 4;grid-row:2">Rédaction</div><div class="evt dark" style="grid-column:12;grid-row:1">Soumission</div><div class="evt dark" style="grid-column:13;grid-row:3">Soutenance</div></div></div>'''
          thesis_en = '''<div class="lane"><div class="lab">Thesis</div><div class="track"><div class="evt dark" style="grid-column:1/span 4;grid-row:1">Literature review</div><div class="evt dark" style="grid-column:3/span 2;grid-row:2">CER - DPD</div><div class="evt dark" style="grid-column:5;grid-row:2"><span class="ev-name">Submission</span><span class="ev-sub">CER - DPD</span></div><div class="evt dark" style="grid-column:9/span 4;grid-row:2">Writing</div><div class="evt dark" style="grid-column:12;grid-row:1">Submission</div><div class="evt dark" style="grid-column:13;grid-row:3">Defense</div></div></div>'''

          fr = replace_lane(target['_fr']['content'], 'Thèse', 'Communications', thesis_fr)
          en = replace_lane(target['_en']['content'], 'Thesis', 'Communications', thesis_en)
          target['_fr']['content'] = fr
          target['content'] = fr
          target['_en']['content'] = en

          target['_fr']['notes'] = target['_fr'].get('notes','') + ' Thèse : CER - DPD T3-T4, soumission CER - DPD T5, rédaction T9-T12, soumission T12, soutenance T13. Le bloc collectes - analyses - intégration est retiré.'
          target['notes'] = target['_fr']['notes']
          target['_en']['notes'] = target['_en'].get('notes','') + ' Thesis: CER - DPD Q3-Q4, CER - DPD submission Q5, writing Q9-Q12, submission Q12, defense Q13. The collections - analyses - integration block is removed.'

          new_array = json.dumps(slides, ensure_ascii=False, indent=2)
          p.write_text(text[:pos] + new_array + text[pos+consumed:], encoding='utf-8')
          PY
      - name: Validate requested changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s = Path('index.html').read_text(encoding='utf-8')
          pos = s.index('const slides = ') + len('const slides = ')
          slides, _ = json.JSONDecoder().raw_decode(s[pos:])
          target = [x for x in slides if not x.get('appendix',False) and x.get('title') == 'Planification - les trois années de thèse'][0]
          fr = target['_fr']['content']
          required = [
              'grid-column:3/span 2;grid-row:2">CER - DPD',
              'grid-column:5;grid-row:2"><span class="ev-name">Soumission</span><span class="ev-sub">CER - DPD</span>',
              'grid-column:9/span 4;grid-row:2">Rédaction</div>',
              'grid-column:12;grid-row:1">Soumission</div>',
              'grid-column:13;grid-row:3">Soutenance</div>'
          ]
          for x in required:
              if x not in fr:
                  raise RuntimeError(f'Missing expected content: {x}')
          forbidden = ['Collectes - analyses', 'intégration</div>', 'Rédaction<br>de thèse', 'Soumission<br>thèse']
          for x in forbidden:
              if x in fr:
                  raise RuntimeError(f'Old thesis content remains: {x}')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          js = [x for x in scripts if 'const slides = [' in x]
          if len(js) != 1:
              raise RuntimeError('Main slides script not found uniquely')
          Path('/tmp/slides.js').write_text(js[0], encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit update and remove helper
        run: |
          git rm .github/workflows/csi-slide40-thesis-row.yml
          git add index.html
          git commit -m "Refine slide 40 thesis timeline"
          git push
