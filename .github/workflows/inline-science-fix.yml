name: Inline CSI scientific additions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inline-science-fix.yml']
permissions:
  contents: write
jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="const schedule=()=>[1540,1570,1590].forEach(ms=>setTimeout(applyScience,ms));"
          new="""const schedule=()=>[1900,2150,2350].forEach(ms=>setTimeout(()=>{\n    try{const w=frame.contentWindow;if(w)w.__CSI_SCIENCE_20260905__=false;}catch(e){}\n    applyScience();\n  },ms));"""
          if old not in s: raise SystemExit('science schedule marker not found')
          s=s.replace(old,new,1)

          old_make="""const make=(section,kicker,title,lead,content,notes='')=>{\n        const s={section,kicker,title,lead,content,notes};\n        s._fr={section,kicker,title,lead,content,notes};\n        return s;\n      };"""
          new_make="""const make=(section,kicker,title,lead,content,notes='')=>{\n        const m=String(title||'').match(/^(TWIXAV|VIBEX|SOFT|OASIS|TWIXOLF)\\b/i);\n        const study=m?m[1].toUpperCase():undefined;\n        const s={section,kicker,title,lead,content,notes,...(study?{study}:{})};\n        s._fr={section,kicker,title,lead,content,notes};\n        return s;\n      };"""
          if old_make not in s: raise SystemExit('make marker not found')
          s=s.replace(old_make,new_make,1)

          old_render="""// Render once, before the existing poster/project-sheet integration runs.\n      if(typeof C.render==='function')C.render(); else if(typeof w.render==='function')w.render();"""
          new_render="""// Final deterministic render of the scientific deck.\n      if(typeof w.renderSlides==='function')w.renderSlides();\n      else if(typeof C.render==='function')C.render();\n      else if(typeof w.render==='function')w.render();\n\n      // Reapply the validated per-study identity after the final render.\n      const SCI_COLORS={TWIXAV:'#2f6f9f',SOFT:'#7652a8',TWIXOLF:'#c36c32',VIBEX:'#2f7d5a',OASIS:'#b44e6c'};\n      slides.forEach((slide,i)=>{\n        const key=slide.study||((String(slide.title||'').match(/^(TWIXAV|VIBEX|SOFT|OASIS|TWIXOLF)\\b/i)||[])[1]||'').toUpperCase();\n        if(key&&!slide.study)slide.study=key;\n        const el=d.getElementById(`slide-${i+1}`);\n        const color=SCI_COLORS[key];\n        if(el&&color){el.style.setProperty('--study',color);el.classList.add('v16-study-slide');}\n      });"""
          if old_render not in s: raise SystemExit('render marker not found')
          s=s.replace(old_render,new_render,1)

          old_boot="setTimeout(()=>boot.classList.add('hidden'),900);"
          if old_boot in s:
              s=s.replace(old_boot,"setTimeout(()=>boot.classList.add('hidden'),2500);",1)

          # Make the visible loader unmistakably identify this build.
          s=s.replace('CSI-1 - version scientifique','CSI-1 - version scientifique intégrée',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/inline-science-fix.yml
      - name: Commit final single-file version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/inline-science-fix.yml
          git commit -m "Stabilize scientific additions inside index.html"
          git push
