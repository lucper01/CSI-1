name: Update year 1 communication card
on:
  push:
    paths:
      - '.github/scripts/csi_update_year1_comm_card.py'
      - '.github/workflows/csi-update-year1-comm-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update communication card
        run: python .github/scripts/csi_update_year1_comm_card.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine year 1 communication card"
          git push
