name: Move timeline under header v2
on:
  push:
    paths:
      - '.github/workflows/csi-move-timeline-under-header-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timeline position
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('index.html')
          save = Path('index_save.html')
          save_hash = hashlib.sha256(save.read_bytes()).hexdigest()
          text = p.read_text(encoding='utf-8')

          assert 'Repère de partie' in text
          assert 'CSI_PART_TIMELINE_HEADER' not in text

          lines = [
              '',
              '    /* CSI_PART_TIMELINE_HEADER */',
              '    .slide [aria-label="Repère de partie"] {',
              '      position: fixed !important;',
              '      z-index: 1175 !important;',
              '      top: 72px !important;',
              '      left: 50% !important;',
              '      transform: translateX(-50%) !important;',
              '      width: min(1180px, calc(100vw - 36px)) !important;',
              '      max-width: min(1180px, calc(100vw - 36px)) !important;',
              '      justify-content: center !important;',
              '      margin: 0 !important;',
              '      padding: 3px 10px !important;',
              '      pointer-events: none !important;',
              '    }',
              '    body[data-view="scroll"] .slide [aria-label="Repère de partie"] {',
              '      display: none !important;',
              '    }',
              '    @media (max-width: 760px) {',
              '      .slide [aria-label="Repère de partie"] {',
              '        top: 62px !important;',
              '        width: calc(100vw - 22px) !important;',
              '        max-width: calc(100vw - 22px) !important;',
              '        gap: 4px !important;',
              '        font-size: .52rem !important;',
              '      }',
              '    }',
              '    @media print {',
              '      .slide [aria-label="Repère de partie"] {',
              '        display: none !important;',
              '      }',
              '    }',
              ''
          ]
          css = '\n'.join(lines)

          pos = text.find('</style>')
          assert pos != -1
          text = text[:pos] + css + text[pos:]
          p.write_text(text, encoding='utf-8')

          assert hashlib.sha256(save.read_bytes()).hexdigest() == save_hash
          print('Timeline positioned under header')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', t, flags=re.S|re.I)
          assert scripts
          Path('/tmp/csi.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/csi.js
      - name: Verify frozen backup
        run: |
          test "$(git hash-object index_save.html)" = "0cf6cb4e08ec3da2bb94c7de2c62ddd154d4c365"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move timeline under header"
          git push
