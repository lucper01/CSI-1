name: CSI wording and remove Year 1 summary
on:
  push:
    paths:
      - '.github/scripts/csi_slide9_12_remove_year1.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSI deck
        run: python .github/scripts/csi_slide9_12_remove_year1.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update slides 9 and 12 and remove Year 1 summary"
          git push
