name: Update slide 35 next studies
on:
  push:
    branches: [main]
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update slide 35 point 4
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          assert len(slides) >= 35, f'Expected at least 35 slides, got {len(slides)}'
          s = slides[34]

          replacements = {
              'les études de deuxième année': 'SOFT, OASIS et TWIXOLF',
              'Les études de deuxième année': 'SOFT, OASIS et TWIXOLF',
              'études de deuxième année': 'SOFT, OASIS et TWIXOLF',
              'Études de deuxième année': 'SOFT, OASIS et TWIXOLF',
              'the second-year studies': 'SOFT, OASIS and TWIXOLF',
              'The second-year studies': 'SOFT, OASIS and TWIXOLF',
              'second-year studies': 'SOFT, OASIS and TWIXOLF',
              'Second-year studies': 'SOFT, OASIS and TWIXOLF',
          }

          count = 0
          def rec(x):
              global count
              if isinstance(x, str):
                  y = x
                  for a,b in replacements.items():
                      if a in y:
                          y = y.replace(a,b)
                          count += 1
                  return y
              if isinstance(x, list):
                  return [rec(v) for v in x]
              if isinstance(x, dict):
                  return {k:rec(v) for k,v in x.items()}
              return x

          slides[34] = rec(s)
          assert count > 0, 'No second-year study wording found on slide 35'

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          p.write_text(text[:start] + new_json + text[end:], encoding='utf-8')
          PY

          git diff --exit-code -- index_save.html
      - name: Commit and clean temporary workflow
        run: |
          rm -f .github/workflows/update-slide35-next-studies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/update-slide35-next-studies.yml
          git commit -m "Name SOFT OASIS and TWIXOLF in slide 35"
          git push
