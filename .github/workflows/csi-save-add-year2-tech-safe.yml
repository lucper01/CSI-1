name: CSI save and add year2 technical slide safely
on:
  push:
    paths:
      - '.github/workflows/csi-save-add-year2-tech-safe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save current state and patch deck
        run: python .github/scripts/csi_save_add_year2_tech_safe.py
      - name: Commit deck changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_save.html
          if git diff --cached --quiet; then
            echo "No deck changes"
          else
            git commit -m "Save and add year2 technical slide"
            git push
          fi
