name: CSI save before slide 9 and timeline
on:
  push:
    paths:
      - '.github/workflows/csi-save-before-slide9-timeline.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current working presentation
        run: |
          cp index.html index_save.html
          git add index_save.html
          if git diff --cached --quiet; then
            echo "Save already matches working presentation."
          else
            git commit -m "Save CSI before slide 9 and timeline update"
            git push
          fi
      - name: Remove temporary save workflow
        run: |
          git pull --rebase
          git rm .github/workflows/csi-save-before-slide9-timeline.yml
          git commit -m "Remove temporary slide 9 save workflow"
          git push
