name: Inspect CSI cover
on:
  push:
    paths:
      - '.github/workflows/inspect-cover.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print first slide
        run: |
          python3 - <<'PY'
          import re,json,pathlib
          h=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          a=json.loads(m.group(1))
          s=a[0]
          print('TITLE',s.get('title'))
          print('CONTENT_START')
          print(s.get('content',''))
          print('CONTENT_END')
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/inspect-cover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Remove cover inspector'; git push; fi