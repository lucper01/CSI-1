name: Build standalone CSI

on:
  push:
    paths:
      - '.github/workflows/build-standalone.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate standalone index
        run: python build_standalone.py

      - name: Commit standalone presentation
        run: |
          rm -f build_standalone.py
          rm -f .github/workflows/build-standalone.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate CSI into one standalone index.html"
          git push origin HEAD:main
