name: CSI slide39 future studies
on:
  push:
    paths:
      - '.github/workflows/csi-slide39-add-future-studies.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save
        run: echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Add future studies to slide 39
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          pos = text.index(marker) + len(marker)
          slides, consumed = json.JSONDecoder().raw_decode(text[pos:])
          main = [s for s in slides if not s.get('appendix', False)]
          assert len(main) >= 39
          target = main[38]
          assert target.get('_fr', {}).get('title') == 'Planification - les trois années de thèse'

          needle = '<div class="evt" style="grid-column:9;grid-row:3">TWIXOLF<br>analyses</div></div></div><div class="lane"><div class="lab">Publications</div>'
          insert = '<div class="evt" style="grid-column:9;grid-row:3">TWIXOLF<br>analyses</div><div class="evt muted" style="grid-column:8/span 3;grid-row:1">SOLAR, BRAUD,<br>BRAUDOLF ?</div></div></div><div class="lane"><div class="lab">Publications</div>'

          for key in ('_fr', '_en'):
              block = target[key]
              content = block['content']
              assert 'SOLAR, BRAUD,<br>BRAUDOLF ?' not in content
              assert needle in content
              block['content'] = content.replace(needle, insert, 1)

          content = target['content']
          assert 'SOLAR, BRAUD,<br>BRAUDOLF ?' not in content
          assert needle in content
          target['content'] = content.replace(needle, insert, 1)

          fr_note = ' Études exploratoires conditionnelles : SOLAR, BRAUD et BRAUDOLF de T8 à T10.'
          en_note = ' Conditional exploratory studies: SOLAR, BRAUD and BRAUDOLF from Q8 to Q10.'
          target['_fr']['notes'] = target['_fr'].get('notes', '') + fr_note
          target['_en']['notes'] = target['_en'].get('notes', '') + en_note
          target['notes'] = target.get('notes', '') + fr_note

          new_array = json.dumps(slides, ensure_ascii=False, indent=2)
          out = text[:pos] + new_array + text[pos+consumed:]
          p.write_text(out, encoding='utf-8')
          PY
      - name: Validate main slides JavaScript and requested change
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          matches = [s for s in scripts if 'const slides = [' in s]
          assert len(matches) == 1
          Path('/tmp/slides.js').write_text(matches[0], encoding='utf-8')
          assert text.count('SOLAR, BRAUD,<br>BRAUDOLF ?') == 3
          assert 'grid-column:8/span 3;grid-row:1">SOLAR, BRAUD,<br>BRAUDOLF ?' in text
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: test "$SAVE_SHA" = "$(git hash-object index_save.html)"
      - name: Commit update and remove helper
        run: |
          rm .github/workflows/csi-slide39-add-future-studies.yml
          git add index.html .github/workflows/csi-slide39-add-future-studies.yml
          git commit -m "Add tentative future studies to slide 39"
          git push origin main
