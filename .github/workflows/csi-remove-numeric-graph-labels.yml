name: CSI remove numeric graph labels

on:
  push:
    paths:
      - '.github/scripts/csi_remove_numeric_graph_labels.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove numeric labels from result graphs
        run: python .github/scripts/csi_remove_numeric_graph_labels.py

      - name: Verify protected save unchanged
        run: git diff --exit-code -- index_save.html

      - name: Commit graph cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/twixav_empirical_curves.svg assets/results/twixav_tbw_width.svg assets/results/vibex_m1_olivia.svg assets/results/vibex_size_interaction.svg
          git commit -m "Remove numeric labels from TWIXAV and VIBEX graphs"
          git push
