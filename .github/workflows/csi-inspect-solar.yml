name: Inspect SOLAR axis references
on:
  push:
    paths:
      - '.github/workflows/csi-inspect-solar.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SOLAR contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path('index.html').read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          for i, s in enumerate(slides, 1):
              blob = json.dumps(s, ensure_ascii=False)
              if 'SOLAR' not in blob:
                  continue
              print('\n=== SLIDE', i, '| appendix=', s.get('appendix'), '| title=', s.get('title'), '===')
              for key in ('content','lead','notes'):
                  val = s.get(key,'')
                  if 'SOLAR' in val:
                      pos = val.find('SOLAR')
                      print(key, ':', val[max(0,pos-500):pos+800])
              for langkey in ('_fr','_en'):
                  d = s.get(langkey) or {}
                  for key in ('content','lead','notes'):
                      val = d.get(key,'')
                      if 'SOLAR' in val:
                          pos = val.find('SOLAR')
                          print(langkey, key, ':', val[max(0,pos-500):pos+800])
          PY
