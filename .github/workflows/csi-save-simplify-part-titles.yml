name: Save then simplify CSI part titles
on:
  push:
    paths:
      - '.github/workflows/csi-save-simplify-part-titles.yml'
permissions:
  contents: write
jobs:
  save-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save current active deck
        shell: bash
        run: |
          cp index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet || git commit -m "Save current CSI deck"
          git push || true
      - name: Simplify divider titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          path = Path('index.html')
          save = Path('index_save.html')
          save_hash = hashlib.sha256(save.read_bytes()).hexdigest()
          text = path.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          visible = [i for i, s in enumerate(slides) if not s.get('appendix')]
          targets = {
              3:  ('Contexte', 'Context'),
              13: ('Architecture', 'Architecture'),
              16: ('Année 1', 'Year 1'),
              33: ('Année 2', 'Year 2'),
              44: ('Année 3', 'Year 3'),
              52: ('Rétroplanning', 'Timeline'),
          }

          def set_lang(slide, key, new_title):
              d = slide if key is None else slide.get(key)
              if not isinstance(d, dict):
                  return
              content = d.get('content', '')
              assert 'section-divider-inner' in content, f"not a divider: {d.get('title')}"
              d['title'] = new_title
              # Keep existing PARTIE/PART numbering, only simplify the visible h1 title.
              content_new = re.sub(r'(<h1>)(.*?)(</h1>)', rf'\1{new_title}\3', content, count=1)
              assert content_new != content
              d['content'] = content_new

          before_titles = []
          for n, (fr_title, en_title) in targets.items():
              idx = visible[n - 1]
              slide = slides[idx]
              before_titles.append((n, slide.get('title', '')))
              set_lang(slide, None, fr_title)
              set_lang(slide, '_fr', fr_title)
              set_lang(slide, '_en', en_title)

          # Validation on visible slide numbers.
          for n, (fr_title, en_title) in targets.items():
              slide = slides[visible[n - 1]]
              assert slide.get('title') == fr_title, (n, slide.get('title'))
              assert f'<h1>{fr_title}</h1>' in slide.get('content', ''), n
              assert slide.get('_fr', {}).get('title') == fr_title, n
              assert f'<h1>{fr_title}</h1>' in slide.get('_fr', {}).get('content', ''), n
              assert slide.get('_en', {}).get('title') == en_title, n
              assert f'<h1>{en_title}</h1>' in slide.get('_en', {}).get('content', ''), n

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          path.write_text(text[:start] + new_json + text[end:], encoding='utf-8')
          assert hashlib.sha256(save.read_bytes()).hexdigest() == save_hash
          print('Updated divider titles:', before_titles)
          PY
          git diff --exit-code -- index_save.html
      - name: Commit title simplification
        shell: bash
        run: |
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify CSI part divider titles"
          git push
