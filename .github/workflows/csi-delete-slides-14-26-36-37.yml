name: CSI delete selected slides
on:
  push:
    paths:
      - '.github/workflows/csi-delete-slides-14-26-36-37.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record protected save hash
        run: git hash-object index_save.html > /tmp/save_hash_before
      - name: Delete requested slides
        run: python .github/scripts/delete-slides-14-26-36-37.py
      - name: Validate relevant JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          m='const slides = ['
          s=t.find(m)
          if s<0: raise SystemExit('slides marker missing')
          script_start=t.rfind('<script',0,s)
          script_open_end=t.find('>',script_start)+1
          script_end=t.find('</script>',s)
          if min(script_start,script_open_end,script_end)<0: raise SystemExit('script bounds missing')
          Path('/tmp/slides-script.js').write_text(t[script_open_end:script_end],encoding='utf-8')
          PY
          node --check /tmp/slides-script.js
      - name: Verify save untouched
        run: |
          test "$(cat /tmp/save_hash_before)" = "$(git hash-object index_save.html)"
          git diff --exit-code -- index_save.html
      - name: Commit and clean helpers
        run: |
          git add index.html
          git commit -m "Delete slides 14 26 36 and 37"
          git rm .github/scripts/delete-slides-14-26-36-37.py .github/workflows/csi-delete-slides-14-26-36-37.yml
          git commit -m "Remove temporary slide deletion helpers"
          git push
