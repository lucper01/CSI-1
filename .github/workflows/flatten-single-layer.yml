name: Build single-layer CSI
on:
  push:
    paths:
      - '.github/workflows/flatten-single-layer.yml'
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
      - name: Build flat index
        run: node tools_flat/build_flat.js
      - name: Validate desktop and mobile
        run: node tools_flat/validate_flat.js
      - name: Commit only final index
        run: |
          rm -rf tools_flat
          rm -f .github/workflows/flatten-single-layer.yml
          rm -f package.json package-lock.json validate-desktop.png validate-mobile.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace layered CSI runtime with one validated standalone index"
          git push