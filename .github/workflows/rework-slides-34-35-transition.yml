name: Rework slides 34 and 35 transition
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rework slides 34 and 35
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          save_before = Path('index_save.html').read_bytes()
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          s34_fr = {
            "section": "Bilan de première année",
            "kicker": "Deux études désormais stabilisées",
            "title": "TWIXAV et VIBEX : deux socles expérimentaux fixés",
            "lead": "Au terme de la première année, deux études disposent d’un paradigme, d’un protocole et d’une stratégie d’analyse suffisamment stabilisés pour servir de références à la suite du programme.",
            "content": "<div class=\"grid two\"><div class=\"card\"><div class=\"mono\">TEMPS - TWIXAV</div><h3>Un protocole temporel opérationnel</h3><p>Le paradigme de fenêtre d’intégration temporelle audiovisuelle est désormais bien défini : déroulé expérimental, conditions, mesures et analyses sont fixés. Les premiers résultats fournissent une <strong>référence temporelle</strong> pour la suite.</p></div><div class=\"card\"><div class=\"mono\">ESPACE - VIBEX</div><h3>Un protocole spatial opérationnel</h3><p>Le paradigme de Boundary Extension est lui aussi stabilisé : structure des essais, conditions, mesures et analyses sont fixées. Il fournit une <strong>référence spatiale</strong> exploitable pour introduire ensuite l’olfaction.</p></div></div><div class=\"card dark\" style=\"margin-top:18px\"><div class=\"mono\">ACQUIS DE L’ANNÉE 1</div><h3>Deux cadres expérimentaux prêts à être prolongés</h3><p>TWIXAV et VIBEX ne sont plus seulement des pistes exploratoires : ils constituent deux socles méthodologiques complémentaires - <strong>temps</strong> et <strong>espace</strong> - sur lesquels peut s’appuyer la deuxième année.</p></div>",
            "notes": "Insister sur le fait que la première année a permis de fixer deux protocoles robustes et réutilisables. La transition vers la slide suivante doit être naturelle : ces deux socles permettent maintenant d’ouvrir les études de deuxième année."
          }
          s34_en = {
            "section": "Year 1 assessment",
            "kicker": "Two studies now stabilized",
            "title": "TWIXAV and VIBEX: two established experimental foundations",
            "lead": "By the end of Year 1, two studies now rely on sufficiently stabilized paradigms, protocols and analysis strategies to serve as reference points for the next stage of the programme.",
            "content": "<div class=\"grid two\"><div class=\"card\"><div class=\"mono\">TIME - TWIXAV</div><h3>An operational temporal protocol</h3><p>The audiovisual temporal binding window paradigm is now well defined: experimental sequence, conditions, measures and analyses are fixed. The first results provide a <strong>temporal reference</strong> for what comes next.</p></div><div class=\"card\"><div class=\"mono\">SPACE - VIBEX</div><h3>An operational spatial protocol</h3><p>The Boundary Extension paradigm is also stabilized: trial structure, conditions, measures and analyses are fixed. It provides a usable <strong>spatial reference</strong> for subsequently introducing olfaction.</p></div></div><div class=\"card dark\" style=\"margin-top:18px\"><div class=\"mono\">YEAR 1 OUTCOME</div><h3>Two experimental frameworks ready to be extended</h3><p>TWIXAV and VIBEX are no longer exploratory ideas: they now form two complementary methodological foundations - <strong>time</strong> and <strong>space</strong> - on which Year 2 can build.</p></div>",
            "notes": "Emphasize that Year 1 fixed two robust and reusable protocols. Transition naturally to the next slide: these two foundations now make the Year 2 studies possible."
          }

          s35_fr = {
            "section": "Transition vers la deuxième année",
            "kicker": "PARTIE 3 - SYNTHÈSE",
            "title": "Deux socles fixés, trois études pour la deuxième année",
            "lead": "Avec un paradigme temporel et un paradigme spatial désormais opérationnels, la suite peut se concentrer sur trois études prioritaires qui prolongent directement ces acquis.",
            "content": "<div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch\"><div class=\"card\"><div class=\"mono\">ANNÉE 1</div><h3>Deux paradigmes stabilisés</h3><p><strong>TWIXAV</strong> fixe le cadre temporel.<br><strong>VIBEX</strong> fixe le cadre spatial.</p><p style=\"margin-top:14px\">Protocoles, mesures et analyses sont suffisamment établis pour servir de références.</p></div><div style=\"display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:var(--accent)\">→</div><div class=\"card dark\"><div class=\"mono\">ANNÉE 2</div><h3>Trois prolongements prioritaires</h3><p><strong>SOFT</strong> - caractériser plus directement le temps propre de chaque modalité.</p><p><strong>OASIS</strong> - prolonger VIBEX en introduisant l’olfaction dans la représentation spatiale.</p><p><strong>TWIXOLF</strong> - prolonger TWIXAV en transposant la liaison temporelle à l’olfaction.</p></div></div><div class=\"card\" style=\"margin-top:18px\"><div class=\"mono\">LOGIQUE DE PROGRESSION</div><h3>Consolider d’abord, complexifier ensuite</h3><p>La deuxième année ne repart donc pas de zéro : elle s’appuie sur deux protocoles déjà maîtrisés pour tester de façon plus ciblée la place de l’olfaction dans l’espace et le temps.</p></div>",
            "notes": "Faire de cette slide la charnière vers la Partie 4. L’idée centrale est très simple : deux paradigmes ont été fixés en première année, ce qui permet maintenant de lancer SOFT, OASIS et TWIXOLF dans une logique de continuité."
          }
          s35_en = {
            "section": "Transition to Year 2",
            "kicker": "PART 3 - SUMMARY",
            "title": "Two established foundations, three Year 2 studies",
            "lead": "With one temporal and one spatial paradigm now operational, the next stage can focus on three priority studies that directly extend these Year 1 achievements.",
            "content": "<div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch\"><div class=\"card\"><div class=\"mono\">YEAR 1</div><h3>Two stabilized paradigms</h3><p><strong>TWIXAV</strong> establishes the temporal framework.<br><strong>VIBEX</strong> establishes the spatial framework.</p><p style=\"margin-top:14px\">Protocols, measures and analyses are sufficiently established to serve as references.</p></div><div style=\"display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:var(--accent)\">→</div><div class=\"card dark\"><div class=\"mono\">YEAR 2</div><h3>Three priority extensions</h3><p><strong>SOFT</strong> - characterize the temporal properties of each modality more directly.</p><p><strong>OASIS</strong> - extend VIBEX by introducing olfaction into spatial representation.</p><p><strong>TWIXOLF</strong> - extend TWIXAV by transposing temporal binding to olfaction.</p></div></div><div class=\"card\" style=\"margin-top:18px\"><div class=\"mono\">PROGRESSION LOGIC</div><h3>Consolidate first, then increase complexity</h3><p>Year 2 therefore does not start from scratch: it builds on two mastered protocols to test more directly the role of olfaction in space and time.</p></div>",
            "notes": "Use this slide as the bridge to Part 4. The central idea is simple: two paradigms were fixed in Year 1, which now makes it possible to launch SOFT, OASIS and TWIXOLF in a continuous progression."
          }

          # Slide 34
          old34 = slides[33]
          new34 = dict(old34)
          new34.update(s34_fr)
          new34['_fr'] = s34_fr
          new34['_en'] = s34_en
          slides[33] = new34

          # Slide 35
          old35 = slides[34]
          new35 = dict(old35)
          new35.update(s35_fr)
          new35['_fr'] = s35_fr
          new35['_en'] = s35_en
          slides[34] = new35

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          text = text[:start] + new_json + text[end:]
          p.write_text(text, encoding='utf-8')

          assert Path('index_save.html').read_bytes() == save_before
          check = p.read_text(encoding='utf-8')
          s2, _ = json.JSONDecoder().raw_decode(check[check.index(marker)+len(marker):])
          assert 'TWIXAV et VIBEX' in s2[33]['title']
          assert 'SOFT' in s2[34]['content'] and 'OASIS' in s2[34]['content'] and 'TWIXOLF' in s2[34]['content']
          print('Slide 34:', s2[33]['title'])
          print('Slide 35:', s2[34]['title'])
          PY
      - name: Commit and clean temporary workflow
        run: |
          rm .github/workflows/rework-slides-34-35-transition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/rework-slides-34-35-transition.yml
          git commit -m "Link Year 1 foundations to Year 2 studies"
          git push
