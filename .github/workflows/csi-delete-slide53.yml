name: Delete CSI slide 53
on:
  push:
    paths:
      - '.github/workflows/csi-delete-slide53.yml'
permissions:
  contents: write
jobs:
  delete-slide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete current visible slide 53
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('index.html')
          before = path.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = before.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(before[start:])
          end = start + rel_end

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title') or ''

          visible_indices = [i for i, s in enumerate(slides) if not s.get('appendix')]
          assert len(visible_indices) >= 53, len(visible_indices)
          remove_index = visible_indices[52]
          removed = slides.pop(remove_index)
          print('Removed visible slide 53:', title(removed))

          new_visible = [s for s in slides if not s.get('appendix')]
          assert len(new_visible) == len(visible_indices) - 1

          # Keep the rest of the HTML exactly as it was, replacing only the slides JSON.
          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          after = before[:start] + new_json + before[end:]
          path.write_text(after, encoding='utf-8')

          # Checkpoint must remain frozen.
          assert Path('index_save.html').read_text(encoding='utf-8')
          PY
          git diff --exit-code -- index_save.html
      - name: Commit deletion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Delete current slide 53"
          git push
