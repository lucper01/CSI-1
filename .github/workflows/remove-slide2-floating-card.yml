name: Remove slide 2 floating card
on:
  push:
    paths:
      - '.github/workflows/remove-slide2-floating-card.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Einstein and review card from slide 2
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title', '')

          idx = next(i for i, s in enumerate(slides) if title(s) == '« No space, no time? » - le paradoxe de l’attention olfactive')
          assert idx == 1, f'Expected target on slide 2, got slide {idx+1}'
          slide = slides[idx]

          changed = 0
          for holder in (slide, slide.get('_fr', {}), slide.get('_en', {})):
              if not isinstance(holder, dict):
                  continue
              content = holder.get('content', '')
              if 'sela-visual-stack' not in content:
                  continue
              new_content, n = re.subn(
                  r'<aside class="sela-visual-stack"[^>]*>.*?</aside>',
                  '',
                  content,
                  count=1,
                  flags=re.S
              )
              assert n == 1, 'Floating visual card not removed exactly once'
              holder['content'] = new_content
              changed += 1

          assert changed >= 2, f'Expected localized slide content to change, changed={changed}'
          slide['content'] = slide.get('_fr', slide).get('content', slide.get('content', ''))

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          text = text[:start] + new_json + text[end:]

          # Let the remaining theory content use the full slide width.
          override = '''\n/* Slide 2 without floating Einstein/review card */\n.sela-slide-layout{display:block!important}\n.sela-theory-copy{width:100%!important;max-width:none!important}\n'''
          if '/* Slide 2 without floating Einstein/review card */' not in text:
              text = text.replace('</style>', override + '\n</style>', 1)

          p.write_text(text, encoding='utf-8')

          out = p.read_text(encoding='utf-8')
          s2 = out.index(marker) + len(marker)
          check, _ = json.JSONDecoder().raw_decode(out[s2:])
          target = check[1]
          blob = target.get('content', '') + target.get('_fr', {}).get('content', '') + target.get('_en', {}).get('content', '')
          assert 'sela-visual-stack' not in blob
          assert 'einstein-card' not in blob
          assert 'sela-review-card' not in blob
          print('OK - slide 2 floating Einstein/review card removed')
      - name: Validate backup untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/remove-slide2-floating-card.yml
          git add -A index.html .github
          git commit -m "Remove slide 2 Einstein and review floating card"
          git push
