name: Harmonize SOLAR to Axis 1
on:
  push:
    paths:
      - '.github/scripts/csi_solar_axis1.py'
      - '.github/workflows/csi-solar-axis1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harmonize SOLAR axis
        run: python .github/scripts/csi_solar_axis1.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/csi-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/csi-inline.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harmonize SOLAR with Axis 1"
          git push
