name: Fix TWIXAV blue on slide 16
on:
  push:
    paths:
      - '.github/workflows/fix-twixav-blue.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix TWIXAV card color
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          p = Path('index.html')
          save = Path('index_save.html')
          save_before = hashlib.sha256(save.read_bytes()).hexdigest()
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          s = slides[15]

          def fix(html):
              if not isinstance(html, str) or 'TWIXAV' not in html:
                  return html
              # Target the TWIXAV card inside the architecture grid.
              m = re.search(r'<div class="card"[^>]*>\s*<div class="mono">Référence temporelle</div>\s*<h3>TWIXAV</h3>', html)
              if not m:
                  m = re.search(r'<div class="card"[^>]*>\s*<div class="mono">Temporal reference</div>\s*<h3>TWIXAV</h3>', html)
              if not m:
                  raise SystemExit('TWIXAV architecture card not found')
              block = m.group(0)
              opening_end = block.index('>')
              opening = block[:opening_end+1]
              rest = block[opening_end+1:]
              attrs = ' data-study="TWIXAV" style="--study:#0072B2;--study-color:#0072B2;border-color:#0072B2;box-shadow:inset 4px 0 0 #0072B2;background:linear-gradient(180deg,color-mix(in srgb,#0072B2 8%,var(--white)),var(--white))"'
              opening = '<div class="card"' + attrs + '>'
              rest = rest.replace('<div class="mono">', '<div class="mono" style="color:#0072B2">', 1)
              rest = rest.replace('<h3>TWIXAV</h3>', '<h3 style="color:#0072B2">TWIXAV</h3>', 1)
              return html[:m.start()] + opening + rest + html[m.end():]

          for key in ('content',):
              s[key] = fix(s.get(key,''))
          for lang in ('_fr','_en'):
              if isinstance(s.get(lang), dict):
                  s[lang]['content'] = fix(s[lang].get('content',''))

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          text = text[:start] + new_json + text[end:]
          p.write_text(text, encoding='utf-8')

          save_after = hashlib.sha256(save.read_bytes()).hexdigest()
          assert save_before == save_after, 'index_save.html changed unexpectedly'

          # Verification on slide 16.
          check = slides[15].get('_fr',{}).get('content','')
          assert 'data-study="TWIXAV"' in check
          assert 'color:#0072B2' in check
          assert 'border-color:#0072B2' in check
          print('TWIXAV slide 16 fully blue-accented; save untouched.')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix TWIXAV study color on slide 16"
          rm .github/workflows/fix-twixav-blue.yml
          git add .github/workflows/fix-twixav-blue.yml
          git commit -m "Remove temporary TWIXAV color workflow"
          git push
