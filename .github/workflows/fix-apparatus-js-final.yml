name: Fix apparatus JS final
on:
  push:
    paths:
      - '.github/workflows/fix-apparatus-js-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair apparatus popup script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          pat=re.compile(r'(<script id="apparatusPopupScript">)(.*?)(</script>)',re.S)
          m=pat.search(t)
          if not m: raise RuntimeError('apparatusPopupScript not found')
          body=m.group(2)
          if '\\n' not in body: print('No literal newline escapes to repair')
          body=body.replace('\\n','\n')
          t=t[:m.start()]+m.group(1)+body+m.group(3)+t[m.end():]
          p.write_text(t,encoding='utf-8')
          PY
      - name: Check all inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          out=Path('/tmp/csi-js'); out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts): (out/f'script_{i:02d}.js').write_text(s,encoding='utf-8')
          print('INLINE SCRIPTS',len(scripts))
          PY
          for f in /tmp/csi-js/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair apparatus popup JavaScript"
          git push
