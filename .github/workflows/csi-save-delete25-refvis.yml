name: CSI save delete25 refvis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/csi-save-delete25-refvis.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save current CSI working version
        shell: bash
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git commit -m "Save CSI before deleting slide 25 and updating visual reference"
          git push
      - name: Delete slide 25 and update slide 21
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = ['
          start = text.index(marker) + len('const slides = ')
          dec = json.JSONDecoder()
          slides, end_rel = dec.raw_decode(text[start:])

          assert len(slides) >= 25
          assert slides[15].get('title') == 'TWIXAV - référence audiovisuelle', slides[15].get('title')
          assert slides[20].get('title') == 'VIBEX - pourquoi établir une référence visuelle ?', slides[20].get('title')
          assert slides[24].get('title') == 'VIBEX - ce que cela apporte à l’olfaction', slides[24].get('title')

          s = slides[20]
          s['title'] = 'Référence visuelle'
          if '_fr' in s:
              s['_fr']['title'] = 'Référence visuelle'

          old_content = '<div class="grid three"><div class="card"><div class="mono">Phénomène</div><h3>Boundary Extension</h3><p>La mémoire d’une scène peut inclure des informations spatiales au-delà de ses limites réellement présentées, révélant une représentation constructive de l’espace.</p></div><div class="card"><div class="mono">Référence</div><h3>Une base visuelle contrôlée</h3><p>Le paradigme doit être fonctionnel et stable sans odeur avant de pouvoir attribuer une modification ultérieure au contexte olfactif.</p></div><div class="card dark"><div class="mono">Suite</div><h3>Préparer VIBOLF</h3><p>VIBEX fixe les scènes, la logique de comparaison et les indices comportementaux qui serviront de référence à l’étude olfactive.</p></div></div>'
          new_content = '<div class="grid three"><div class="card"><div class="mono">RÉFÉRENCE</div><h3>Boundary Extension</h3><p>La mémoire d’une scène peut inclure des informations spatiales au-delà de ses limites réellement présentées, révélant une représentation constructive de l’espace.</p></div><div class="card"><div class="mono">DOUBLE OBJECTIF</div><h3>La taille comme paramètre et comme question</h3><p>Le paradigme doit être fonctionnel et stable sans odeur avant de pouvoir attribuer une modification ultérieure au contexte olfactif.</p></div><div class="card dark"><div class="mono">SUITE</div><h3>Préparer VIBOLF</h3><p>VIBEX fixe les scènes, la logique de comparaison et les indices comportementaux qui serviront de référence à l’étude olfactive.</p></div></div>'
          assert s.get('content') == old_content
          s['content'] = new_content
          if '_fr' in s:
              assert s['_fr'].get('content') == old_content
              s['_fr']['content'] = new_content

          # Delete the original current slide 25 only after all validations.
          del slides[24]

          rebuilt = json.dumps(slides, ensure_ascii=False, indent=2)
          end = start + end_rel
          text = text[:start] + rebuilt + text[end:]
          p.write_text(text, encoding='utf-8')

          # Final safety checks.
          check = json.JSONDecoder().raw_decode(text[start:])[0]
          assert check[20]['title'] == 'Référence visuelle'
          assert 'DOUBLE OBJECTIF' in check[20]['content']
          assert 'La taille comme paramètre et comme question' in check[20]['content']
          assert all(x.get('title') != 'VIBEX - ce que cela apporte à l’olfaction' for x in check)
          print('Slide 21 updated; slide 25 deleted successfully')
          PY
      - name: Verify save stayed frozen
        shell: bash
        run: git diff --exit-code -- index_save.html
      - name: Commit working update and clean helper
        shell: bash
        run: |
          git rm .github/workflows/csi-save-delete25-refvis.yml
          git add index.html
          git commit -m "Delete slide 25 and align VIBEX visual reference cards"
          git push
