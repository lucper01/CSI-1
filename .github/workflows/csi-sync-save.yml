name: Sync CSI save
on:
  push:
    paths:
      - '.github/workflows/csi-sync-save.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync active file to save
        shell: bash
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
      - name: Commit save checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet && exit 0
          git commit -m "Save current CSI checkpoint"
          git push
