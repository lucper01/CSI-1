name: Trim VIBEX graph caption
on:
  push:
    paths:
      - '.github/workflows/trim-vibex-caption.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update caption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          a='<strong>VIBEX - Olivia Hiridjee.</strong> '
          b=' - redessin de la Figure 6 du mémoire pour la présentation.'
          assert t.count(a) >= 1
          assert t.count(b) >= 1
          t=t.replace(a,'').replace(b,'.')
          assert 'redessin de la Figure 6 du mémoire pour la présentation' not in t
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit clean update
        run: |
          git rm .github/workflows/trim-vibex-caption.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Simplify VIBEX graph caption"
          git push
