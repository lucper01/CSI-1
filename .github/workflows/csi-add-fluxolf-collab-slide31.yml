name: Add FLUXOLF collaboration card
on:
  push:
    paths:
      - '.github/workflows/csi-add-fluxolf-collab-slide31.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch slide 31
        run: python .github/scripts/csi_add_fluxolf_collab_slide31.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add FLUXOLF collaboration card to slide 31"
          git push
