name: CSI save and add quarterly planning
on:
  push:
    paths:
      - '.github/workflows/csi-save-add-quarterly-planning.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current working version
        run: |
          cp index.html index_save.html
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before adding quarterly planning"
            git push
          fi
          echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Insert quarterly planning after current main slide 39
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = ['
          start = text.index(marker) + len(marker)

          i = start
          depth_sq = 1
          in_str = None
          esc = False
          end = None
          while i < len(text):
              ch = text[i]
              if in_str:
                  if esc:
                      esc = False
                  elif ch == '\\':
                      esc = True
                  elif ch == in_str:
                      in_str = None
              else:
                  if ch in ('"', "'", '`'):
                      in_str = ch
                  elif ch == '[':
                      depth_sq += 1
                  elif ch == ']':
                      depth_sq -= 1
                      if depth_sq == 0:
                          end = i
                          break
              i += 1
          if end is None:
              raise RuntimeError('Could not locate slides array')

          body = text[start:end]
          objs = []
          i = 0
          while i < len(body):
              if body[i] != '{':
                  i += 1
                  continue
              a = i
              depth = 0
              in_str = None
              esc = False
              while i < len(body):
                  ch = body[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == in_str:
                          in_str = None
                  else:
                      if ch in ('"', "'", '`'):
                          in_str = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              objs.append((a, i + 1, body[a:i+1]))
                              i += 1
                              break
                  i += 1

          def is_appendix(obj):
              return bool(re.search(r'"appendix"\s*:\s*true', obj))

          main = [(a,b,o) for a,b,o in objs if not is_appendix(o)]
          if len(main) != 41:
              raise RuntimeError(f'Expected 41 main slides before insertion, found {len(main)}')
          a39,b39,obj39 = main[38]
          print('Current main slide 39:', re.findall(r'"title"\s*:\s*"([^"]*)"', obj39)[:3])

          style = '''<style>
          .csi-plan12{font-size:.72rem}
          .csi-plan12 .ph{display:grid;grid-template-columns:132px 1fr;gap:6px;margin-bottom:5px}
          .csi-plan12 .years,.csi-plan12 .quarters{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
          .csi-plan12 .year{padding:7px 6px;border-radius:12px;text-align:center;font-weight:950;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--line)}
          .csi-plan12 .q{position:relative;padding:6px 2px;border-radius:10px;text-align:center;font-weight:900;background:var(--white);border:1px solid var(--line);color:var(--muted)}
          .csi-plan12 .q.now{background:color-mix(in srgb,var(--accent) 12%,var(--white));color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
          .csi-plan12 .here{display:block;font-size:.58rem;line-height:1;margin-top:2px;color:var(--accent);font-weight:950;white-space:nowrap}
          .csi-plan12 .lane{display:grid;grid-template-columns:132px 1fr;gap:6px;margin-top:6px}
          .csi-plan12 .lab{display:flex;align-items:center;padding:9px 10px;border-radius:14px;background:var(--accent-pale);border:1px solid var(--line);font-weight:950;color:var(--accent-strong)}
          .csi-plan12 .track{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:36px;gap:4px;min-width:0}
          .csi-plan12 .evt{display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 6px;border-radius:11px;background:var(--white);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 7%,transparent);font-weight:850;line-height:1.1;overflow:hidden}
          .csi-plan12 .evt.soft{background:color-mix(in srgb,var(--accent) 8%,var(--white))}
          .csi-plan12 .evt.dark{background:var(--accent-strong);color:#fff;border-color:transparent}
          .csi-plan12 .evt.muted{opacity:.72;border-style:dashed}
          .csi-plan12 .legend{margin-top:8px;text-align:right;color:var(--muted);font-size:.66rem}
          </style>'''

          fr_content = style + '''<div class="csi-plan12">
          <div class="ph"><div></div><div class="years"><div class="year" style="grid-column:1/span 4">Année 1</div><div class="year" style="grid-column:5/span 4">Année 2</div><div class="year" style="grid-column:9/span 4">Année 3</div></div></div>
          <div class="ph"><div></div><div class="quarters"><div class="q">T1</div><div class="q">T2</div><div class="q">T3</div><div class="q now">T4<span class="here">📍 VOUS ÊTES ICI</span></div><div class="q">T1</div><div class="q">T2</div><div class="q">T3</div><div class="q">T4</div><div class="q">T1</div><div class="q">T2</div><div class="q">T3</div><div class="q">T4</div></div></div>
          <div class="lane"><div class="lab">Études</div><div class="track"><div class="evt soft" style="grid-column:1/span 3;grid-row:1">TWIXAV</div><div class="evt soft" style="grid-column:2/span 3;grid-row:2">VIBEX</div><div class="evt" style="grid-column:5/span 3;grid-row:1">SOFT - collecte · analyses</div><div class="evt" style="grid-column:6/span 2;grid-row:2">VIBOLF</div><div class="evt" style="grid-column:8/span 3;grid-row:2">TWIXOLF</div><div class="evt muted" style="grid-column:9/span 2;grid-row:1">SOLAR · BRAUD · BRAUDOLF</div><div class="evt" style="grid-column:11/span 2;grid-row:1">Analyses finales</div></div></div>
          <div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1">Revue · protocoles · pipelines</div><div class="evt" style="grid-column:5/span 4;grid-row:1">TWIXAV · VIBEX - manuscrits</div><div class="evt" style="grid-column:7/span 3;grid-row:2">SOFT - rédaction</div><div class="evt" style="grid-column:9/span 4;grid-row:2">VIBOLF · TWIXOLF - rédaction</div><div class="evt" style="grid-column:10/span 3;grid-row:1">Soumissions · révisions</div></div></div>
          <div class="lane"><div class="lab">Thèse</div><div class="track"><div class="evt dark" style="grid-column:1/span 4;grid-row:1">Cadrage · état de l’art</div><div class="evt dark" style="grid-column:2/span 3;grid-row:2">CER · DPD · protocoles</div><div class="evt dark" style="grid-column:5/span 5;grid-row:1">Collectes · analyses · intégration</div><div class="evt dark" style="grid-column:9/span 4;grid-row:2">Rédaction de thèse</div><div class="evt dark" style="grid-column:12/span 1;grid-row:1">Soumission · soutenance</div></div></div>
          <div class="lane"><div class="lab">Communications</div><div class="track"><div class="evt soft" style="grid-column:3/span 2;grid-row:1">JDD 2026 · prix originalité</div><div class="evt soft" style="grid-column:4/span 2;grid-row:2">Nuit des chercheurs 2026</div><div class="evt" style="grid-column:6/span 3;grid-row:1">FJC · JDD · ECRO · GDR03 - 2027</div><div class="evt" style="grid-column:6/span 3;grid-row:2">Expérimentarium 2027</div><div class="evt" style="grid-column:10/span 2;grid-row:1">FJC · JDD 2028</div><div class="evt muted" style="grid-column:10/span 3;grid-row:2">ISOT 2028 - si financement</div></div></div>
          <div class="legend">Les blocs s’étendent sur plusieurs trimestres lorsque l’activité se poursuit dans le temps.</div>
          </div>'''

          en_content = style + '''<div class="csi-plan12">
          <div class="ph"><div></div><div class="years"><div class="year" style="grid-column:1/span 4">Year 1</div><div class="year" style="grid-column:5/span 4">Year 2</div><div class="year" style="grid-column:9/span 4">Year 3</div></div></div>
          <div class="ph"><div></div><div class="quarters"><div class="q">Q1</div><div class="q">Q2</div><div class="q">Q3</div><div class="q now">Q4<span class="here">📍 YOU ARE HERE</span></div><div class="q">Q1</div><div class="q">Q2</div><div class="q">Q3</div><div class="q">Q4</div><div class="q">Q1</div><div class="q">Q2</div><div class="q">Q3</div><div class="q">Q4</div></div></div>
          <div class="lane"><div class="lab">Studies</div><div class="track"><div class="evt soft" style="grid-column:1/span 3;grid-row:1">TWIXAV</div><div class="evt soft" style="grid-column:2/span 3;grid-row:2">VIBEX</div><div class="evt" style="grid-column:5/span 3;grid-row:1">SOFT - collection · analyses</div><div class="evt" style="grid-column:6/span 2;grid-row:2">VIBOLF</div><div class="evt" style="grid-column:8/span 3;grid-row:2">TWIXOLF</div><div class="evt muted" style="grid-column:9/span 2;grid-row:1">SOLAR · BRAUD · BRAUDOLF</div><div class="evt" style="grid-column:11/span 2;grid-row:1">Final analyses</div></div></div>
          <div class="lane"><div class="lab">Publications</div><div class="track"><div class="evt soft" style="grid-column:1/span 4;grid-row:1">Review · protocols · pipelines</div><div class="evt" style="grid-column:5/span 4;grid-row:1">TWIXAV · VIBEX - manuscripts</div><div class="evt" style="grid-column:7/span 3;grid-row:2">SOFT - writing</div><div class="evt" style="grid-column:9/span 4;grid-row:2">VIBOLF · TWIXOLF - writing</div><div class="evt" style="grid-column:10/span 3;grid-row:1">Submissions · revisions</div></div></div>
          <div class="lane"><div class="lab">Thesis</div><div class="track"><div class="evt dark" style="grid-column:1/span 4;grid-row:1">Framing · literature review</div><div class="evt dark" style="grid-column:2/span 3;grid-row:2">Ethics · data protection · protocols</div><div class="evt dark" style="grid-column:5/span 5;grid-row:1">Collections · analyses · integration</div><div class="evt dark" style="grid-column:9/span 4;grid-row:2">Thesis writing</div><div class="evt dark" style="grid-column:12/span 1;grid-row:1">Submission · defense</div></div></div>
          <div class="lane"><div class="lab">Communications</div><div class="track"><div class="evt soft" style="grid-column:3/span 2;grid-row:1">JDD 2026 · originality award</div><div class="evt soft" style="grid-column:4/span 2;grid-row:2">Researchers’ Night 2026</div><div class="evt" style="grid-column:6/span 3;grid-row:1">FJC · JDD · ECRO · GDR03 - 2027</div><div class="evt" style="grid-column:6/span 3;grid-row:2">Experimentarium 2027</div><div class="evt" style="grid-column:10/span 2;grid-row:1">FJC · JDD 2028</div><div class="evt muted" style="grid-column:10/span 3;grid-row:2">ISOT 2028 - if funded</div></div></div>
          <div class="legend">Blocks span several quarters whenever an activity continues over time.</div>
          </div>'''

          fr = {
              "section": "Planification",
              "kicker": "Vue trimestrielle",
              "title": "Planification - les trois années de thèse",
              "lead": "Douze trimestres pour visualiser les activités réalisées, en cours et prévues, ainsi que leurs chevauchements.",
              "content": fr_content,
              "notes": "Présenter la frise comme une vue globale et flexible : les blocs indiquent des périodes de travail, pas des échéances rigides. Le repère est placé au quatrième trimestre de l’année 1."
          }
          en = {
              "section": "Planning",
              "kicker": "Quarterly view",
              "title": "Planning - the three PhD years",
              "lead": "Twelve quarters to visualize completed, ongoing and planned activities, including overlaps between workstreams.",
              "content": en_content,
              "notes": "Present the timeline as a flexible overview: blocks indicate working periods rather than rigid deadlines. The marker is placed in the fourth quarter of Year 1."
          }
          slide = {
              "chapter": "Planification",
              "study": "",
              "appendix": False,
              "_fr": fr,
              "_en": en,
              **fr
          }
          new_obj = json.dumps(slide, ensure_ascii=False, indent=4)
          new_body = body[:b39] + ',\n  ' + new_obj + body[b39:]
          out = text[:start] + new_body + text[end:]
          p.write_text(out, encoding='utf-8')
          print('Inserted new quarterly planning after main slide 39')
          PY
      - name: Validate presentation JavaScript and slide count
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          target = [x for x in scripts if 'const slides = [' in x]
          if len(target) != 1:
              raise RuntimeError(f'Expected one main slides script, found {len(target)}')
          Path('/tmp/slides.js').write_text(target[0], encoding='utf-8')
          if s.count('Planification - les trois années de thèse') != 2:
              raise RuntimeError('New French planning slide was not inserted in root + _fr as expected')
          if '📍 VOUS ÊTES ICI' not in s:
              raise RuntimeError('Current-position marker missing')
          PY
          node --check /tmp/slides.js
      - name: Verify protected save unchanged after insertion
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit working update and remove helper
        run: |
          git rm .github/workflows/csi-save-add-quarterly-planning.yml
          git add index.html
          git commit -m "Add three-year quarterly thesis planning"
          git push
