name: Replace VIBEX mask
on:
  push:
    paths:
      - '.github/workflows/run-vibex-mask-replacement.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace mask
        run: python3 tools_temp/replace_vibex_mask.py
      - name: Validate
        run: |
          test -f assets/demo/Masque_SCR.webp
          grep -q 'assets/demo/Masque_SCR.webp' index.html
          ! grep -q 'assets/demo/vibex_mask_16.png' index.html
          git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools_temp/replace_vibex_mask.py
          rm -f .github/workflows/run-vibex-mask-replacement.yml
          git add -A index.html assets/demo/Masque_SCR.webp tools_temp .github
          git commit -m "Use supplied texture mask in VIBEX demo"
          git push
