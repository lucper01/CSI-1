name: Update future-study hardware
on:
  push:
    paths:
      - '.github/workflows/update-future-hardware.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',html,re.S)
          if not m:
              raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))

          future={'SOFT','OASIS','TWIXOLF','SORBET','SOLAR','COBEX','BRAUD','BRAUDOLF'}

          def containers(s):
              yield s
              for key in ('_fr','_en'):
                  d=s.get(key)
                  if isinstance(d,dict):
                      yield d

          def remove_old_float_material(text):
              if not isinstance(text,str): return text
              # Keep poster links, remove existing material cards from study-floating blocks.
              text=re.sub(r'<div class="float-card"><b>Matériel</b><span>.*?</span></div>','',text)
              text=re.sub(r'<div class="float-card"><b>Hardware</b><span>.*?</span></div>','',text)
              text=re.sub(r'<div class="float-card"><b>Selon pilote</b><span>.*?</span></div>','',text)
              text=re.sub(r'<div class="float-card"><b>Depending on pilot</b><span>.*?</span></div>','',text)
              return text

          def hardware_block(study,lang='fr'):
              labels=['Sniff-0','Spir-0','BIOPAC MP160']
              if study=='SOFT': labels.append('EEG BioSemi')
              title='Matériel' if lang=='fr' else 'Hardware'
              chips=''.join(f'<span>{x}</span>' for x in labels)
              return f'<div class="hardware-floating" aria-label="{title} {study}"><b>{title}</b><div>{chips}</div></div>'

          # SOFT: no pilot framing anywhere.
          for s in slides:
              study=str(s.get('study','')).upper()
              for c in containers(s):
                  for key in ('content','notes','lead'):
                      val=c.get(key)
                      if not isinstance(val,str): continue
                      if study=='SOFT':
                          val=val.replace('<div class="v16-callout"><strong>Décision du pilote :</strong> déterminer la durée maximale de session et la place exacte de l’EEG / physiologie avant la collecte complète.</div>','')
                          val=val.replace('<div class="v16-callout"><strong>Pilot decision:</strong> determine the maximum session duration and the exact place of EEG / physiology before full data collection.</div>','')
                          val=val.replace('Pilote - automne 2026','Collecte prévue - 2026-2027')
                          val=val.replace('Pilot - autumn 2026','Planned collection - 2026-2027')
                          val=val.replace("Insister sur le lien direct avec l'asymétrie observée dans TWIXAV et sur le rôle du pilote.","Insister sur le lien direct avec l'asymétrie observée dans TWIXAV et sur le rôle méthodologique de SOFT.")
                          val=val.replace('Emphasize the direct link with the asymmetry observed in TWIXAV and the role of the pilot.','Emphasize the direct link with the asymmetry observed in TWIXAV and the methodological role of SOFT.')
                          val=val.replace('EEG et physiologie selon faisabilité','EEG BioSemi et physiologie BIOPAC')
                          val=val.replace('EEG and physiology depending on feasibility','BioSemi EEG and BIOPAC physiology')
                      if study=='TWIXOLF':
                          val=val.replace('les paramètres finaux seront ajustés à partir du pilote SOFT et de la robustesse observée sur la chaîne olfactométrique.','les paramètres finaux seront ajustés à partir des mesures obtenues avec SOFT et de la robustesse observée sur la chaîne olfactométrique.')
                          val=val.replace('the final parameters will be adjusted from the SOFT pilot and the robustness observed on the olfactometry chain.','the final parameters will be adjusted from the measurements obtained with SOFT and the robustness observed on the olfactometry chain.')
                          val=val.replace('Les SOA définitifs restent à verrouiller par les pilotes.','Les SOA définitifs restent à verrouiller dans le protocole final.')
                          val=val.replace('Final SOAs remain to be locked by pilots.','Final SOAs remain to be locked in the final protocol.')
                      c[key]=val

          # Put compact discrete hardware cards only on the most relevant slide for each future study.
          for study in future:
              candidates=[s for s in slides if str(s.get('study','')).upper()==study]
              if not candidates: continue
              target=None
              if study in {'SOFT','OASIS','TWIXOLF'}:
                  target=next((s for s in candidates if 'Méthode' in str(s.get('title','')) or 'Method' in str(s.get('title',''))),None)
              if target is None:
                  target=candidates[-1]

              for c in containers(target):
                  content=remove_old_float_material(c.get('content',''))
                  # Remove any previously generated hardware block, then append a fresh one.
                  content=re.sub(r'<div class="hardware-floating".*?</div></div>','',content,flags=re.S)
                  lang='en' if c is target.get('_en') else 'fr'
                  content+=hardware_block(study,lang)
                  c['content']=content

          # Ensure older material cards are removed from other slides of those studies.
          for s in slides:
              if str(s.get('study','')).upper() not in future: continue
              for c in containers(s):
                  if c is target: continue
                  if isinstance(c.get('content'),str):
                      c['content']=remove_old_float_material(c['content'])

          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          html=html[:m.start(1)]+arr+html[m.end(1):]

          css='''
          .hardware-floating{position:absolute;right:clamp(18px,2.2vw,34px);bottom:clamp(18px,2vw,30px);z-index:9;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--study,var(--accent)) 22%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--white) 90%,transparent);backdrop-filter:blur(10px);box-shadow:0 8px 18px rgba(11,47,35,.08);font-size:.66rem;line-height:1.15;max-width:min(70%,720px)}
          .hardware-floating>b{color:var(--study,var(--accent));font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
          .hardware-floating>div{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
          .hardware-floating span{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:color-mix(in srgb,var(--study,var(--accent)) 8%,var(--white));border:1px solid color-mix(in srgb,var(--study,var(--accent)) 18%,var(--line));font-weight:780;white-space:nowrap;color:var(--text)}
          @media(max-width:900px){.hardware-floating{position:static;margin-top:10px;max-width:none;width:max-content;max-width:100%;flex-wrap:wrap}.hardware-floating>div{justify-content:flex-start}}
          '''
          if '.hardware-floating{' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          path.write_text(html,encoding='utf-8')
          PY
      - name: Validate structure and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          slides=json.loads(m.group(1))
          alltxt=json.dumps(slides,ensure_ascii=False)
          assert 'Décision du pilote' not in alltxt
          assert 'Pilote - automne 2026' not in alltxt
          assert 'Selon pilote' not in alltxt
          assert 'pilote SOFT' not in alltxt
          assert 'rôle du pilote' not in alltxt
          future=['SOFT','OASIS','TWIXOLF','SORBET','SOLAR','COBEX','BRAUD','BRAUDOLF']
          for st in future:
              ss=[s for s in slides if str(s.get('study','')).upper()==st]
              assert ss, st
              joined=json.dumps(ss,ensure_ascii=False)
              assert 'Sniff-0' in joined, st+' missing Sniff-0'
              assert 'Spir-0' in joined, st+' missing Spir-0'
              assert 'BIOPAC MP160' in joined, st+' missing BIOPAC'
              if st=='SOFT': assert 'EEG BioSemi' in joined
              else: assert 'EEG BioSemi' not in joined, st+' should not have EEG'
          print('validated',len(slides),'slides')
          PY
      - name: Commit update and clean workflow
        run: |
          rm -f .github/workflows/update-future-hardware.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update future-study hardware and remove SOFT pilot wording"
          git push