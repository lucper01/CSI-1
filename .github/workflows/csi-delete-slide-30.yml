name: Delete slide 30
on:
  push:
    paths:
      - '.github/workflows/csi-delete-slide-30.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete slide 30 from active deck
        run: python .github/scripts/csi_delete_slide_30.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Delete slide 30 from CSI deck"
          git push
