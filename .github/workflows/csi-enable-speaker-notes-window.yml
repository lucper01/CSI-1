name: CSI enable speaker notes window

on:
  push:
    paths:
      - '.github/workflows/csi-enable-speaker-notes-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify protected save snapshot
        run: |
          test "$(git hash-object index_save.html)" = "05d308a044407d81fa909330f6df01d6b3728a8d"
      - name: Enable separate speaker notes window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="assets/csi-speaker-notes.js?v=1"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('Missing closing body tag')
              text = text.replace('</body>', f'  {tag}\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate speaker notes runtime
        run: |
          node --check assets/csi-speaker-notes.js
          grep -q 'assets/csi-speaker-notes.js?v=1' index.html
      - name: Commit working presentation only
        run: |
          git add index.html assets/csi-speaker-notes.js
          if ! git diff --cached --quiet; then
            git commit -m "Open detailed speaker notes in separate window"
            git push
          fi
      - name: Verify save remains untouched
        run: |
          test "$(git hash-object index_save.html)" = "05d308a044407d81fa909330f6df01d6b3728a8d"
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/csi-enable-speaker-notes-window.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary speaker notes workflow"
            git push
          fi
