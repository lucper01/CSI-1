name: Shorten technical difficulties
on:
  push:
    paths:
      - '.github/workflows/shorten-technical-difficulties.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten five difficulty slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          path=Path('index.html')
          backup=Path('index_save.html')
          backup_hash=hashlib.sha256(backup.read_bytes()).hexdigest()
          text=path.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end

          data={
            'TWIXAV':{
              'fr':{
                'lead':'Trois points à verrouiller pour garantir un timing audiovisuel réellement contrôlé.',
                'cards':[
                  ('Timing écran','Refresh · frames · durées réelles','Mesure du refresh · conversion en frames'),
                  ('Synchronisation audiovisuelle','Onsets · SOA · latences','Prétests · journalisation des événements'),
                  ('Robustesse','Paramètres · poste · répétabilité','Contrôles au lancement · essais pilotes')],
                'take':'Timing mesuré · vérifié · reproductible.'},
              'en':{
                'lead':'Three points to secure genuinely controlled audiovisual timing.',
                'cards':[
                  ('Display timing','Refresh rate · frames · actual durations','Refresh measurement · frame conversion'),
                  ('Audiovisual synchronization','Onsets · SOA · latencies','Pre-tests · event logging'),
                  ('Robustness','Parameters · workstation · repeatability','Startup checks · pilot trials')],
                'take':'Measured · verified · reproducible timing.'}},
            'VIBEX':{
              'fr':{
                'lead':'Trois verrous techniques pour stabiliser le paradigme visuel.',
                'cards':[
                  ('Durée d’affichage','Refresh · frames · onsets / offsets','Timing contrôlé'),
                  ('Tailles et cadrages','LL / SS / LS / SL · résolution · position','Stimuli standardisés · gabarits fixes'),
                  ('Synchronisation','Affichage · réponses · acquisition','PsychoPy · horodatage commun')],
                'take':'Base visuelle stabilisée pour OASIS.'},
              'en':{
                'lead':'Three technical locks to stabilize the visual paradigm.',
                'cards':[
                  ('Display duration','Refresh rate · frames · onsets / offsets','Controlled timing'),
                  ('Sizes and crops','LL / SS / LS / SL · resolution · position','Standardized stimuli · fixed templates'),
                  ('Synchronization','Display · responses · acquisition','PsychoPy · common timestamps')],
                'take':'Stable visual basis for OASIS.'}},
            'SOFT':{
              'fr':{
                'lead':'L’enjeu principal : faire fonctionner plusieurs modalités et appareils sur une même chronologie.',
                'cards':[
                  ('Affichage et timing','Windows 7 · PsychoPy · double écran · refresh','Fenêtre quasi plein écran · frames'),
                  ('Coexistence des systèmes','Sniff-0 · Spir-0 · BIOPAC · EEG','Modules indépendants · états visibles'),
                  ('Respiration et triggers','Inspiration · polarité · EEG 8 bits','Front inspiration · triggers < 255')],
                'take':'Une chaîne multimodale unique · pilotée · observable.'},
              'en':{
                'lead':'Main challenge: running several modalities and devices on one common timeline.',
                'cards':[
                  ('Display and timing','Windows 7 · PsychoPy · dual screen · refresh','Near-fullscreen window · frames'),
                  ('System coexistence','Sniff-0 · Spir-0 · BIOPAC · EEG','Independent modules · visible states'),
                  ('Respiration and triggers','Inhalation · polarity · 8-bit EEG','Inhalation edge · triggers < 255')],
                'take':'One multimodal chain · controlled · observable.'}},
            'OASIS':{
              'fr':{
                'lead':'Ajouter l’olfaction à VIBEX sans perdre le contrôle visuel et temporel.',
                'cards':[
                  ('Vision et olfaction','VIBEX · odeur · timing','Cœur visuel conservé · module olfactif'),
                  ('Synchronisation','Écran · Sniff-0 · Spir-0 · acquisition','Timestamps communs'),
                  ('Flush et résiduel','Carry-over · adaptation · flux','Calibration · purge · intervalles')],
                'take':'VIBEX pour le visuel · SOFT pour l’intégration olfactive.'},
              'en':{
                'lead':'Add olfaction to VIBEX without losing visual and temporal control.',
                'cards':[
                  ('Vision and olfaction','VIBEX · odor · timing','Preserved visual core · olfactory module'),
                  ('Synchronization','Display · Sniff-0 · Spir-0 · acquisition','Common timestamps'),
                  ('Flush and residual odor','Carry-over · adaptation · airflow','Calibration · purge · intervals')],
                'take':'VIBEX for vision · SOFT for olfactory integration.'}},
            'TWIXOLF':{
              'fr':{
                'lead':'Rendre la stimulation olfactive suffisamment précise pour construire des SOA.',
                'cards':[
                  ('Onset olfactif','Commande · transport · inspiration','Ancre respiratoire · calibration du flux'),
                  ('SOA intermodal','Repère temporel · latences · reproductibilité','Chronologie commune · validation instrumentale'),
                  ('Purge et répétition','Résiduel · adaptation · essais successifs','Flush · contrôle des flux · ITI adaptés')],
                'take':'Une odeur horodatable · répétable · exploitable temporellement.'},
              'en':{
                'lead':'Make olfactory stimulation precise enough to construct SOAs.',
                'cards':[
                  ('Olfactory onset','Command · transport · inhalation','Respiratory anchor · flow calibration'),
                  ('Crossmodal SOA','Temporal reference · latencies · repeatability','Common timeline · instrumental validation'),
                  ('Purge and repetition','Residual odor · adaptation · successive trials','Flush · airflow control · suitable ITIs')],
                'take':'Timestampable · repeatable · temporally usable odor.'}}
          }

          def content(cfg, english=False):
              out=[]
              for i,(title,keywords,solution) in enumerate(cfg['cards']):
                  cls='card dark' if i==2 else 'card'
                  label='Solution:' if english else 'Solution :'
                  out.append(f'<div class="{cls}"><h3>{title}</h3><p><strong>{keywords}</strong></p><p>{label} {solution}</p></div>')
              return '<div class="grid three">'+''.join(out)+f'</div><div class="callout" style="margin-top:16px"><strong>{cfg["take"]}</strong></div>'

          updated=[]
          for s in slides:
              study=s.get('study')
              if study not in data:
                  continue
              titles=' '.join([s.get('title',''),(s.get('_fr') or {}).get('title',''),(s.get('_en') or {}).get('title','')]).lower()
              if 'difficult' not in titles:
                  continue
              fr=data[study]['fr']; en=data[study]['en']
              s['lead']=fr['lead']; s['content']=content(fr,False)
              if s.get('_fr') is not None:
                  s['_fr']['lead']=fr['lead']; s['_fr']['content']=content(fr,False)
              if s.get('_en') is not None:
                  s['_en']['lead']=en['lead']; s['_en']['content']=content(en,True)
              updated.append(study)

          if sorted(updated)!=sorted(data):
              raise RuntimeError(f'Expected five difficulty slides, updated {updated}')

          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          path.write_text(text[:start]+new_json+text[end:],encoding='utf-8')

          if hashlib.sha256(backup.read_bytes()).hexdigest()!=backup_hash:
              raise RuntimeError('index_save.html changed')
          print('Updated:',updated)
          print('Backup SHA256:',backup_hash)
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten technical difficulty slides"
          rm .github/workflows/shorten-technical-difficulties.yml
          git add .github/workflows/shorten-technical-difficulties.yml
          git commit -m "Remove temporary shortening workflow"
          git push
