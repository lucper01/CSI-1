name: CSI local timeline and VIBEX manual preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-local-timeline-vibex.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/tmp_local_timeline_vibex_manual.py
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "d753d93f7208a4b14adac02f254f12a561719406"
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm tools/tmp_local_timeline_vibex_manual.py .github/workflows/tmp-local-timeline-vibex.yml
          git commit -m "Use local section timelines and add manual VIBEX preview"
          git push
