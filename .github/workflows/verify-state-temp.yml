name: Verify current slide refactor state
on:
  push:
    paths:
      - '.github/workflows/verify-state-temp.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('index.html').read_text(encoding='utf-8')
          saved=Path('index_save.html').read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides,_=json.JSONDecoder().raw_decode(text[start:])
          print('same_save=', text==saved)
          print('slide_count=',len(slides))
          for i in [15,33,34]:
              if i < len(slides):
                  s=slides[i]
                  print('SLIDE',i+1,'TITLE',s.get('title') or s.get('_fr',{}).get('title'))
                  print('CONTENT', (s.get('content') or s.get('_fr',{}).get('content',''))[:1200])
          PY
      - name: Remove temp workflow
        run: |
          rm .github/workflows/verify-state-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-state-temp.yml
          git commit -m "Remove temporary verification workflow" || true
          git push
