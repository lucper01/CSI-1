name: Add year 2 communications
on:
  push:
    paths:
      - '.github/scripts/csi_year2_communications.py'
      - '.github/workflows/csi-year2-communications.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch communications
        run: python .github/scripts/csi_year2_communications.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add dated scientific communications"
          git push
