name: CSI purge VIBEX VIBOLF landscape
on:
  push:
    paths:
      - '.github/workflows/tmp-purge-vibex-vibolf-landscape.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Freeze protected save hash
        run: git hash-object index_save.html > /tmp/save_hash_before
      - name: Purge legacy landscape and bust cache
        run: python .github/scripts/tmp_purge_vibex_vibolf_landscape.py
      - name: Validate visual runtime
        run: node --check assets/csi-source-visuals.js
      - name: Verify save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$(cat /tmp/save_hash_before)"
      - name: Commit change
        run: |
          git add index.html assets/csi-source-visuals.js
          git commit -m "Purge VIBEX and VIBOLF landscape visuals"
          git push
      - name: Cleanup helpers
        run: |
          git rm .github/scripts/tmp_purge_vibex_vibolf_landscape.py .github/workflows/tmp-purge-vibex-vibolf-landscape.yml
          git commit -m "Remove temporary landscape purge helpers"
          git push
