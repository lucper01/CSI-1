name: Delete selected CSI slides
on:
  push:
    paths:
      - '.github/scripts/csi_delete_slides_15_26_32_33_42_52.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete selected slides
        run: python .github/scripts/csi_delete_slides_15_26_32_33_42_52.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit working deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Delete slides 15 26 32 33 42 and 52"
          git push
