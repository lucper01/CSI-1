name: Update year 1 training hours
on:
  push:
    paths:
      - '.github/scripts/csi_year1_training_hours.py'
      - '.github/workflows/csi-year1-training-hours.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update slide 31 hours
        run: python .github/scripts/csi_year1_training_hours.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update year 1 teaching and training hours"
          git push
