name: Integrate CSI content and structure updates
on:
  push:
    paths:
      - '.github/workflows/csi-integrate-batch-v1.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested CSI updates without changing DA
        run: |
          cat > /tmp/apply_csi.py <<'PY'
          from pathlib import Path
          import copy, json, re, hashlib, html
          import xml.etree.ElementTree as ET

          INDEX = Path('index.html')
          SAVE = Path('index_save.html')

          def load_deck(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, start, rel_end, slides

          text, start, rel_end, slides = load_deck(INDEX)
          save_text, _, _, save_slides = load_deck(SAVE)
          assert INDEX.read_bytes() == SAVE.read_bytes(), 'Expected index.html to start from latest saved checkpoint'
          assert len(slides) == 64, len(slides)
          orig = copy.deepcopy(slides)
          save_hash = hashlib.sha256(SAVE.read_bytes()).hexdigest()
          style_before = re.findall(r'<style\b[^>]*>.*?</style>', text, flags=re.S|re.I)

          AX1_FR = 'Limites Spatio-temporelles de l’olfaction vs celles de la vision et de l’audition'
          AX2_FR = 'Influence des Odeurs sur la Perception Spatio-Temporelle en Vision et en Audition'
          AX1_EN = 'Spatio-temporal limits of olfaction vs those of vision and audition'
          AX2_EN = 'Influence of odors on spatio-temporal perception in vision and audition'

          def set_slide(s, *, chapter=None, study=None, appendix=None, fr=None, en=None, divider=None, hero=None):
              if chapter is not None: s['chapter'] = chapter
              if study is not None: s['study'] = study
              if appendix is not None: s['appendix'] = appendix
              if divider is not None: s['divider'] = divider
              if hero is not None: s['hero'] = hero
              if fr:
                  s.setdefault('_fr', {}).update(fr)
              if en:
                  s.setdefault('_en', {}).update(en)
              if s.get('_fr'):
                  s.update(s['_fr'])
              return s

          def new_slide(base, *, chapter, study='', appendix=False, fr, en):
              s = copy.deepcopy(base)
              for k in ['hero','divider']:
                  s.pop(k, None)
              s['chapter'] = chapter
              s['study'] = study
              s['appendix'] = appendix
              s['_fr'] = copy.deepcopy(fr)
              s['_en'] = copy.deepcopy(en)
              s.update(s['_fr'])
              return s

          def card(label, title, body, dark=False):
              return f'<div class="card{" dark" if dark else ""}"><div class="mono">{label}</div><h3>{title}</h3><p>{body}</p></div>'

          # ------------------------------------------------------------------
          # Sommaire and general divider titles
          # ------------------------------------------------------------------
          for holder in [orig[1].get('_fr', {}), orig[1]]:
              c = holder.get('content','')
              c = c.replace('Première année','Année 1').replace('Deuxième année','Année 2').replace('Compléments','Perspectives').replace('Rétroplanning global','Rétroplanning')
              holder['content'] = c
          for holder in [orig[1].get('_en', {})]:
              c = holder.get('content','')
              c = c.replace('First year','Year 1').replace('Second year','Year 2').replace('Complementary studies','Perspectives').replace('Global timeline','Timeline')
              holder['content'] = c
          orig[1].update(orig[1]['_fr'])

          # Slide 4 - four requested references
          set_slide(orig[3], chapter='Cadre théorique', fr={
              'section':'Cadre théorique','kicker':'Vision et audition','title':'Vision et audition - espace et temps ne pèsent pas pareil',
              'lead':'Les deux modalités organisent l’espace et le temps, mais la littérature récente montre que leur pondération et leur interaction diffèrent selon la modalité et la tâche.',
              'content': '<div class="grid two">'
                  + card('Occelli et al., 2023','Sight for space, sound for time ?','Les interférences espace-temps ne sont pas symétriques : l’espace pèse davantage sur le temps en vision, alors que le temps pèse davantage sur l’espace en audition.')
                  + card('Capizzi et al., 2023','Attention à l’espace et au temps','L’attention spatiale et l’attention temporelle peuvent être étudiées séparément, mais leurs interactions dépendent du contexte et des demandes de la tâche.')
                  + card('Di Stefano & Spence, 2025','Percevoir la structure temporelle','La structure temporelle est construite au sein d’une modalité et entre modalités, avec des contraintes propres aux systèmes sensoriels.')
                  + card('Ampollini et al., 2024','Percevoir la synchronie','La fenêtre temporelle d’intégration varie selon les paires sensorielles et n’est donc pas une propriété uniforme de la perception multisensorielle.', True)
                  + '</div><div class="callout" style="margin-top:14px"><strong>Conséquence pour STOLF :</strong> vision et audition servent de références, mais pas de références interchangeables.</div>'
                  + '<div class="csi-cite">Occelli et al. (2023); Capizzi et al. (2023); Di Stefano & Spence (2025); Ampollini et al. (2024).</div>'
          }, en={
              'section':'Theoretical framework','kicker':'Vision and audition','title':'Vision and audition - space and time do not weigh the same',
              'lead':'Both modalities organize space and time, but recent work shows that their relative weighting and interaction depend on modality and task.',
              'content':'<div class="grid two">'
                  + card('Occelli et al., 2023','Sight for space, sound for time?','Spatio-temporal interference is modality-dependent: space weighs more on time in vision, whereas time weighs more on space in audition.')
                  + card('Capizzi et al., 2023','Attention to space and time','Spatial and temporal attention can be dissociated, yet their interaction depends on context and task demands.')
                  + card('Di Stefano & Spence, 2025','Perceiving temporal structure','Temporal structure is built within and between modalities, under modality-specific constraints.')
                  + card('Ampollini et al., 2024','Synchrony perception','Temporal binding windows differ across sensory pairings rather than constituting one uniform multisensory property.', True)
                  + '</div><div class="callout" style="margin-top:14px"><strong>For STOLF:</strong> vision and audition are reference systems, but not interchangeable ones.</div><div class="csi-cite">Occelli et al. (2023); Capizzi et al. (2023); Di Stefano & Spence (2025); Ampollini et al. (2024).</div>'
          })

          # Slide 5: keep wording already validated, harmonize EN
          set_slide(orig[4], chapter='Cadre théorique', en={'title':'Time - events we know how to organize'})

          # Slide 6 - explain spatial perception as slide 5 explains time
          set_slide(orig[5], chapter='Cadre théorique', fr={
              'section':'Cadre théorique','kicker':'Cadre théorique','title':'L’espace - des signaux que l’on sait organiser',
              'lead':'Percevoir l’espace consiste à extraire une position, organiser des relations entre éléments et attribuer les signaux à des sources ou à des objets.',
              'content':'<div class="grid three">'
                  + card('POSITION','Où se trouve le signal ?','La vision code directement la position dans la scène. L’audition reconstruit la direction d’une source à partir d’indices binauraux et spectraux.')
                  + card('RELATION','Comment les éléments sont-ils disposés ?','Distance, direction, profondeur, gauche-droite et relations entre objets structurent une scène au-delà de la seule position absolue.')
                  + card('ORGANISATION','À quelle source attribuer le signal ?','La cohérence spatiale contribue à regrouper les informations et à décider si plusieurs signaux renvoient au même événement.', True)
                  + '</div><div class="callout" style="margin-top:16px"><strong>Comme pour le temps :</strong> l’espace peut être décrit par des composantes élémentaires puis par leurs relations.</div><div class="csi-cite">Middlebrooks & Green (1991); Stein & Stanford (2008).</div>'
          }, en={
              'section':'Theoretical framework','kicker':'Theoretical framework','title':'Space - signals we know how to organize',
              'lead':'Perceiving space means extracting position, organizing relations among elements and assigning signals to sources or objects.',
              'content':'<div class="grid three">'
                  + card('POSITION','Where is the signal?','Vision directly represents position in a scene. Audition reconstructs source direction from binaural and spectral cues.')
                  + card('RELATION','How are elements arranged?','Distance, direction, depth, left-right relations and object-to-object relations structure a scene beyond absolute position.')
                  + card('ORGANIZATION','Which source generated the signal?','Spatial consistency contributes to grouping information and deciding whether several signals belong to one event.', True)
                  + '</div><div class="callout" style="margin-top:16px"><strong>As with time:</strong> space can be decomposed into elementary components and then their relations.</div><div class="csi-cite">Middlebrooks & Green (1991); Stein & Stanford (2008).</div>'
          })

          set_slide(orig[6], chapter='Cadre théorique', fr={'title':'Espace + temps - organiser un même événement'}, en={'title':'Space + time - organizing a single event'})

          # New slide between old 7 and 8 - genuine vision/audition synthesis
          va_slide = new_slide(orig[6], chapter='Cadre théorique', fr={
              'section':'Cadre théorique','kicker':'Vision / audition','title':'Deux organisations spatio-temporelles',
              'lead':'Vision et audition permettent toutes deux de répondre à « où ? » et « quand ? », mais elles n’accordent pas le même poids à ces dimensions.',
              'content':'<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>L’espace est directement disponible</h3><p>Positions, distances, limites de scène et mouvements sont explicitement représentés. Le temps est lu à travers les changements, l’ordre et la durée des événements visuels.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>Le temps est extrêmement structurant</h3><p>Onsets, offsets, rythme et synchronie sont très fins. La position spatiale est reconstruite à partir d’indices acoustiques plutôt que directement projetée dans une scène.</p></div></div><div class="callout" style="margin-top:16px"><strong>Point clé :</strong> il n’y a pas une seule norme spatio-temporelle. La comparaison avec l’olfaction doit donc conserver cette différence entre modalités.</div><div class="csi-cite">Occelli et al. (2023); Capizzi et al. (2023); Di Stefano & Spence (2025).</div>',
              'notes':'Faire de cette diapo la synthèse vision-audition avant de passer à l’olfaction.'
          }, en={
              'section':'Theoretical framework','kicker':'Vision / audition','title':'Two spatio-temporal organizations',
              'lead':'Vision and audition can both answer “where?” and “when?”, but they do not give the same weight to these dimensions.',
              'content':'<div class="grid two"><div class="card"><div class="mono">VISION</div><h3>Space is directly available</h3><p>Positions, distances, scene boundaries and motion are explicitly represented. Time is read through change, order and event duration.</p></div><div class="card dark"><div class="mono">AUDITION</div><h3>Time is highly structuring</h3><p>Onsets, offsets, rhythm and synchrony are finely resolved. Spatial position is reconstructed from acoustic cues rather than directly projected into a scene.</p></div></div><div class="callout" style="margin-top:16px"><strong>Key point:</strong> there is no single spatio-temporal benchmark. Comparisons with olfaction must preserve modality-specific differences.</div><div class="csi-cite">Occelli et al. (2023); Capizzi et al. (2023); Di Stefano & Spence (2025).</div>',
              'notes':'Synthesize vision and audition before moving to olfaction.'
          })

          # Old slide 8 and duplicate Less space, less time
          set_slide(orig[7], chapter='Cadre théorique')
          less_slide = new_slide(orig[7], chapter='Cadre théorique', fr={
              'section':'Introduction générale','kicker':'Relire Sela & Sobel','title':'Less space, less time',
              'lead':'« No space, no time » est un slogan utile, mais Sela et Sobel décrivent surtout une faible disponibilité attentionnelle de dimensions olfactives qui existent bel et bien.',
              'content':'<div class="grid three">'
                  + card('PERCEPTS','Il existe bien un espace et un temps olfactifs','La perception varie avec la proximité et la concentration, et l’échantillonnage respiratoire impose une structure rythmique au signal.')
                  + card('CHANGE BLINDNESS','Nous sommes peu sensibles aux changements','Sela et Sobel décrivent un état de « constant change-blindness » : des changements du monde olfactif peuvent survenir sans devenir saillants pour l’attention consciente.')
                  + card('LIMITES','Moins accessible ne veut pas dire absent','La localisation des sources reste grossière et les variations temporelles sont moins directement accessibles que dans les systèmes visuel et auditif. La question devient donc celle des limites, pas de l’existence.', True)
                  + '</div><div class="callout" style="margin-top:16px"><strong>Reformulation de la thèse :</strong> moins d’espace et moins de temps disponibles à la perception explicite - mais pas zéro espace, zéro temps.</div><div class="csi-cite">Sela & Sobel (2010); Mainland & Sobel (2006); Porter et al. (2007).</div>',
              'notes':'Insister sur la nuance : percepts présents, changements peu accessibles, localisation peu précise.'
          }, en={
              'section':'General introduction','kicker':'Reading Sela & Sobel again','title':'Less space, less time',
              'lead':'“No space, no time” is a useful slogan, but Sela and Sobel mainly describe poor attentional availability of olfactory dimensions that nevertheless exist.',
              'content':'<div class="grid three">'
                  + card('PERCEPTS','Olfactory space and time do exist','Perception changes with proximity and concentration, while respiratory sampling imposes rhythmic structure on the signal.')
                  + card('CHANGE BLINDNESS','We are relatively insensitive to change','Sela and Sobel describe a state of constant change-blindness: changes in the olfactory world may occur without becoming salient to conscious attention.')
                  + card('LIMITS','Less accessible does not mean absent','Source localization remains coarse and temporal variations are less directly available than in visual and auditory systems. The question is therefore about limits rather than existence.', True)
                  + '</div><div class="callout" style="margin-top:16px"><strong>Thesis reframing:</strong> less space and less time available to explicit perception - not zero space and zero time.</div><div class="csi-cite">Sela & Sobel (2010); Mainland & Sobel (2006); Porter et al. (2007).</div>',
              'notes':'Emphasize the nuance: percepts exist, changes are poorly accessible, localization is coarse.'
          })

          # Slide 9 axes - wording already validated; retain and slightly clarify lead
          set_slide(orig[8], chapter='Cadre théorique', fr={
              'lead':'Deux axes complémentaires : caractériser les limites spatio-temporelles propres à l’olfaction, puis tester si un contexte olfactif peut modifier la perception visuelle ou auditive.'
          }, en={
              'lead':'Two complementary axes: characterize olfactory spatio-temporal limits, then test whether an olfactory context can modify visual or auditory perception.'
          })

          # Compact theoretical replacement for useful content from old slides 10-13
          axis2_theory = new_slide(orig[11], chapter='Cadre théorique', fr={
              'section':'Cadre théorique','kicker':'Axe 2 - influence intersensorielle','title':'Une influence olfactive est plausible',
              'lead':'L’olfaction peut modifier le traitement d’autres modalités. La question de l’Axe 2 est donc de tester directement si cette influence atteint aussi leurs dimensions spatiales et temporelles.',
              'content':'<div class="grid two"><div class="card"><div class="mono">VISION - ARNAUD LELEU</div><h3>Une odeur peut aider la catégorisation visuelle</h3><p>Rekow et al. montrent qu’un contexte olfactif peut faciliter la catégorisation de stimuli visuels ambigus. Cela établit une influence olfactive sur le traitement visuel, sans présumer encore d’un effet spatial.</p></div><div class="card dark"><div class="mono">AUDITION - RENAUD BROCHARD</div><h3>Une odeur peut biaiser le tempo musical préféré</h3><p>Baccarani et Brochard montrent que des odeurs ambiantes relaxantes ou stimulantes modulent les préférences de tempo. Cela soutient une interaction olfactivo-auditive sans démontrer directement un changement du temps auditif.</p></div></div><div class="callout" style="margin-top:16px"><strong>Donc :</strong> l’influence intersensorielle est crédible a priori. STOLF teste maintenant jusqu’où elle s’étend dans l’espace et le temps perceptifs.</div><div class="csi-cite">Rekow, Baudouin, Durand, & Leleu (2022); Baccarani & Brochard (2024).</div>',
              'notes':'Bien distinguer preuve d’influence intersensorielle et preuve d’un effet directement spatio-temporel.'
          }, en={
              'section':'Theoretical framework','kicker':'Axis 2 - cross-sensory influence','title':'An olfactory influence is plausible',
              'lead':'Olfaction can alter processing in other modalities. Axis 2 therefore tests directly whether this influence also reaches their spatial and temporal dimensions.',
              'content':'<div class="grid two"><div class="card"><div class="mono">VISION - ARNAUD LELEU</div><h3>Odor can assist visual categorization</h3><p>Rekow et al. show that olfactory context can facilitate categorization of ambiguous visual stimuli. This establishes an olfactory influence on visual processing without yet demonstrating a spatial effect.</p></div><div class="card dark"><div class="mono">AUDITION - RENAUD BROCHARD</div><h3>Odor can bias preferred musical tempo</h3><p>Baccarani and Brochard show that relaxing or stimulating ambient odors shift musical-tempo preferences. This supports olfactory-auditory interaction without directly demonstrating altered auditory time perception.</p></div></div><div class="callout" style="margin-top:16px"><strong>Therefore:</strong> cross-sensory influence is plausible a priori. STOLF now tests how far it extends into perceptual space and time.</div><div class="csi-cite">Rekow et al. (2022); Baccarani & Brochard (2024).</div>',
              'notes':'Distinguish evidence for cross-sensory influence from direct evidence for spatio-temporal effects.'
          })

          # Architecture divider and axis summary
          set_slide(orig[13], chapter='Architecture', fr={'section':'Architecture','title':'Architecture de la thèse','content':'<div class="section-divider-inner"><span class="section-divider-number">PARTIE 2</span><h1>Architecture de la thèse</h1><i aria-hidden="true"></i></div>'}, en={'section':'Architecture','title':'Thesis architecture'})

          axis15_fr = '<div class="v16-axes"><article><b>Axe 1</b><h3>'+AX1_FR+'</h3><p>Caractériser précisément comment les informations olfactives, visuelles et auditives s’organisent dans l’espace et dans le temps...</p><div class="v16-pills"><span data-study="TWIXAV">TWIXAV</span><span data-study="TWIXOLF">TWIXOLF</span></div><div class="v16-pills"><span data-study="SOFT">SOFT</span><span data-study="SOLAR">SOLAR</span></div></article><article><b>Axe 2</b><h3>'+AX2_FR+'</h3><p>Déterminer dans quelle mesure la présence et les propriétés d’une odeur modifient la perception et la représentation de l’espace et du temps dans les autres modalités.</p><div class="v16-pills"><span data-study="VIBEX">VIBEX</span><span data-study="OASIS">OASIS</span></div><div class="v16-pills"><span data-study="BRAUD">BRAUD</span><span data-study="BRAUDOLF">BRAUDOLF</span></div></article></div>'
          axis15_en = '<div class="v16-axes"><article><b>Axis 1</b><h3>'+AX1_EN+'</h3><p>Precisely characterize how olfactory, visual and auditory information is organized in space and time.</p><div class="v16-pills"><span data-study="TWIXAV">TWIXAV</span><span data-study="TWIXOLF">TWIXOLF</span></div><div class="v16-pills"><span data-study="SOFT">SOFT</span><span data-study="SOLAR">SOLAR</span></div></article><article><b>Axis 2</b><h3>'+AX2_EN+'</h3><p>Determine to what extent odor presence and properties modify spatial and temporal perception in other modalities.</p><div class="v16-pills"><span data-study="VIBEX">VIBEX</span><span data-study="OASIS">OASIS</span></div><div class="v16-pills"><span data-study="BRAUD">BRAUD</span><span data-study="BRAUDOLF">BRAUDOLF</span></div></article></div>'
          set_slide(orig[14], chapter='Architecture', fr={'section':'Architecture','kicker':'Deux axes','title':'Deux axes','content':axis15_fr}, en={'section':'Architecture','kicker':'Two axes','title':'Two axes','content':axis15_en})

          tree_fr = '''<div class="grid two"><div class="card"><div class="mono">AXE 1</div><h3>Temps et espace - limites de l’olfaction</h3><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px"><span class="badge">Année 1</span><strong data-study="TWIXAV">TWIXAV</strong><span>→</span><span class="badge">Année 2</span><strong data-study="SOFT">SOFT</strong><span>→</span><span class="badge">Année 3</span><strong data-study="TWIXOLF">TWIXOLF</strong><span>→</span><strong data-study="SOLAR" style="opacity:.55">SOLAR si temps</strong></div><p style="margin-top:16px">TWIXAV fournit la référence audiovisuelle, SOFT dissèque les composantes temporelles, puis TWIXOLF transpose la fenêtre temporelle à l’olfaction.</p></div><div class="card dark"><div class="mono">AXE 2</div><h3>Influence de l’olfaction</h3><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px"><span class="badge">Année 1</span><strong data-study="VIBEX">VIBEX</strong><span>→</span><span class="badge">Année 2</span><strong data-study="OASIS">OASIS</strong><span>→</span><strong data-study="BRAUD" style="opacity:.55">BRAUD</strong><span>→</span><strong data-study="BRAUDOLF" style="opacity:.45">BRAUDOLF</strong></div><p style="margin-top:16px">VIBEX établit la référence visuelle, OASIS introduit l’olfaction, puis les extensions auditives ne sont lancées que si le calendrier le permet.</p></div></div><div class="callout" style="margin-top:16px"><strong>Lecture temporelle :</strong> TWIXAV + VIBEX en année 1 - SOFT + OASIS en année 2 - TWIXOLF en année 3 - SOLAR / BRAUD / BRAUDOLF si le temps restant le permet.</div>'''
          tree_en = '''<div class="grid two"><div class="card"><div class="mono">AXIS 1</div><h3>Time and space - olfactory limits</h3><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px"><span class="badge">Year 1</span><strong>TWIXAV</strong><span>→</span><span class="badge">Year 2</span><strong>SOFT</strong><span>→</span><span class="badge">Year 3</span><strong>TWIXOLF</strong><span>→</span><strong style="opacity:.55">SOLAR if time allows</strong></div><p style="margin-top:16px">TWIXAV provides the audiovisual reference, SOFT decomposes temporal components, and TWIXOLF then transfers temporal binding to olfaction.</p></div><div class="card dark"><div class="mono">AXIS 2</div><h3>Influence of olfaction</h3><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px"><span class="badge">Year 1</span><strong>VIBEX</strong><span>→</span><span class="badge">Year 2</span><strong>OASIS</strong><span>→</span><strong style="opacity:.55">BRAUD</strong><span>→</span><strong style="opacity:.45">BRAUDOLF</strong></div><p style="margin-top:16px">VIBEX establishes the visual reference, OASIS introduces olfaction, and auditory extensions are launched only if the schedule allows.</p></div></div>'''
          set_slide(orig[15], chapter='Architecture', fr={'section':'Architecture','kicker':'Trajectoire des études','title':'Arbre des études','lead':'Chaque étude répond à la précédente et s’inscrit dans une année cible.','content':tree_fr}, en={'section':'Architecture','kicker':'Study trajectory','title':'Study tree','lead':'Each study answers the previous one and has a target year.','content':tree_en})

          # Year 1 divider/general titles
          set_slide(orig[16], chapter='Année 1', fr={'section':'Année 1','title':'Année 1','content':'<div class="section-divider-inner"><span class="section-divider-number">PARTIE 3</span><h1>Année 1</h1><i aria-hidden="true"></i></div>'}, en={'section':'Year 1','title':'Year 1','content':'<div class="section-divider-inner"><span class="section-divider-number">PART 3</span><h1>Year 1</h1><i aria-hidden="true"></i></div>'})
          set_slide(orig[17], chapter='Année 1', fr={'section':'Année 1','title':'Année 1 - bilan'}, en={'section':'Year 1','title':'Year 1 - summary'})

          # TWIXAV intro, method, merged results, transition, recap
          set_slide(orig[18], chapter='Année 1', study='TWIXAV', fr={
              'section':'Année 1','kicker':'TWIXAV - Introduction','title':'TWIXAV - référence audiovisuelle','lead':'TWIXAV établit une référence temporelle audiovisuelle avant toute transposition à l’olfaction.',
              'content':'<div class="grid three">'+card('RÉFÉRENCE','Une Temporal Binding Window audiovisuelle','Le jugement de simultanéité fournit une fenêtre de tolérance temporelle dans deux modalités dont l’intégration est bien documentée.')+card('DOUBLE OBJECTIF','La durée comme paramètre et comme question','Tester plusieurs durées sert à choisir un paramètre robuste pour la suite, mais aussi à documenter théoriquement si la durée elle-même modifie la fenêtre.')+card('SUITE','Vers TWIXOLF','Cette référence sera ensuite transposée à une paire impliquant l’olfaction afin de comparer directement les limites temporelles.',True)+'</div>'
          }, en={
              'section':'Year 1','kicker':'TWIXAV - Introduction','title':'TWIXAV - audiovisual reference','lead':'TWIXAV establishes an audiovisual temporal reference before any transfer to olfaction.',
              'content':'<div class="grid three">'+card('REFERENCE','An audiovisual temporal binding window','Simultaneity judgments provide a temporal tolerance window in two well-characterized modalities.')+card('DUAL GOAL','Duration as parameter and question','Testing several durations both selects robust settings for later work and tests theoretically whether duration itself changes the window.')+card('NEXT','Toward TWIXOLF','The audiovisual benchmark is then transferred to a pairing involving olfaction for a direct comparison of temporal limits.',True)+'</div>'
          })

