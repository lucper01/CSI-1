              if 'deux axes' in t: return 'Axes'
              if 'arbre' in t: return 'Arbre des études'
              if 'trajectoire' in t: return 'Trajectoire'
              if 'less space' in t or 'no space' in t: return 'Olfaction'
              if 'temps -' in t: return 'Temps'
              if 'espace -' in t: return 'Espace'
              return steps[0]

          def tl_html(steps, cur):
              spans=[]
              for step in steps:
                  active = step == cur
                  spans.append('<span style="font-size:.68rem;font-weight:850;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:' + ('var(--accent)' if active else 'var(--white)') + ';color:' + ('#fff' if active else 'var(--muted)') + '">' + html.escape(step) + '</span>')
              return '<div aria-label="Timeline de la partie" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 9px">' + ''.join(spans) + '</div>'

          for s in main:
              if s.get('divider') or s.get('hero') or s.get('chapter') not in timeline_defs:
                  continue
              steps = timeline_defs[s['chapter']]
              cur = current_step(s, steps)
              fr_prefix = tl_html(steps, cur)
              en_prefix = fr_prefix
              study = s.get('study','')
              if study in axis1_studies:
                  fr_prefix += '<div class="mono" style="margin:0 0 9px;color:var(--accent-strong)">AXE 1 · '+AX1_FR+'</div>'
                  en_prefix += '<div class="mono" style="margin:0 0 9px;color:var(--accent-strong)">AXIS 1 · '+AX1_EN+'</div>'
              elif study in axis2_studies:
                  fr_prefix += '<div class="mono" style="margin:0 0 9px;color:var(--accent-strong)">AXE 2 · '+AX2_FR+'</div>'
                  en_prefix += '<div class="mono" style="margin:0 0 9px;color:var(--accent-strong)">AXIS 2 · '+AX2_EN+'</div>'
              if s.get('_fr'):
                  s['_fr']['content'] = fr_prefix + s['_fr'].get('content','')
              if s.get('_en'):
                  s['_en']['content'] = en_prefix + s['_en'].get('content','')
              s.update(s['_fr'])

          # Assertions for visible content / axes / removed slides.
          for s in main:
              blob = json.dumps(s, ensure_ascii=False)
              assert 'SORBET' not in blob, s.get('title')
              assert 'COBEX' not in blob, s.get('title')
          assert 'SOLAR' in json.dumps(orig[14]['_fr'], ensure_ascii=False) and 'TWIXOLF' in json.dumps(orig[14]['_fr'], ensure_ascii=False)
          assert 'TWIXOLF' in json.dumps(orig[51]['_fr'], ensure_ascii=False)
          assert 'À consolider' not in json.dumps(final, ensure_ascii=False)

          # ------------------------------------------------------------------
          # SVG helpers - requested VIBEX graph grammar.
          # ------------------------------------------------------------------
          psame = {
              'Petite': {'LL':(79.4,74.3,84.5),'SS':(68.4,60.4,76.4),'SL':(58.4,49.7,67.2),'LS':(27.8,19.9,35.7)},
              'Moyenne':{'LL':(77.5,71.6,83.5),'SS':(77.6,72.6,82.7),'SL':(50.5,41.1,59.9),'LS':(25.2,18.6,31.7)},
              'Grande': {'LL':(79.5,73.4,85.6),'SS':(77.9,71.0,84.9),'SL':(47.1,39.4,54.8),'LS':(32.3,23.7,40.8)},
          }
          rt = {
              'Petite': {'LL':821,'SS':850,'SL':842,'LS':789},
              'Moyenne':{'LL':838,'SS':808,'SL':848,'LS':811},
              'Grande': {'LL':803,'SS':804,'SL':821,'LS':807},
          }
          size_colors={'Petite':'#8EB8E5','Moyenne':'#9FA7A3','Grande':'#D8AF55'}
          cond_colors={'LL':'#173f5f','SS':'#6d8b7a','SL':'#2f7d5a','LS':'#9bbcaf'}

          def svg_header(title, desc, w=920,h=520):
              return [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w} {h}" role="img"><title>{title}</title><desc>{desc}</desc><rect width="100%" height="100%" rx="24" fill="#fff"/>']

          def ymap(v, lo, hi, top=65, bottom=440):
              return bottom - (v-lo)/(hi-lo)*(bottom-top)

          # Slide 28 overview: condition x-axis, size series, pairwise LL-SS and SL-LS only, labels on error bars.
          out=svg_header('VIBEX - condition et taille','Moyennes et IC95, LL relié à SS et SL relié à LS pour chaque taille.')
          xs={'LL':145,'SS':330,'SL':545,'LS':730}; offsets={'Petite':-12,'Moyenne':0,'Grande':12}
          for tick in [20,40,60,80]:
              y=ymap(tick,15,90); out.append(f'<line x1="80" y1="{y:.1f}" x2="780" y2="{y:.1f}" stroke="#e6ebe8"/><text x="68" y="{y+5:.1f}" text-anchor="end" font-family="Arial" font-size="13" fill="#5f6f65">{tick}</text>')
          out.append('<line x1="80" y1="440" x2="780" y2="440" stroke="#26342d" stroke-width="2"/><line x1="80" y1="65" x2="80" y2="440" stroke="#26342d" stroke-width="2"/><text x="24" y="255" transform="rotate(-90 24 255)" text-anchor="middle" font-family="Arial" font-size="16" fill="#26342d">Réponses « identique » (%)</text>')
          for cond,x in xs.items(): out.append(f'<text x="{x}" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#26342d">{cond}</text>')
          for size in ['Petite','Moyenne','Grande']:
              col=size_colors[size]; off=offsets[size]
              for a,b in [('LL','SS'),('SL','LS')]:
                  y1=ymap(psame[size][a][0],15,90); y2=ymap(psame[size][b][0],15,90)
                  out.append(f'<line x1="{xs[a]+off}" y1="{y1:.1f}" x2="{xs[b]+off}" y2="{y2:.1f}" stroke="{col}" stroke-width="3" opacity=".9"/>')
              for cond in ['LL','SS','SL','LS']:
                  mean,low,high=psame[size][cond]; x=xs[cond]+off; y=ymap(mean,15,90); yl=ymap(low,15,90); yh=ymap(high,15,90)
                  out += [f'<line x1="{x}" y1="{yh:.1f}" x2="{x}" y2="{yl:.1f}" stroke="{col}" stroke-width="2.4"/>',f'<line x1="{x-5}" y1="{yh:.1f}" x2="{x+5}" y2="{yh:.1f}" stroke="{col}" stroke-width="2.4"/>',f'<line x1="{x-5}" y1="{yl:.1f}" x2="{x+5}" y2="{yl:.1f}" stroke="{col}" stroke-width="2.4"/>',f'<circle cx="{x}" cy="{y:.1f}" r="5.5" fill="#fff" stroke="{col}" stroke-width="3"/>',f'<text x="{x}" y="{max(18,yh-7):.1f}" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="{col}">{mean:.1f}</text>']
          for j,size in enumerate(['Petite','Moyenne','Grande']):
              x=805; y=130+j*38; col=size_colors[size]; out.append(f'<line x1="{x}" y1="{y}" x2="{x+26}" y2="{y}" stroke="{col}" stroke-width="3"/><circle cx="{x+13}" cy="{y}" r="4.5" fill="#fff" stroke="{col}" stroke-width="3"/><text x="{x+35}" y="{y+5}" font-family="Arial" font-size="14" fill="#26342d">{size}</text>')
          out.append('<text x="430" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d6143">LL-SS et SL-LS reliées séparément - moyenne et IC95</text></svg>')
          Path('assets/results/vibex_m1_olivia.svg').write_text(''.join(out),encoding='utf-8')

          def faceted_psame_svg():
              out=svg_header('VIBEX - condition par taille','Trois facettes de taille, conditions en abscisse, pourcentage en ordonnée, moyennes et IC95.')
              panels=[('Petite',60),('Moyenne',350),('Grande',640)]
              for tick in [20,40,60,80]:
                  y=ymap(tick,15,90,95,425); out.append(f'<line x1="50" y1="{y:.1f}" x2="900" y2="{y:.1f}" stroke="#eef1ef"/>')
                  out.append(f'<text x="42" y="{y+4:.1f}" text-anchor="end" font-family="Arial" font-size="12" fill="#5f6f65">{tick}</text>')
              out.append('<text x="18" y="260" transform="rotate(-90 18 260)" text-anchor="middle" font-family="Arial" font-size="15" fill="#26342d">Réponses « identique » (%)</text>')
              for size,x0 in panels:
                  out.append(f'<rect x="{x0}" y="65" width="250" height="390" rx="16" fill="#fbfcfb" stroke="#e3e9e6"/><text x="{x0+125}" y="88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173f32">{size}</text>')
                  cx=[x0+38,x0+96,x0+154,x0+212]
                  for (cond,x) in zip(['LL','SS','SL','LS'],cx):
                      mean,low,high=psame[size][cond]; y=ymap(mean,15,90,105,425); yl=ymap(low,15,90,105,425); yh=ymap(high,15,90,105,425); col=cond_colors[cond]
                      out += [f'<line x1="{x}" y1="{yh:.1f}" x2="{x}" y2="{yl:.1f}" stroke="{col}" stroke-width="2.2"/>',f'<line x1="{x-4}" y1="{yh:.1f}" x2="{x+4}" y2="{yh:.1f}" stroke="{col}" stroke-width="2.2"/>',f'<line x1="{x-4}" y1="{yl:.1f}" x2="{x+4}" y2="{yl:.1f}" stroke="{col}" stroke-width="2.2"/>',f'<circle cx="{x}" cy="{y:.1f}" r="5" fill="#fff" stroke="{col}" stroke-width="3"/>',f'<text x="{x}" y="{max(103,yh-6):.1f}" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="{col}">{mean:.1f}</text>',f'<text x="{x}" y="448" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#26342d">{cond}</text>']
                  # connect the two meaningful pairs inside each facet
                  for a,b in [('LL','SS'),('SL','LS')]:
                      ia=['LL','SS','SL','LS'].index(a); ib=['LL','SS','SL','LS'].index(b)
                      out.append(f'<line x1="{cx[ia]}" y1="{ymap(psame[size][a][0],15,90,105,425):.1f}" x2="{cx[ib]}" y2="{ymap(psame[size][b][0],15,90,105,425):.1f}" stroke="#8b9891" stroke-width="1.7" opacity=".55"/>')
              out.append('</svg>'); return ''.join(out)
          Path('assets/results/vibex_size_interaction.svg').write_text(faceted_psame_svg(),encoding='utf-8')

          def faceted_rt_svg():
              out=svg_header('VIBEX - temps de réponse par taille','Trois facettes de taille, conditions en abscisse et temps de réponse en ordonnée. Pas de barres d’erreur car les intervalles par taille ne sont pas disponibles.')
              panels=[('Petite',60),('Moyenne',350),('Grande',640)]
              def yrt(v): return ymap(v,770,870,105,425)
              for tick in [780,800,820,840,860]:
                  y=yrt(tick); out.append(f'<line x1="50" y1="{y:.1f}" x2="900" y2="{y:.1f}" stroke="#eef1ef"/><text x="42" y="{y+4:.1f}" text-anchor="end" font-family="Arial" font-size="12" fill="#5f6f65">{tick}</text>')
              out.append('<text x="18" y="260" transform="rotate(-90 18 260)" text-anchor="middle" font-family="Arial" font-size="15" fill="#26342d">Temps de réponse (ms)</text>')
              for size,x0 in panels:
                  out.append(f'<rect x="{x0}" y="65" width="250" height="390" rx="16" fill="#fbfcfb" stroke="#e3e9e6"/><text x="{x0+125}" y="88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173f32">{size}</text>')
                  cx=[x0+38,x0+96,x0+154,x0+212]
                  for a,b in [('LL','SS'),('SL','LS')]:
                      ia=['LL','SS','SL','LS'].index(a); ib=['LL','SS','SL','LS'].index(b)
                      out.append(f'<line x1="{cx[ia]}" y1="{yrt(rt[size][a]):.1f}" x2="{cx[ib]}" y2="{yrt(rt[size][b]):.1f}" stroke="#8b9891" stroke-width="2" opacity=".65"/>')
                  for cond,x in zip(['LL','SS','SL','LS'],cx):
                      val=rt[size][cond]; y=yrt(val); col=cond_colors[cond]
                      out += [f'<circle cx="{x}" cy="{y:.1f}" r="5.5" fill="#fff" stroke="{col}" stroke-width="3"/>',f'<text x="{x}" y="{y-9:.1f}" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="{col}">{val}</text>',f'<text x="{x}" y="448" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#26342d">{cond}</text>']
              out.append('<text x="460" y="500" text-anchor="middle" font-family="Arial" font-size="13" fill="#5f6f65">Moyennes descriptives - aucun IC par taille fabriqué</text></svg>'); return ''.join(out)
          Path('assets/results/vibex_rt_interaction.svg').write_text(faceted_rt_svg(),encoding='utf-8')

          # Validate SVG XML
          for f in ['assets/results/vibex_m1_olivia.svg','assets/results/vibex_size_interaction.svg','assets/results/vibex_rt_interaction.svg']:
              ET.parse(f)

          # Final JS slide replacement - do not touch CSS/style blocks.
          final_json = json.dumps(final, ensure_ascii=False, separators=(',', ':'))
          new_text = text[:start] + final_json + text[start+rel_end:]
          INDEX.write_text(new_text, encoding='utf-8')

          # Backup remains frozen during the whole batch.
          assert hashlib.sha256(SAVE.read_bytes()).hexdigest() == save_hash
          style_after = re.findall(r'<style\b[^>]*>.*?</style>', new_text, flags=re.S|re.I)
          assert style_after == style_before, 'DA/CSS style blocks changed unexpectedly'

          # Reparse final deck and validate appendix order.
          _, _, _, check = load_deck(INDEX)
          assert len(check) == len(final)
          first_app = next(i for i,s in enumerate(check) if s.get('appendix'))
          assert all(not s.get('appendix') for s in check[:first_app])
          assert all(s.get('appendix') for s in check[first_app:])
          assert check[first_app-1]['title'] == 'Merci pour votre attention'
          assert all('SORBET' not in json.dumps(s,ensure_ascii=False) and 'COBEX' not in json.dumps(s,ensure_ascii=False) for s in check[:first_app])
          print(f'Integrated CSI batch: {len(check)} slides, {first_app} main + {len(check)-first_app} appendices')
          PY
          python /tmp/apply_csi.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',t,flags=re.S|re.I)
          assert scripts
          Path('/tmp/csi.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/csi.js
