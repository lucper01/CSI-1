name: CSI save before speaker notes window

on:
  push:
    paths:
      - '.github/workflows/csi-save-before-notes-window.yml'

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current working presentation
        run: |
          cp index.html index_save.html
          git add index_save.html
          if ! git diff --cached --quiet; then
            git commit -m "Save CSI before speaker notes window"
            git push
          fi
      - name: Remove temporary save workflow
        run: |
          rm -f .github/workflows/csi-save-before-notes-window.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary save workflow"
            git push
          fi
