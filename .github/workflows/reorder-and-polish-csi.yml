name: Reorder and polish CSI
on:
  push:
    paths:
      - '.github/workflows/reorder-and-polish-csi.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update presentation
        run: python3 tools_temp/reorder_csi.py
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          t=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          assert blocks
          for i,b in enumerate(blocks):
              f=Path(f'/tmp/csi_script_{i}.js')
              f.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print('Validated',len(blocks),'inline scripts')
          PY
      - name: Commit clean update
        run: |
          git rm .github/workflows/reorder-and-polish-csi.yml
          git rm -r tools_temp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Reorder CSI slides and align study colors"
          git push
