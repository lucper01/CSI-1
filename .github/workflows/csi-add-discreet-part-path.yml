name: Add discreet part progress
on:
  push:
    paths:
      - '.github/workflows/csi-add-discreet-part-path.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discreet part progress indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('index.html')
          save = Path('index_save.html')
          save_hash = hashlib.sha256(save.read_bytes()).hexdigest()
          text = p.read_text(encoding='utf-8')

          assert 'csi-part-path-style' not in text
          assert 'function partPathMarkup(' not in text

          css = r'''
  <style id="csi-part-path-style">
    .csi-part-path {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      align-items: start;
      width: min(760px, 100%);
      margin: 0 0 11px;
      padding: 0 2px;
      opacity: .82;
      user-select: none;
      pointer-events: none;
    }
    .csi-part-node {
      position: relative;
      min-width: 0;
      padding-top: 9px;
      text-align: center;
      color: color-mix(in srgb, var(--muted) 76%, transparent);
      font-size: .56rem;
      font-weight: 760;
      line-height: 1.1;
      letter-spacing: .045em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .csi-part-node::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line);
    }
    .csi-part-node:first-child::before { left: 50%; }
    .csi-part-node:last-child::before { right: 50%; }
    .csi-part-node i {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: color-mix(in srgb, var(--muted) 22%, var(--white));
      border: 1px solid var(--white);
      box-shadow: 0 0 0 1px var(--line);
    }
    .csi-part-node.past i {
      background: color-mix(in srgb, var(--accent) 38%, var(--white));
    }
    .csi-part-node.active {
      color: var(--accent-strong);
      font-weight: 920;
      opacity: 1;
    }
    .csi-part-node.active i {
      background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
    }
    html[data-theme="dark"] .csi-part-node i {
      border-color: var(--cream);
    }
    body.high-contrast .csi-part-path { opacity: 1; }
    body.high-contrast .csi-part-node.active i { box-shadow: 0 0 0 2px currentColor; }
    @media (max-width: 760px) {
      .csi-part-path { width: 100%; margin-bottom: 9px; }
      .csi-part-node { font-size: .5rem; letter-spacing: 0; }
    }
    @media (max-width: 560px) {
      .csi-part-node b { display: none; }
      .csi-part-path { margin-bottom: 7px; }
    }
  </style>
'''
          text = text.replace('</head>', css + '\n</head>', 1)

          anchor = '  function renderSlides(){\n'
          assert anchor in text
          helper = r'''  const CSI_PARTS = [
    { chapter:'Cadre théorique', fr:'Contexte', en:'Context' },
    { chapter:'Architecture', fr:'Architecture', en:'Architecture' },
    { chapter:'Première année', fr:'Année 1', en:'Year 1' },
    { chapter:'Deuxième année', fr:'Année 2', en:'Year 2' },
    { chapter:'Compléments', fr:'Compléments', en:'Extensions' },
    { chapter:'Rétroplanning global', fr:'Rétroplanning', en:'Timeline' }
  ];

  function partIndexForSlide(i){
    let active = -1;
    CSI_PARTS.forEach((part, idx) => {
      const dividerIndex = slides.findIndex(s => s.divider && s.chapter === part.chapter);
      if(dividerIndex >= 0 && i > dividerIndex) active = idx;
    });
    return active;
  }

  function partPathMarkup(i, s){
    if(s.hero || s.divider || s.appendix) return '';
    const active = partIndexForSlide(i);
    if(active < 0) return '';
    const en = document.documentElement.lang === 'en';
    return `<div class="csi-part-path" aria-hidden="true">${CSI_PARTS.map((part, idx) => `<span class="csi-part-node${idx < active ? ' past' : ''}${idx === active ? ' active' : ''}"><i></i><b>${en ? part.en : part.fr}</b></span>`).join('')}</div>`;
  }

'''
          text = text.replace(anchor, helper + anchor, 1)

          old = '      const inner = s.hero ? `<div class="slide-shell">${s.content}</div>` : `<div class="slide-shell"><div class="slide-kicker">${s.kicker||s.section}</div><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:\'\'}<div class="slide-content">${s.content||\'\'}</div></div>`;'
          new = '      const inner = s.hero ? `<div class="slide-shell">${s.content}</div>` : `<div class="slide-shell">${partPathMarkup(i,s)}<div class="slide-kicker">${s.kicker||s.section}</div><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:\'\'}<div class="slide-content">${s.content||\'\'}</div></div>`;'
          assert old in text, 'renderSlides inner template not found'
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          assert hashlib.sha256(save.read_bytes()).hexdigest() == save_hash
          assert 'csi-part-path-style' in text
          assert 'function partPathMarkup(' in text
          assert '${partPathMarkup(i,s)}<div class="slide-kicker">' in text
          print('Discreet six-part progress indicator integrated.')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          assert scripts
          Path('/tmp/csi.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/csi.js
      - name: Verify frozen backup
        run: |
          test "$(git hash-object index_save.html)" = "0cf6cb4e08ec3da2bb94c7de2c62ddd154d4c365"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add discreet part progress indicator"
          git push
