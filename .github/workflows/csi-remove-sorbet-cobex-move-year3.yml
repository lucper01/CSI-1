name: Remove SORBET COBEX and move year 3 activity
on:
  push:
    paths:
      - '.github/scripts/csi_remove_sorbet_cobex_move_year3.py'
      - '.github/workflows/csi-remove-sorbet-cobex-move-year3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update deck structure
        run: python .github/scripts/csi_remove_sorbet_cobex_move_year3.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove SORBET COBEX and move year 3 activities"
          git push
