name: Harmonize hardware resource cards
on:
  push:
    paths:
      - '.github/workflows/harmonize-hardware-cards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harmonize hardware cards and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides', h, re.S)
          if not m:
              raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))

          hardware={
              'SOFT - Méthode':'Sniff-0 · Spir-0 · BIOPAC MP160 · EEG BioSemi',
              'OASIS - Méthode':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'TWIXOLF - Méthode':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'SORBET':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'SOLAR':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'COBEX':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'BRAUD':'Sniff-0 · Spir-0 · BIOPAC MP160',
              'BRAUDOLF':'Sniff-0 · Spir-0 · BIOPAC MP160',
          }

          hw_re=re.compile(r'<div class="hardware-floating"[^>]*>.*?</div></div>', re.S)
          sf_re=re.compile(r'(<div class="study-floating"[^>]*>)(.*?)(</div>)', re.S)

          def harmonize(content, title, lang='fr'):
              if not isinstance(content,str): return content
              label='Matériel' if lang=='fr' else 'Hardware'
              value=hardware[title]
              card=f'<div class="float-card hardware-card"><b>{label}</b><span>{value}</span></div>'
              # Remove old hardware pill bar.
              content2, n=hw_re.subn('', content, count=1)
              if n!=1:
                  raise SystemExit(f'hardware block not found exactly once: {title} / {lang} / {n}')
              # Method slides already have a poster resource row: append hardware into that same row.
              if title.endswith(' - Méthode'):
                  def add_card(mm):
                      return mm.group(1)+mm.group(2)+card+mm.group(3)
                  content2, n2=sf_re.subn(add_card, content2, count=1)
                  if n2!=1:
                      raise SystemExit(f'study-floating poster row missing: {title} / {lang}')
              else:
                  # Extensions: place the hardware card after the complete study block,
                  # matching the bottom-right resource-row ergonomics of VIBEX/TWIXAV.
                  content2 += f'<div class="study-floating hardware-resource-row" aria-label="{label} {title}">{card}</div>'
              return content2

          for s in slides:
              t=s.get('title','')
              if t not in hardware: continue
              # Top-level content.
              s['content']=harmonize(s.get('content',''),t,'fr')
              # Localized content.
              if isinstance(s.get('_fr'),dict) and isinstance(s['_fr'].get('content'),str):
                  s['_fr']['content']=harmonize(s['_fr']['content'],t,'fr')
              if isinstance(s.get('_en'),dict) and isinstance(s['_en'].get('content'),str):
                  s['_en']['content']=harmonize(s['_en']['content'],t,'en')

          # Slide 34 wording: remove the now-unnecessary calendar-slide wording.
          act=next((s for s in slides if s.get('title')=='Activités doctorales prévues - 2026-2027'),None)
          if not act: raise SystemExit('upcoming activities slide not found')
          fr_old='La diffusion scientifique se poursuit en parallèle des collectes, sans diapo de calendrier séparée.'
          fr_new='La diffusion scientifique se poursuit en parallèle des collectes.'
          en_old='Scientific dissemination continues alongside data collection, without a separate communication-calendar slide.'
          en_new='Scientific dissemination continues alongside data collection.'
          for container in (act, act.get('_fr',{})):
              if isinstance(container,dict) and isinstance(container.get('content'),str):
                  container['content']=container['content'].replace(fr_old,fr_new)
          if isinstance(act.get('_en'),dict) and isinstance(act['_en'].get('content'),str):
              act['_en']['content']=act['_en']['content'].replace(en_old,en_new)

          # Honor the previously fixed SOFT no-pilot status if the old phrase is still present elsewhere.
          for s in slides:
              for container in (s, s.get('_fr',{}), s.get('_en',{})):
                  if not isinstance(container,dict): continue
                  for field in ('content','lead','notes'):
                      if not isinstance(container.get(field),str): continue
                      container[field]=container[field].replace('critères de simplification après le pilote','critères de simplification si nécessaire')
                      container[field]=container[field].replace('simplification criteria after the pilot','simplification criteria if needed')

          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          h=h[:m.start(1)]+arr+h[m.end(1):]

          css='''
/* Hardware resource cards V3 - same ergonomics as VIBEX/TWIXAV resource cards */
.study-floating .float-card.hardware-card{
  min-width:190px;
  max-width:245px;
  padding:10px 13px;
  justify-content:center;
  background:color-mix(in srgb,var(--white) 94%,var(--study,var(--accent)) 6%);
}
.study-floating .float-card.hardware-card>span{
  display:block;
  margin-top:2px;
  font-size:.72rem;
  line-height:1.25;
  font-weight:520;
  color:var(--text);
  white-space:normal;
}
.study-floating.hardware-resource-row{
  margin-top:14px!important;
  margin-left:auto!important;
  justify-content:flex-end!important;
}
@media(max-width:900px){
  .study-floating .float-card.hardware-card{min-width:0;max-width:none;flex:1 1 190px}
  .study-floating.hardware-resource-row{margin-left:0!important;justify-content:flex-start!important}
}
'''
          marker='</style>\n\n<style id="csi-flat-v17">'
          if marker not in h: raise SystemExit('style insertion marker not found')
          h=h.replace(marker,css+'\n</style>\n\n<style id="csi-flat-v17">',1)
          p.write_text(h,encoding='utf-8')
          print('updated slides:', ', '.join(hardware))
          PY
      - name: Validate content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          slides=json.loads(m.group(1))
          assert len(slides)==40
          targets=['SOFT - Méthode','OASIS - Méthode','TWIXOLF - Méthode','SORBET','SOLAR','COBEX','BRAUD','BRAUDOLF']
          for t in targets:
              s=next(x for x in slides if x.get('title')==t)
              blob=json.dumps(s,ensure_ascii=False)
              assert 'hardware-floating' not in blob, t
              assert 'hardware-card' in blob, t
              assert 'BIOPAC MP160' in blob, t
              assert 'Sniff-0' in blob and 'Spir-0' in blob, t
              if t=='SOFT - Méthode': assert 'EEG BioSemi' in blob
              else: assert 'EEG BioSemi' not in blob
          act=next(x for x in slides if x.get('title')=='Activités doctorales prévues - 2026-2027')
          blob=json.dumps(act,ensure_ascii=False)
          assert 'sans diapo de calendrier séparée' not in blob
          assert 'without a separate communication-calendar slide' not in blob
          assert 'après le pilote' not in json.dumps(slides,ensure_ascii=False)
          print('VALIDATION PASSED')
          PY
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/harmonize-hardware-cards.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Match future-study hardware cards to VIBEX resource style"
          git push