name: Normalize reference labels
on:
  push:
    paths:
      - '.github/workflows/csi-local-part-timelines.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize non-study reference labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          p=Path('index.html')
          save=Path('index_save.html')
          save_hash=hashlib.sha256(save.read_bytes()).hexdigest()
          text=p.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides,rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end
          titles=[s.get('title','') for s in slides]
          changed=0

          def fix(value, lang):
              global changed
              if not isinstance(value,str):
                  return value
              if lang=='fr':
                  old='<strong>Références</strong>'
                  new='<strong>Références :</strong>'
              else:
                  old='<strong>References</strong>'
                  new='<strong>References:</strong>'
              n=value.count(old)
              if n:
                  changed+=n
                  value=value.replace(old,new)
              return value

          for s in slides:
              if s.get('study'):
                  continue
              s['content']=fix(s.get('content'),'fr')
              fr=s.get('_fr')
              if isinstance(fr,dict):
                  fr['content']=fix(fr.get('content'),'fr')
              en=s.get('_en')
              if isinstance(en,dict):
                  en['content']=fix(en.get('content'),'en')

          assert changed>0, 'No non-study reference labels needed normalization'
          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+new_json+text[end:]
          p.write_text(text,encoding='utf-8')

          final=p.read_text(encoding='utf-8')
          start2=final.index(marker)+len(marker)
          slides2,_=json.JSONDecoder().raw_decode(final[start2:])
          assert [s.get('title','') for s in slides2]==titles
          assert hashlib.sha256(save.read_bytes()).hexdigest()==save_hash
          assert 'CSI_LOCAL_PART_TIMELINE' in final
          print(f'Normalized {changed} reference labels')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',t,flags=re.S|re.I)
          assert scripts
          Path('/tmp/csi.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/csi.js
      - name: Verify frozen backup
        run: |
          test "$(git hash-object index_save.html)" = "0cf6cb4e08ec3da2bb94c7de2c62ddd154d4c365"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize reference labels"
          git push
