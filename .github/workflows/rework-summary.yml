name: Rework summary layout
on:
  push:
    paths:
      - '.github/workflows/rework-summary.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rework Sommaire slide
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib

          def parse(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, start, start + rel_end, slides

          before_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          text, start, end, slides = parse('index.html')

          idx = next(i for i,s in enumerate(slides) if (s.get('title') or s.get('_fr',{}).get('title','')) == 'Sommaire')
          s = slides[idx]

          fr = '''<div class="grid two" style="align-items:stretch"><div class="card" style="padding:28px"><div class="mono">CADRE SCIENTIFIQUE</div><div style="display:grid;gap:18px;margin-top:18px"><div style="display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start"><strong style="font-size:2rem;color:var(--accent)">01</strong><div><h3 style="margin-top:0">Contexte théorique</h3><p>Partir de la vision et de l’audition, puis introduire le contraste olfactif et la question de l’espace-temps des odeurs.</p></div></div><div style="display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start"><strong style="font-size:2rem;color:var(--accent)">02</strong><div><h3 style="margin-top:0">Architecture de la thèse</h3><p>Présenter les deux axes, les études structurantes et leur articulation dans le programme STOLF.</p></div></div></div></div><div class="card dark" style="padding:28px"><div class="mono">DÉROULÉ DU CSI</div><div style="display:grid;gap:14px;margin-top:18px"><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">03</strong><div><h3 style="margin:0 0 4px">Première année</h3><p style="margin:0">Études menées, résultats, méthodes et activités doctorales.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">04</strong><div><h3 style="margin:0 0 4px">Deuxième année</h3><p style="margin:0">Priorités expérimentales et études à venir.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">05</strong><div><h3 style="margin:0 0 4px">Compléments</h3><p style="margin:0">Extensions conditionnelles, complémentaires et exploratoires.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">06</strong><div><h3 style="margin:0 0 4px">Rétroplanning global</h3><p style="margin:0">Calendrier, valorisation et trajectoire jusqu’à la fin de la thèse.</p></div></div></div></div></div>'''

          en = '''<div class="grid two" style="align-items:stretch"><div class="card" style="padding:28px"><div class="mono">SCIENTIFIC FRAMEWORK</div><div style="display:grid;gap:18px;margin-top:18px"><div style="display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start"><strong style="font-size:2rem;color:var(--accent)">01</strong><div><h3 style="margin-top:0">Theoretical context</h3><p>Start from vision and audition, then introduce the olfactory contrast and the question of odor space-time.</p></div></div><div style="display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start"><strong style="font-size:2rem;color:var(--accent)">02</strong><div><h3 style="margin-top:0">Thesis architecture</h3><p>Present the two axes, the core studies and their articulation within the STOLF programme.</p></div></div></div></div><div class="card dark" style="padding:28px"><div class="mono">CSI FLOW</div><div style="display:grid;gap:14px;margin-top:18px"><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">03</strong><div><h3 style="margin:0 0 4px">Year 1</h3><p style="margin:0">Studies conducted, results, methods and doctoral activities.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">04</strong><div><h3 style="margin:0 0 4px">Year 2</h3><p style="margin:0">Experimental priorities and upcoming studies.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">05</strong><div><h3 style="margin:0 0 4px">Extensions</h3><p style="margin:0">Conditional, complementary and exploratory studies.</p></div></div><div style="display:grid;grid-template-columns:54px 1fr;gap:14px"><strong style="font-size:1.65rem">06</strong><div><h3 style="margin:0 0 4px">Global timeline</h3><p style="margin:0">Schedule, dissemination and trajectory through the end of the PhD.</p></div></div></div></div></div>'''

          s['_fr']['lead'] = 'Deux temps structurent la présentation : construire le cadre scientifique, puis présenter la progression du doctorat.'
          s['_fr']['content'] = fr
          s['_en']['lead'] = 'The presentation follows two stages: building the scientific framework, then presenting the progression of the PhD.'
          s['_en']['content'] = en
          s['lead'] = s['_fr']['lead']
          s['content'] = fr

          new_text = text[:start] + json.dumps(slides, ensure_ascii=False, separators=(',',':')) + text[end:]
          Path('index.html').write_text(new_text, encoding='utf-8')

          after_save = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          assert before_save == after_save, 'index_save.html changed unexpectedly'
      - name: Commit update and cleanup
        shell: bash
        run: |
          rm .github/workflows/rework-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/rework-summary.yml
          git commit -m "Rework summary into narrative roadmap"
          git push
