name: Build single-layer CSI v2
on:
  push:
    paths:
      - '.github/workflows/flatten-single-layer-v2.yml'
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden TWIXAV result anchor
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools_flat/build_flat.js')
          s=p.read_text(encoding='utf-8')
          old="  let twr=idx(slides,/Un effet net de la durée|TWIXAV - Résultats/i);\n  if(twr>=0){"
          new="  let twr=idx(slides,/Un effet net de la durée|TWIXAV - Résultats/i);\n  if(twr<0) twr=anyIdx(slides,/Effet de la durée[\\s\\S]*Effet du SOA|p\\s*=\\s*\\.001[\\s\\S]*SOA|SOA[\\s\\S]*p\\s*=\\s*\\.001/i);\n  if(twr<0) twr=anyIdx(slides,/durée[\\s\\S]*SOA[\\s\\S]*interaction|interaction[\\s\\S]*durée[\\s\\S]*SOA/i);\n  if(twr>=0){"
          if old not in s:
              raise SystemExit('TWIXAV anchor block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve repository
        run: python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
      - name: Build flat index
        run: node tools_flat/build_flat.js
      - name: Validate desktop and mobile
        run: node tools_flat/validate_flat.js
      - name: Commit validated single-layer index
        run: |
          rm -rf tools_flat
          rm -rf .github
          rm -f package.json package-lock.json validate-desktop.png validate-mobile.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace layered CSI runtime with one validated standalone index"
          git push