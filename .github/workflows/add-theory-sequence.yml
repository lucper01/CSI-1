name: Add documented theoretical sequence
on:
  push:
    paths:
      - '.github/workflows/add-theory-sequence.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert documented theory slides
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const slides = '
          start = text.index(marker) + len(marker)
          slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
          end = start + rel_end

          def title(s):
              return s.get('title') or s.get('_fr', {}).get('title', '')

          assert title(slides[1]) == '« No space, no time? » - le paradoxe de l’attention olfactive'
          assert title(slides[2]) == 'Deux axes'
          assert title(slides[3]) == 'Architecture de la thèse'

          def slide(fr_title, fr_lead, fr_content, en_title, en_lead, en_content, kicker='Cadre théorique', section='Cadre théorique'):
              fr = {'section':section,'kicker':kicker,'title':fr_title,'lead':fr_lead,'content':fr_content,'notes':''}
              en = {'section':'Theoretical framework','kicker':'Theoretical framework','title':en_title,'lead':en_lead,'content':en_content,'notes':''}
              return {'chapter':'Cadre théorique','study':'','appendix':False,'_fr':fr,'_en':en,**fr}

          pre = [
            slide(
              'La multisensorialité est organisée par l’espace et le temps',
              'Le cerveau ne combine pas automatiquement des signaux parce qu’ils coexistent. Leur probabilité d’être intégrés dépend notamment de leur compatibilité spatiale et temporelle.',
              '<div class="grid three"><div class="card"><div class="mono">Événement</div><h3>Plusieurs entrées sensorielles</h3><p>Un même événement peut produire des signaux visuels, auditifs et olfactifs qui doivent être attribués à une cause commune.</p></div><div class="card"><div class="mono">Espace</div><h3>Une contrainte de co-localisation</h3><p>Lorsque des signaux proviennent de positions compatibles, leur intégration est généralement facilitée.</p></div><div class="card dark"><div class="mono">Temps</div><h3>Une contrainte de proximité temporelle</h3><p>Des signaux suffisamment proches dans le temps sont plus facilement regroupés comme appartenant au même événement.</p></div></div><div class="callout" style="margin-top:16px"><strong>Point clé :</strong> l’espace et le temps ne sont pas de simples propriétés du stimulus. Ils participent à l’inférence d’une cause commune entre les sens.</div><div class="csi-cite">Stein, B. E., & Stanford, T. R. (2008). Multisensory integration: current issues from the perspective of the single neuron. Nature Reviews Neuroscience, 9, 255-266. Vroomen, J., & Keetels, M. (2010). Perception of intersensory synchrony: a tutorial review. Attention, Perception, & Psychophysics, 72, 871-884.</div>',
              'Multisensory perception is organized by space and time',
              'The brain does not automatically combine signals simply because they co-occur. Their probability of integration depends in particular on spatial and temporal compatibility.',
              '<div class="grid three"><div class="card"><div class="mono">Event</div><h3>Multiple sensory inputs</h3><p>A single event may generate visual, auditory and olfactory signals that have to be assigned to a common cause.</p></div><div class="card"><div class="mono">Space</div><h3>A co-location constraint</h3><p>Signals arising from compatible locations are generally more likely to be integrated.</p></div><div class="card dark"><div class="mono">Time</div><h3>A temporal-proximity constraint</h3><p>Signals that occur sufficiently close in time are more readily grouped as belonging to the same event.</p></div></div><div class="callout" style="margin-top:16px"><strong>Key point:</strong> space and time are not merely stimulus properties. They contribute to the inference of a common cause across the senses.</div><div class="csi-cite">Stein, B. E., & Stanford, T. R. (2008). Nature Reviews Neuroscience, 9, 255-266. Vroomen, J., & Keetels, M. (2010). Attention, Perception, & Psychophysics, 72, 871-884.</div>'
            ),
            slide(
              'Le temps multisensoriel n’est pas un point de synchronie',
              'Les modalités n’ont ni les mêmes délais physiques ni les mêmes latences de traitement. La synchronie perçue repose donc sur une tolérance temporelle plutôt que sur une simultanéité parfaite.',
              '<div class="grid three"><div class="card"><div class="mono">Fenêtre</div><h3>Temporal Binding Window</h3><p>La probabilité d’intégrer deux signaux reste élevée dans une plage d’asynchronies autour de la simultanéité physique.</p></div><div class="card"><div class="mono">Asymétrie</div><h3>L’ordre des modalités compte</h3><p>La tolérance peut différer selon que le signal auditif, visuel ou olfactif arrive en premier.</p></div><div class="card dark"><div class="mono">Plasticité</div><h3>La synchronie se recalibre</h3><p>L’exposition répétée à des décalages peut déplacer le point de simultanéité subjective et modifier la fenêtre d’intégration.</p></div></div><div class="callout" style="margin-top:16px"><strong>Conséquence :</strong> étudier une modalité lente et discontinue comme l’olfaction impose de distinguer onset, offset, durée, ordre et jugement global de synchronie.</div><div class="csi-cite">Vroomen, J., & Keetels, M. (2010). Perception of intersensory synchrony: a tutorial review. Attention, Perception, & Psychophysics, 72, 871-884.</div>',
              'Multisensory time is not a single point of synchrony',
              'Sensory modalities differ in physical transmission delays and neural processing latencies. Perceived synchrony therefore relies on temporal tolerance rather than perfect simultaneity.',
              '<div class="grid three"><div class="card"><div class="mono">Window</div><h3>Temporal Binding Window</h3><p>The probability of integrating two signals remains high across a range of asynchronies around physical simultaneity.</p></div><div class="card"><div class="mono">Asymmetry</div><h3>Modality order matters</h3><p>Tolerance can differ depending on whether the auditory, visual or olfactory signal occurs first.</p></div><div class="card dark"><div class="mono">Plasticity</div><h3>Synchrony can recalibrate</h3><p>Repeated exposure to temporal lags can shift subjective simultaneity and alter the integration window.</p></div></div><div class="callout" style="margin-top:16px"><strong>Consequence:</strong> studying a slow and discontinuous modality such as olfaction requires separating onset, offset, duration, order and overall synchrony judgments.</div><div class="csi-cite">Vroomen, J., & Keetels, M. (2010). Attention, Perception, & Psychophysics, 72, 871-884.</div>'
            ),
            slide(
              'L’espace multisensoriel repose sur l’attribution d’une source',
              'Vision et audition offrent des repères spatiaux relativement précis. L’olfaction humaine présente une organisation spatiale plus atypique, sans être pour autant dépourvue de capacités de localisation.',
              '<div class="grid three"><div class="card"><div class="mono">Vision - audition</div><h3>Des cartes spatiales exploitables</h3><p>La position d’un objet ou d’un son fournit un indice fort pour décider si plusieurs signaux appartiennent à la même source.</p></div><div class="card"><div class="mono">Olfaction</div><h3>Une spatialisation spontanée limitée</h3><p>La localisation olfactive humaine est moins précise et moins directement disponible à l’attention que la localisation visuelle ou auditive.</p></div><div class="card dark"><div class="mono">Mais...</div><h3>Des capacités spatiales existent</h3><p>Le suivi de traces odorantes peut s’améliorer avec la pratique et bénéficie de comparaisons inter-narinaires.</p></div></div><div class="callout" style="margin-top:16px"><strong>Point clé :</strong> l’olfaction n’est pas « sans espace ». Son espace semble davantage dépendre de l’échantillonnage actif et du contexte multisensoriel.</div><div class="csi-cite">Stein, B. E., & Stanford, T. R. (2008). Nature Reviews Neuroscience, 9, 255-266. Sela, L., & Sobel, N. (2010). Experimental Brain Research, 205, 13-29. Porter, J., et al. (2007). Mechanisms of scent-tracking in humans. Nature Neuroscience, 10, 27-29.</div>',
              'Multisensory space depends on assigning signals to a source',
              'Vision and audition provide relatively precise spatial cues. Human olfaction has a more atypical spatial organization, without being devoid of localization abilities.',
              '<div class="grid three"><div class="card"><div class="mono">Vision - audition</div><h3>Usable spatial maps</h3><p>Object and sound location provide strong evidence for deciding whether several signals belong to the same source.</p></div><div class="card"><div class="mono">Olfaction</div><h3>Limited spontaneous spatialization</h3><p>Human olfactory localization is less precise and less directly available to attention than visual or auditory localization.</p></div><div class="card dark"><div class="mono">Yet...</div><h3>Spatial abilities do exist</h3><p>Human scent tracking improves with practice and benefits from inter-nostril comparisons.</p></div></div><div class="callout" style="margin-top:16px"><strong>Key point:</strong> olfaction is not spatially empty. Its spatial information appears to depend more strongly on active sampling and multisensory context.</div><div class="csi-cite">Stein & Stanford (2008); Sela & Sobel (2010); Porter et al. (2007).</div>'
            ),
            slide(
              'Le sniff transforme le temps olfactif',
              'Une odeur n’est pas échantillonnée comme un flux continu comparable à une image ou à un son. L’inhalation transporte, segmente et rythme l’information olfactive.',
              '<div class="grid three"><div class="card"><div class="mono">Échantillonnage actif</div><h3>Sentir implique de respirer</h3><p>Le sniff est une étape motrice de transport du stimulus et fait partie intégrante de la perception olfactive.</p></div><div class="card"><div class="mono">Discrétisation</div><h3>Une information en unités successives</h3><p>Chaque inhalation définit une fenêtre d’acquisition, séparée de la suivante par une période sans nouvel échantillonnage olfactif.</p></div><div class="card dark"><div class="mono">Neurophysiologie</div><h3>Sniffer et sentir ne sont pas identiques</h3><p>Des réponses cérébrales liées au sniff peuvent être distinguées de celles liées au contenu odorant lui-même.</p></div></div><div class="callout" style="margin-top:16px"><strong>Conséquence :</strong> onset, offset et durée olfactifs ne peuvent pas être supposés équivalents aux mêmes événements en vision ou en audition.</div><div class="csi-cite">Sobel, N., et al. (1998). Sniffing and smelling: separate subsystems in the human olfactory cortex. Nature, 392, 282-286. Kepecs, A., Uchida, N., & Mainen, Z. F. (2006). The sniff as a unit of olfactory processing. Chemical Senses, 31, 167-179. Uchida, N., Kepecs, A., & Mainen, Z. F. (2006). Nature Reviews Neuroscience, 7, 485-491.</div>',
              'The sniff reshapes olfactory time',
              'Odors are not sampled as a continuous stream comparable to an image or a sound. Inhalation transports, segments and rhythmically structures olfactory information.',
              '<div class="grid three"><div class="card"><div class="mono">Active sampling</div><h3>Smelling requires breathing</h3><p>The sniff is a motor stage of stimulus transport and an integral part of olfactory perception.</p></div><div class="card"><div class="mono">Discretization</div><h3>Information arrives in successive units</h3><p>Each inhalation defines an acquisition window separated from the next by a period without new olfactory sampling.</p></div><div class="card dark"><div class="mono">Neurophysiology</div><h3>Sniffing and smelling are not identical</h3><p>Brain responses related to sniffing can be dissociated from responses related to odor content itself.</p></div></div><div class="callout" style="margin-top:16px"><strong>Consequence:</strong> olfactory onset, offset and duration cannot simply be assumed to correspond to the same events in vision or audition.</div><div class="csi-cite">Sobel et al. (1998); Kepecs, Uchida, & Mainen (2006); Uchida, Kepecs, & Mainen (2006).</div>'
            ),
            slide(
              'De l’asymétrie sensorielle à deux questions expérimentales',
              'Les particularités spatio-temporelles de l’olfaction conduisent à distinguer deux directions de recherche qui ne testent pas la même relation causale.',
              '<div class="grid two"><div class="card"><div class="mono">Question 1</div><h3>Comment les modalités se coordonnent-elles ?</h3><p>Il s’agit de comparer olfaction, vision et audition pour déterminer comment leurs signaux s’organisent dans l’espace et le temps lorsqu’ils doivent être reliés.</p><p><strong>Ici, l’olfaction est une modalité à mettre en relation avec les autres.</strong></p></div><div class="card dark"><div class="mono">Question 2</div><h3>Que change une odeur dans une autre modalité ?</h3><p>Des odeurs congruentes peuvent déjà biaiser la dominance visuelle et orienter l’attention vers des objets visuels correspondants.</p><p><strong>Ici, l’olfaction devient un contexte susceptible de modifier vision ou audition.</strong></p></div></div><div class="callout" style="margin-top:16px"><strong>Transition :</strong> cette distinction entre <em>relations entre modalités</em> et <em>influence de l’odeur sur les autres modalités</em> conduit directement aux deux axes de la thèse.</div><div class="csi-cite">Zhou, W., Jiang, Y., He, S., & Chen, D. (2010). Olfaction modulates visual perception in binocular rivalry. Current Biology, 20, 1356-1358. Seo, H.-S., Roidl, E., Müller, F., & Negoias, S. (2010). Odors enhance visual attention to congruent objects. Appetite, 54, 544-549. Gottfried, J. A. (2010). Nature Reviews Neuroscience, 11, 628-641.</div>',
              'From sensory asymmetry to two experimental questions',
              'The spatio-temporal particularities of olfaction lead to two research directions that do not test the same causal relationship.',
              '<div class="grid two"><div class="card"><div class="mono">Question 1</div><h3>How do the modalities coordinate?</h3><p>This requires comparing olfaction, vision and audition to determine how their signals are organized in space and time when they must be related.</p><p><strong>Here, olfaction is one modality to be related to the others.</strong></p></div><div class="card dark"><div class="mono">Question 2</div><h3>What does an odor change in another modality?</h3><p>Congruent odors can bias visual dominance and orient attention toward corresponding visual objects.</p><p><strong>Here, olfaction becomes a context capable of modifying vision or audition.</strong></p></div></div><div class="callout" style="margin-top:16px"><strong>Transition:</strong> this distinction between <em>relations across modalities</em> and <em>odor-driven influences on other modalities</em> leads directly to the two thesis axes.</div><div class="csi-cite">Zhou et al. (2010); Seo et al. (2010); Gottfried (2010).</div>'
            )
          ]

          post = [
            slide(
              'Axe 1 - Le temps : intégrer des signaux aux dynamiques différentes',
              'L’Axe 1 demande comment l’olfaction peut entrer dans des mécanismes temporels multisensoriels établis surtout en vision et en audition.',
              '<div class="grid three"><div class="card"><div class="mono">Référence</div><h3>Vision et audition</h3><p>Les jugements de simultanéité et d’ordre temporel fournissent des repères bien caractérisés pour quantifier la tolérance aux asynchronies.</p></div><div class="card"><div class="mono">Spécificité</div><h3>Olfaction</h3><p>Le stimulus est dépendant du transport respiratoire et d’un échantillonnage discret, ce qui peut modifier la latence et la variabilité perceptives.</p></div><div class="card dark"><div class="mono">Mesures</div><h3>Décomposer le temps perceptif</h3><p>Fenêtre d’intégration, ordre, onset, offset, durée et recalibration permettent de tester où apparaît l’asymétrie.</p></div></div><div class="callout" style="margin-top:16px"><strong>Hypothèse générale :</strong> l’olfaction ne supprime pas nécessairement l’intégration temporelle, mais peut en modifier la largeur, le centre ou l’asymétrie.</div><div class="csi-cite">Vroomen & Keetels (2010). Attention, Perception, & Psychophysics, 72, 871-884. Kepecs, Uchida, & Mainen (2006). Chemical Senses, 31, 167-179. Sela & Sobel (2010). Experimental Brain Research, 205, 13-29.</div>',
              'Axis 1 - Time: integrating signals with different dynamics',
              'Axis 1 asks how olfaction can enter multisensory temporal mechanisms that have mainly been characterized in vision and audition.',
              '<div class="grid three"><div class="card"><div class="mono">Reference</div><h3>Vision and audition</h3><p>Simultaneity and temporal-order judgments provide well-characterized benchmarks for quantifying tolerance to asynchrony.</p></div><div class="card"><div class="mono">Specificity</div><h3>Olfaction</h3><p>The stimulus depends on respiratory transport and discrete sampling, which can alter perceptual latency and variability.</p></div><div class="card dark"><div class="mono">Measures</div><h3>Decomposing perceptual time</h3><p>Integration window, order, onset, offset, duration and recalibration can reveal where asymmetries arise.</p></div></div><div class="callout" style="margin-top:16px"><strong>General hypothesis:</strong> olfaction may not abolish temporal integration, but may alter its width, center or asymmetry.</div><div class="csi-cite">Vroomen & Keetels (2010); Kepecs, Uchida, & Mainen (2006); Sela & Sobel (2010).</div>',
              kicker='Axe 1 - cadre théorique', section='Axe 1 - cadre théorique'
            ),
            slide(
              'Axe 1 - L’espace : que signifie « localiser » une odeur ?',
              'L’Axe 1 traite aussi de la relation spatiale entre modalités, en évitant d’assimiler la faible localisation spontanée des odeurs à une absence totale de représentation spatiale.',
              '<div class="grid three"><div class="card"><div class="mono">Limite</div><h3>Une localisation moins précise</h3><p>Chez l’humain, une odeur seule fournit généralement moins d’information spatiale directement exploitable qu’un son ou une cible visuelle.</p></div><div class="card"><div class="mono">Capacité</div><h3>Un espace olfactif actif</h3><p>Le suivi de traces et les comparaisons inter-narinaires montrent que des informations spatiales peuvent être extraites lorsque la tâche et l’exploration le permettent.</p></div><div class="card dark"><div class="mono">Multisensorialité</div><h3>Une source peut être construite conjointement</h3><p>Les repères visuels ou auditifs peuvent fournir un cadre spatial dans lequel l’information olfactive est attribuée à une source.</p></div></div><div class="callout" style="margin-top:16px"><strong>Question de l’axe :</strong> la structure spatiale d’une odeur couplée à la vision ou à l’audition est-elle spécifique à l’olfaction, héritée de l’autre modalité, ou construite conjointement ?</div><div class="csi-cite">Porter, J., et al. (2007). Nature Neuroscience, 10, 27-29. Sela, L., & Sobel, N. (2010). Experimental Brain Research, 205, 13-29. Stein, B. E., & Stanford, T. R. (2008). Nature Reviews Neuroscience, 9, 255-266.</div>',
              'Axis 1 - Space: what does it mean to localize an odor?',
              'Axis 1 also addresses spatial relations across modalities without equating weak spontaneous odor localization with a complete absence of spatial representation.',
              '<div class="grid three"><div class="card"><div class="mono">Limit</div><h3>Less precise localization</h3><p>In humans, an odor alone generally provides less directly usable spatial information than a sound or a visual target.</p></div><div class="card"><div class="mono">Capacity</div><h3>An active olfactory space</h3><p>Scent tracking and inter-nostril comparisons show that spatial information can be extracted when task demands and exploration support it.</p></div><div class="card dark"><div class="mono">Multisensory</div><h3>A source may be jointly constructed</h3><p>Visual or auditory cues can provide a spatial frame in which olfactory information is assigned to a source.</p></div></div><div class="callout" style="margin-top:16px"><strong>Axis question:</strong> when an odor is paired with vision or audition, is its spatial structure olfaction-specific, inherited from the other modality, or jointly constructed?</div><div class="csi-cite">Porter et al. (2007); Sela & Sobel (2010); Stein & Stanford (2008).</div>',
              kicker='Axe 1 - cadre théorique', section='Axe 1 - cadre théorique'
            ),
            slide(
              'Axe 2 - Vision : une odeur peut modifier ce qui devient perceptuellement saillant',
              'Le sens causal est ici inversé : il ne s’agit plus seulement d’intégrer l’odeur à une scène visuelle, mais de tester si l’odeur transforme la perception ou la représentation de cette scène.',
              '<div class="grid three"><div class="card"><div class="mono">Perception</div><h3>Rivalité binoculaire</h3><p>Une odeur congruente avec une image augmente le temps pendant lequel cette image domine la perception consciente.</p></div><div class="card"><div class="mono">Attention</div><h3>Objets visuels congruents</h3><p>Lorsqu’une odeur est présente, les participants fixent davantage les objets visuels qui lui correspondent.</p></div><div class="card dark"><div class="mono">Espace de scène</div><h3>Une représentation reconstruite</h3><p>La mémoire des limites d’une scène peut s’étendre ou se contracter, offrant une mesure sensible des biais imposés par le contexte.</p></div></div><div class="callout" style="margin-top:16px"><strong>Enjeu :</strong> si l’odeur modifie la saillance ou l’interprétation d’une scène, elle peut aussi modifier la manière dont son espace est représenté et mémorisé.</div><div class="csi-cite">Zhou, W., Jiang, Y., He, S., & Chen, D. (2010). Current Biology, 20, 1356-1358. Seo, H.-S., et al. (2010). Appetite, 54, 544-549. Intraub, H., & Richardson, M. (1989). Journal of Experimental Psychology: Learning, Memory, and Cognition, 15, 179-187. Bainbridge, W. A., & Baker, C. I. (2020). Current Biology, 30, 537-543.e3.</div>',
              'Axis 2 - Vision: an odor can change what becomes perceptually salient',
              'The causal direction is reversed here: the question is no longer only how an odor is integrated into a visual scene, but whether the odor transforms perception or representation of that scene.',
              '<div class="grid three"><div class="card"><div class="mono">Perception</div><h3>Binocular rivalry</h3><p>An odor congruent with one image increases the time that image dominates conscious perception.</p></div><div class="card"><div class="mono">Attention</div><h3>Congruent visual objects</h3><p>When an odor is present, observers look more often and longer at visually corresponding objects.</p></div><div class="card dark"><div class="mono">Scene space</div><h3>A reconstructed representation</h3><p>Memory for scene boundaries can extend or contract, providing a sensitive measure of context-driven spatial bias.</p></div></div><div class="callout" style="margin-top:16px"><strong>Issue:</strong> if odor alters scene salience or interpretation, it may also alter how scene space is represented and remembered.</div><div class="csi-cite">Zhou et al. (2010); Seo et al. (2010); Intraub & Richardson (1989); Bainbridge & Baker (2020).</div>',
              kicker='Axe 2 - cadre théorique', section='Axe 2 - cadre théorique'
            ),
            slide(
              'Axe 2 - Audition : un terrain encore moins caractérisé',
              'Les liens olfactivo-auditifs sont réels, mais l’effet direct d’une odeur sur les dimensions spatiales et temporelles de la perception auditive reste beaucoup moins documenté que les interactions classiques audio-visuelles.',
              '<div class="grid three"><div class="card"><div class="mono">Correspondances</div><h3>Odeurs et propriétés sonores</h3><p>Les participants associent de manière non aléatoire certaines odeurs à des hauteurs et à des timbres particuliers.</p></div><div class="card"><div class="mono">Intégration neurale</div><h3>Les systèmes auditif et olfactif communiquent</h3><p>Des indices auditifs prédictifs d’une odeur synchronisent l’activité de régions auditives et olfactives lors d’un appariement réussi.</p></div><div class="card dark"><div class="mono">Question ouverte</div><h3>Et le temps ou l’espace auditif ?</h3><p>La littérature établit l’intégration et la congruence, mais fournit encore peu de tests directs d’un effet de l’odeur sur des jugements auditifs de durée, d’onset, d’offset, de synchronie ou de position.</p></div></div><div class="callout" style="margin-top:16px"><strong>Positionnement :</strong> ce manque de littérature directe ne doit pas être comblé par une extrapolation. Il délimite précisément le versant exploratoire et mécanistique de l’Axe 2.</div><div class="csi-cite">Crisinel, A.-S., & Spence, C. (2012). A fruity note: crossmodal associations between odors and musical notes. Chemical Senses, 37, 151-158. Zhou, G., et al. (2019). Human olfactory-auditory integration requires phase synchrony between sensory cortices. Nature Communications, 10, 1168.</div>',
              'Axis 2 - Audition: a much less characterized territory',
              'Olfactory-auditory links are real, but the direct effect of an odor on the spatial and temporal dimensions of auditory perception is far less documented than classic audiovisual interactions.',
              '<div class="grid three"><div class="card"><div class="mono">Correspondences</div><h3>Odors and sound properties</h3><p>Participants non-randomly match certain odors with particular pitches and timbres.</p></div><div class="card"><div class="mono">Neural integration</div><h3>Auditory and olfactory systems communicate</h3><p>Auditory cues predicting an odor synchronize activity in auditory and olfactory regions during successful matching.</p></div><div class="card dark"><div class="mono">Open question</div><h3>What about auditory time and space?</h3><p>The literature establishes integration and congruence, but still provides few direct tests of odor-driven changes in auditory duration, onset, offset, synchrony or location judgments.</p></div></div><div class="callout" style="margin-top:16px"><strong>Positioning:</strong> this lack of direct evidence should not be filled by extrapolation. It precisely defines the exploratory and mechanistic part of Axis 2.</div><div class="csi-cite">Crisinel & Spence (2012). Chemical Senses, 37, 151-158. Zhou, G., et al. (2019). Nature Communications, 10, 1168.</div>',
              kicker='Axe 2 - cadre théorique', section='Axe 2 - cadre théorique'
            )
          ]

          slides[2:2] = pre
          axis_idx = 2 + len(pre)
          assert title(slides[axis_idx]) == 'Deux axes'
          slides[axis_idx+1:axis_idx+1] = post

          assert [title(s) for s in slides[2:8]] == [
              'La multisensorialité est organisée par l’espace et le temps',
              'Le temps multisensoriel n’est pas un point de synchronie',
              'L’espace multisensoriel repose sur l’attribution d’une source',
              'Le sniff transforme le temps olfactif',
              'De l’asymétrie sensorielle à deux questions expérimentales',
              'Deux axes'
          ]
          assert title(slides[12]) == 'Architecture de la thèse'

          new_json = json.dumps(slides, ensure_ascii=False, separators=(',', ':'))
          text = text[:start] + new_json + text[end:]
          p.write_text(text, encoding='utf-8')
          print('OK - inserted 5 pre-axis and 4 post-axis documented theory slides')
      - name: Validate backup untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-theory-sequence.yml
          git add -A index.html .github
          git commit -m "Add documented theoretical sequence around thesis axes"
          git push
