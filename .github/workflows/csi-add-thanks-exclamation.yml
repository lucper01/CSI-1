name: CSI add thanks exclamation
on:
  push:
    paths:
      - '.github/workflows/csi-add-thanks-exclamation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record save hash
        run: echo "SAVE_BLOB=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Add exclamation mark to slide 41
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          fr='Merci de votre attention</div></div>'
          en='Thank you for your attention</div></div>'
          if s.count(fr) != 2:
              raise RuntimeError(f'Expected 2 French occurrences, found {s.count(fr)}')
          if s.count(en) != 1:
              raise RuntimeError(f'Expected 1 English occurrence, found {s.count(en)}')
          s=s.replace(fr,'Merci de votre attention !</div></div>')
          s=s.replace(en,'Thank you for your attention!</div></div>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate slides JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          target=[x for x in scripts if 'const slides = [' in x]
          if len(target)!=1:
              raise RuntimeError(f'Expected one slides script, found {len(target)}')
          Path('/tmp/slides.js').write_text(target[0],encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Keep save untouched
        run: |
          test "$(git hash-object index_save.html)" = "$SAVE_BLOB"
          git diff --exit-code -- index_save.html
      - name: Commit and remove helper
        run: |
          git rm .github/workflows/csi-add-thanks-exclamation.yml
          git add index.html
          git commit -m "Add exclamation mark to final thank-you slide"
          git push
