name: Fix CSI scientific patch order

on:
  push:
    paths:
      - '.github/workflows/fix-science-order.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scientific structure after historical V17 patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "const schedule=()=>[80,180,360,620].forEach(ms=>setTimeout(applyScience,ms));"
          new = "const schedule=()=>[1540,1570,1590].forEach(ms=>setTimeout(applyScience,ms));"
          if old not in s:
              raise SystemExit('Scientific schedule marker not found')
          s = s.replace(old, new, 1)

          old_guard = "if(d.documentElement.dataset.projectSheets==='1')return true;"
          new_guard = "if(d.documentElement.dataset.projectSheets==='1'&&d.querySelector('.csi-sheet-actions'))return true;if(d.documentElement.dataset.projectSheets==='1'){d.documentElement.dataset.projectSheets='';d.getElementById('csiSheetViewer')?.remove();d.getElementById('csi-project-sheet-style')?.remove();}"
          if old_guard not in s:
              raise SystemExit('Project sheet guard marker not found')
          s = s.replace(old_guard, new_guard, 1)

          # Make the active build visually identifiable during troubleshooting.
          s = s.replace('CSI-1 - version autonome','CSI-1 - version scientifique',1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-science-order.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run scientific structure after V17 rendering"
          git push origin HEAD:main
