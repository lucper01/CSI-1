name: Add FLUXOLF M1 card
on:
  push:
    paths:
      - '.github/workflows/add-fluxolf-m1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Morgane Barret to FLUXOLF resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          if not m:
              raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))
          flux=next((s for s in slides if str(s.get('study','')).upper()=='FLUXOLF'),None)
          if not flux:
              raise SystemExit('FLUXOLF slide not found')

          def add_card(content, lang='fr'):
              if not isinstance(content,str): return content
              if 'Morgane Barret' in content: return content
              label='Mémoire M1' if lang=='fr' else 'Master 1 thesis'
              card=f'<div class="float-card m1"><b>{label}</b><span>Morgane Barret</span></div>'
              # Insert inside the FLUXOLF resource row, after the material card.
              marker='<div class="float-card"><b>Matériel</b><span>BioSemi ActiveTwo + BIOPAC MP160</span></div></div>'
              marker_en='<div class="float-card"><b>Hardware</b><span>BioSemi ActiveTwo + BIOPAC MP160</span></div></div>'
              if marker in content:
                  return content.replace(marker,marker[:-6]+card+'</div>',1)
              if marker_en in content:
                  return content.replace(marker_en,marker_en[:-6]+card+'</div>',1)
              # If no resource row exists (English version), append a matching one.
              if lang=='en':
                  row='<div class="study-floating" aria-label="FLUXOLF resources"><a class="float-card poster" href="affiches/FLUXOLF_1.pdf" target="_blank" rel="noopener"><b>Poster 1</b><span>FLUXOLF</span></a><a class="float-card poster" href="affiches/FLUXOLF_2.pdf" target="_blank" rel="noopener"><b>Poster 2</b><span>FLUXOLF</span></a><div class="float-card"><b>Hardware</b><span>BioSemi ActiveTwo + BIOPAC MP160</span></div>'+card+'</div>'
                  return content+row
              raise SystemExit('FLUXOLF resource row not found')

          flux['content']=add_card(flux.get('content',''),'fr')
          if isinstance(flux.get('_fr'),dict):
              flux['_fr']['content']=add_card(flux['_fr'].get('content',''),'fr')
          if isinstance(flux.get('_en'),dict):
              flux['_en']['content']=add_card(flux['_en'].get('content',''),'en')

          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          h=h[:m.start(1)]+arr+h[m.end(1):]
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate FLUXOLF M1 card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          h=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          slides=json.loads(m.group(1))
          f=next(s for s in slides if str(s.get('study','')).upper()=='FLUXOLF')
          assert 'Morgane Barret' in f['content']
          assert 'Mémoire M1' in f['content']
          assert f['content'].count('Morgane Barret')==1
          if isinstance(f.get('_fr'),dict):
              assert f['_fr']['content'].count('Morgane Barret')==1
          if isinstance(f.get('_en'),dict):
              assert f['_en']['content'].count('Morgane Barret')==1
          print('FLUXOLF M1 card validated')
          PY
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/add-fluxolf-m1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Morgane Barret M1 card to FLUXOLF"
          git push