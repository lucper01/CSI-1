name: CSI slide 53 remove SORBET and COBEX
on:
  push:
    paths:
      - '.github/scripts/csi_slide53_remove_sorbet_cobex.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch slide 53
        run: python .github/scripts/csi_slide53_remove_sorbet_cobex.py
      - name: Verify save unchanged
        run: git diff --exit-code -- index_save.html
      - name: Commit working deck update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove SORBET and COBEX from slide 53"
          git push
