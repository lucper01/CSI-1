name: Save current CSI working version
on:
  push:
    paths:
      - '.github/scripts/csi_save_current.py'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy working index to save
        run: python .github/scripts/csi_save_current.py
      - name: Commit saved version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet && exit 0
          git commit -m "Save current CSI working version"
          git push
