name: CSI save current
on:
  push:
    paths:
      - '.github/workflows/csi-save-current.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Save current CSI
        run: |
          cp index.html index_save.html
          test "$(git hash-object index.html)" = "$(git hash-object index_save.html)"
          git add index_save.html
          git commit -m "Save current CSI state"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/csi-save-current.yml
          git commit -m "Remove temporary save workflow"
          git push
