name: Save current CSI
on:
  push:
    paths:
      - '.github/workflows/csi-save-current.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize active deck to checkpoint
        run: cp index.html index_save.html
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet && exit 0
          git commit -m "Save current CSI checkpoint"
          git push
