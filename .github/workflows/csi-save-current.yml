name: Save current CSI state
on:
  push:
    paths:
      - '.github/workflows/csi-save-current.yml'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy active deck to save
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx = Path('index.html')
          sav = Path('index_save.html')
          sav.write_bytes(idx.read_bytes())
          PY
      - name: Commit save
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet && exit 0
          git commit -m "Save current CSI deck state"
          git push
