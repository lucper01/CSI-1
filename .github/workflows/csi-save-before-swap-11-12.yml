name: Save CSI before swap 11 12
on:
  push:
    paths:
      - '.github/scripts/csi_save_before_swap_11_12.py'
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy working index to save
        run: python .github/scripts/csi_save_before_swap_11_12.py
      - name: Commit save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_save.html
          git diff --cached --quiet && exit 0
          git commit -m "Save CSI before swapping slides 11 and 12"
          git push
