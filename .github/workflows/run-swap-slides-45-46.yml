name: Swap slides 45 and 46
on:
  push:
    paths:
      - '.github/workflows/run-swap-slides-45-46.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swap slides
        run: python3 tools_temp/swap_slides_45_46.py
      - name: Validate backup untouched
        run: git diff --exit-code -- index_save.html
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools_temp/swap_slides_45_46.py
          rm -f .github/workflows/run-swap-slides-45-46.yml
          git add -A index.html tools_temp .github
          git commit -m "Swap slides 45 and 46"
          git push
