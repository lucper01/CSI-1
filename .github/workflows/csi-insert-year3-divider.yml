name: Insert year 3 divider
on:
  push:
    paths:
      - '.github/scripts/csi_insert_year3_divider.py'
      - '.github/workflows/csi-insert-year3-divider.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert year 3 divider
        run: python .github/scripts/csi_insert_year3_divider.py
      - name: Verify frozen checkpoint
        run: git diff --exit-code -- index_save.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Insert year 3 divider before activities"
          git push
