name: CSI save current state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-save-current-csi.yml'

jobs:
  save:
    if: github.event.head_commit.message == 'Run CSI save current state'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Copy current presentation to protected save
        run: |
          cp index.html index_save.html
          cmp -s index.html index_save.html
      - name: Commit save and cleanup helper
        run: |
          rm .github/workflows/tmp-save-current-csi.yml
          git add index_save.html .github/workflows/tmp-save-current-csi.yml
          git commit -m "Save current CSI state"
          git push
