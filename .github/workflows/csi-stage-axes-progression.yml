name: CSI stage axes progression
on:
  push:
    paths:
      - '.github/workflows/csi-stage-axes-progression.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record save hash
        run: echo "SAVE_SHA=$(git hash-object index_save.html)" >> "$GITHUB_ENV"
      - name: Apply staged axis slides
        run: python .github/scripts/csi_stage_axes_progression.py
      - name: Validate slide array JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          matches=[s for s in scripts if 'const slides = [' in s]
          assert len(matches)==1
          Path('/tmp/slides.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/slides.js
      - name: Verify save untouched
        run: test "$SAVE_SHA" = "$(git hash-object index_save.html)"
      - name: Commit and clean helpers
        run: |
          rm .github/workflows/csi-stage-axes-progression.yml
          rm .github/scripts/csi_stage_axes_progression.py
          git add index.html .github/workflows/csi-stage-axes-progression.yml .github/scripts/csi_stage_axes_progression.py
          git commit -m "Stage progressive axis-study slides"
          git push origin main
