name: CSI literature mini descriptions
on:
  push:
    paths:
      - '.github/workflows/tmp-literature-mini-descriptions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Freeze protected save hash
        run: echo "SAVE_HASH=$(sha256sum index_save.html | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Restore concise literature descriptions
        run: python .github/scripts/tmp_restore_literature_descriptions.py

      - name: Validate literature cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'CSI_LITERATURE_MINI_DESCRIPTIONS_V1' in text
          prefix = 'const slides = '
          start = text.index(prefix) + len(prefix)
          slides, _ = json.JSONDecoder().raw_decode(text[start:])
          targets = [s for s in slides if s.get('_literature_mini_descriptions') == 'v1']
          assert len(targets) == 8, len(targets)
          assert sum(s.get('content','').count('lit-mini') for s in targets) == 23
          for s in targets:
              assert 'Détails des cartes conservés pour les notes orateur' in s.get('notes','') or s.get('_fr',{}).get('notes')
          print('Validated 8 slides and 23 concise visible descriptions')
          PY

      - name: Verify save untouched
        run: test "$SAVE_HASH" = "$(sha256sum index_save.html | cut -d' ' -f1)"

      - name: Commit deck update
        run: |
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore concise descriptions on literature slides"
          git push

      - name: Cleanup temporary helpers
        run: |
          git rm .github/scripts/tmp_restore_literature_descriptions.py .github/workflows/tmp-literature-mini-descriptions.yml
          git commit -m "Remove temporary literature description helpers"
          git push
