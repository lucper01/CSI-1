name: Rework slide 35 year 1 summary
on:
  push:
    paths:
      - '.github/workflows/rework-slide35-year1-summary.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace slide 35 with a general year 1 summary
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib

          def parse(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = 'const slides = '
              start = text.index(marker) + len(marker)
              slides, rel_end = json.JSONDecoder().raw_decode(text[start:])
              return text, start, start + rel_end, slides

          save_before = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          text, start, end, slides = parse('index.html')
          assert len(slides) >= 35, f'Only {len(slides)} slides found'

          slide = slides[34]

          fr_content = '''<div class="grid two">
          <div class="card"><div class="mono">01 - CADRE SCIENTIFIQUE</div><h3>Une problématique devenue testable</h3><p>La question générale de l’espace et du temps en olfaction a été structurée en <strong>deux axes complémentaires</strong>, avec une articulation claire entre comparaison intermodale et influence des odeurs sur la perception.</p></div>
          <div class="card"><div class="mono">02 - PREMIERS RÉSULTATS</div><h3>Les premières briques empiriques sont posées</h3><p><strong>TWIXAV</strong> et <strong>VIBEX</strong> fournissent les premiers résultats du programme et permettent de préciser les questions, les hypothèses et les choix expérimentaux pour la suite.</p></div>
          <div class="card"><div class="mono">03 - MÉTHODES & INFRASTRUCTURE</div><h3>Un environnement expérimental consolidé</h3><p>Paradigmes, PsychoPy, olfactométrie, suivi respiratoire, physiologie et pipelines d’analyse ont été développés ou consolidés pour rendre les prochaines études plus directement opérationnelles.</p></div>
          <div class="card"><div class="mono">04 - PROGRAMME DE THÈSE</div><h3>Une trajectoire de recherche structurée</h3><p>Les études de deuxième année sont désormais positionnées dans une logique d’ensemble, avec leurs priorités, leurs dépendances méthodologiques et une stratégie de valorisation progressive.</p></div>
          </div>
          <div class="card dark" style="margin-top:18px"><div class="mono">BILAN</div><h3>De la question générale au programme expérimental</h3><p>La première année a surtout permis de transformer une problématique large en un <strong>programme de recherche structuré, instrumenté et testable</strong>, avec de premiers résultats et une base méthodologique solide pour la suite.</p></div>'''

          en_content = '''<div class="grid two">
          <div class="card"><div class="mono">01 - SCIENTIFIC FRAMEWORK</div><h3>A broad question made testable</h3><p>The general question of space and time in olfaction has been organized into <strong>two complementary axes</strong>, clearly separating cross-modal comparison from the influence of odors on perception.</p></div>
          <div class="card"><div class="mono">02 - FIRST RESULTS</div><h3>The first empirical building blocks are in place</h3><p><strong>TWIXAV</strong> and <strong>VIBEX</strong> provide the first results of the programme and help refine the questions, hypotheses and experimental choices for the next steps.</p></div>
          <div class="card"><div class="mono">03 - METHODS & INFRASTRUCTURE</div><h3>A consolidated experimental environment</h3><p>Paradigms, PsychoPy, olfactometry, respiratory monitoring, physiology and analysis pipelines have been developed or consolidated to make the next studies directly operational.</p></div>
          <div class="card"><div class="mono">04 - THESIS PROGRAMME</div><h3>A structured research trajectory</h3><p>Year 2 studies are now positioned within a coherent overall logic, with clear priorities, methodological dependencies and a progressive dissemination strategy.</p></div>
          </div>
          <div class="card dark" style="margin-top:18px"><div class="mono">TAKE-HOME</div><h3>From a broad question to an experimental programme</h3><p>Year 1 mainly transformed a broad research problem into a <strong>structured, instrumented and testable programme</strong>, supported by first results and a solid methodological basis for the next stages.</p></div>'''

          fr = slide.setdefault('_fr', {})
          en = slide.setdefault('_en', {})

          fr.update({
              'section':'Première année',
              'kicker':'PARTIE 3 - SYNTHÈSE',
              'title':'Bilan de la première année',
              'lead':'Une première année consacrée à structurer la question scientifique, obtenir les premiers résultats et construire les outils nécessaires à la suite du programme.',
              'content':fr_content,
              'notes':'Faire un bilan transversal de la première année, sans revenir étude par étude. Insister sur la structuration scientifique, les premiers résultats, la consolidation méthodologique et la préparation de la suite.'
          })
          en.update({
              'section':'Year 1',
              'kicker':'PART 3 - SUMMARY',
              'title':'Year 1 - General assessment',
              'lead':'A first year devoted to structuring the scientific question, obtaining initial results and building the tools required for the next stages of the programme.',
              'content':en_content,
              'notes':'Give a cross-cutting year 1 assessment rather than going study by study. Emphasize scientific structuring, first results, methodological consolidation and preparation for the next stage.'
          })

          slide.update({
              'section':fr['section'],
              'kicker':fr['kicker'],
              'title':fr['title'],
              'lead':fr['lead'],
              'content':fr['content'],
              'notes':fr['notes']
          })

          new_text = text[:start] + json.dumps(slides, ensure_ascii=False, separators=(',', ':')) + text[end:]
          Path('index.html').write_text(new_text, encoding='utf-8')

          # Validate exact target and untouched backup.
          _, _, _, check = parse('index.html')
          assert check[34].get('title') == 'Bilan de la première année'
          assert 'programme expérimental' in check[34].get('content','')
          save_after = hashlib.sha256(Path('index_save.html').read_bytes()).hexdigest()
          assert save_before == save_after, 'index_save.html changed unexpectedly'

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rework-slide35-year1-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/rework-slide35-year1-summary.yml
          git commit -m "Make slide 35 a general year 1 summary"
          git push