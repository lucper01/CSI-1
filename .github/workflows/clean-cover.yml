name: Clean CSI cover
on:
  push:
    paths:
      - '.github/workflows/clean-cover.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate lower cover block
        run: |
          python3 - <<'PY'
          import re,json,pathlib
          p=pathlib.Path('index.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          if not m: raise SystemExit('slides array not found')
          slides=json.loads(m.group(1))
          s=slides[0]
          if s.get('title') != 'Y a-t-il un espace-temps pour les odeurs ?':
              raise SystemExit('unexpected cover slide')
          old=s.get('content','')
          new=re.sub(r'<div class="csi-institutions">.*?</div></div>$','',old,flags=re.S)
          if new==old:
              # Robust fallback: remove from the known lower-block marker to end.
              marker='<div class="csi-institutions">'
              if marker not in old: raise SystemExit('lower duplicate block not found')
              new=old.split(marker,1)[0]
          s['content']=new
          if isinstance(s.get('_fr'),dict): s['_fr']['content']=new
          arr=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          h=h[:m.start(1)]+arr+h[m.end(1):]
          p.write_text(h,encoding='utf-8')
          print('cover duplicate block removed')
          print('kept logo cloud:',new.count('v16-logo-cloud'))
          print('kept identity card:',new.count('identity-card'))
          print('lower institutions:',new.count('csi-institutions'))
          PY
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Validate cover on desktop and mobile
        run: |
          python3 -m http.server 8000 >/tmp/csi-http.log 2>&1 &
          cat > check.js <<'EOF'
          const { chromium }=require('playwright');
          async function test(viewport,label){
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport});
            const errors=[]; p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const s=await p.evaluate(()=>({
              logos:document.querySelectorAll('.slide.active .v16-logo-cloud img').length,
              identity:document.querySelectorAll('.slide.active .identity-card').length,
              lower:document.querySelectorAll('.slide.active .csi-institutions').length,
              members:document.querySelectorAll('.slide.active .csi-members').length,
              visible:[...document.querySelectorAll('.slide')].filter(x=>getComputedStyle(x).display!=='none'&&x.getBoundingClientRect().height>0).length
            }));
            console.log(label,JSON.stringify(s),JSON.stringify(errors));
            if(errors.length||s.logos!==5||s.identity!==1||s.lower!==0||s.members!==0||s.visible<1) throw new Error(label+' failed');
            await b.close();
          }
          (async()=>{await test({width:1600,height:1000},'desktop');await test({width:690,height:1536},'mobile');console.log('VALIDATION PASSED')})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node check.js
      - name: Commit validated cover
        run: |
          rm -f .github/workflows/clean-cover.yml check.js package.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove duplicate logos and supervisor cards from cover"
          git push