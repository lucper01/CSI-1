name: Inspect M1 result slides
on:
  push:
    paths:
      - '.github/workflows/inspect-m1-slides.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print target slides
        run: |
          python3 - <<'PY'
          import re,json,pathlib
          h=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+slides\s*=\s*(\[.*?\]);\s*\n\s*const\s+mainSlides',h,re.S)
          a=json.loads(m.group(1))
          for s in a:
            if s.get('title') in ['TWIXAV - Résultats','VIBEX - résultats du prétest et statut','TWIXAV - Méthode','VIBEX - Méthode']:
              print('\n###',s.get('title'))
              print(s.get('content',''))
          PY
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/inspect-m1-slides.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Remove M1 slide inspector'; git push; fi