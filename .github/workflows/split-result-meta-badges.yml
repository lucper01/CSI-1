name: Split result meta badges
on:
  push:
    paths:
      - '.github/workflows/split-result-meta-badges.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split student and sample size badges
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          path=Path('index.html')
          backup=Path('index_save.html')
          backup_hash=hashlib.sha256(backup.read_bytes()).hexdigest()
          text=path.read_text(encoding='utf-8')
          marker='const slides = '
          start=text.index(marker)+len(marker)
          slides, rel_end=json.JSONDecoder().raw_decode(text[start:])
          end=start+rel_end

          targets={
            'TWIXAV':('Alicia Emorine','19'),
            'VIBEX':('Olivia Hiridjee','24')
          }

          def split_badge(content, name, n, english=False):
              label="Master's thesis" if english else 'Mémoire M1'
              old=f'<div class="m1-owner"><span>{label}</span><strong>{name} - n = {n}</strong></div>'
              new=(f'<div class="result-meta-row">'
                   f'<div class="m1-owner"><span>{label}</span><strong>{name}</strong></div>'
                   f'<div class="m1-owner result-n"><strong>n = {n}</strong></div>'
                   f'</div>')
              if old not in content:
                  return content,0
              return content.replace(old,new),1

          changed=[]
          for i,s in enumerate(slides,1):
              study=s.get('study')
              if study not in targets:
                  continue
              name,n=targets[study]
              local=0
              for holder,english in [(s,False),(s.get('_fr') or {},False),(s.get('_en') or {},True)]:
                  c=holder.get('content')
                  if not c: continue
                  c,k=split_badge(c,name,n,english)
                  holder['content']=c
                  local+=k
              if local:
                  changed.append((i,study,local))

          if len(changed)!=2:
              raise RuntimeError(f'Expected two result slides changed, got {changed}')

          new_json=json.dumps(slides,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+new_json+text[end:]

          css='''\n/* result-meta-split-v1 */\n.result-meta-row{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin-bottom:14px}.result-meta-row .m1-owner{margin:0}.result-meta-row .result-n{display:flex;align-items:center;justify-content:center;min-width:92px}.result-meta-row .result-n strong{white-space:nowrap}@media(max-width:700px){.result-meta-row{gap:8px}.result-meta-row .result-n{min-width:80px}}\n'''
          if '/* result-meta-split-v1 */' not in text:
              text=text.replace('</style>',css+'</style>',1)

          path.write_text(text,encoding='utf-8')
          if hashlib.sha256(backup.read_bytes()).hexdigest()!=backup_hash:
              raise RuntimeError('index_save.html changed')

          final=path.read_text(encoding='utf-8')
          assert 'Alicia Emorine - n = 19' not in final
          assert 'Olivia Hiridjee - n = 24' not in final
          assert final.count('class="m1-owner result-n"')>=6
          print('Changed:',changed)
          print('Backup SHA256:',backup_hash)
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split M1 student and sample size badges"
          rm .github/workflows/split-result-meta-badges.yml
          git add .github/workflows/split-result-meta-badges.yml
          git commit -m "Remove temporary result badge workflow"
          git push
