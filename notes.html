<!doctype html>
<html lang="fr" data-theme="light" data-accent="forest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI-1 - Notes orateur</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#fbf7ed;--panel:#ffffff;--panel-2:#f7f8f5;--text:#1d261f;--muted:#627068;--line:rgba(11,47,35,.12);
  --accent:#1f6f50;--accent-strong:#0b2f23;--accent-soft:#dceee3;--accent-pale:#f3faf5;
  --study:#8a6ee8;--font-scale:1;--shadow:0 18px 46px rgba(11,47,35,.10);--shadow-soft:0 9px 26px rgba(11,47,35,.08)
}
html[data-accent="blue"]{--accent:#2f6f9f;--accent-strong:#173f5f;--accent-soft:#dceaf4;--accent-pale:#f2f8fc}
html[data-accent="cassis"]{--accent:#7a2f5d;--accent-strong:#4c1738;--accent-soft:#f0dde8;--accent-pale:#fbf4f8}
html[data-accent="ochre"]{--accent:#9a6b20;--accent-strong:#584018;--accent-soft:#f3ead6;--accent-pale:#fcf8ef}
html[data-theme="dark"]{--bg:#07130f;--panel:#10251c;--panel-2:#0c1f17;--text:#edf8f0;--muted:#b8cabc;--line:rgba(220,238,227,.13);--shadow:0 20px 55px rgba(0,0,0,.32);--shadow-soft:0 10px 30px rgba(0,0,0,.22)}
html[data-theme="dark"][data-accent="forest"]{--accent:#77b892;--accent-strong:#dceee3;--accent-soft:#193f2e;--accent-pale:#0b1f17}
html[data-theme="dark"][data-accent="blue"]{--accent:#7eb0d2;--accent-strong:#dceaf4;--accent-soft:#19384f;--accent-pale:#0d1e2a}
html[data-theme="dark"][data-accent="cassis"]{--accent:#be7da3;--accent-strong:#f0dde8;--accent-soft:#4b2139;--accent-pale:#25101d}
html[data-theme="dark"][data-accent="ochre"]{--accent:#c9a45c;--accent-strong:#f3ead6;--accent-soft:#4b3917;--accent-pale:#241c0d}
*{box-sizing:border-box}html{font-size:calc(16px * var(--font-scale))}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding:0;background:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--study) 11%,transparent),transparent 31%),radial-gradient(circle at 95% 18%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 30%),linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--accent-pale) 55%,var(--bg)))}
body.dyslexic{font-family:Verdana,Tahoma,Arial,sans-serif;letter-spacing:.018em;word-spacing:.05em}body.high-contrast{--bg:#fff;--panel:#fff;--panel-2:#fff;--text:#000;--muted:#222;--line:rgba(0,0,0,.42)}html[data-theme="dark"] body.high-contrast{--bg:#000;--panel:#000;--panel-2:#000;--text:#fff;--muted:#eee;--line:rgba(255,255,255,.5)}
.shell{width:min(1160px,calc(100% - 34px));margin:0 auto;padding:22px 0 46px}.top{position:sticky;top:0;z-index:5;margin:0 -2px;padding:14px 2px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 97%,transparent) 68%,transparent);backdrop-filter:blur(16px)}
.top-card{padding:20px 22px 22px;border-radius:28px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);box-shadow:var(--shadow)}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta-left,.meta-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:850;font-size:.82rem;color:var(--muted)}.pill.study{color:var(--study);border-color:color-mix(in srgb,var(--study) 28%,var(--line));background:color-mix(in srgb,var(--study) 8%,var(--panel))}.dot{width:9px;height:9px;border-radius:50%;background:var(--study);box-shadow:0 0 0 5px color-mix(in srgb,var(--study) 13%,transparent)}
.section{margin-top:18px;color:var(--study);font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;font-weight:950}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.55rem,5vw,4.7rem);line-height:.98;letter-spacing:-.048em;margin:7px 0 0;color:var(--accent-strong)}
.notes{margin-top:18px}.csi-note-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:16px;align-items:start}.csi-note-card{padding:20px 22px;border-radius:23px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-soft);position:relative;overflow:hidden}.csi-note-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:color-mix(in srgb,var(--study) 78%,transparent)}.csi-note-card h3{margin:0 0 11px;color:var(--study);font-size:.83rem;text-transform:uppercase;letter-spacing:.075em;font-weight:950}.csi-note-card p,.csi-note-card li{font-size:1.06rem;line-height:1.58}.csi-note-card p{margin:0}.csi-note-card ul,.csi-note-card ol{margin:0;padding-left:1.35rem;display:grid;gap:8px}.csi-note-card.key{grid-column:1/-1;padding:24px 26px;background:linear-gradient(135deg,color-mix(in srgb,var(--study) 10%,var(--panel)),var(--panel))}.csi-note-card.key p{font-family:Georgia,"Times New Roman",serif;font-size:1.42rem;line-height:1.45;color:var(--accent-strong);font-weight:700}.csi-note-card.flow{grid-row:span 2}.csi-note-card.flow li::marker{color:var(--study);font-weight:950}.csi-note-card.details{background:color-mix(in srgb,var(--accent-pale) 46%,var(--panel))}.csi-note-card.watch{background:color-mix(in srgb,#f3b33d 10%,var(--panel));border-color:color-mix(in srgb,#f3b33d 28%,var(--line))}.csi-note-card.watch::before{background:#e89a18}.csi-note-card.watch h3{color:#b36c00}.csi-note-card.next{background:color-mix(in srgb,var(--study) 6%,var(--panel))}.csi-note-card.next p{font-weight:800}.waiting{padding:30px;border:1px dashed var(--line);border-radius:24px;background:var(--panel);color:var(--muted);box-shadow:var(--shadow-soft);font-size:1.04rem}.next-slide{margin-top:16px;padding:15px 18px;border-radius:18px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);color:var(--muted);font-size:.94rem}.next-slide strong{color:var(--study)}
@media(max-width:820px){.shell{width:min(100% - 22px,1160px)}.csi-note-grid{grid-template-columns:1fr}.csi-note-card.flow{grid-row:auto}.title{font-size:clamp(2.2rem,9vw,3.5rem)}}
@media(prefers-reduced-motion:no-preference){.csi-note-card{transition:transform .18s ease,box-shadow .18s ease}.csi-note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="top-card">
    <div class="meta"><div class="meta-left"><span class="pill" id="counter">Notes CSI-1</span><span class="pill study"><i class="dot"></i><span id="status">En attente</span></span></div><div class="meta-right"><span class="pill" id="lang">FR</span></div></div>
    <div class="section" id="section">Notes orateur</div>
    <h1 class="title" id="title">Ouvrez les notes depuis la présentation</h1>
  </div></header>
  <section class="notes" id="notes"><div class="waiting">Cette fenêtre se synchronise automatiquement avec la diapositive affichée et reprend son thème, sa langue et la couleur de l’étude.</div></section>
  <div class="next-slide" id="next"></div>
</main>
<script>
const $=id=>document.getElementById(id),counter=$('counter'),status=$('status'),lang=$('lang'),section=$('section'),title=$('title'),notes=$('notes'),next=$('next');
const studyColors={TWIXAV:'#00A7C4',SOFT:'#7057E8',TWIXOLF:'#F06449',SORBET:'#A879D8',VIBEX:'#13A89E',OASIS:'#D84C7F',COBEX:'#4F66D4',SOLAR:'#FF8A2B',BRAUD:'#6F7F8E',BRAUDOLF:'#9A5B8A',FLUXOLF:'#D1495B'};
let systemTheme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function appearance(){
 const choice=localStorage.getItem('csi-theme')||'light',theme=choice==='system'?systemTheme:choice,accent=localStorage.getItem('csi-accent')||'forest';
 const scale=Math.min(1.36,Math.max(.9,parseFloat(localStorage.getItem('csi-font')||'1')));
 document.documentElement.dataset.theme=theme;document.documentElement.dataset.accent=accent;document.documentElement.style.setProperty('--font-scale',scale);
 document.body.classList.toggle('high-contrast',localStorage.getItem('csi-contrast')==='1');document.body.classList.toggle('dyslexic',localStorage.getItem('csi-dyslexic')==='1');
}
function studyAccent(t=''){const up=String(t).toUpperCase(),k=Object.keys(studyColors).find(x=>up.includes(x));document.documentElement.style.setProperty('--study',k?studyColors[k]:'var(--accent)')}
function paint(p){
 if(!p||p.type!=='csi-notes-v12')return;appearance();studyAccent(p.title);const en=p.lang==='en';document.documentElement.lang=en?'en':'fr';
 counter.textContent=`${(p.index||0)+1} / ${p.total||0}`;status.textContent=en?'Synchronized':'Synchronisé';lang.textContent=en?'EN':'FR';section.textContent=p.section||'';title.textContent=p.title||'';
 notes.innerHTML=p.notes||`<div class="waiting">${en?'No specific speaker notes for this slide.':'Aucune note orateur spécifique pour cette diapositive.'}</div>`;
 next.innerHTML=p.nextTitle?`<strong>${en?'Next slide':'Diapositive suivante'} :</strong> ${p.nextTitle}`:'';document.title=`${(p.index||0)+1}/${p.total||0} - ${p.title||'Notes CSI-1'}`;
}
appearance();try{const saved=JSON.parse(localStorage.getItem('csi-notes-v12-last')||'null');if(saved)paint(saved)}catch(e){}
window.addEventListener('message',e=>{if(e.origin===location.origin)paint(e.data)});window.addEventListener('storage',e=>{if(!e.key||e.key.startsWith('csi-'))appearance()});
if('BroadcastChannel'in window){const ch=new BroadcastChannel('csi-notes-v12');ch.onmessage=e=>paint(e.data)}
try{if(window.opener&&!window.opener.closed)window.opener.postMessage('csi-notes-v12-ready',location.origin)}catch(e){}
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{systemTheme=e.matches?'dark':'light';appearance()});setInterval(appearance,900);
</script>
</body>
</html>
