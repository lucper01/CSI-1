<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI-1 - Notes orateur</title>
<style>
:root{color-scheme:light dark;--bg:#f3f1e7;--panel:#fffdf7;--text:#17352a;--muted:#65736c;--accent:#147954;--line:rgba(23,53,42,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding:22px}.shell{max-width:900px;margin:0 auto}.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);padding:8px 0 16px}.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:800;font-size:.78rem}.section{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:900;margin-top:18px}.title{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.6rem);line-height:1.02;letter-spacing:-.035em;margin:7px 0 12px}.notes{display:grid;gap:12px}.csi-note-block{padding:16px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px rgba(23,53,42,.07);font-size:1rem;line-height:1.6}.csi-note-block strong{color:var(--accent)}.csi-vigilance{background:#fff4df}.next{margin-top:16px;padding:14px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}.waiting{padding:28px;border:1px dashed var(--line);border-radius:22px;background:var(--panel);color:var(--muted)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1d17;--panel:#142820;--text:#e8f3ec;--muted:#b2c6ba;--accent:#7dd3a5;--line:rgba(232,243,236,.14)}.csi-vigilance{background:#302815}}
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <div class="meta"><span class="pill" id="counter">Notes CSI-1</span><span class="pill" id="status">En attente de la présentation</span></div>
    <div class="section" id="section">Notes orateur</div>
    <h1 class="title" id="title">Ouvrez les notes depuis le bouton N de la présentation</h1>
  </div>
  <section class="notes" id="notes"><div class="waiting">Cette fenêtre se synchronise automatiquement avec la diapositive affichée dans la présentation principale.</div></section>
  <div class="next" id="next"></div>
</main>
<script>
const counter=document.getElementById('counter'),status=document.getElementById('status'),section=document.getElementById('section'),title=document.getElementById('title'),notes=document.getElementById('notes'),next=document.getElementById('next');
function paint(p){if(!p||p.type!=='csi-notes-v12')return;document.documentElement.lang=p.lang||'fr';counter.textContent=`${(p.index||0)+1} / ${p.total||0}`;status.textContent=p.lang==='en'?'Synchronized':'Synchronisé';section.textContent=p.section||'';title.textContent=p.title||'';notes.innerHTML=p.notes||'<div class="waiting">Aucune note spécifique pour cette diapositive.</div>';next.innerHTML=p.nextTitle?`<strong>${p.lang==='en'?'Next':'Suivante'} :</strong> ${p.nextTitle}`:'';document.title=`${(p.index||0)+1}/${p.total||0} - ${p.title||'Notes CSI-1'}`}
try{const saved=JSON.parse(localStorage.getItem('csi-notes-v12-last')||'null');if(saved)paint(saved)}catch(e){}
window.addEventListener('message',e=>{if(e.origin===location.origin)paint(e.data)});
if('BroadcastChannel' in window){const ch=new BroadcastChannel('csi-notes-v12');ch.onmessage=e=>paint(e.data)}
try{if(window.opener&&!window.opener.closed)window.opener.postMessage('csi-notes-v12-ready',location.origin)}catch(e){}
</script>
</body>
</html>
