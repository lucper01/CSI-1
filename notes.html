<!doctype html>
<html lang="fr" data-theme="light" data-accent="forest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI-1 - Notes orateur</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#fbf7ed;--panel:#ffffff;--text:#1d261f;--muted:#5f6f65;--line:rgba(11,47,35,.13);
  --accent:#1f6f50;--accent-strong:#0b2f23;--accent-soft:#dceee3;--accent-pale:#f3faf5;--study-accent:var(--accent);--font-scale:1;
  --shadow:0 12px 30px rgba(11,47,35,.10)
}
html[data-accent="blue"]{--accent:#2f6f9f;--accent-strong:#173f5f;--accent-soft:#dceaf4;--accent-pale:#f2f8fc}
html[data-accent="cassis"]{--accent:#7a2f5d;--accent-strong:#4c1738;--accent-soft:#f0dde8;--accent-pale:#fbf4f8}
html[data-accent="ochre"]{--accent:#9a6b20;--accent-strong:#584018;--accent-soft:#f3ead6;--accent-pale:#fcf8ef}
html[data-theme="dark"]{--bg:#07130f;--panel:#10251c;--text:#edf8f0;--muted:#b8cabc;--line:rgba(220,238,227,.13);--shadow:0 12px 30px rgba(0,0,0,.25)}
html[data-theme="dark"][data-accent="forest"]{--accent:#77b892;--accent-strong:#dceee3;--accent-soft:#193f2e;--accent-pale:#0b1f17}
html[data-theme="dark"][data-accent="blue"]{--accent:#7eb0d2;--accent-strong:#dceaf4;--accent-soft:#19384f;--accent-pale:#0d1e2a}
html[data-theme="dark"][data-accent="cassis"]{--accent:#be7da3;--accent-strong:#f0dde8;--accent-soft:#4b2139;--accent-pale:#25101d}
html[data-theme="dark"][data-accent="ochre"]{--accent:#c9a45c;--accent-strong:#f3ead6;--accent-soft:#4b3917;--accent-pale:#241c0d}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--font-scale))}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding:22px;background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 34%),linear-gradient(180deg,var(--bg),var(--accent-pale))}
body.dyslexic{font-family:Verdana,Tahoma,Arial,sans-serif;letter-spacing:.02em;word-spacing:.06em}
body.high-contrast{--bg:#fff;--panel:#fff;--text:#000;--muted:#222;--line:rgba(0,0,0,.45)}
html[data-theme="dark"] body.high-contrast{--bg:#000;--panel:#000;--text:#fff;--muted:#eee;--line:rgba(255,255,255,.5)}
.shell{max-width:980px;margin:0 auto}
.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);padding:8px 0 16px}
.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:850;font-size:.82rem;box-shadow:var(--shadow)}
.section{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--study-accent);font-weight:950;margin-top:20px}
.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,5vw,4rem);line-height:1;letter-spacing:-.04em;margin:7px 0 12px;color:var(--accent-strong)}
.notes{display:grid;gap:13px}.csi-note-block{padding:18px 20px;border-radius:19px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:1.06rem;line-height:1.62}.csi-note-block strong{color:var(--study-accent)}.csi-vigilance{background:color-mix(in srgb,var(--accent-pale) 70%,#fff1d7)}
html[data-theme="dark"] .csi-vigilance{background:color-mix(in srgb,var(--accent-pale) 72%,#3b2e12)}
.next{margin-top:17px;padding:15px 17px;border-top:1px solid var(--line);color:var(--muted);font-size:.96rem}.next strong{color:var(--accent-strong)}
.waiting{padding:30px;border:1px dashed var(--line);border-radius:22px;background:var(--panel);color:var(--muted);font-size:1rem}
.theme-indicator{display:flex;align-items:center;gap:7px}.theme-indicator i{display:block;width:10px;height:10px;border-radius:50%;background:var(--accent)}
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <div class="meta"><span class="pill" id="counter">Notes CSI-1</span><span class="pill theme-indicator" id="status"><i></i><span>En attente de la présentation</span></span></div>
    <div class="section" id="section">Notes orateur</div>
    <h1 class="title" id="title">Ouvrez les notes depuis le bouton N de la présentation</h1>
  </div>
  <section class="notes" id="notes"><div class="waiting">Cette fenêtre se synchronise automatiquement avec la diapositive affichée dans la présentation principale.</div></section>
  <div class="next" id="next"></div>
</main>
<script>
const counter=document.getElementById('counter'),status=document.getElementById('status'),statusText=status.querySelector('span'),section=document.getElementById('section'),title=document.getElementById('title'),notes=document.getElementById('notes'),next=document.getElementById('next');
const studyColors={TWIXAV:'#2f6f9f',SOFT:'#7652a8',TWIXOLF:'#c36c32',SORBET:'#9a6b20',VIBEX:'#2f7d5a',OASIS:'#b44e6c',SOLAR:'#d09422',COBEX:'#5865a8',BRAUD:'#4f7187',BRAUDOLF:'#875a7c',FLUXOLF:'#a34d5d'};
let systemTheme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function appearance(){
  const choice=localStorage.getItem('csi-theme')||'light';
  const theme=choice==='system'?systemTheme:choice;
  const accent=localStorage.getItem('csi-accent')||'forest';
  const scale=Math.min(1.35,Math.max(.85,parseFloat(localStorage.getItem('csi-font')||'1')));
  document.documentElement.dataset.theme=theme;document.documentElement.dataset.accent=accent;document.documentElement.style.setProperty('--font-scale',scale);
  document.body.classList.toggle('high-contrast',localStorage.getItem('csi-contrast')==='1');
  document.body.classList.toggle('dyslexic',localStorage.getItem('csi-dyslexic')==='1');
}
function studyAccent(t=''){const key=Object.keys(studyColors).find(k=>String(t).toUpperCase().includes(k));document.documentElement.style.setProperty('--study-accent',key?studyColors[key]:'var(--accent)')}
function paint(p){
  if(!p||p.type!=='csi-notes-v12')return;
  appearance();studyAccent(p.title);
  const en=p.lang==='en';document.documentElement.lang=p.lang||'fr';
  counter.textContent=`${(p.index||0)+1} / ${p.total||0}`;statusText.textContent=en?'Synchronized':'Synchronisé';section.textContent=p.section||'';title.textContent=p.title||'';
  notes.innerHTML=p.notes||`<div class="waiting">${en?'No specific note for this slide.':'Aucune note spécifique pour cette diapositive.'}</div>`;
  next.innerHTML=p.nextTitle?`<strong>${en?'Next':'Suivante'} :</strong> ${p.nextTitle}`:'';
  document.title=`${(p.index||0)+1}/${p.total||0} - ${p.title||'Notes CSI-1'}`;
}
appearance();
try{const saved=JSON.parse(localStorage.getItem('csi-notes-v12-last')||'null');if(saved)paint(saved)}catch(e){}
window.addEventListener('message',e=>{if(e.origin===location.origin)paint(e.data)});
window.addEventListener('storage',e=>{if(!e.key||e.key.startsWith('csi-'))appearance()});
if('BroadcastChannel' in window){const ch=new BroadcastChannel('csi-notes-v12');ch.onmessage=e=>paint(e.data)}
try{if(window.opener&&!window.opener.closed)window.opener.postMessage('csi-notes-v12-ready',location.origin)}catch(e){}
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{systemTheme=e.matches?'dark':'light';appearance()});
setInterval(appearance,700);
</script>
</body>
</html>
