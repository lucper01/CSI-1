<head>
  <meta charset="utf-8">

  <title>CSI 1 - Luc Perroquin</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#143d2e,#07130f 58%);color:#edf8f0;transition:opacity .25s ease}
    #boot.hidden{opacity:0;pointer-events:none}
    .boot-card{width:min(540px,calc(100vw - 40px));padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
    .boot-kicker{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9ccbb0}.boot-card h1{margin:8px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.05}.boot-card p{margin:0;color:rgba(237,248,240,.72);line-height:1.5}.bar{height:5px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar span{display:block;width:38%;height:100%;border-radius:inherit;background:#77b892;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(165%)}}
    .boot-error{margin-top:16px;padding:12px 14px;border-radius:15px;background:#4a1f25;color:#ffe8ea;display:none;white-space:pre-wrap;font-size:.84rem}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="boot-kicker">CSI-1 - version autonome</div><h1>Chargement de la présentation</h1><p>Chargement de la présentation autonome avec identité visuelle par étude.</p><div class="bar"><span></span></div><div class="boot-error" id="bootError"></div></div></div>
  <iframe id="presentation" title="CSI 1 - Luc Perroquin" allowfullscreen></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('presentation'),boot=document.getElementById('boot'),err=document.getElementById('bootError');
    function forceFrenchAndCleanHeader(){
      try{
        localStorage.setItem('csi-lang','fr');
        const d=frame.contentDocument;
        if(!d)return;
        d.documentElement.lang='fr';

        d.querySelectorAll('.csi-lang,.language-toggle,.lang-toggle,#csiQOverlay,.csi-qbtn').forEach(el=>el.remove());

        d.querySelectorAll('.appbar button, header button').forEach(btn=>{
          const label=(btn.textContent||'').trim();
          const title=(btn.getAttribute('title')||'').toLowerCase();
          const aria=(btn.getAttribute('aria-label')||'').toLowerCase();
          const isLanguage=/^(en|fr)$/i.test(label)||title.includes('langue')||title.includes('language')||aria.includes('langue')||aria.includes('language');
          const isHelp=label==='?';
          const isQA=label.toUpperCase()==='Q&A';
          if(isLanguage||isHelp||isQA)btn.remove();
        });
      }catch(e){console.warn('Header cleanup',e)}
    }

    function integrateProjectSheets(){
      try{
        const d=frame.contentDocument;
        if(!d||!d.body)return false;
        if(d.documentElement.dataset.projectSheets==='1')return true;

        const style=d.createElement('style');
        style.id='csi-project-sheet-style';
        style.textContent=`
          .csi-sheet-actions{position:absolute;top:88px;right:clamp(24px,4vw,66px);z-index:18;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
          .csi-sheet-btn{border:1px solid var(--line);background:color-mix(in srgb,var(--white) 94%,transparent);color:var(--accent-strong);border-radius:999px;padding:8px 12px;font-size:.76rem;font-weight:950;cursor:pointer;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:7px}
          .csi-sheet-btn:hover{background:var(--accent-soft)}
          .csi-sheet-btn:before{content:'▤';font-size:.95rem}
          #csiSheetViewer{position:fixed;inset:0;z-index:200000;background:color-mix(in srgb,var(--cream) 96%,#000 4%);display:none;flex-direction:column;color:var(--text)}
          #csiSheetViewer.open{display:flex}
          .csi-sheet-head{height:66px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--cream) 95%,transparent);backdrop-filter:blur(16px)}
          .csi-sheet-head strong{font-family:Georgia,'Times New Roman',serif;color:var(--accent-strong);font-size:1.12rem}
          .csi-sheet-head-actions{display:flex;align-items:center;gap:8px}
          .csi-sheet-head a,.csi-sheet-close{border:1px solid var(--line);background:var(--white);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:900;text-decoration:none;cursor:pointer;font-size:.8rem}
          .csi-sheet-frame{width:100%;height:calc(100vh - 66px);border:0;background:#525659}
          @media(max-height:760px){.csi-sheet-actions{top:70px}.csi-sheet-btn{padding:6px 9px;font-size:.7rem}}
          @media(max-width:850px){.csi-sheet-actions{top:72px;right:18px}.csi-sheet-head strong{font-size:.92rem}.csi-sheet-head a{display:none}}
        `;
        d.head.appendChild(style);

        const viewer=d.createElement('div');
        viewer.id='csiSheetViewer';
        viewer.innerHTML=`<div class="csi-sheet-head"><strong id="csiSheetTitle">Fiche projet</strong><div class="csi-sheet-head-actions"><a id="csiSheetExternal" href="#" target="_blank" rel="noopener">Ouvrir le PDF</a><button class="csi-sheet-close" id="csiSheetClose" type="button">Retour au diapo</button></div></div><iframe class="csi-sheet-frame" id="csiSheetFrame" title="Fiche projet"></iframe>`;
        d.body.appendChild(viewer);

        const viewFrame=d.getElementById('csiSheetFrame');
        const viewTitle=d.getElementById('csiSheetTitle');
        const viewExternal=d.getElementById('csiSheetExternal');
        const closeViewer=()=>{viewer.classList.remove('open');viewFrame.removeAttribute('src')};
        d.getElementById('csiSheetClose').onclick=closeViewer;
        viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});
        d.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open')){e.preventDefault();closeViewer()}},true);

        const root='https://lucper01.github.io/CSI-1/affiches/';
        const configs=[
          {study:'TWIXAV',title:/^TWIXAV\b/i,files:[['Fiche projet','TWIXAV.pdf']]},
          {study:'TWIXOLF',title:/^TWIXOLF\b/i,files:[['Fiche projet','TWIXOLF.pdf']]},
          {study:'SOFT',title:/^SOFT\b/i,files:[['Fiche projet','SOFT.pdf']]},
          {study:'VIBEX',title:/^VIBEX\b/i,files:[['Fiche projet','VIBEX.pdf']]},
          {study:'OASIS',title:/^OASIS\b/i,files:[['Fiche projet','OASIS.pdf']]},
          {study:'FLUXOLF',title:/^FLUXOLF\b/i,files:[['Fiche 1','FLUXOLF_1.pdf'],['Fiche 2','FLUXOLF_2.pdf']]}
        ];

        const allSlides=[...d.querySelectorAll('#deck .slide,.slide')];
        configs.forEach(cfg=>{
          const slide=allSlides.find(el=>{
            const h=el.querySelector('h1,h2');
            return h&&cfg.title.test((h.textContent||'').trim());
          });
          if(!slide)return;
          if(getComputedStyle(slide).position==='static')slide.style.position='relative';
          const actions=d.createElement('div');
          actions.className='csi-sheet-actions';
          actions.setAttribute('aria-label',`Fiches ${cfg.study}`);
          cfg.files.forEach(([label,file])=>{
            const url=root+encodeURIComponent(file).replace(/%2F/g,'/');
            const btn=d.createElement('button');
            btn.type='button';
            btn.className='csi-sheet-btn';
            btn.textContent=label;
            btn.title=`Ouvrir ${label.toLowerCase()} ${cfg.study}`;
            btn.onclick=()=>{
              viewTitle.textContent=`${cfg.study} - ${label}`;
              viewExternal.href=url;
              viewFrame.src=url+'#view=FitH';
              viewer.classList.add('open');
            };
            actions.appendChild(btn);
          });
          slide.appendChild(actions);
        });

        d.documentElement.dataset.projectSheets='1';
        return true;
      }catch(e){console.warn('Project sheets',e);return false}
    }


    const base="<!DOCTYPE html>\n<html lang=\"fr\" data-theme=\"light\" data-accent=\"forest\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta name=\"color-scheme\" content=\"light dark\">\n  <meta name=\"theme-color\" content=\"#0b2f23\">\n  <meta name=\"description\" content=\"Comité de suivi individuel de Luc Perroquin - première année de doctorat en psychologie cognitive au CSGA.\">\n  <title>CSI 1 - Luc Perroquin</title>\n  <style>\n    :root {\n      --page-width: 1480px;\n      --green-deep: #061f17;\n      --green-dark: #0b2f23;\n      --green-main: #1f6f50;\n      --green-light: #77b892;\n      --green-soft: #dceee3;\n      --green-pale: #f3faf5;\n      --cream: #fbf7ed;\n      --text: #1d261f;\n      --muted: #5f6f65;\n      --white: #ffffff;\n      --line: rgba(11,47,35,.13);\n      --shadow: 0 18px 45px rgba(11,47,35,.16);\n      --shadow-soft: 0 12px 30px rgba(11,47,35,.10);\n      --radius-xl: 34px;\n      --radius-lg: 26px;\n      --radius-md: 18px;\n      --font-scale: 1;\n      --slide-pad-x: clamp(28px, 5vw, 84px);\n      --slide-pad-y: clamp(28px, 4.4vw, 72px);\n      --accent: var(--green-main);\n      --accent-strong: var(--green-dark);\n      --accent-soft: var(--green-soft);\n      --accent-pale: var(--green-pale);\n      --accent-light: var(--green-light);\n      --hero-start: #061f17;\n      --hero-mid: #0b2f23;\n      --hero-end: #1f6f50;\n    }\n    html[data-accent=\"blue\"] {\n      --accent: #2f6f9f;\n      --accent-strong: #173f5f;\n      --accent-soft: #dceaf4;\n      --accent-pale: #f2f8fc;\n      --accent-light: #7eb0d2;\n      --hero-start: #0a2233;\n      --hero-mid: #173f5f;\n      --hero-end: #2f6f9f;\n    }\n    html[data-accent=\"cassis\"] {\n      --accent: #7a2f5d;\n      --accent-strong: #4c1738;\n      --accent-soft: #f0dde8;\n      --accent-pale: #fbf4f8;\n      --accent-light: #be7da3;\n      --hero-start: #29101f;\n      --hero-mid: #4c1738;\n      --hero-end: #7a2f5d;\n    }\n    html[data-accent=\"ochre\"] {\n      --accent: #9a6b20;\n      --accent-strong: #584018;\n      --accent-soft: #f3ead6;\n      --accent-pale: #fcf8ef;\n      --accent-light: #c9a45c;\n      --hero-start: #302610;\n      --hero-mid: #584018;\n      --hero-end: #9a6b20;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; font-size: calc(16px * var(--font-scale)); }\n    body {\n      margin: 0;\n      min-height: 100vh;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      line-height: 1.55;\n      color: var(--text);\n      background:\n        radial-gradient(circle at 8% 2%, color-mix(in srgb, var(--accent-light) 22%, transparent), transparent 31%),\n        radial-gradient(circle at 92% 28%, color-mix(in srgb, var(--accent-soft) 68%, transparent), transparent 35%),\n        linear-gradient(180deg, var(--cream), var(--accent-pale));\n      overflow-x: hidden;\n      transition: background .25s ease, color .25s ease;\n    }\n    html[data-theme=\"dark\"] {\n      --cream: #07130f;\n      --text: #edf8f0;\n      --muted: #b8cabc;\n      --white: #10251c;\n      --line: rgba(220,238,227,.13);\n      --shadow: 0 18px 45px rgba(0,0,0,.38);\n      --shadow-soft: 0 12px 30px rgba(0,0,0,.22);\n    }\n    html[data-theme=\"dark\"] body {\n      background:\n        radial-gradient(circle at 8% 2%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 31%),\n        radial-gradient(circle at 92% 28%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 35%),\n        linear-gradient(180deg, #07130f, #0b1f17);\n    }\n    html[data-theme=\"dark\"][data-accent=\"blue\"] body { background: linear-gradient(180deg,#07111a,#0d1e2a); }\n    html[data-theme=\"dark\"][data-accent=\"cassis\"] body { background: linear-gradient(180deg,#160a11,#25101d); }\n    html[data-theme=\"dark\"][data-accent=\"ochre\"] body { background: linear-gradient(180deg,#171209,#241c0d); }\n\n    body.high-contrast {\n      --text: #000;\n      --muted: #222;\n      --white: #fff;\n      --cream: #fff;\n      --line: rgba(0,0,0,.42);\n      background: #fff;\n    }\n    html[data-theme=\"dark\"] body.high-contrast {\n      --text: #fff;\n      --muted: #eee;\n      --white: #000;\n      --cream: #000;\n      --line: rgba(255,255,255,.52);\n      background: #000;\n    }\n    body.dyslexic {\n      font-family: Verdana, Tahoma, Arial, sans-serif;\n      letter-spacing: .02em;\n      word-spacing: .06em;\n    }\n    body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {\n      scroll-behavior: auto !important;\n      animation: none !important;\n      transition: none !important;\n    }\n\n    button, input { font: inherit; }\n    button { color: inherit; }\n    a { color: var(--accent); font-weight: 800; }\n    a:hover { text-decoration-thickness: 2px; }\n\n    .skip-link {\n      position: fixed;\n      top: 12px;\n      left: 12px;\n      transform: translateY(-150%);\n      z-index: 9999;\n      background: var(--white);\n      color: var(--text);\n      padding: 10px 14px;\n      border-radius: 999px;\n      box-shadow: var(--shadow-soft);\n    }\n    .skip-link:focus { transform: translateY(0); }\n\n    .appbar {\n      position: fixed;\n      z-index: 1200;\n      top: 16px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: min(1180px, calc(100vw - 28px));\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      padding: 8px 10px 8px 14px;\n      border-radius: 999px;\n      background: color-mix(in srgb, var(--cream) 91%, transparent);\n      border: 1px solid var(--line);\n      box-shadow: var(--shadow-soft);\n      backdrop-filter: blur(18px);\n    }\n    .brand {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      min-width: 0;\n      font-weight: 950;\n      letter-spacing: -.02em;\n    }\n    .brand-mark {\n      width: 30px;\n      height: 30px;\n      border-radius: 12px;\n      background: linear-gradient(135deg, var(--accent-strong), var(--accent));\n      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);\n      flex: 0 0 auto;\n      position: relative;\n    }\n    .brand-mark::after {\n      content: \"\";\n      position: absolute;\n      width: 10px;\n      height: 10px;\n      border-radius: 50%;\n      background: rgba(255,255,255,.86);\n      right: 5px;\n      top: 5px;\n    }\n    .brand span:last-child {\n      overflow: hidden;\n      text-overflow: ellipsis;\n      white-space: nowrap;\n    }\n    .app-actions {\n      display: flex;\n      gap: 6px;\n      flex-wrap: nowrap;\n    }\n    .icon-btn, .pill-btn {\n      border: 0;\n      cursor: pointer;\n      background: transparent;\n      min-height: 38px;\n      border-radius: 999px;\n      font-weight: 850;\n    }\n    .icon-btn {\n      width: 40px;\n      display: grid;\n      place-items: center;\n    }\n    .pill-btn { padding: 8px 13px; }\n    .icon-btn:hover, .pill-btn:hover, .icon-btn.active, .pill-btn.active {\n      background: var(--accent-soft);\n      color: var(--accent-strong);\n    }\n\n    .drawer, .navigator, .overview, .notes-panel {\n      position: fixed;\n      z-index: 1600;\n      background: color-mix(in srgb, var(--cream) 96%, transparent);\n      border: 1px solid var(--line);\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(18px);\n    }\n    .drawer {\n      top: 70px;\n      right: 16px;\n      width: min(390px, calc(100vw - 32px));\n      max-height: calc(100vh - 90px);\n      overflow: auto;\n      padding: 20px;\n      border-radius: 26px;\n    }\n    .drawer[hidden], .navigator[hidden], .overview[hidden], .notes-panel[hidden] { display:none; }\n    .drawer-head, .panel-head {\n      display:flex;\n      align-items:flex-start;\n      justify-content:space-between;\n      gap:12px;\n      margin-bottom:16px;\n    }\n    .drawer h2, .navigator h2, .notes-panel h2 {\n      margin:0;\n      font-family: Georgia, \"Times New Roman\", serif;\n      color: var(--accent-strong);\n      letter-spacing:-.03em;\n    }\n    .close-btn {\n      border:0;\n      width:36px;\n      height:36px;\n      border-radius:999px;\n      background:var(--accent-soft);\n      color:var(--accent-strong);\n      cursor:pointer;\n      font-weight:950;\n    }\n    .control-section {\n      padding: 14px 0;\n      border-top: 1px solid var(--line);\n    }\n    .control-section:first-of-type { border-top:0; padding-top:0; }\n    .control-label {\n      font-size:.79rem;\n      text-transform:uppercase;\n      letter-spacing:.08em;\n      font-weight:900;\n      color:var(--muted);\n      margin-bottom:8px;\n    }\n    .segmented {\n      display:flex;\n      gap:6px;\n      flex-wrap:wrap;\n    }\n    .segmented button {\n      border:1px solid var(--line);\n      background:var(--white);\n      padding:8px 11px;\n      border-radius:999px;\n      cursor:pointer;\n      font-weight:800;\n    }\n    .segmented button.active {\n      background:var(--accent);\n      color:#fff;\n      border-color:transparent;\n    }\n    .toggle-row {\n      display:flex;\n      align-items:center;\n      justify-content:space-between;\n      gap:14px;\n      padding:9px 0;\n    }\n    .switch {\n      position:relative;\n      width:46px;\n      height:26px;\n      flex:0 0 auto;\n    }\n    .switch input { opacity:0; width:0; height:0; }\n    .slider {\n      position:absolute;\n      inset:0;\n      cursor:pointer;\n      background:color-mix(in srgb, var(--muted) 30%, transparent);\n      border-radius:999px;\n      transition:.2s;\n    }\n    .slider::before {\n      content:\"\";\n      position:absolute;\n      width:20px;height:20px;\n      left:3px;top:3px;\n      border-radius:50%;\n      background:#fff;\n      box-shadow:0 2px 8px rgba(0,0,0,.15);\n      transition:.2s;\n    }\n    .switch input:checked + .slider { background:var(--accent); }\
