ark\" aria-hidden=\"true\"></span>\n      <span>CSI 1 - Luc Perroquin</span>\n    </div>\n    <div class=\"app-actions\">\n      <button class=\"pill-btn\" id=\"modeBtn\" type=\"button\" title=\"Basculer entre présentation et défilement\"><span class=\"long\">Mode</span> diapo</button>\n      <button class=\"icon-btn\" id=\"navBtn\" type=\"button\" aria-label=\"Ouvrir le sommaire\" title=\"Sommaire\">☰</button>\n      <button class=\"icon-btn\" id=\"overviewBtn\" type=\"button\" aria-label=\"Vue d'ensemble\" title=\"Vue d'ensemble\">▦</button>\n      <button class=\"icon-btn\" id=\"notesBtn\" type=\"button\" aria-label=\"Notes orateur\" title=\"Notes orateur\">N</button>\n      <button class=\"icon-btn\" id=\"fullscreenBtn\" type=\"button\" aria-label=\"Plein écran\" title=\"Plein écran\">⛶</button>\n      <button class=\"icon-btn\" id=\"settingsBtn\" type=\"button\" aria-label=\"Personnalisation\" title=\"Personnalisation\">⚙</button>\n    </div>\n  </header>\n\n  <aside class=\"drawer\" id=\"settingsDrawer\" hidden aria-label=\"Personnalisation\">\n    <div class=\"drawer-head\">\n      <div><div class=\"control-label\">Préférences</div><h2>Personnalisation</h2></div>\n      <button class=\"close-btn\" data-close=\"settingsDrawer\" type=\"button\" aria-label=\"Fermer\">×</button>\n    </div>\n    <section class=\"control-section\">\n      <div class=\"control-label\">Affichage</div>\n      <div class=\"segmented\" id=\"themeControls\">\n        <button type=\"button\" data-theme-choice=\"light\">Clair</button>\n        <button type=\"button\" data-theme-choice=\"dark\">Sombre</button>\n        <button type=\"button\" data-theme-choice=\"system\">Système</button>\n      </div>\n    </section>\n    <section class=\"control-section\">\n      <div class=\"control-label\">Palette</div>\n      <div class=\"segmented\" id=\"accentControls\">\n        <button type=\"button\" data-accent-choice=\"forest\">Portfolio</button>\n        <button type=\"button\" data-accent-choice=\"blue\">Bleu</button>\n        <button type=\"button\" data-accent-choice=\"cassis\">Cassis</button>\n        <button type=\"button\" data-accent-choice=\"ochre\">Ocre</button>\n      </div>\n    </section>\n    <section class=\"control-section\">\n      <div class=\"control-label\">Taille du texte</div>\n      <div class=\"segmented\"><button type=\"button\" id=\"fontMinus\">A-</button><button type=\"button\" id=\"fontReset\">100 %</button><button type=\"button\" id=\"fontPlus\">A+</button></div>\n    </section>\n    <section class=\"control-section\">\n      <div class=\"toggle-row\"><span>Contraste élevé</span><label class=\"switch\"><input id=\"contrastToggle\" type=\"checkbox\"><span class=\"slider\"></span></label></div>\n      <div class=\"toggle-row\"><span>Police très lisible</span><label class=\"switch\"><input id=\"dyslexicToggle\" type=\"checkbox\"><span class=\"slider\"></span></label></div>\n      <div class=\"toggle-row\"><span>Réduire les animations</span><label class=\"switch\"><input id=\"motionToggle\" type=\"checkbox\"><span class=\"slider\"></span></label></div>\n      <div class=\"toggle-row\"><span>Inclure les annexes en mode diapo</span><label class=\"switch\"><input id=\"appendixToggle\" type=\"checkbox\"><span class=\"slider\"></span></label></div>\n    </section>\n    <section class=\"control-section\">\n      <div class=\"control-label\">Raccourcis</div>\n      <div style=\"color:var(--muted);font-size:.9rem;line-height:1.7\">← → / espace : naviguer<br>Home / End : début / fin<br>M : diapo / scroll · O : vue d'ensemble<br>N : notes · F : plein écran · C : personnalisation</div>\n    </section>\n  </aside>\n\n  <aside class=\"navigator\" id=\"navigator\" hidden aria-label=\"Sommaire\">\n    <div class=\"panel-head\"><div><div class=\"control-label\">Navigation</div><h2>Sommaire</h2></div><button class=\"close-btn\" data-close=\"navigator\" type=\"button\" aria-label=\"Fermer\">×</button></div>\n    <input class=\"nav-search\" id=\"navSearch\" type=\"search\" placeholder=\"Rechercher une slide...\">\n    <div class=\"slide-list\" id=\"slideList\"></div>\n  </aside>\n\n  <section class=\"overview\" id=\"overview\" hidden aria-label=\"Vue d'ensemble\">\n    <div class=\"panel-head\" style=\"max-width:1500px;margin:0 auto 16px\"><div><div class=\"control-label\">Vue globale</div><h2>La présentation en un coup d'œil</h2></div><button class=\"close-btn\" data-close=\"overview\" type=\"button\" aria-label=\"Fermer\">×</button></div>\n    <div class=\"overview-grid\" id=\"overviewGrid\"></div>\n  </section>\n\n  <aside class=\"notes-panel\" id=\"notesPanel\" hidden aria-live=\"polite\">\n    <div class=\"panel-head\"><div><div class=\"control-label\">Orateur</div><h2>Notes</h2></div><button class=\"close-btn\" data-close=\"notesPanel\" type=\"button\" aria-label=\"Fermer\">×</button></div>\n    <div class=\"notes-body\" id=\"notesBody\"></div>\n  </aside>\n\n  <main id=\"deck\" class=\"deck\" tabindex=\"-1\"></main>\n\n  <div class=\"timer-badge\" title=\"Chronomètre de présentation\"><span id=\"timerText\">00:00</span><button id=\"timerBtn\" type=\"button\" aria-label=\"Démarrer ou mettre en pause le chronomètre\">▶</button><button id=\"timerReset\" type=\"button\" aria-label=\"Réinitialiser le chronomètre\">↺</button></div>\n  <div class=\"deck-footer\" aria-live=\"polite\"><span id=\"sectionName\">Introduction</span><span class=\"dot\"></span><span id=\"slideCounter\">1 / 32</span></div>\n  <div class=\"nav-arrows\" aria-label=\"Navigation\"><button id=\"prevBtn\" type=\"button\" aria-label=\"Slide précédente\">←</button><button id=\"nextBtn\" type=\"button\" aria-label=\"Slide suivante\">→</button></div>\n  <div class=\"footer-progress\" aria-hidden=\"true\"><div id=\"progressBar\"></div></div>\n  <div class=\"toast\" id=\"toast\"></div>\n\n  <script>\n  const slides = [\n    {\n      section:\"Introduction\", kicker:\"Comité de suivi individuel - 1\", title:\"Y a-t-il un espace-temps pour les odeurs ?\", lead:\"Mécanismes d'intégration entre olfaction, vision et audition - première année de doctorat.\", hero:true,\n      content:`\n        <div>\n          <span class=\"eyebrow\">Doctorat en psychologie cognitive · 2025-2026</span>\n          <h1>Y a-t-il un espace-temps pour les odeurs&nbsp;?</h1>\n          <p class=\"subtitle\">Mécanismes d'intégration entre olfaction, vision et audition</p>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:26px\"><span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">CSGA - équipe DOCC</span><span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">ED Environnement-Santé</span></div>\n        </div>\n        <aside class=\"identity-card\">\n          <div class=\"mono\">Doctorant</div><strong>Luc PERROQUIN</strong>\n          <div class=\"identity-list\">\n            <div class=\"identity-row\"><div class=\"mono\">Direction</div><strong>Renaud BROCHARD</strong><br>Professeur des Universités - directeur</div>\n            <div class=\"identity-row\"><div class=\"mono\">Co-directeur</div><strong>Arnaud LELEU</strong><br>Maître de conférences</div>\n            <div class=\"identity-row\"><div class=\"mono\">Équipe</div><strong>DOCC</strong><br>Cognition et communication olfactives en développement</div>\n          </div>\n        </aside>`,\n      notes:\"Ouvrir par la question de thèse, puis annoncer que le suivi est organisé comme un récit scientifique : d'où vient la question, ce qui est déjà acquis, ce qui est en construction et les décisions à prendre.\"\n    },\n    {\n      section:\"Introduction\", kicker:\"Fil conducteur\", title:\"Un récit en quatre mouvements\", lead:\"La présentation ne suit pas la liste des études une par une. Elle suit la logique qui relie question scientifique, résultats, outils et prochaines décisions.\",\n      content:`\n        <div class=\"grid four\">\n          <div class=\"card dark\"><span class=\"badge\" style=\"background:rgba(255,255,255,.14);color:#fff\">01</span><h3>Construire la question</h3><p>Parcours, cadre doctoral, théorie multisensorielle et spécificités de l'olfaction.</p></div>\n          <div class=\"card\"><span class=\"badge\">02</span><h3>Tester le programme</h3><p>TWIXAV et VIBEX comme points d'appui, puis TWIXOLF, SOFT et OASIS comme développements actuels.</p></div>\n          <div class=\"card\"><span class=\"badge\">03</span><h3>Rendre les études possibles</h3><p>Respiration, olfactométrie, EEG, physiologie, analyses, éthique et outils transversaux.</p></div>\n          <div class=\"card\"><span class=\"badge\">04</span><h3>Prioriser la suite</h3><p>Enseignement, formation, valorisation, publications, calendrier et questions au comité.</p></div>\n        </div>\n        <div class=\"bridge\">Objectif : montrer la cohérence du programme sans répéter les mêmes informations de statut, de méthode et de perspective sur chaque slide.</div>`,\n      notes:\"Cette slide donne le mode d'emploi. Insister sur le fait que les statuts et les méthodes transversales seront centralisés plus loin pour éviter les répétitions.\"\n    },\n    {\n      section:\"Genèse\", kicker:\"01 - Construire la question\", title:\"D'un parcours généraliste à une thèse multisensorielle\", lead:\"La trajectoire est cohérente : perception, cognition, EEG, expérience de terrain et intérêt croissant pour les interactions entre modalités sensorielles.\",\n      content:`\n        <div class=\"timeline\">\n          <div class=\"timeline-item\"><div class=\"timeline-dot\">20</div><h3>Bac littéraire</h3><p>Spécialité Mathématiques - Lycée Anna Judic, Semur-en-Auxois.</p></div>\n          <div class=\"timeline-item\"><div class=\"timeline-dot\">23</div><h3>Licence Psychologie</h3><p>Psychologie cognitive et développementale - UBE. Travaux sur synesthésie audio-spatiale, mémoire et perception humaine.</p></div>\n          <div class=\"timeline-item\"><div class=\"timeline-dot\">25</div><h3>Master PSYCOEF</h3><p>M1 sur odeur et synchronisation au rythme auditif. M2 sur l'approche expert-apprenti des stratégies opérationnelles.</p></div>\n          <div class=\"timeline-item\"><div class=\"timeline-dot\">PhD</div><h3>Doctorat</h3><p>Depuis 2025 - psychologie cognitive, CSGA, équipe DOCC, contrat doctoral public.</p></div>\n        </div>\n        <div class=\"grid three\" style=\"margin-top:26px\">\n          <div class=\"card soft\"><h3>351 h de stages recherche</h3><p>54 h en 2021-2022, 45 h en 2022-2023 et 252 h en 2023-2024 au CSGA.</p></div>\n          <div class=\"card soft\"><h3>Expérience professionnelle</h3><p>Commerce puis adjoint manager, parallèlement au cursus, avec un stage professionnel de M2 de 500 h.</p></div>\n          <div class=\"card soft\"><h3>Titre de psychologue</h3><p>Obtenu en 2025, avant l'entrée en doctorat.</p></div>\n        </div>`,\n      notes:\"Ne pas détailler chaque expérience. Le message est la continuité : perception -> multisensorialité -> olfaction, plus autonomie organisationnelle acquise hors recherche.\"\n    },\n    {\n      section:\"Genèse\", kicker:\"Cadre doctoral\", title:\"Un environnement qui combine cognition, olfaction et méthodologie\", lead:\"Le projet s'inscrit au CSGA, dans l'équipe DOCC, avec une articulation forte entre question fondamentale et développement de dispositifs expérimentaux.\",\n      content:`\n        <div class=\"grid two\">\n          <div class=\"card dark\"><h3>Thèse</h3><p><strong>Y a-t-il un espace-temps pour les odeurs ?</strong><br>Mécanismes d'intégration entre olfaction, vision et audition.</p><div style=\"margin-top:18px\"><span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">CSGA</span> <span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">DOCC</span></div></div>\n          <div class=\"card\"><h3>Encadrement</h3><p><strong>Renaud Brochard</strong> - directeur de thèse<br><strong>Arnaud Leleu</strong> - co-directeur</p><div class=\"callout\" style=\"margin-top:18px\"><strong>Positionnement :</strong> psychologie cognitive, perception multisensorielle, temporalité et spatialité, avec une plateforme expérimentale multimodale.</div></div>\n        </div>`,\n      notes:\"Slide courte. Elle fixe les noms et le positionnement, puis on entre immédiatement dans la question scientifique.\"\n    },\n    {\n      section:\"Genèse\", kicker:\"Question centrale\", title:\"Deux axes pour interroger l'espace et le temps multisensoriels\", lead:\"Le cœur de la thèse n'est pas l'odeur isolée : c'est la façon dont l'olfaction s'insère dans des mécanismes habituellement étudiés en vision et en audition.\",\n      content:`\n        <div class=\"project-map\">\n          <div class=\"axis-card\"><span class=\"badge\">Axe 1</span><h3>Relations spatio-temporelles entre olfaction, vision et audition</h3><p>Quand des événements issus de modalités différentes sont-ils traités comme appartenant au même épisode ? Comment leurs débuts, fins et durées sont-ils représentés ?</p></div>\n          <div class=\"axis-card\"><span class=\"badge\">Axe 2</span><h3>Influence des odeurs sur la perception spatio-temporelle en audition et vision</h3><p>Une odeur peut-elle modifier la manière dont un événement visuel ou auditif est représenté dans l'espace et le temps ?</p></div>\n        </div>\n        <div class=\"bridge\">Les deux axes convergent vers une même question : quelle place la modalité olfactive occupe-t-elle dans l'organisation multisensorielle de l'expérience ?</div>`,\n      notes:\"Poser clairement la différence entre axes sans énumérer les projets. Les projets seront cartographiés sur la slide suivante.\"\n    },\n    {\n      section:\"Genèse\", kicker:\"Verrou conceptuel\", title:\"L'olfaction complique le problème temporel\", lead:\"En vision et audition, l'instant de stimulation est relativement maîtrisable. En olfaction, le temps du signal physique, de la respiration et de la perception ne se superposent pas simplement.\",\n      content:`\n        <div class=\"flow\">\n          <div class=\"flow-card\"><span class=\"step\">1</span><h3>Commande</h3><p>Le logiciel envoie une instruction à l'olfactomètre.</p></div><div class=\"flow-arrow\">→</div>\n          <div class=\"flow-card\"><span class=\"step\">2</span><h3>Délivrance</h3><p>Le stimulus chemine avec une dynamique de débit et de diffusion.</p></div><div class=\"flow-arrow\">→</div>\n          <div class=\"flow-card\"><span class=\"step\">3</span><h3>Perception</h3><p>La respiration et la montée du stimulus conditionnent l'accès effectif à l'odeur.</p></div>\n        </div>\n        <div class=\"grid four\" style=\"margin-top:22px\">\n          <div class=\"card soft\"><h3>Respiration</h3><p>Le début d'inspiration devient une information expérimentale à détecter et journaliser.</p></div>\n          <div class=\"card soft\"><h3>Latence</h3><p>La commande logicielle ne suffit pas à définir l'onset perceptif.</p></div>\n          <div class=\"card soft\"><h3>Habituation</h3><p>La répétition impose des choix de durée, pauses et ordre des essais.</p></div>\n          <div class=\"card soft\"><h3>Standardisation</h3><p>Débit, dilution, valence, intensité et arousal doivent être contrôlés.</p></div>\n        </div>`,\n      notes:\"Cette slide justifie une grande partie des développements techniques présentés plus tard. Elle crée la transition vers l'architecture expérimentale du programme.\"\n    },\n    {\n      section:\"Genèse\", kicker:\"Architecture du programme\", title:\"Dix études principales, mais une logique commune\", lead:\"Les projets ne sont pas dix blocs indépendants. Ils explorent des variantes temporelles et spatiales autour de quelques mécanismes communs.\",\n      content:`\n        <div class=\"project-map\">\n          <div class=\"axis-card\"><h3>Temps et intégration</h3><p>Comparer les fenêtres d'intégration, la perception de l'onset/offset/durée et les recalibrations temporelles.</p><div class=\"project-pills\"><span class=\"project-pill\">TWIXAV <small>AV</small></span><span class=\"project-pill\">TWIXOLF <small>olfaction</small></span><span class=\"project-pill\">SOFT <small>onset/offset</small></span><span class=\"project-pill\">SORBET <small>recalibration</small></span></div></div>\n          <div class=\"axis-card\"><h3>Espace et représentation</h3><p>Tester l'extension ou la restriction des représentations spatiales et l'influence de l'odeur sur ces mécanismes.</p><div class=\"project-pills\"><span class=\"project-pill\">VIBEX <small>vision</small></span><span class=\"project-pill\">OASIS <small>approche-évitement</small></span><span class=\"project-pill\">SOLAR <small>cueing</small></span><span class=\"project-pill\">COBEX <small>congruence</small></span><span class=\"project-pill\">BRAUD <small>audition</small></span><span class=\"project-pill\">BRAUDOLF <small>audition + odeur</small></span></div></div>\n        </div>\n        <div class=\"callout\" style=\"margin-top:18px\"><strong>Projet annexe :</strong> FLUXOLF explore les interactions musique-odeur à travers des mesures physiologiques. Il alimente les compétences méthodologiques sans devenir un troisième axe de thèse.</div>\n        <div class=\"bridge\">Le récit expérimental commence par TWIXAV, car c'est le résultat temporel actuellement le plus avancé et celui qui motive directement plusieurs développements suivants.</div>`,\n      notes:\"Ne pas détailler chaque acronyme. Faire comprendre que la carte réduit la complexité apparente à deux familles de mécanismes.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"02 - Tester le programme\", title:\"TWIXAV - établir une référence audiovisuelle\", lead:\"Avant d'intégrer l'olfaction, TWIXAV réplique une tâche de fenêtre temporelle d'intégration en audition-vision et fournit un point de comparaison.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Design</h3><ul><li>n = 19 participants au prétest</li><li>Stimuli auditifs et visuels de 50, 150 ou 250 ms</li><li>SOA de -500 à +500 ms par pas de 100 ms</li><li>Jugement de simultanéité</li></ul></div><div class=\"card\"><h3>Ce que l'étude doit fournir</h3><p>Une fonction psychométrique de simultanéité et des indices temporels permettant de caractériser la fenêtre de liaison audiovisuelle, sa largeur et son asymétrie.</p><div class=\"callout\" style=\"margin-top:18px\"><strong>Rôle dans la thèse :</strong> obtenir une référence comportementale avant d'ajouter les contraintes propres à l'olfaction.</div></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Mémoire de M1 :</strong> ce projet a donné lieu au mémoire de M1 d'Alicia.</div>`,\n      notes:\"Présenter seulement les paramètres qui donnent l'échelle de la tâche. Ne pas dérouler le pipeline d'analyse ici, il sera centralisé dans la partie méthodes. Mentionner brièvement que le projet a aussi servi de support au mémoire de M1 d'Alicia.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"TWIXAV - prétest\", title:\"Un effet net de la durée et du décalage temporel\", lead:\"Les analyses préliminaires montrent que la réponse de simultanéité dépend de la durée, du SOA et de leur interaction.\",\n      content:`\n        <div class=\"result-strip\"><div class=\"result\"><div class=\"pval\">p = .001</div><p>Effet de la durée</p></div><div class=\"result\"><div class=\"pval\">p &lt; .001</div><p>Effet du SOA</p></div><div class=\"result\"><div class=\"pval\">p = .001</div><p>Interaction durée × SOA</p></div></div>\n        <div class=\"grid two\" style=\"margin-top:22px\"><div class=\"card soft\"><h3>Point acquis</h3><p>La manipulation temporelle produit bien une modulation structurée du jugement de simultanéité.</p></div><div class=\"card soft\"><h3>Point à verrouiller</h3><p>Les indices finaux de fenêtre, PSS et asymétrie doivent être consolidés avant interprétation définitive.</p></div></div>\n        <div class=\"bridge\">Une asymétrie temporelle décrite dans la littérature et retrouvée dans la réplication préliminaire devient une question à traiter plus directement dans la suite.</div>`,\n      notes:\"Ne pas annoncer de direction ou de valeur d'asymétrie tant que les analyses finales ne sont pas verrouillées. La transition doit conduire à TWIXOLF et SOFT.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"Connexion logique\", title:\"De la fenêtre audiovisuelle à la temporalité olfactive\", lead:\"TWIXAV ne constitue pas une fin en soi. Il pose la référence à partir de laquelle deux questions deviennent centrales : comment l'olfaction s'intègre-t-elle, et comment définir son propre temps perceptif ?\",\n      content:`<div class=\"flow\"><div class=\"flow-card\"><span class=\"step\">A</span><h3>TWIXAV</h3><p>Caractériser une fenêtre de simultanéité en audition-vision.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">B</span><h3>TWIXOLF</h3><p>Transposer la question de liaison temporelle à l'olfaction.</p></div><div class=\"flow-arrow\">+</div><div class=\"flow-card\"><span class=\"step\">C</span><h3>SOFT</h3><p>Mesurer plus directement onset, offset et durée perçue dans les trois modalités.</p></div></div><div class=\"callout\" style=\"margin-top:22px\"><strong>Conséquence :</strong> l'étude de l'intégration olfactive nécessite en parallèle une étude de la temporalité propre du stimulus olfactif, d'où le rôle structurant de SOFT.</div>`,\n      notes:\"Cette slide est une charnière. Elle évite de présenter TWIXOLF et SOFT comme deux projets ajoutés arbitrairement.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"TWIXOLF\", title:\"Transposer la liaison temporelle à l'olfaction\", lead:\"TWIXOLF reprend la question de la fenêtre temporelle d'intégration en intégrant les contraintes spécifiques de la délivrance olfactive.\",\n      content:`<div class=\"grid three\"><div class=\"card\"><h3>Question</h3><p>À quelles relations temporelles une stimulation olfactive est-elle traitée comme appartenant au même événement qu'un signal visuel ou auditif ?</p></div><div class=\"card\"><h3>Verrous</h3><p>Habituation, choix de l'odeur, diffusion, respiration, intensité, valence et synchronisation effective.</p></div><div class=\"card tint\"><span class=\"status progress\">En cours</span><h3 style=\"margin-top:12px\">Étape actuelle</h3><p>Architecture PsychoPy + Sniffo/Spir0 en développement et validation de l'onset, du débit et de la respiration.</p></div></div><div class=\"bridge\">TWIXOLF dépend donc directement de la fiabilisation de la plateforme olfactive et de la mesure respiratoire présentées plus loin.</div>`,\n      notes:\"Ne pas répéter tout le matériel ici. Seulement dire de quoi l'étude dépend, puis renvoyer explicitement à la partie infrastructure.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"SOFT\", title:\"Mesurer le temps propre de chaque modalité\", lead:\"SOFT - Sensory Onset Offset Task - vise à comparer la perception du début, de la fin et de la durée en audition, vision et olfaction.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Pourquoi SOFT est structurant</h3><p>La temporalité de l'olfaction ne peut pas être réduite au timestamp de commande de l'olfactomètre. SOFT permet d'étudier la relation entre événement physique, respiration et événement perceptif.</p></div><div class=\"card\"><h3>Architecture actuelle</h3><ul><li>Modalités audition, vision et olfaction</li><li>Durées paramétrables, notamment séries linéaire ou logarithmique</li><li>Ordres de blocs contrôlés ou pseudo-aléatoires</li><li>Logs onset, offset, press et release</li><li>EEG, EDA, ECG et respiration selon configuration</li></ul></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Statut :</strong> développement avancé. Prochaine étape - pilote complet et vérification de la charge participant.</div>`,\n      notes:\"Garder les détails de timing, triggers et calibration en annexe. Ici, faire comprendre la contribution scientifique et méthodologique.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"Extensions temporelles\", title:\"Les études futures prolongent des mécanismes déjà testés\", lead:\"Les projets prospectifs sont conservés comme extensions conditionnelles. Ils ne doivent pas brouiller la priorité donnée aux études actives.\",\n      content:`<div class=\"grid two\"><div class=\"card\"><span class=\"status future\">À venir</span><h3 style=\"margin-top:12px\">SORBET</h3><p>Étudier une recalibration temporelle impliquant l'olfaction, après caractérisation plus solide des fenêtres d'intégration et du temps perceptif.</p></div><div class=\"card\"><span class=\"status future\">À venir</span><h3 style=\"margin-top:12px\">SOLAR</h3><p>Explorer le cueing spatial olfactif et son influence sur les réponses visuelles, dans la continuité de la question spatio-temporelle générale.</p></div></div><div class=\"bridge\">Le programme bascule maintenant vers la seconde famille de mécanismes : la représentation spatiale et son éventuelle modulation par les odeurs.</div>`,\n      notes:\"Présenter ces projets comme perspectives conditionnelles, sans leur donner le même poids que TWIXOLF ou SOFT.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"VIBEX\", title:\"VIBEX - établir une référence visuelle de Boundary Extension\", lead:\"Comme TWIXAV pour le temps, VIBEX fournit une base de référence avant l'introduction de manipulations olfactives ou intermodales.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Prétest</h3><ul><li>24 scènes</li><li>Manipulation de zoom</li><li>Image initiale 200 ms</li><li>Délai 1000 ms puis image test</li><li>Réponse identique / différente</li><li>Conditions LL, SS, LS et SL</li></ul></div><div class=\"card\"><span class=\"status done\">Prétest terminé</span><h3 style=\"margin-top:14px\">Ce qui reste</h3><p>Normer les images et consolider l'analyse avant de réutiliser le paradigme comme base pour les extensions olfactives et intermodales.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Mémoire de M1 :</strong> ce projet a donné lieu au mémoire de M1 d'Olivia.</div>`,\n      notes:\"Même logique que TWIXAV : référence classique d'abord, extension olfactive ensuite. Mentionner brièvement que le projet a aussi servi de support au mémoire de M1 d'Olivia.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"OASIS\", title:\"OASIS - relier odeur, approche-évitement et espace\", lead:\"OASIS explore comment la présence olfactive peut s'articuler à des réponses spatiales d'approche ou d'évitement.\",\n      content:`<div class=\"grid three\"><div class=\"card\"><h3>Dimension cognitive</h3><p>Tester une modulation spatiale liée à l'odeur sans réduire l'effet à une simple évaluation consciente du stimulus.</p></div><div class=\"card\"><h3>Mesures prévues</h3><p>Comportement, EDA, ECG et respiration, avec canules et contrôle du moment de stimulation.</p></div><div class=\"card tint\"><span class=\"status progress\">En préparation</span><h3 style=\"margin-top:12px\">Étape actuelle</h3><p>Stabiliser les stimuli, le plan expérimental et les prétests olfactifs.</p></div></div><div class=\"bridge\">OASIS réutilise donc les mêmes briques matérielles et physiologiques que TWIXOLF et SOFT, plutôt que de développer une infrastructure séparée.</div>`,\n      notes:\"Ne pas surdéfinir la tâche finale tant qu'elle n'est pas figée. Le message important est la réutilisation de l'infrastructure commune.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"Extensions spatiales\", title:\"Trois prolongements possibles autour de l'extension et de la restriction\", lead:\"Ces études restent des branches possibles du programme. Leur activation dépendra des résultats des études de référence et du calendrier réel de collecte.\",\n      content:`<div class=\"grid three\"><div class=\"card\"><span class=\"status future\">Perspective</span><h3 style=\"margin-top:12px\">COBEX</h3><p>Tester une Boundary Extension visuelle sous influence d'une odeur congruente ou incongruente.</p></div><div class=\"card\"><span class=\"status future\">Exploratoire</span><h3 style=\"margin-top:12px\">BRAUD</h3><p>Examiner un mécanisme de Boundary Restriction dans la modalité auditive.</p></div><div class=\"card\"><span class=\"status future\">Exploratoire</span><h3 style=\"margin-top:12px\">BRAUDOLF</h3><p>Prolonger cette restriction auditive en introduisant une composante olfactive.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Principe de priorisation :</strong> les études futures enrichissent le programme, mais ne doivent pas retarder la consolidation des études centrales déjà engagées.</div>`,\n      notes:\"Cette slide permet de citer les trois projets sans leur consacrer chacun une slide. C'est l'un des principaux gains de fluidité par rapport au diaporama initial.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"Projet annexe\", title:\"FLUXOLF - une branche méthodologique utile, distincte de la thèse\", lead:\"FLUXOLF étudie les interactions musique-odeur avec des mesures physiologiques et sert aussi de terrain de consolidation pour les pipelines EDA, HR et HRV.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Structure des données</h3><p>Blocs N1, O1, O2, N2, N3 - phases BASELINE, STRESS, STIM et REST - acquisition Biopac à 1000 Hz.</p></div><div class=\"card\"><h3>Analyses</h3><p>HR, EDA et HRV avec RMSSD, SDNN, pNN50, meanNN et composante HF. Les données sont disponibles et le pipeline d'analyse est en cours de consolidation.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Mémoire de M1 :</strong> ce projet a donné lieu au mémoire de M1 de Morgane.</div><div class=\"bridge\">FLUXOLF reste un side project : il nourrit les compétences et les méthodes, mais la progression de la thèse reste prioritaire.</div>`,\n      notes:\"Éviter d'ouvrir un nouveau récit scientifique. Cette slide justifie la place de FLUXOLF et referme immédiatement la parenthèse. Mentionner que le projet a également donné lieu au mémoire de M1 de Morgane.\"\n    },\n    {\n      section:\"Programme expérimental\", kicker:\"Vue consolidée\", title:\"Un programme à plusieurs niveaux de maturité\", lead:\"Centraliser les statuts sur une seule slide évite de répéter 'en cours', 'prétest' ou 'à venir' dans chaque transition.\",\n      content:`<div class=\"status-table\"><div class=\"status-row\"><div class=\"proj\">TWIXAV</div><span class=\"status done\">Prétest terminé</span><div class=\"desc\">n = 19 - analyses préliminaires disponibles.</div><div class=\"desc\">Finaliser les indices temporels.</div></div><div class=\"status-row\"><div class=\"proj\">VIBEX</div><span class=\"status done\">Prétest terminé</span><div class=\"desc\">Paradigme fonctionnel.</div><div class=\"desc\">Norming des images et consolidation.</div></div><div class=\"status-row\"><div class=\"proj\">TWIXOLF</div><span class=\"status progress\">En cours</span><div class=\"desc\">Architecture PsychoPy + Sniffo/Spir0.</div><div class=\"desc\">Onset, débit et respiration.</div></div><div class=\"status-row\"><div class=\"proj\">SOFT</div><span class=\"status progress\">En cours avancé</span><div class=\"desc\">Architecture multimodale et logs.</div><div class=\"desc\">Pilote complet + charge participant.</div></div><div class=\"status-row\"><div class=\"proj\">OASIS</div><span class=\"status progress\">Préparation</span><div class=\"desc\">Mesures physiologiques définies.</div><div class=\"desc\">Stimuli, plan et prétests.</div></div><div class=\"status-row\"><div class=\"proj\">Autres</div><span class=\"status future\">Conditionnels</span><div class=\"desc\">SOLAR, COBEX, BRAUD, BRAUDOLF, SORBET.</div><div class=\"desc\">Activation selon résultats et faisabilité.</div></div></div>`,\n      notes:\"C'est la slide de statut de référence. Si une question de calendrier arrive plus tôt, renvoyer ici plutôt que de répéter.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"03 - Rendre les études possibles\", title:\"Une plateforme expérimentale commune plutôt qu'un montage par étude\", lead:\"Le choix méthodologique majeur de la première année est de mutualiser les briques matérielles, logicielles et de journalisation.\",\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>Stimulation</h3><p>PsychoPy Coder, écran participant, opérateur, audio et visuel.</p></div><div class=\"card\"><h3>Olfaction</h3><p>Cynexo Sniffo, débits, valves, canules, flushs et calibration.</p></div><div class=\"card\"><h3>Physiologie</h3><p>Biopac, EDA, ECG, respiration et autres mesures selon l'étude.</p></div><div class=\"card\"><h3>EEG</h3><p>BioSemi ActiveTwo 128 électrodes, triggers TTL et synchronisation événementielle.</p></div></div><div class=\"callout\" style=\"margin-top:20px\"><strong>Architecture cible :</strong> un noyau générique, des modules activables, des états matériels visibles et des logs cohérents quel que soit le protocole.</div>`,\n      notes:\"Introduire la partie infrastructure par le principe de mutualisation. Les appareils sont des briques au service de plusieurs études.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Respiration et olfaction\", title:\"Déclencher sur un événement physiologique, pas seulement logiciel\", lead:\"Pour les études olfactives, le cycle respiratoire devient une partie du contrôle expérimental.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Spir0</h3><p>Lecture par fibre optique du cycle respiratoire. La polarité est paramétrable pour associer l'état inspiratoire au déclenchement attendu.</p><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px\"><span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">Inspiration = déclenchement</span><span class=\"chip\" style=\"background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)\">Expiration = attente</span></div></div><div class=\"card\"><h3>Deux stratégies de fixation déjà envisagées</h3><ul><li>Croix de durée fixe puis blank jusqu'au début d'inspiration.</li><li>Croix maintenue jusqu'à la détection d'un nouveau cycle respiratoire.</li></ul><div class=\"callout\" style=\"margin-top:16px\"><strong>But :</strong> aligner autant que possible le début du stimulus olfactif avec le moment où il peut réellement être échantillonné.</div></div></div>`,\n      notes:\"Cette logique est réutilisable dans plusieurs études. Ne pas entrer dans les ports COM ou les valeurs bas niveau sauf question.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Analyse\", title:\"Une seule logique de traitement, adaptée à chaque famille de mesures\", lead:\"Les pipelines sont organisés pour que les choix de nettoyage, agrégation, statistiques et export soient traçables et reproductibles.\",\n      content:`<div class=\"grid three\"><div class=\"card\"><h3>Comportement</h3><p>Agrégation par participant, contrôle des essais d'entraînement et NA, filtrage RT par IQR, ANOVA à mesures répétées, post-hoc corrigés et exports standardisés.</p></div><div class=\"card\"><h3>EEG</h3><p>Synchronisation par triggers, prétraitement sous Let'sWave 6 et analyses fréquentielles ciblant notamment des harmoniques définies par le paradigme.</p></div><div class=\"card\"><h3>Physiologie</h3><p>HR, EDA, HRV et respiration, avec segmentation par phases, contrôle des artefacts et attention portée à la durée des fenêtres d'analyse.</p></div></div><div class=\"bridge\">Le détail statistique n'est donc plus répété sur chaque étude : chaque projet hérite d'un socle commun et ajoute uniquement les analyses spécifiques à son hypothèse.</div>`,\n      notes:\"Cette slide remplace plusieurs slides redondantes de pipeline. Si le comité veut le détail, les annexes donnent les règles comportementales et physiologiques.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Analyse comportementale\", title:\"Des sorties standardisées pour comparer les études\", lead:\"Le pipeline comportemental est pensé comme une chaîne reproductible plutôt que comme une suite d'analyses manuelles.\",\n      content:`<div class=\"flow\"><div class=\"flow-card\"><span class=\"step\">1</span><h3>Préparer</h3><p>Retirer entraînement et réponses manquantes, vérifier les identifiants et conditions.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">2</span><h3>Agréger</h3><p>Moyennes intra-sujet, descriptifs par condition et contrôle des RT par participant.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">3</span><h3>Tester</h3><p>Hypothèses paramétriques, ANOVA RM, effets simples, post-hoc FDR et analyses spécifiques comme FWHM/PSS.</p></div></div><div class=\"grid three\" style=\"margin-top:20px\"><div class=\"card soft\"><h3>XLSX</h3><p>Tables exploitables et récapitulatifs participant/condition.</p></div><div class=\"card soft\"><h3>PNG</h3><p>Figures standardisées, notamment boxplots et courbes de réponse.</p></div><div class=\"card soft\"><h3>Quarto</h3><p>Rapports reproductibles et logique modulaire réutilisable.</p></div></div>`,\n      notes:\"Cette slide montre le niveau de structuration des analyses sans faire un cours de statistiques.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Données et éthique\", title:\"La robustesse du protocole inclut aussi la charge participant\", lead:\"La qualité d'une étude multimodale dépend autant du design expérimental que de la durée de préparation, du confort, de la traçabilité et de la protection des données.\",\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>Données</h3><p>Pseudonymisation pendant le traitement puis anonymisation selon le cycle de gestion retenu.</p></div><div class=\"card\"><h3>Non invasif</h3><p>EEG, EDA, ECG, respiration et olfactométrie dans le cadre des protocoles prévus.</p></div><div class=\"card\"><h3>Charge</h3><p>Préparation EEG pouvant approcher 60 min et passation SOFT envisagée autour de 120 min avec pauses.</p></div><div class=\"card\"><h3>Documentation</h3><p>Fiches d'information, consentement, supports participants et dossiers éthiques préparés selon les études.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Point de vigilance :</strong> la faisabilité réelle de SOFT doit être validée en pilote complet, pas seulement sur la base du code.</div>`,\n      notes:\"Ne pas affirmer d'approbation éthique non confirmée. Parler de documentation et dossiers selon l'état réel.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Outils transversaux\", title:\"Des développements logiciels conçus pour réduire la friction de recherche\", lead:\"Les side projects techniques ont une fonction directe : standardiser, tracer, préparer et rendre les expériences plus faciles à maintenir.\",\n      content:`<div class=\"grid four\"><div class=\"card dark\"><h3>Dashboard expérimental</h3><p>Interface opérateur générique, écran participant, états outils, tests, calibration et logs par dispositif.</p></div><div class=\"card\"><h3>Lab Inventory</h3><p>Inventaire, emplacements, QR codes, transferts, historiques, stocks et suivi partagé du matériel.</p></div><div class=\"card\"><h3>R / Quarto</h3><p>Pipelines reproductibles et générateur modulaire pour analyses, tableaux et figures cohérents.</p></div><div class=\"card\"><h3>Portfolio</h3><p>Présentation bilingue de la thèse, des projets, communications, recrutements et outils produits.</p></div></div><div class=\"bridge\">Le critère pour maintenir un side project est simple : il doit soutenir directement les collectes, la reproductibilité, la documentation ou la valorisation.</div>`,\n      notes:\"Cette slide remplace les répétitions sur les outils dans les slides compétences, carrière et roadmap. Plus tard, on parlera de ce que ces outils démontrent, pas de ce qu'ils font.\"\n    },\n    {\n      section:\"Infrastructure\", kicker:\"Retour d'expérience\", title:\"Les principales difficultés ont déjà modifié la manière de concevoir les études\", lead:\"La première année n'a pas seulement produit des prototypes. Elle a fait évoluer les choix méthodologiques.\",\n      content:`<div class=\"grid two\"><div class=\"stack\"><div class=\"callout\"><strong>Synchronisation olfactive :</strong> passage d'un simple timestamp de commande à une logique intégrant respiration, délai physique et logs matériels.</div><div class=\"callout\"><strong>Multiplication des dispositifs :</strong> passage de scripts spécifiques à une architecture générique avec modules activables.</div><div class=\"callout\"><strong>Analyses nombreuses :</strong> passage de scripts isolés à des pipelines standardisés R/Quarto.</div></div><div class=\"card tint\"><h3>Le changement de perspective</h3><p>Le protocole n'est plus seulement une séquence de stimuli. C'est un système complet qui doit synchroniser matériel, physiologie, comportement, logs et analyse.</p><p style=\"margin-top:14px\">Cette évolution est directement issue des contraintes rencontrées en TWIXOLF, SOFT, VIBEX et FLUXOLF.</p></div></div>`,\n      notes:\"C'est la slide 'ce qui a changé' sans créer une nouvelle liste de décisions. Elle synthétise les apprentissages techniques.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"04 - Construire la suite\", title:\"La première année a aussi construit un profil de chercheur\", lead:\"Les compétences ne sont pas une liste de logiciels : elles se structurent autour de quatre rôles de plus en plus intégrés.\",\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>Chercheur</h3><p>Problématisation, hypothèses, lecture critique et articulation d'un programme multisensoriel.</p></div><div class=\"card\"><h3>Expérimentateur</h3><p>PsychoPy, EEG, EDA, ECG, respiration, olfactométrie, TTL et résolution de problèmes matériels.</p></div><div class=\"card\"><h3>Analyste</h3><p>R, Quarto, statistiques répétées, pipelines reproductibles et exports standardisés.</p></div><div class=\"card\"><h3>Constructeur d'outils</h3><p>Dashboards, inventaire, portfolio et ressources réutilisables au-delà d'une seule expérience.</p></div></div>`,\n      notes:\"Ici, ne pas redécrire Lab Inventory ou le dashboard. On parle uniquement de ce que ces réalisations démontrent en termes de compétences.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Enseignement et formation\", title:\"Un développement doctoral qui ne se limite pas aux collectes\", lead:\"L'enseignement et la formation complètent la construction du profil d'enseignant-chercheur.\",\n      content:`<div class=\"grid two\"><div class=\"card dark\"><div class=\"big-number\" style=\"color:#fff\">64 HETD</div><div class=\"metric-label\" style=\"color:rgba(255,255,255,.78)\">Chargé de TD depuis 2025 - UBE Dijon - niveaux L1, L3 et Master.</div><p style=\"margin-top:18px\">Structuration d'un raisonnement scientifique accessible, adaptation au niveau des étudiants, retour constructif et articulation enseignement-recherche.</p></div><div class=\"card\"><div class=\"big-number\">34,5 h</div><div class=\"metric-label\">de formation doctorale documentée en 2025-2026.</div><ul><li>Poursuite de carrière - Enseignement supérieur : 27,5 h</li><li>Intelligence économique - veille et valorisation : 4 h</li><li>Intégrité scientifique et déontologie : 3 h</li></ul></div></div><div class=\"bridge\">Les formations 2026-2027 restent à sélectionner selon le programme de l'École doctorale et les besoins du projet professionnel.</div>`,\n      notes:\"Ne pas inventer les intitulés d'UE ou les heures par cours. Mettre l'accent sur le volume global et les niveaux enseignés.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Communication et valorisation\", title:\"Rendre la recherche visible, compréhensible et recrutante\", lead:\"La communication scientifique progresse en parallèle de la communication de projet et du recrutement.\",\n      content:`<div class=\"grid three\"><div class=\"card dark\"><h3>JDD 2026</h3><p>Prise de parole scientifique devant la communauté doctorale et <strong>prix de l'originalité</strong>.</p></div><div class=\"card\"><h3>2027</h3><p>Objectif de participation au Forum des Jeunes Chercheurs 2027 et à la Journée des doctorants 2027, selon l'avancement des résultats.</p></div><div class=\"card\"><h3>Supports</h3><p>Affiches, questionnaires, fiches d'information, pages d'étude et portfolio pour améliorer visibilité et recrutement.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Objectif :</strong> transformer progressivement les résultats disponibles en prises de parole et productions scientifiques autonomes.</div>`,\n      notes:\"Séparer clairement communication scientifique et outils de visibilité. Le portfolio n'est cité ici que comme support, pas redétaillé.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Productions\", title:\"Passer de prototypes et prétests à des sorties scientifiques\", lead:\"La priorité des prochains mois est de convertir les éléments les plus mûrs du programme en analyses verrouillées, communications et manuscrits.\",\n      content:`<div class=\"grid three\"><div class=\"card\"><span class=\"badge\">1</span><h3 style=\"margin-top:12px\">Consolider</h3><p>Finaliser TWIXAV et VIBEX pour disposer de résultats de référence propres, documentés et réutilisables.</p></div><div class=\"card\"><span class=\"badge\">2</span><h3 style=\"margin-top:12px\">Collecter</h3><p>Verrouiller les études centrales olfactives et lancer les collectes lorsque matériel, respiration et charge participant sont validés.</p></div><div class=\"card\"><span class=\"badge\">3</span><h3 style=\"margin-top:12px\">Valoriser</h3><p>Identifier les ensembles de résultats pouvant devenir communication, manuscrit ou contribution méthodologique autonome.</p></div></div><div class=\"bridge\">La stratégie de publication doit suivre la maturité des données, pas l'ordre dans lequel les acronymes ont été imaginés.</div>`,\n      notes:\"Éviter de promettre un nombre ou une revue précise sans décision. Le message est l'ordre de maturation.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Priorités 2026-2027\", title:\"Un horizon court centré sur la consolidation\", lead:\"Le prochain cycle doit réduire l'incertitude méthodologique avant d'élargir encore le programme.\",\n      content:`<div class=\"grid four\"><div class=\"card dark\"><h3>TWIXAV</h3><p>Finaliser l'analyse et verrouiller les indices temporels.</p></div><div class=\"card\"><h3>VIBEX</h3><p>Normer les images et consolider le paradigme de référence.</p></div><div class=\"card\"><h3>TWIXOLF + SOFT</h3><p>Valider respiration, onset olfactif, débit, triggers, pilote complet et charge participant.</p></div><div class=\"card\"><h3>OASIS</h3><p>Stabiliser stimuli, plan et prétests olfactifs avant collecte.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>En parallèle :</strong> maintenir le dashboard, Lab Inventory et les pipelines uniquement dans la mesure où ils soutiennent directement ces objectifs.</div>`,\n      notes:\"Slide volontairement opérationnelle. C'est ici que l'on peut discuter de ce qui doit être prioritaire en année 2.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Feuille de route\", title:\"Une progression conditionnelle plutôt qu'un calendrier rigide\", lead:\"Les études futures sont activées en fonction des résultats et de la faisabilité, afin de préserver un noyau de travaux pleinement exploitables.\",\n      content:`<div class=\"roadmap\"><div class=\"roadmap-card\"><div class=\"year\">2026-2027</div><h3>Verrouiller et collecter</h3><ul><li>TWIXOLF / SOFT</li><li>VIBEX ou OASIS selon validation</li><li>Supports, éthique et recrutement</li><li>Formations 2026-2027 à préciser</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">2027</div><h3>Analyser et communiquer</h3><ul><li>Traitements comportementaux, EEG et physiologiques</li><li>Manuscrits</li><li>Objectif FJC 2027</li><li>Objectif JDD 2027</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">2027-2028</div><h3>Étendre et rédiger</h3><ul><li>SOLAR, COBEX ou SORBET selon résultats</li><li>Consolidation des outils réutilisables</li><li>Rédaction, soutenance et publications</li></ul></div></div><div class=\"bridge\">Principe de gestion du risque : conserver un noyau de 3 à 5 études pleinement exploitables et traiter le reste comme extensions conditionnelles.</div>`,\n      notes:\"Le calendrier est volontairement conditionnel. Il doit servir à discuter des priorités, pas à promettre que toutes les études seront réalisées.\"\n    },\n    {\n      section:\"Développement doctoral\", kicker:\"Projet professionnel\", title:\"Construire progressivement un profil de maître de conférences\", lead:\"La trajectoire professionnelle recherchée combine recherche autonome, enseignement, méthodes expérimentales et contribution collective.\",\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>Recherche</h3><p>Développer un programme autonome sur cognition multisensorielle, olfaction, attention et temporalité.</p></div><div class=\"card\"><h3>Enseignement</h3><p>Intervenir en psychologie cognitive, neurosciences, méthodologie, statistiques et expérimentation.</p></div><div class=\"card\"><h3>Collectif</h3><p>Encadrer, contribuer aux plateformes et maintenir des outils partagés utiles au laboratoire.</p></div><div class=\"card dark\"><h3>Autonomie</h3><p>Transformer les side projects, formations et communications en preuves de capacité à conduire et structurer des projets.</p></div></div>`,\n      notes:\"Ne pas réénumérer les outils. Ici, on les convertit en preuve d'autonomie et de contribution collective.\"\n    },\n    {\n      section:\"Discussion\", kicker:\"Questions au comité\", title:\"Les décisions les plus utiles à discuter aujourd'hui\", lead:\"Le suivi est surtout utile s'il aide à arbitrer entre ambition scientifique, faisabilité expérimentale et production effective.\",\n      content:`<div class=\"question-list\"><div class=\"question\"><div><strong>Priorisation scientifique</strong><br>Quel noyau d'études est indispensable et lesquelles doivent rester des perspectives conditionnelles ?</div></div><div class=\"question\"><div><strong>Faisabilité</strong><br>La charge participant de SOFT, les contraintes matérielles et le calendrier de collecte sont-ils compatibles avec les objectifs de l'année 2 ?</div></div><div class=\"question\"><div><strong>Valorisation</strong><br>Quel ordre privilégier pour les analyses, communications et premiers manuscrits ?</div></div><div class=\"question\"><div><strong>Développement doctoral</strong><br>Quelle place donner aux side projects, aux formations et aux communications dans la trajectoire vers l'autonomie et le projet MCF ?</div></div></div>`,\n      notes:\"Prendre le temps de laisser ces questions ouvertes. Cette slide peut aussi servir de support de discussion si le comité interrompt la présentation.\"\n    },\n    {\n      section:\"Conclusion\", kicker:\"À retenir\", title:\"Une première année passée de la question à l'infrastructure\", lead:\"Le programme reste ambitieux, mais il est désormais mieux structuré autour d'études de référence, de dépendances techniques identifiées et d'outils mutualisés.\",\n      content:`<div class=\"grid three\"><div class=\"card dark\"><span class=\"badge\" style=\"background:rgba(255,255,255,.14);color:#fff\">1</span><h3 style=\"margin-top:12px\">Une question cohérente</h3><p>Comprendre comment l'olfaction s'insère dans l'organisation spatio-temporelle multisensorielle.</p></div><div class=\"card\"><span class=\"badge\">2</span><h3 style=\"margin-top:12px\">Une infrastructure en place</h3><p>Prétests, plateforme multimodale, respiration, analyses et outils transversaux commencent à converger.</p></div><div class=\"card\"><span class=\"badge\">3</span><h3 style=\"margin-top:12px\">Une priorité claire</h3><p>Transformer l'ampleur du programme en un ensemble resserré d'études robustes, analysables et publiables.</p></div></div><div class=\"bridge\">Étape suivante : consolider les résultats acquis, verrouiller les études centrales et laisser les extensions dépendre des données plutôt que l'inverse.</div>`,\n      notes:\"Finir sur trois messages simples. Ensuite revenir à la slide Questions au comité si la discussion démarre.\"\n    },\n    {\n      section:\"Références\", kicker:\"Références principales\", title:\"Repères bibliographiques - Axe 1\", lead:\"Sélection de références directement mobilisées pour le cadre temporel et multisensoriel.\",\n      content:`<div class=\"refs\"><p><strong>Gotow & Kobayakawa (2017).</strong> Travaux sur la temporalité et l'intégration impliquant l'olfaction.</p><p><strong>Keetels & Vroomen (2012).</strong> Repères sur l'intégration temporelle multisensorielle.</p><p><strong>McGovern et al. (2022).</strong> Temporal binding et mécanismes d'intégration intersensorielle.</p><p><strong>Powers et al. (2009).</strong> Fenêtre temporelle d'intégration et plasticité perceptive.</p><p><strong>Stevenson et al. (2012).</strong> Questions temporelles liées à l'olfaction et aux interactions multisensorielles.</p><p><strong>Zerr et al. (2019).</strong> Temporalité perceptive et intégration multisensorielle.</p></div><div class=\"callout\" style=\"margin-top:22px\">Les références complètes sont conservées dans la bibliographie de travail. Cette slide sert de repère oral et non de bibliographie exhaustive.</div>`,\n      notes:\"Ne pas lire les références. Les garder comme support pour les questions théoriques.\"\n    },\n    {\n      section:\"Références\", kicker:\"Références principales\", title:\"Repères bibliographiques - Axe 2\", lead:\"Sélection de références mobilisées pour la représentation spatiale, Boundary Extension et les influences sensorielles associées.\",\n      content:`<div class=\"refs\"><p><strong>Bainbridge & Baker (2020).</strong> Représentation et mémoire des scènes visuelles.</p><p><strong>Gagnier et al. (2013).</strong> Boundary Extension et représentations spatiales.</p><p><strong>Hall & Geng (2025).</strong> Attention et représentation spatiale.</p><p><strong>Hörberg et al. (2020).</strong> Interactions olfactives et traitement cognitif.</p><p><strong>Intraub & Richardson (1989).</strong> Travaux fondateurs sur la Boundary Extension.</p><p><strong>Park et al. (2024).</strong> Représentation spatiale et effets contextuels récents.</p><p><strong>Rekow et al. (2022).</strong> Odeurs, affect et traitement perceptif.</p></div><div class=\"callout\" style=\"margin-top:22px\">Les références détaillées peuvent être complétées ou remplacées au fil de la rédaction des manuscrits et de la revue de littérature.</div>`,\n      notes:\"Dernière slide du récit principal. Les annexes suivantes sont facultatives en mode diapo.\"\n    },\n    {\n      section:\"Annexes\", kicker:\"Annexe A\", title:\"Glossaire des projets\", lead:\"Vue compacte des acronymes pour répondre rapidement aux questions sans revenir dans le fil principal.\", appendix:true,\n      content:`<div class=\"grid two\"><div class=\"card\"><h3>TWIXAV</h3><p>Temporal Window of Integration in Audition-Vision.</p></div><div class=\"card\"><h3>TWIXOLF</h3><p>Temporal Window of Integration in Olfaction.</p></div><div class=\"card\"><h3>VIBEX</h3><p>Visual Boundary Extension.</p></div><div class=\"card\"><h3>OASIS</h3><p>Olfactory Approach-avoidance Sensitivity In Space.</p></div><div class=\"card\"><h3>SOLAR</h3><p>Spatial Olfactory cueing of visuAL Responses.</p></div><div class=\"card\"><h3>COBEX</h3><p>Congruent Olfactory Boundary EXtension.</p></div><div class=\"card\"><h3>BRAUD</h3><p>Boundary Restriction in Audition.</p></div><div class=\"card\"><h3>BRAUDOLF</h3><p>Boundary Restriction in Audition and Olfaction.</p></div><div class=\"card\"><h3>SORBET</h3><p>Olfactory Recalibration of Subjective Event Timing.</p></div><div class=\"card\"><h3>SOFT</h3><p>Sensory Onset Offset Task.</p></div></div>`, notes:\"Annexe de navigation uniquement.\"\n    },\n    {\n      section:\"Annexes\", kicker:\"Annexe B\", title:\"SOFT - paramètres techniques actuellement prévus\", lead:\"Détails utiles en cas de question sur le volume de la tâche, la randomisation ou les triggers.\", appendix:true,\n      content:`<div class=\"grid three\"><div class=\"card\"><h3>Durées</h3><p>Séries possibles : 400/800/1200/1600 ms ou 400/800/1600/3200 ms selon la version retenue.</p></div><div class=\"card\"><h3>Ordres</h3><p>24 ordres de blocs sélectionnables ou pseudo-randomisation sans deux modalités identiques consécutives.</p></div><div class=\"card\"><h3>ITI</h3><p>Valeurs usuelles 1000/3000/6000 ms ou valeur personnalisée, avec multiplicateur de répétitions.</p></div><div class=\"card\"><h3>Calibration</h3><p>Setflow 1 à 5, défaut 3, séquence de calibration de deux minutes stoppable.</p></div><div class=\"card\"><h3>EEG TTL</h3><p>Codage limité à 8 bits avec valeurs réservées pour certains événements techniques.</p></div><div class=\"card\"><h3>Logs</h3><p>Onset, offset, press, release, états outils et événements de calibration.</p></div></div>`, notes:\"Ne montrer cette annexe que si la discussion porte sur le design SOFT.\"\n    },\n    {\n      section:\"Annexes\", kicker:\"Annexe C\", title:\"Configuration physiologique et EEG\", lead:\"Résumé du montage envisagé pour les études qui mobilisent les mesures périphériques ou cérébrales.\", appendix:true,\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>EEG</h3><p>BioSemi ActiveTwo 128 électrodes + références selon le montage retenu.</p></div><div class=\"card\"><h3>EDA</h3><p>Électrodes sur index et majeur de la main gauche.</p></div><div class=\"card\"><h3>ECG</h3><p>Trois électrodes : clavicule droite, flanc gauche et flanc droit.</p></div><div class=\"card\"><h3>Respiration</h3><p>Canules et lecture par fibre optique Spir0 selon le protocole.</p></div></div><div class=\"callout\" style=\"margin-top:18px\"><strong>Selon les études :</strong> EMG zygomatique/corrugateur, SKT et autres voies Biopac peuvent compléter le montage.</div>`, notes:\"Annexe technique. Adapter la réponse à l'étude interrogée.\"\n    },\n    {\n      section:\"Annexes\", kicker:\"Annexe D\", title:\"Bibliothèque de stimuli olfactifs envisagée\", lead:\"Liste de travail pour la préparation et le prétest des odeurs. Elle ne signifie pas que chaque stimulus est retenu pour chaque étude.\", appendix:true,\n      content:`<div class=\"grid four\"><div class=\"card\"><h3>Huiles essentielles</h3><p>Lavande, citron, menthe poivrée, eucalyptus.</p></div><div class=\"card\"><h3>Arômes</h3><p>Fraise, café, citron, citron vert.</p></div><div class=\"card\"><h3>Molécules / odeurs de synthèse</h3><p>PEA, acide butyrique, acide isovalérique.</p></div><div class=\"card\"><h3>Diluants</h3><p>Propylène glycol, huile minérale, eau distillée.</p></div></div><div class=\"bridge\">Le choix final dépend du protocole, du prétest d'intensité, de valence, d'arousal et des contraintes matérielles.</div>`, notes:\"Insister sur le caractère candidat de la liste.\"\n    },\n    {\n      section:\"Annexes\", kicker:\"Annexe E\", title:\"Règles communes du pipeline comportemental\", lead:\"Principes déjà stabilisés pour les analyses TBW et Boundary Extension.\", appendix:true,\n      content:`<div class=\"grid two\"><div class=\"card\"><h3>Prétraitement</h3><ul><li>Pas d'exclusion arbitraire de sujets.</li><li>Retrait des essais d'entraînement et des réponses NA.</li><li>Filtrage RT par IQR ±1,5 au niveau participant lorsque prévu.</li><li>Agrégation intra-sujet avant analyses de groupe.</li></ul></div><div class=\"card\"><h3>Statistiques et sorties</h3><ul><li>Shapiro par cellule lorsque pertinent.</li><li>Levene sur données agrégées.</li><li>ANOVA à mesures répétées.</li><li>FDR réservé aux comparaisons post-hoc/pairwise selon le plan.</li><li>Tables APA XLSX/PNG et p-values jamais affichées comme zéro.</li></ul></div></div>`, notes:\"Annexe pour discussion statistique.\"\n    }\n  ];\n\n  const mainSlides = slides.filter(s => !s.appendix).length;\n  const deck = document.getElementById('deck');\n  let current = 0;\n  let includeAppendix = localStorage.getItem('csi-appendix') === '1';\n  let fontScale = parseFloat(localStorage.getItem('csi-font') || '1');\n  let systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';\n\n  function esc(s){ return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}[m])); }\n\n  function renderSlides(){\n    deck.innerHTML = slides.map((s,i)=>{\n      const classes = ['slide'];\n      if(s.hero) classes.push('hero-slide');\n      if(s.appendix) classes.push('appendix');\n      if(i===current) classes.push('active');\n      const inner = s.hero ? `<div class=\"slide-shell\">${s.content}</div>` : `<div class=\"slide-shell\"><div class=\"slide-kicker\">${s.kicker||s.section}</div><h2>${s.title}</h2>${s.lead?`<p class=\"lead\">${s.lead}</p>`:''}<div class=\"slide-content\">${s.content||''}</div></div>`;\n      return `<section class=\"${classes.join(' ')}\" id=\"slide-${i+1}\" data-index=\"${i}\" aria-label=\"Slide ${i+1} - ${esc(s.title)}\">${inner}</section>`;\n    }).join('');\n    renderNavigator(); renderOverview();\n  }\n\n  function visibleIndexes(){ return slides.map((s,i)=>({s,i})).filter(x=>includeAppendix || !x.s.appendix).map(x=>x.i); }\n  function normalizeCurrent(direction=1){ const vis=visibleIndexes(); if(!vis.includes(current)){ current = direction >= 0 ? (vis.find(i=>i>current) ?? vis[vis.length-1]) : ([...vis].reverse().find(i=>i<current) ?? vis[0]); } }\n\n  function goTo(index, pushHash=true){\n    index=Math.max(0,Math.min(slides.length-1,index));\n    if(slides[index].appendix && !includeAppendix && document.body.dataset.view==='slides'){ showToast('Activez les annexes dans Personnalisation pour les inclure en mode diapo.'); return; }\n    current=index;\n    document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===current));\n    updateUI();\n    if(document.body.dataset.view==='scroll') document.getElementById(`slide-${current+1}`).scrollIntoView({behavior:document.body.classList.contains('reduced-motion')?'auto':'smooth',block:'start'});\n    if(pushHash) history.replaceState(null,'',`#s=${current+1}`);\n  }\n  function move(delta){ const vis=visibleIndexes(); const pos=vis.indexOf(current); const next=Math.max(0,Math.min(vis.length-1,pos+delta)); goTo(vis[next]); }\n\n  function updateUI(){\n    const vis=visibleIndexes(); const pos=Math.max(0,vis.indexOf(current));\n    document.getElementById('slideCounter').textContent=`${pos+1} / ${vis.length}`;\n    document.getElementById('sectionName').textContent=slides[current].section;\n    document.getElementById('progressBar').style.width=`${((pos+1)/vis.length)*100}%`;\n    document.getElementById('notesBody').innerHTML=`<strong>${slides[current].title}</strong><br><br>${slides[current].notes||'Aucune note spécifique.'}`;\n    document.querySelectorAll('.slide-link').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===current));\n    document.getElementById('modeBtn').innerHTML=document.body.dataset.view==='slides'?'<span class=\"long\">Mode</span> diapo':'<span class=\"long\">Mode</span> scroll';\n    document.title=`${pos+1}/${vis.length} - ${slides[current].title} - CSI 1`;\n  }\n\n  function renderNavigator(){\n    const list=document.getElementById('slideList');\n    list.innerHTML=slides.map((s,i)=>`<button class=\"slide-link ${s.appendix?'appendix':''}\" type=\"button\" data-index=\"${i}\" data-search=\"${esc((s.title+' '+s.section+' '+s.kicker).toLowerCase())}\"><span class=\"n\">${s.appendix?'A'+(i-mainSlides+1):i+1}</span><span class=\"t\">${esc(s.title)}</span></button>`).join('');\n    list.querySelectorAll('.slide-link').forEach(btn=>btn.addEventListener('click',()=>{ const i=Number(btn.dataset.index); if(slides[i].appendix && !includeAppendix && document.body.dataset.view==='slides'){ includeAppendix=true; document.getElementById('appendixToggle').checked=true; localStorage.setItem('csi-appendix','1'); } goTo(i); document.getElementById('navigator').hidden=true; }));\n  }\n  function renderOverview(){\n    document.getElementById('overviewGrid').innerHTML=slides.map((s,i)=>`<button class=\"overview-card\" type=\"button\" data-index=\"${i}\"><div class=\"mini-n\">${s.appendix?'Annexe '+String.fromCharCode(65+i-mainSlides):'Slide '+(i+1)} · ${esc(s.section)}</div><h3>${esc(s.title)}</h3><p>${esc(s.lead||'')}</p></button>`).join('');\n    document.querySelectorAll('.overview-card').forEach(btn=>btn.addEventListener('click',()=>{ const i=Number(btn.dataset.index); if(slides[i].appendix && !includeAppendix && document.body.dataset.view==='slides'){ includeAppendix=true; document.getElementById('appendixToggle').checked=true; localStorage.setItem('csi-appendix','1'); } goTo(i); document.getElementById('overview').hidden=true; }));\n  }\n\n  function togglePanel(id){ ['settingsDrawer','navigator','overview'].forEach(pid=>{ if(pid!==id) document.getElementById(pid).hidden=true; }); const el=document.getElementById(id); el.hidden=!el.hidden; }\n  function setView(view){ document.body.dataset.view=view; localStorage.setItem('csi-view',view); if(view==='scroll'){ document.querySelectorAll('.slide').forEach(el=>el.style.display='flex'); setTimeout(()=>document.getElementBy mécanistique :</strong> l'asymétrie observée motive directement SOFT.</div></div>${result('Résultats finaux à intégrer','Courbes par durée, PSS, FWHM et comparaison des deux directions temporelles.')}</div>${cite('(Powers et al., 2009; Stevenson et al., 2012)')}`;\n const soft=find('Mesurer le temps propre de chaque modalité');if(soft){soft.title='SOFT - dissocier onset, offset et durée';soft.kicker='SOFT - prête à démarrer';soft.content=`<div class=\"csi-context\"><div><div class=\"grid two\"><div class=\"card dark\">${status()}<h3 style=\"margin-top:12px\">Question</h3><p>Comparer la précision du début, de la fin et de la durée perçue en audition, vision et olfaction afin d'expliquer l'asymétrie observée avec TWIXAV.</p></div><div class=\"card\"><h3>Mesures</h3><ul><li>onset perçu</li><li>offset perçu</li><li>durée perçue</li><li>EEG et physiologie selon configuration</li></ul></div></div></div><div class=\"csi-float-stack\">${photo('BioSemi ActiveTwo - EEG 128 canaux','https://www.biosemi.com/pics/cap_128_medium1_large.jpg')}${photo('BIOPAC MP160 - physiologie')}</div></div>${cite('(Powers et al., 2009; Stevenson et al., 2012; Vroomen & Keetels, 2010)')}`;}\n const tw=find(\"Transposer la liaison temporelle à l'olfaction\");if(tw){tw.kicker='TWIXOLF - prête à démarrer';tw.content=`<div class=\"csi-context\"><div><div class=\"grid three\"><div class=\"card\"><h3>Question</h3><p>À quelles relations temporelles une stimulation olfactive est-elle traitée comme appartenant au même événement qu'un signal visuel ou auditif ?</p></div><div class=\"card\"><h3>Variables critiques</h3><p>Respiration, latence, habituation, intensité, valence et synchronisation.</p></div><div class=\"card tint\">${status()}<h3 style=\"margin-top:12px\">État actuel</h3><p>Architecture expérimentale et contrôles matériels préparés pour le pilote.</p></div></div></div><div class=\"csi-float-stack\">${photo('CyNexo Sniff-0','https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto5.jpg')}${photo('Photo de contexte - installation participant')}</div></div>${cite('(Gotow & Kobayakawa, 2017; Mainland & Sobel, 2006; Sela & Sobel, 2010)')}`;}\n const vib=find('VIBEX - établir une référence visuelle');if(vib)vib.content=`<div class=\"csi-study-grid\"><div><div class=\"card dark\"><h3>Prétest</h3><ul><li>24 scènes</li><li>Manipulation de zoom</li><li>Conditions LL, SS, LS et SL</li><li>Réponse identique / différente</li></ul></div><div class=\"callout\" style=\"margin-top:14px\"><strong>Mémoire de M1 :</strong> Olivia.</div></div>${result('VIBEX - résultats à intégrer','Zone réservée aux biais par condition et taille et à l’indice global de Boundary Extension.')}</div><div style=\"width:230px;margin:-34px 0 0 auto\">${photo('Exemple de scène / stimulus')}</div>${cite('(Bainbridge & Baker, 2020; Gagnier et al., 2013; Intraub & Richardson, 1989; Park et al., 2024)')}`;\n const oasis=find('OASIS - relier odeur');if(oasis){oasis.kicker='OASIS - prête à démarrer';oasis.content=`<div class=\"csi-context\"><div><div class=\"grid three\"><div class=\"card\"><h3>Dimension cognitive</h3><p>Tester comment la présence olfactive module les réponses spatiales d'approche ou d'évitement.</p></div><div class=\"card\"><h3>Mesures</h3><p>Comportement, EDA, ECG et respiration.</p></div><div class=\"card tint\">${status()}<h3 style=\"margin-top:12px\">État actuel</h3><p>Stimuli, plan et chaîne de mesure préparés pour le démarrage.</p></div></div></div><div class=\"csi-float-stack\">${photo('Photo de contexte - préparation olfactive')}${photo('BIOPAC - EDA / ECG')}</div></div>${cite('(Hörberg et al., 2020; Rekow et al., 2022)')}`;}\n const stat=find('Un programme à plusieurs niveaux de maturité');if(stat){stat.title=\"État d'avancement des études centrales\";stat.lead='TWIXOLF, SOFT et OASIS sont prêtes à démarrer, tandis que TWIXAV et VIBEX disposent déjà de prétests exploitables.';stat.content=`<div class=\"status-table\"><div class=\"status-row\"><div class=\"proj\">TWIXAV</div><span class=\"status done\">Prétest terminé</span><div class=\"desc\">Analyses préliminaires disponibles.</div><div class=\"desc\">Finaliser indices et figures.</div></div><div class=\"status-row\"><div class=\"proj\">VIBEX</div><span class=\"status done\">Prétest terminé</span><div class=\"desc\">Paradigme fonctionnel.</div><div class=\"desc\">Consolider analyse et valorisation.</div></div><div class=\"status-row\"><div class=\"proj\">SOFT</div>${status()}<div class=\"desc\">Architecture multimodale stabilisée.</div><div class=\"desc\">Pilote puis collecte.</div></div><div class=\"status-row\"><div class=\"proj\">OASIS</div>${status()}<div class=\"desc\">Chaîne olfactive et physiologique préparée.</div><div class=\"desc\">Pilote puis collecte.</div></div><div class=\"status-row\"><div class=\"proj\">TWIXOLF</div>${status()}<div class=\"desc\">Architecture Sniff-0 / Spir-0 préparée.</div><div class=\"desc\">Pilote puis collecte.</div></div></div>`;}\n}catch(e){console.error('CSI11 core',e)}});\n})();",
      "(function(){const frame=document.getElementById('presentation');if(!frame)return;frame.addEventListener('load',()=>{try{\n const w=frame.contentWindow,d=w.document,C=w.CSI11;if(!C)return;const {slides,find}=C;\n const css=`.csi-yearboard{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.csi-year-summary{border-radius:26px;padding:24px;background:linear-gradient(145deg,var(--accent-strong),color-mix(in srgb,var(--accent-strong) 75%,#000));color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--accent-strong) 18%,transparent)}.csi-year-summary .big-number{color:#fff!important;font-size:4rem!important}.csi-year-summary p{color:rgba(255,255,255,.8);font-size:.9rem}.csi-year-rows{display:grid;gap:10px}.csi-year-row{display:grid;grid-template-columns:112px 1fr 130px;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:19px;padding:14px 16px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent-strong) 7%,transparent)}.csi-year-row .type{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:950;color:var(--accent)}.csi-year-row strong{display:block;color:var(--accent-strong)}.csi-year-row p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.csi-year-row .hours{text-align:right;font-weight:950}.csi-diffusion{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative}.csi-diffusion:before{content:\"\";position:absolute;left:5%;right:5%;top:28px;height:2px;background:var(--accent-soft)}.csi-diff{position:relative;z-index:1;padding:0 7px}.csi-diff .dot{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:950;margin-bottom:13px;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 25%,transparent)}.csi-diff h3{margin:0 0 4px;color:var(--accent-strong);font:800 1.05rem Georgia,serif}.csi-diff p{margin:0;color:var(--muted);font-size:.84rem}.csi-retro{display:grid;grid-template-columns:repeat(6,minmax  <em>Memory & Cognition, 53</em>, 6-18. https://doi.org/10.3758/s13421-024-01540-9</p><p>Hörberg, T., Larsson, M., Ekström, I., Sandöy, C., Lundén, P., & Olofsson, J. K. (2020). Olfactory influences on visual categorization: Behavioral and ERP evidence. <em>Cerebral Cortex, 30</em>(7), 4220-4237. https://doi.org/10.1093/cercor/bhaa050</p><p>Rekow, D., Baudouin, J.-Y., Durand, K., & Leleu, A. (2022). Smell what you hardly see: Odors assist visual categorization in the human brain. <em>NeuroImage, 255</em>, 119181. https://doi.org/10.1016/j.neuroimage.2022.119181</p></div>`;}\n const thanks={section:'Remerciements',kicker:'Remerciements',title:'Merci pour votre attention',lead:'Merci aux membres du Comité de Suivi Individuel et à l’équipe d’encadrement pour leurs échanges et leur suivi.',content:`<div class=\"grid two\"><div class=\"card dark\"><h3>Comité de Suivi Individuel</h3><p><strong>Fabrice Damon</strong><br>Maître de conférences en psychologie - UBE, CSGA - DOCC</p><p style=\"margin-top:14px\"><strong>Camille Ferdenzi-Lemaître</strong><br>Chargée de recherche CNRS - CRNL, psychologie de l’olfaction</p></div><div class=\"card\"><h3>Direction de thèse</h3><p><strong>Renaud Brochard</strong> - directeur de thèse</p><p style=\"margin-top:10px\"><strong>Arnaud Leleu</strong> - co-directeur de thèse</p><div class=\"csi-logo-cloud\"><img class=\"wide\" src=\"https://til.u-bourgogne.fr/wp-content/uploads/2025/01/logo-UBE-drapeau-quadri.jpg\"><img src=\"https://commons.wikimedia.org/wiki/Special:Redirect/file/Cnrs-logo.svg\"><img src=\"https://clienfarms.eu/wp-content/uploads/2022/05/inrae-vector-logo.png\"><img class=\"wide\" src=\"https://fjc-2024.sciencesconf.org/data/pages/CSGA_1.png\"><img class=\"wide\" src=\"https://u1093.ube.fr/app/smush-webp/2026/04/logo-ES.jpg.webp\"></div></div></div>`};slides.push(thanks);C.thanks=thanks;\n const appendix=slides.filter(s=>s.appendix),main=slides.filter(s=>!s.appendix&&s!==thanks),p=[\"Y a-t-il un espace-temps\",\"Un récit e
