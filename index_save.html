      "(function(){const frame=document.getElementById('presentation');if(!frame)return;frame.addEventListener('load',()=>{try{\n const w=frame.contentWindow,d=w.document,C=w.CSI11;if(!C)return;const slides=C.slides;\n const css=`.csi-lang{display:flex;align-items:center;padding:3px;border:1px solid var(--line);background:var(--white);border-radius:999px}.csi-lang button{border:0;background:transparent;color:var(--muted);font-size:.72rem;font-weight:950;border-radius:999px;padding:6px 8px;cursor:pointer}.csi-lang button.active{background:var(--accent);color:#fff}.notes-panel.csi-notes{position:fixed!important;left:42px!important;right:auto!important;top:90px!important;bottom:auto!important;width:480px!important;height:520px!important;max-width:90vw!important;max-height:82vh!important;min-width:340px!important;min-height:260px!important;resize:both!important;overflow:auto!important;border-radius:24px!important;padding:0!important}.notes-panel.csi-notes .panel-head{position:sticky;top:0;z-index:2;padding:15px 16px;margin:0!important;background:color-mix(in srgb,var(--cream) 95%,var(--accent-pale));border-bottom:1px solid var(--line);cursor:move;user-select:none}.notes-panel.csi-notes .notes-body{padding:18px 20px!important;line-height:1.55!important}.csi-note-title{font:800 1.2rem Georgia,serif;color:var(--accent-strong);margin-bottom:10px}.csi-note-block{padding:12px 14px;border-radius:16px;background:var(--accent-pale);border:1px solid var(--line);margin:10px 0}.csi-note-block strong{color:var(--accent-strong)}.csi-note-next{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}#csiQVault{position:fixed;inset:0;z-index:3000;background:linear-gradient(180deg,var(--cream),var(--accent-pale));display:none;overflow:auto;color:var(--text)}.csi-q-inner{width:min(1660px,100%);min-height:100vh;margin:auto;padding:92px clamp(38px,4.2vw,82px) 70px}.csi-q-head{display:flex;justify-content:space-between;align-items:center}.csi-q-close{border:1px solid var(--line);background:var(--white);color:var(--text);border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer}.csi-q-blank{margin-top:30px;min-height:58vh;border:1px dashed var(--line);border-radius:28px;background:var(--white)}@media(max-width:820px){.notes-panel.csi-notes{left:5vw!important;width:90vw!important}}`;const st=d.createElement('style');st.textContent=css;d.head.appendChild(st);\n const pack=(core,pts,trans)=>`<div class=\"csi-note-block\"><strong>Message central</strong><br>${core}</div><div class=\"csi-note-block\"><strong>À dire</strong><br>${pts.map(x=>'• '+x).join('<br>')}</div>${trans?`<div class=\"csi-note-block\"><strong>Transition</strong><br>${trans}</div>`:''}`;\n const notesFR=s=>{const t=s.title||'';\n  if(t.includes('espace-temps pour les odeurs'))return pack('Présenter la question de thèse comme le fil conducteur du CSI.',['Situer le doctorat au CSGA et dans l’équipe DOCC.','Nommer l’encadrement et les deux membres du CSI.','Annoncer le bilan scientifique, méthodologique et doctoral.'],'Passer au parcours puis à la question scientifique.');\n  if(t.includes('parcours généraliste'))return pack('Montrer la continuité entre psychologie cognitive, multisensorialité et olfaction.',['Rester bref sur chaque diplôme.','Insister sur la montée en autonomie expérimentale.','Relier le Master aux questions actuelles.'],'Introduire le cadre doctoral.');\n  if(t.includes('Deux axes'))return pack('Clarifier la complémentarité des deux axes.',['Axe 1 : relations spatio-temporelles entre modalités.','Axe 2 : influence des odeurs sur la perception visuelle et auditive.','Les deux axes partagent des contraintes de synchronisation et de mesure.'],'Présenter ensuite le verrou temporel propre à l’olfaction.');\n  if(t.includes('L\\'olfaction complique'))return pack('Expliquer pourquoi le temps olfactif ne correspond pas au timestamp logiciel.',['Distinguer commande, délivrance, inspiration et perception.','Utiliser les cartes Sniff-0 et Spir-0 uniquement comme contexte visuel.','Relier cette difficulté à SOFT et TWIXOLF.'],'Entrer dans le programme expérimental.');\n  if(t.includes('TWIXAV -'))return pack('Présenter TWIXAV comme référence audiovisuelle de l’Axe 1.',['Rappeler le jugement de simultanéité.','Indiquer que la zone de résultats recevra les courbes finales.','Mentionner le mémoire de M1 d’Alicia.'],'Passer aux effets préliminaires et à l’asymétrie.');\n  if(t.includes('effet net de la durée'))return pack('Montrer que la manipulation temporelle produit des effets structurés.',['Commenter les trois effets statistiques sans surinterpréter.','Insister sur l’asymétrie comme question mécanistique.','Les courbes finales viendront dans la zone dédiée.'],'Introduire SOFT.');\n  if(t.includes('SOFT -'))return pack('SOFT teste si l’asymétrie vient d’une différence de précision entre onset et offset.',['Préciser que l’étude est prête à démarrer.','Distinguer comportement, EEG et physiologie.','Garder les détails de triggers et de timing pour les questions.'],'Revenir ensuite à l’intégration olfactive avec TWIXOLF.');\n  if(t.includes('Transposer la liaison'))return pack('TWIXOLF transpose la fenêtre temporelle d’intégration à l’olfaction.',['Préciser que l’étude est prête à démarrer.','Citer respiration, latence, habituation et intensité comme contrôles.','Le rétroplanning place OASIS avant TWIXOLF pour des raisons opérationnelles.'],'Passer à l’Axe 2.');\n  if(t.includes('VIBEX -'))return pack('Présenter VIBEX comme référence visuelle de Boundary Extension.',['Rappeler le paradigme sans détailler toutes les conditions.','Montrer la zone réservée aux résultats.','Mentionner le mémoire de M1 d’Olivia.'],'Introduire OASIS.');\n  if(t.includes('OASIS -'))return pack('OASIS teste la modulation olfactive de réponses spatiales d’approche-évitement.',['Préciser que l’étude est prête à démarrer.','Présenter comportement, EDA, ECG et respiration.','Souligner la réutilisation de l’infrastructure.'], nisms.'],\n  'De la fenêtre audiovisuelle à la temporalité olfactive':['Experimental program','From audiovisual binding to olfactory timing','TWIXAV provides the reference from which olfactory binding and sensory timing are investigated.'],\n  'Les études futures prolongent des mécanismes déjà testés':['Perspectives','Future studies extend already-tested mechanisms','Prospective projects remain conditional extensions of the core studies.'],\n  'Trois prolongements possibles autour de l’extension et de la restriction':['Perspectives','Three possible extensions around extension and restriction','COBEX, BRAUD and BRAUDOLF are conditional spatial extensions.'],\n  'FLUXOLF - une branche méthodologique utile, distincte de la thèse':['Side project','FLUXOLF - a useful methodological side project','FLUXOLF supports physiological-method development without becoming a third thesis axis.'],\n  'Une plateforme expérimentale commune plutôt qu’un montage par étude':['Methods','A shared experimental platform rather than one setup per study','A common software, hardware and logging architecture supports the different experiments.'],\n  'Déclencher sur un événement physiologique, pas seulement logiciel':['Methods','Triggering on a physiological event, not only a software event','Respiratory phase is part of experimental control for olfactory studies.'],\n  'Une seule logique de traitement, adaptée à chaque famille de mesures':['Methods','One analysis logic adapted to each family of measures','Behavioral, EEG and physiological pipelines share reproducible principles.'],\n  'Des sorties standardisées pour comparer les études':['Methods','Standardized outputs across studies','Behavioral analyses produce reproducible tables, figures and Quarto reports.'],\n  'La robustesse du protocole inclut aussi la charge participant':['Methods','Protocol robustness also includes participant burden','Feasibility includes preparation time, comfort, traceability and data protection.'],\n  'Des développements logiciels conçus pour réduire la friction de recherche':['Methods','Software developments designed to reduce research friction','Dashboards, inventory and analysis tools directly support data collection and reproducibility.'],\n  'Les principales difficultés ont déjà modifié la manière de concevoir les études':['Methods','The main difficulties have already changed study design','Olfactory timing, multiple devices and complex analyses led to methodological changes.'],\n  'La première année a aussi construit un profil de chercheur':['Doctoral development','The first year also built a researcher profile','The first year developed scientific, experimental, analytical and tool-building skills.'],\n  'Passer de prototypes et prétests à des sorties scientifiques':['Year 2','From prototypes and pretests to scientific outputs','The next step is to convert mature results into analyses, presentations and manuscripts.'],\n  'Un horizon court centré sur la consolidation':['Year 2','A short-term horizon focused on consolidation','The next cycle prioritizes core studies before further extensions.'],\n  'Une progression conditionnelle plutôt qu’un calendrier rigide':['Year 2','Conditional progression rather than a rigid schedule','Future studies are activated according to results and feasibility.'],\n  'Construire progressivement un profil de maître de conférences':['Career','Building an academic teaching-research profile','The career objective combines autonomous research, teaching, methods and collective contribution.'],\n  'Une première année passée de la question à l’infrastructure':['Conclusion','A first year moving from the question to the infrastructure','The program is now structured around reference studies, identified technical dependencies and shared tools.'],\n  'Glossaire des projets':['Appendix','Project glossary','Compact glossary of project acronyms for questions.'],\n  'SOFT - paramètres techniques actuellement prévus':['Appendix','SOFT - current technical rmation.');combined._fr={section:combined.section,kicker:combined.kicker,title:combined.title,lead:combined.lead,content:combined.content,notes:combined.notes};}\n const noteMap=[\n ['Un récit en quatre mouvements',pack('Donner au comité la structure du récit.',['La présentation part de la question scientifique.','Elle distingue ensuite résultats, méthodes et développement doctoral.','Les perspectives ne sont abordées qu’après les contraintes et le bilan.'],'Passer au parcours qui conduit à la thèse.')],\n ['Un environnement qui combine',pack('Situer la thèse dans son environnement scientifique.',['CSGA et équipe DOCC.','Direction par Renaud Brochard et co-direction par Arnaud Leleu.','Positionnement en psychologie cognitive et perception multisensorielle.'],'Formuler ensuite les deux axes de recherche.')],\n ['Dix études principales',pack('Réduire la complexité apparente des acronymes à deux familles de questions.',['Temps et intégration pour TWIXAV, TWIXOLF, SOFT et SORBET.','Espace et représentation pour VIBEX, OASIS, SOLAR, COBEX, BRAUD et BRAUDOLF.','FLUXOLF reste un projet annexe méthodologique.'],'Entrer dans les études déjà testées.')],\n ['De la fenêtre audiovisuelle',pack('Faire de cette slide la charnière entre TWIXAV, SOFT et TWIXOLF.',['TWIXAV décrit la fenêtre audiovisuelle.','SOFT teste l’origine possible de l’asymétrie.','TWIXOLF transpose ensuite la question à l’olfaction.'],'Présenter les études centrales dans cet ordre conceptuel.')],\n ['Les études futures prolongent',pack('Maintenir SORBET et SOLAR au statut de perspectives conditionnelles.',['Ne pas les présenter comme des collectes déjà programmées.','Leur pertinence dépendra des résultats des études centrales.'],'Revenir aux études spatiales de référence.')],\n ['Trois prolongements possibles',pack('Présenter COBEX, BRAUD et BRAUDOLF comme branches possibles.',['COBEX prolonge la Boundary Extension avec une manipulation olfactive.','BRAUD et BRAUDOLF explorent la restriction dans le domaine auditif.','Aucun de ces projets ne doit retarder le noyau expérimental.'],'Refermer les perspectives et revenir au programme central.')],\n ['FLUXOLF -',pack('Présenter FLUXOLF comme projet annexe utile aux méthodes.',['Mesures physiologiques EDA, HR et HRV.','Le projet sert à consolider les pipelines physiologiques.','Il reste distinct des deux axes de thèse.'],'Passer à la vue consolidée des études centrales.')],\n ['Une seule logique de traitement',pack('Montrer la cohérence des pipelines analytiques.',['Comportement : agrégation intra-sujet et statistiques répétées.','EEG : synchronisation événementielle et prétraitements dédiés.','Physiologie : segmentation temporelle et contrôle des artefacts.'],'Montrer ensuite les sorties standardisées.')],\n ['Des sorties standardisées',pack('Présenter l’analyse comme une chaîne reproductible.',['Préparer les données.','Agréger au niveau participant.','Tester puis exporter tables et figures.'],'Passer aux contraintes de faisabilité et d’éthique.')],\n ['La robustesse du protocole',pack('Rappeler que la faisabilité inclut aussi la charge participant et les données.',['Préparation et durée de passation.','Confort et pauses.','Pseudonymisation, consentement et traçabilité.'],'Présenter ensuite les outils développés pour soutenir cette organisation.')],\n ['Des développements logiciels',pack('Présenter les outils comme des supports directs du travail scientifique.',['Dashboard expérimental pour les passations.','Lab Inventory pour le matériel.','R et Quarto pour les analyses.','Portfolio pour la visibilité et le recrutement.'],'Passer aux difficultés qui ont motivé ces développements.')],\n ['La première année a aussi construit',pack('Faire ressortir les compétences acquises plutôt que les logiciels utilisés.',['Problématisation et lecture critique.','Expérimentation multimodale.','Analyse reproductible.','Développement d’outils de laboratoire.'],'Passer au bilan d’enseignement et de formation.')],\n ['Passer de prototypes',pack('Expliquer la logique de valorisation scientifique.',['Consolider TWIXAV et VIBEX.','Analyser les collectes en continu.','Écrire et communiquer dès que les résultats sont suffisamment mûrs.'],'Passer aux priorités concrètes de l’année 2.')],\n ['Un horizon court',pack('Présenter les priorités proches sans ouvrir de nouvelles branches.',['Finaliser TWIXAV et VIBEX.','Lancer les études prêtes à démarrer.','Limiter les développements techniques aux besoins des collectes.'],'Passer à la feuille de route conditionnelle.')],\n ['Une progression conditionnelle',pack('Présenter la roadmap comme une logique de décision, non comme une promesse exhaustive.',['2026-2027 : collecter et consolider.','2027 : analyser et communiquer.','2027-2028 : étendre uniquement si les résultats le justifient.'],'Relier cette organisation au projet professionnel.')],\n ['Construire progressivement un profil',pack('Relier le doctorat au projet de maître de conférences.',['Recherche autonome.','Enseignement en psychologie cognitive et neurosciences.','Contribution collective et encadrement.','Autonomie dans la conduite de projets.'],'Passer ensuite aux actions de diffusion prévues.')],\n ['Une première année passée de la question',pack('Conclure sur trois messages simples.',['Une question scientifique cohérente.','Une infrastructure expérimentale suffisamment structurée pour lancer les études centrales.','Une priorité donnée à la consolidation et à la valorisation.'],'Ouvrir les échanges avec le comité ou aller aux références si nécessaire.')],\n ['Repères bibliographiques - Axe 1',pack('Utiliser cette slide uniquement en appui des questions théoriques.',['Les références sont présentées au format APA.','Pointer la référence pertinente selon la question.'],'Passer à l’Axe 2 ou revenir à la discussion.')],\n ['Repères bibliographiques - Axe 2',pack('Utiliser cette slide pour les questions sur les scènes, la Boundary Extension et les influences olfactives.',['Les références sont présentées au format APA.','Distinguer travaux fondateurs et travaux récents.'],'Revenir à la discussion ou aux annexes.')],\n ['Glossaire des projets',pack('Utiliser l’annexe pour désambiguïser rapidement les acronymes.',['Ne pas la parcourir systématiquement.','Répondre uniquement sur le projet demandé.'])],\n ['SOFT - paramètres techniques',pack('Utiliser cette annexe pour les questions techniques sur SOFT.',['Durées et ordres de blocs.','ITI et calibration.','Codage EEG et logs.'])],\n ['Configuration physiologique et EEG',pack('Répondre aux questions sur le montage de mesure.',['EEG BioSemi.','EDA et ECG.','Respiration et voies physiologiques complémentaires.'])],\n ['Bibliothèque de stimuli olfactifs',pack('Présenter cette liste comme un ensemble de candidats.',['Le choix dépend des prétests d’intensité, valence et arousal.','Les diluants varient selon les composés.'])],\n ['Règles communes du pipeline comportemental',pack('Rappeler les règles analytiques stabilisées.',['Agrégation intra-sujet.','Contrôle des essais et des RT.','ANOVA répétées et corrections post-hoc.'])]\n ];noteMap.forEach(([k,n])=>{const s=slides.find(x=>x.title&&x.title.includes(k));if(s){s.notes=n;if(s._fr)s._fr.notes=n}});\n const enObj=(s,section,kicker,title,lead,content)=>({section,kicker,title,lead,content,notes:`<div class=\"csi-note-block\"><strong>Core message</strong><br>${lead}</div><div class=\"csi-note-block\"><strong>Delivery</strong><br>• State the result or purpose first.<br>• Comment only on the information visible on the slide.<br>• Keep technical details for questions.</div>`});\n const setEN=(key,section,kicker,title,lead,content)=>{const s=slides.find(x=>x._fr&&x._fr.title.includes(key));if(s)s._en=enObj(s,section,kicker,title,lead,content)};\n setEN('Un récit en quatre mouvements','Introduction','Roadmap','A four-part narrative','The presentation follows a single progression from the research question to results, methods, doctoral development and decisions.',`<div class=\"grid four\">${card('01 - Build the question','Background, doctoral environment, multisensory theory and the specific constraints of olfaction.','dark')}${card('02 - Test the program','TWIXAV and VIBEX as reference studies, then SOFT, TWIXOLF and OASIS as the next core studies.')}${card('03 - Make the studies feasible','Respiration, olfactometry, EEG, physiology, analysis, ethics and shared tools.')}${card('04 - Prioritize the next steps','Teaching, doctoral training, scientific outputs, timeline and decisions for the committee.')}</div>`);\n setEN(\"D'un parcours généraliste\",'Background','Academic path','From a broad psychology background to a multisensory PhD','The academic path progressively converged on perception, multisensory cognition and olfaction.',`<div class=\"timeline\"><div class=\"timeline-item\"><div class=\"timeline-dot\">20</div><h3>Literary Baccalaureate</h3><p>Mathematics specialization - Lycée Anna Judic, Semur-en-Auxois.</p></div><div class=\"timeline-item\"><div class=\"timeline-dot\">23</div><h3>BSc Psychology</h3><p>Cognitive and developmental psychology - UBE. Work on audio-spatial synesthesia, memory and human perception.</p></div><div class=\"timeline-item\"><div class=\"timeline-dot\">25</div><h3>MSc PSYCOEF</h3><p>M1 on odor and synchronization to auditory rhythm. M2 on expert-apprentice approaches to operational strategies.</p></div><div class=\"timeline-item\"><div class=\"timeline-dot\">PhD</div><h3>PhD</h3><p>Since 2025 - Cognitive Psychology, CSGA, DOCC team.</p></div></div>`);\n setEN('Un environnement qui combine','Background','Doctoral environment','A doctoral environment combining cognition, olfaction and methodology','The PhD is conducted at CSGA within the DOCC team and combines fundamental questions with experimental-method development.',`<div class=\"grid two\">${card('PhD','<strong>Is there a space-time for odors?</strong><br>Mechanisms of integration between olfaction, vision and audition.','dark')}${card('Supervision','<strong>Renaud Brochard</strong> - supervisor<br><strong>Arnaud Leleu</strong> - co-supervisor<br><br>Cognitive psychology, multisensory perception, timing and spatial representation.')}</div>`);\n setEN(\"L'olfaction complique\",'Theoretical framework','Olfactory timing','Olfaction complicates the temporal problem','In olfaction, software command, physical delivery, respiration and perceptual onset are not equivalent events.',`<div class=\"csi-context\"><div><div class=\"flow\"><div class=\"flow-card\"><span class=\"step\">1</span><h3>Command</h3><p>The experimental software sends the olfactometer instruction.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">2</span><h3>Delivery</h3><p>The odor travels according to flow and diffusion dynamics.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">3</span><h3>Perception</h3><p>Respiration and stimulus build-up determine effective access to the odor.</p></div></div><div class=\"grid four\" style=\"margin-top:20px\">${card('Respiration','Inspiratory onset becomes an experimental event that must be detected and logged.')}${card('Latency','The software command does not define perceptual onset.')}${card('Habituation','Repeated stimulation constrains duration, pauses and trial order.')}${card('Standardization','Flow, dilution, valence, intensity and arousal must be controlled.')}</div></div><div class=\"csi-float-stack\">${C.photo('CyNexo Sniff-0 - controlled olfactometry','https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto5.jpg')}${C.photo('Spir-0 - respiratory-cycle monitoring')}</div></div>${C.cite('(Gotow & Kobayakawa, 2017; Mainland & Sobel, 2006; Sela & Sobel, 2010)')}`);\n setEN('Dix études principales','Thesis project','Program architecture','Ten core studies, one shared logic','The projects are organized around two families of mechanisms rather than ten independent experiments.',`<div class=\"project-map\"><div class=\"axis-card\"><h3>Time and integration</h3><p>Temporal binding windows, perceived onset and offset, duration and temporal recalibration.</p><div class=\"project-pills\"><span class=\"project-pill\">TWIXAV <small>AV</small></span><span class=\"project-pill\">TWIXOLF <small>olfaction</small></span><span class=\"project-pill\">SOFT <small>onset/offset</small></span><span class=\"project-pill\">SORBET <small>recalibration</small></span></div></div><div class=\"axis-card\"><h3>Space and representation</h3><p>Spatial extension or restriction and the influence of odors on these mechanisms.</p><div class=\"project-pills\"><span class=\"project-pill\">VIBEX <small>vision</small></span><span class=\"project-pill\">OASIS <small>approach-avoidance</small></span><span class=\"project-pill\">SOLAR <small>cueing</small></span><span class=\"project-pill\">COBEX <small>congruence</small></span><span class=\"project-pill\">BRAUD <small>audition</small></span><span class=\"project-pill\">BRAUDOLF <small>audition + odor</small></span></div></div></div>`);\n setEN('Un effet net de la durée','Experimental program','TWIXAV - pretest','A clear effect of duration and temporal offset','Preliminary analyses show that simultaneity judgments depend on stimulus duration, SOA and their interaction.',`<div class=\"csi-study-grid\"><div><div class=\"result-strip\" style=\"grid-template-columns:1fr\"><div class=\"result\"><div class=\"pval\">p = .001</div><p>Duration effect</p></div><div class=\"result\"><div class=\"pval\">p &lt; .001</div><p>SOA effect</p></div><div class=\"result\"><div class=\"pval\">p = .001</div><p>Duration × SOA interaction</p></div></div><div class=\"callout\" style=\"margin-top:14px\"><strong>Mechanistic question:</strong> the observed asymmetry directly motivates SOFT.</div></div>${C.result('Final TWIXAV results','Curves by duration, PSS, FWHM and comparison of the two temporal directions.')}</div>${C.cite('(Powers et al., 2009; Stevenson et al., 2012)')}`);\n setEN('De la fenêtre audiovisuelle','Experimental program','Logical connection','From audiovisual binding to olfactory timing','TWIXAV provides the audiovisual reference; SOFT investigates the temporal asymmetry; TWIXOLF extends temporal binding to olfaction.',`<div class=\"flow\"><div class=\"flow-card\"><span class=\"step\">A</span><h3>TWIXAV</h3><p>Characterize an audiovisual simultaneity window.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">B</span><h3>SOFT</h3><p>Measure perceived onset, offset and duration more directly.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">C</span><h3>TWIXOLF</h3><p>Transfer the temporal-binding question to olfaction.</p></div></div>`);\n setEN('Les études futures prolongent','Perspectives','Temporal extensions','Future studies extend mechanisms already tested','SORBET and SOLAR remain conditional extensions and are not given the same priority as the core studies.',`<div class=\"grid two\">${card('SORBET','Temporal recalibration involving olfaction, after the temporal windows and sensory timing have been sufficiently characterized.')}${card('SOLAR','Olfactory spatial cueing and its influence on visual responses, if the core spatial results justify this extension.')}</div>`);\n setEN('Trois prolongements possibles','Perspectives','Spatial extensions','Three possible extensions around extension and restriction','COBEX, BRAUD and BRAUDOLF remain optional branches whose activation depends on results and feasibility.',`<div class=\"grid three\">${card('COBEX','Visual Boundary Extension under a congruent or incongruent odor.')}${card('BRAUD','Boundary Restriction in audition.')}${card('BRAUDOLF','Auditory Boundary Restriction with an olfactory component.')}</div>`);\n setEN('FLUXOLF -','Side project','Methodological side project','FLUXOLF - a useful methodological branch outside the core thesis','FLUXOLF examines music-odor interactions with physiological measures and supports development of EDA, HR and HRV pipelines.',`<div class=\"grid two\">${card('Data structure','Blocks N1, O1, O2, N2 and N3; BASELINE, STRESS, STIM and REST phases; BIOPAC acquisition.','dark')}${card('Analyses','Heart rate, EDA and HRV including RMSSD, SDNN, pNN50, meanNN and HF measures.')}</div><div class=\"callout\" style=\"margin-top:16px\"><strong>M1 thesis:</strong> Morgane.</div>`);\n setEN(\"État d'avancement\",'Experimental program','Current status','Current status of the core studies','TWIXAV and VIBEX have completed pretests; SOFT, OASIS and TWIXOLF are ready to launch.',`<div class=\"status-table\"><div class=\"status-row\"><div class=\"proj\">TWIXAV</div><span class=\"status done\">Pretest completed</span><div class=\"desc\">Preliminary analyses available.</div><div class=\"desc\">Finalize indices and figures.</div></div><div class=\"status-row\"><div class=\"proj\">VIBEX</div><span class=\"status done\">Pretest completed</span><div class=\"desc\">Functional paradigm.</div><div class=\"desc\">Consolidate analysis and dissemination.</div></div><div class=\"status-row\"><div class=\"proj\">SOFT</div><span class=\"status ready\">Ready to launch</span><div class=\"desc\">Multimodal architecture stabilized.</div><div class=\"desc\">Pilot then data collection.</div></div><div class=\"status-row\"><div class=\"proj\">OASIS</div><span class=\"status ready\">Ready to launch</span><div class=\"desc\">Olfactory and physiological chain prepared.</div><div class=\"desc\">Pilot then data collection.</div></div><div class=\"status-row\"><div class=\"proj\">TWIXOLF</div><span class=\"status ready\">Ready to launch</span><div class=\"desc\">Sniff-0 / Spir-0 architecture prepared.</div><div class=\"desc\">Pilot then data collection.</div></div></div>`);\n setEN('Une plateforme expérimentale','Methods','Shared infrastructure','A shared experimental platform rather than one setup per study','The first-year methodological choice was to share software, hardware and logging components across studies.',`<div class=\"grid four\">${card('Stimulation','PsychoPy Coder, participant display, operator display, auditory and visual stimulation.')}${card('Olfaction','CyNexo Sniff-0, flows, valves, cannulas, flushing and calibration.')}${card('Physiology','BIOPAC, EDA, ECG, respiration and additional measures depending on the study.')}${card('EEG','BioSemi ActiveTwo 128-channel EEG, TTL triggers and event synchronization.')}</div>`);\n setEN('Déclencher sur un événement physiologique','Methods','Respiration and olfaction','Triggering on a physiological event, not only a software event','For olfactory studies, the respiratory cycle becomes part of experimental control.',`<div class=\"grid two\">${card('Spir-0','Fiber-optic reading of the respiratory cycle. Inspiratory state is used to trigger stimulation.','dark')}${card('Two fixation strategies','Fixed-duration fixation followed by a blank until inspiration, or fixation maintained until a new respiratory cycle is detected.')}</div>`);\n setEN('Une seule logique de traitement','Methods','Analysis','One analysis logic adapted to each family of measures','Behavioral, EEG and physiological pipelines share reproducible principles while retaining study-specific analyses.',`<div class=\"grid three\">${card('Behavior','Within-participant aggregation, trial cleaning, repeated-measures analyses and corrected post-hoc tests.')}${card('EEG','Event-trigger synchronization, preprocessing and frequency-domain analyses tailored to the paradigm.')}${card('Physiology','HR, EDA, HRV and respiration segmented by experimental phase with artifact control.')}</div>`);\n setEN('Des sorties standardisées','Methods','Behavioral analysis','Standardized outputs across studies','The behavioral pipeline is organized as a reproducible chain rather than a sequence of manual analyses.',`<div class=\"flow\"><div class=\"flow-card\"><span class=\"step\">1</span><h3>Prepare</h3><p>Remove training trials and missing responses; verify participant IDs and conditions.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">2</span><h3>Aggregate</h3><p>Within-participant means, condition summaries and reaction-time checks.</p></div><div class=\"flow-arrow\">→</div><div class=\"flow-card\"><span class=\"step\">3</span><h3>Test</h3><p>Repeated-measures analyses, simple effects, corrected post-hoc comparisons and study-specific indices.</p></div></div>`);\n setEN('La robustesse du protocole','Methods','Data and ethics','Protocol robustness also includes participant burden','The quality of a multimodal study depends on preparation time, participant comfort, traceability and data protection.',`<div class=\"grid four\">${card('Data','Pseudonymization during processing and anonymization according to the data-management cycle.')}${card('Non-invasive measures','EEG, EDA, ECG, respiration and olfactometry in the planned protocols.')}${card('Participant burden','EEG preparation, pauses and total session duration are included in feasibility checks.')}${card('Documentation','Information sheets, consent forms, participant materials and ethics documentation.')}</div>`);\n setEN('Des développements logiciels','Methods','Research tools','Software developments designed to reduce research friction','The technical side projects directly support data collection, traceability, reproducibility and recruitment.',`<div class=\"grid four\">${card('Experimental dashboard','Reusable operator interface, participant screen, hardware states, tests, calibration and device logs.','dark')}${card('Lab Inventory','Inventory, locations, QR codes, transfers, histories and stock monitoring.')}${card('R / Quarto','Reproducible pipelines and modular generation of analyses, tables and figures.')}${card('Portfolio','Bilingual presentation of the PhD, projects, communications, recruitment and research tools.')}</div>`);\n setEN('Les principales difficultés','Methods','Experimental difficulties','The main difficulties have already changed the way the studies are designed','Olfactory synchronization, multiple devices and complex analyses have led to concrete methodological changes.',`<div class=\"grid two\"><div class=\"stack\"><div class=\"callout\"><strong>Olfactory synchronization:</strong> from a simple command timestamp to a model integrating respiration, physical delay and hardware logs.</div><div class=\"callout\"><strong>Multiple devices:</strong> from study-specific scripts to a modular architecture.</div><div class=\"callout\"><strong>Analyses:</strong> from isolated scripts to standardized R/Quarto pipelines.</div></div>${card('Change in perspective','The protocol is treated as a complete system synchronizing hardware, physiology, behavior, logs and analysis.','tint')}</div>`);\n setEN('La première année a aussi construit','Doctoral development','Skills','The first year also built a researcher profile','The skills developed can be grouped into four increasingly integrated roles.',`<div class=\"grid four\">${card('Researcher','Problem formulation, hypotheses, critical reading and construction of a multisensory research program.')}${card('Experimentalist','PsychoPy, EEG, EDA, ECG, respiration, olfactometry, TTL and hardware troubleshooting.')}${card('Analyst','R, Quarto, repeated-measures statistics, reproducible pipelines and standardized exports.')}${card('Tool builder','Dashboards, inventory, portfolio and reusable laboratory resources.')}</div>`);\n if(combined)combined._en=enObj(combined,'Doctoral development','First-year overview','Teaching and training - first-year overview','The 2025-2026 year combined university teaching with a structured doctoral-training program.',`<div class=\"grid two\"><div class=\"card dark\"><div class=\"big-number\" style=\"color:#fff\">60 h</div><div class=\"metric-label\" style=\"color:rgba(255,255,255,.8)\">credited tutorial-equivalent teaching</div><p style=\"margin-top:16px\">L1 and L3 teaching plus a 6-hour Master practical class not included in the credited total.</p></div><div class=\"card\"><div class=\"big-number\">60 h</div><div class=\"metric-label\">doctoral training</div><p style=\"margin-top:16px\">Six modules covering university pedagogy, career development, research integrity, documentation, AI and valorization.</p></div></div>`);\n setEN('Passer de prototypes','Year 2','Scientific outputs','From prototypes and pretests to scientific outputs','The next months should convert the most mature elements of the program into locked analyses, presentations and manuscripts.',`<div class=\"grid three\">${card('Consolidate','Finalize TWIXAV and VIBEX as clean, documented reference datasets.')}${card('Collect','Launch the core olfactory studies with validated hardware, respiration control and participant burden.')}${card('Disseminate','Convert sufficiently mature results into communications, manuscripts or methodological contributions.')}</div>`);\n setEN('Un horizon court','Year 2','2026-2027 priorities','A short-term horizon focused on consolidation','The next cycle prioritizes consolidation of the core program before any further expansion.',`<div class=\"grid four\">${card('TWIXAV','Finalize analyses and temporal indices.','dark')}${card('VIBEX','Consolidate the analysis and prepare the short paper.')}${card('SOFT, OASIS, TWIXOLF','Launch pilots and data collection according to the operational timeline.')}${card('Shared tools','Maintain only developments that directly support data collection and reproducibility.')}</div>`);\n setEN('Une progression conditionnelle','Year 2','Roadmap','Conditional progression rather than a rigid schedule','Future studies are activated according to results and feasibility so that a robust core remains fully analyzable.',`<div class=\"roadmap\"><div class=\"roadmap-card\"><div class=\"year\">2026-2027</div><h3>Validate and collect</h3><ul><li>SOFT, OASIS and TWIXOLF</li><li>Finalize TWIXAV and VIBEX</li><li>Ethics, recruitment and support materials</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">2027</div><h3>Analyze and communicate</h3><ul><li>Behavioral, EEG and physiological analyses</li><li>Manuscripts</li><li>FJC and JDD</li></ul></div><div class=\"roadmap-card\"><div class=\"year\">2027-2028</div><h3>Extend and write</h3><ul><li>Conditional extensions</li><li>Thesis writing</li><li>Publications and defense preparation</li></ul></div></div>`);\n setEN('Construire progressivement un profil','Career','Academic career','Building an academic teaching-research profile','The intended trajectory combines autonomous research, teaching, experimental methods and collective contribution.',`<div class=\"grid four\">${card('Research','Develop an autonomous program on multisensory cognition, olfaction, attention and timing.')}${card('Teaching','Teach cognitive psychology, neuroscience, methodology, statistics and experimentation.')}${card('Collective contribution','Supervise students, contribute to platforms and maintain shared laboratory resources.')}${card('Autonomy','Turn research projects, teaching and communication into evidence of independent project leadership.','dark')}</div>`);\n setEN('Les décisions les plus utiles','Discussion','Questions for the committee','The most useful decisions to discuss today','The committee can help arbitrate between scientific ambition, experimental feasibility and effective scientific output.',`<div class=\"question-list\"><div class=\"question\"><div><strong>Scientific prioritization</strong><br>Which studies are indispensable and which should remain conditional extensions?</div></div><div class=\"question\"><div><strong>Feasibility</strong><br>Are SOFT participant burden, hardware constraints and the data-collection timeline compatible with Year 2 objectives?</div></div><div class=\"question\"><div><strong>Dissemination</strong><br>What order should be prioritized for analyses, communications and first manuscripts?</div></div><div class=\"question\"><div><strong>Doctoral development</strong><br>How should teaching, training, tools and outreach be balanced with scientific production?</div></div></div>`);\n setEN('Une première année passée','Conclusion','Take-home message','A first year moving from the question to the infrastructure','The program is now structured around reference studies, identified technical dependencies and shared tools.',`<div class=\"grid three\">${card('A coherent question','Understand how olfaction fits into multisensory spatiotemporal organization.','dark')}${card('A functional infrastructure','Pretests, multimodal hardware, respiration control, analyses and shared tools are converging.')}${card('A clear priority','Transform the breadth of the program into a focused set of robust, analyzable and publishable studies.')}</div>`);\n setEN('Glossaire des projets','Appendix','Appendix A','Project glossary','Compact project glossary for questions.',`<div class=\"grid two\">${card('TWIXAV','Temporal Window of Integration in Audition-Vision.')}${card('TWIXOLF','Temporal Window of Integration in Olfaction.')}${card('VIBEX','Visual Boundary Extension.')}${card('OASIS','Olfactory Approach-Avoidance Sensitivity in Space.')}${card('SOLAR','Spatial Olfactory Cueing of Visual Responses.')}${card('COBEX','Congruent Olfactory Boundary Extension.')}${card('BRAUD','Boundary Restriction in Audition.')}${card('BRAUDOLF','Boundary Restriction in Audition and Olfaction.')}${card('SORBET','Olfactory Recalibration of Subjective Event Timing.')}${card('SOFT','Sensory Onset Offset Task.')}</div>`);\n setEN('SOFT - paramètres techniques','Appendix','Appendix B','SOFT - current technical parameters','Technical details available for questions about SOFT.',`<div class=\"grid three\">${card('Durations','Selectable duration series according to the retained version.')}${card('Orders','24 selectable block orders or pseudo-randomization without two consecutive identical modalities.')}${card('ITI','Standard or custom inter-trial intervals with repetition multiplier.')}${card('Calibration','Olfactory flow calibration sequence.')}${card('EEG TTL','8-bit event coding with reserved technical values.')}${card('Logs','Onset, offset, press, release, hardware states and calibration events.')}</div>`);\n setEN('Configuration physiologique et EEG','Appendix','Appendix C','Physiological and EEG configuration','Summary of the acquisition setup used when peripheral or brain measures are included.',`<div class=\"grid four\">${card('EEG','BioSemi ActiveTwo, 128 electrodes plus reference channels.')}${card('EDA','Electrodes on the index and middle fingers of the left hand.')}${card('ECG','Three electrodes: right clavicle, left flank and right flank.')}${card('Respiration','Cannulas and fiber-optic Spir-0 readout depending on the protocol.')}</div>`);\n setEN('Bibliothèque de stimuli olfactifs','Appendix','Appendix D','Candidate olfactory stimulus library','Candidate odorants and diluents for pretesting; not every stimulus is used in every study.',`<div class=\"grid four\">${card('Essential oils','Lavender, lemon, peppermint, eucalyptus.')}${card('Flavors / aromas','Strawberry, coffee, lemon, lime.')}${card('Synthetic odorants','Phenethyl alcohol, butyric acid, isovaleric acid.')}${card('Diluents','Propylene glycol, mineral oil, distilled water.')}</div>`);\n setEN('Règles communes du pipeline comportemental','Appendix','Appendix E','Common behavioral-pipeline rules','Shared preprocessing, aggregation and statistical-analysis principles.',`<div class=\"grid two\">${card('Preprocessing','Remove training trials and missing responses, check reaction times at participant level, and aggregate within participant before group analyses.')}${card('Statistics and outputs','Repeated-measures analyses, corrected post-hoc comparisons, APA tables, standardized figures and non-zero formatted p-values.')}</div>`);\n const appendix=slides.filter(s=>s.appendix),thanks=C.thanks,main=slides.filter(s=>!s.appendix&&s!==thanks);const desired=[\"Y a-t-il un espace ysiologie');set(hw,'lead','Les dispositifs sont regroupés afin de rendre explicite la chaîne instrumentale et les contraintes de synchronisation propres aux protocoles multisensoriels.');set(hw,'content',`<div class=\"csi-hardware-grid\"><article class=\"csi-hw\"><div class=\"pic\"><img src=\"https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto5.jpg\" alt=\"CyNexo Sniff-0\"></div><span class=\"tag\">Olfactométrie</span><h3>CyNexo Sniff-0 / Spir-0</h3><p>Administration contrôlée des odeurs et synchronisation sur le cycle respiratoire.</p><ul><li>débit, valves et flush</li><li>déclenchement sur inspiration</li><li>logs des délais de stimulation</li></ul></article><article class=\"csi-hw\"><div class=\"pic\"><img src=\"https://www.biosemi.com/pics/cap_128_medium1_large.jpg\" alt=\"BioSemi ActiveTwo\"></div><span class=\"tag\">EEG</span><h3>BioSemi ActiveTwo</h3><p>Acquisition EEG haute densité lorsque la dynamique électrophysiologique est informative.</p><ul><li>128 canaux + références</li><li>marqueurs synchronisés</li><li>contrôle du timing et des artefacts</li></ul></article><article class=\"csi-hw\"><div class=\"pic\"><img src=\"https://sensorlab.arizona.edu/sites/default/files/styles/az_card_image/public/2023-06/biopac.jpg.webp?itok=KDhaWerq\" alt=\"BIOPAC MP160\"></div><span class=\"tag\">Psychophysiologie</span><h3>BIOPAC / BioNomadix</h3><p>Mesures autonomes et périphériques complémentaires au comportement.</p><ul><li>EDA, ECG, EMG et SKT</li><li>AcqKnowledge</li><li>marqueurs TTL</li></ul></article></div>${refs('Mainland & Sobel, 2006 ; Zelano et al., 2016 ; Luck, 2014 ; Boucsein, 2012 ; Shaffer & Ginsberg, 2017.')}`);}\n\n/* Rétroplanning : OASIS avant TWIXOLF. */\nconst retro=by('Rétroplanning des études centrales');if(retro){set(retro,'lead','La séquence opérationnelle retenue est SOFT, puis OASIS, puis TWIXOLF, tandis que TWIXAV et VIBEX avancent en parallèle sur l’analyse et la valorisation.');set(retro,'content',`<div class=\"csi-retro\"><div><div class=\"csi-date\">Sept-Oct 2026</div><h3>SOFT - pilote</h3><p>Validation de la passation, du timing, des triggers et de la charge participant.</p></div><div><div class=\"csi-date\">Oct-Déc 2026</div><h3>SOFT - collecte</h3><p>Collecte prioritaire et analyses intermédiaires.</p></div><div><div class=\"csi-date\">Jan-Mars 2027</div><h3>OASIS</h3><p>Pilote puis collecte spatiale olfactive.</p></div><div><div class=\"csi-date\">Avr-Juin 2027</div><h3>TWIXOLF</h3><p>Pilote puis collecte temporelle olfactive.</p></div><div><div class=\"csi-date\">En parallèle</div><h3>TWIXAV + VIBEX</h3><p>Analyses finales, figures, rédaction et valorisation.</p></div><div><div class=\"csi-date\">2027-2028</div><h3>Extensions</h3><p>Uniquement selon résultats et faisabilité.</p></div></div>`);}\n\n/* Communications prévues. */\nconst comm=by('Communications envisagées');if(comm){set(comm,'lead','Les actions de diffusion sont placées après le calendrier expérimental afin de conserver une progression chronologique : contraintes, collectes, analyses, puis valorisation.');set(comm,'content',`<div class=\"csi-diffusion\"><div class=\"csi-diff\"><div class=\"dot\">09</div><h3>Nuit des chercheurs</h3><p>Septembre 2026</p></div><div class=\"csi-diff\"><div class=\"dot\">10</div><h3>Fête de la Science</h3><p>Octobre 2026</p></div><div class=\"csi-diff\"><div class=\"dot\">03</div><h3>Expérimentarium</h3><p>Mars 2027</p></div><div class=\"csi-diff\"><div class=\"dot\">06</div><h3>FJC</h3><p>Juin 2027</p></div><div class=\"csi-diff\"><div class=\"dot\">06</div><h3>JDD</h3><p>Juin 2027</p></div></div>`);}\n\n/* Arbitrages : 2 colonnes pour éviter tout débordement hors plein écran. */\nconst dec=by('Les arbitrages les plus utiles')||by('Les décisions les plus utiles');if(dec){const item=(n,t,p)=>`<article class=\"csi-v14-decision\"><b>${n}</b><div><h3>${t}</h3><p>${p}</p></div></article>`;set(dec,'lead','Le CSI peut surtout aider à sécuriser les choix qui conditionnent la faisabilité de l’année 2 Page('FLUXOLF',{\n    statusFr:'Analyses en cours',statusEn:'Analyses ongoing',statusKind:'progress',\n    principleFr:\"Étudier les réponses physiologiques et électrophysiologiques dans un contexte intermodal musique-odeur.\",\n    principleEn:'Study physiological and electrophysiological responses in a crossmodal music-odor context.',\n    hypFr:\"Les conditions odeur, musique et odeur + musique devraient moduler l'arousal et les indices autonomes par rapport au contrôle, avec de possibles interactions.\",\n    hypEn:'Odor, music and odor + music conditions should modulate arousal and autonomic indices relative to control, with possible interactions.',\n    designFr:'Phases baseline, stress, stimulation et repos; conditions contrôle, odeur, musique et combinaison.',\n    designEn:'Baseline, stress, stimulation and rest phases; control, odor, music and combined conditions.',\n    measureFr:'EDA, HR, HRV, RMSSD, SDNN, pNN50, meanNN, HF et EEG selon le pipeline.',\n    measureEn:'EDA, HR, HRV, RMSSD, SDNN, pNN50, meanNN, HF and EEG depending on the pipeline.',\n    extraFr:'<div class=\"v16-callout\"><strong>Rôle dans la thèse :</strong> projet annexe utilisé comme terrain méthodologique pour fiabiliser les analyses physiologiques et les triggers.</div>',\n    extraEn:'<div class=\"v16-callout\"><strong>Role in the PhD:</strong> side project used as a methodological test bed to improve physiological analyses and trigger handling.</div>',\n    refs:'Boucsein, 2012; Shaffer & Ginsberg, 2017; Task Force, 1996.'\n  });\n  fresh.push(bi('Année 1',{kicker:'Projet annexe',title:'FLUXOLF',lead:'Un projet méthodologique utile, mais distinct du noyau expérimental de STOLF.',content:p.fr,notes:'Rappeler le statut annexe et l\\'apport méthodologique.'},{kicker:'Side project',title:'FLUXOLF',lead:'A useful methodological project, but separate from the experimental core of STOLF.',content:p.en,notes:'Recall its side-project status and methodological contribution.'},'FLUXOLF'));\n\n  fresh.push(bi('Année 1',{\n    kicker:'Activités doctorales',title:'Enseignement, formation et encadrement',lead:'Les activités doctorales ont été développées en parallèle des travaux expérimentaux.',\n    content:`<div class=\"v16-activity\"><article><b>54 h eq. TD</b><h3>Enseignement</h3><p>40 h de méthodologie expérimentale en L1 et 14 h de TER en L3. Les 6 h de TP Master sont affichées séparément du total.</p></article><article><b>60 h</b><h3>Formation doctorale</h3><p>Pédagogie universitaire, enseignement, IA et éducation, intégrité scientifique, intelligence économique et Zotero.</p></article><article><b>M1</b><h3>Encadrement</h3><p>Accompagnement de projets de Master autour des paradigmes temporels et de Boundary Extension.</p></article></div>`,\n    notes:'Rester synthétique. Le but est de montrer la construction du profil doctoral, pas de détailler chaque séance.'\n  },{\n    kicker:'Doctoral activities',title:'Teaching, training and supervision',lead:'Doctoral activities were developed in parallel with experimental work.',\n    content:`<div class=\"v16-activity\"><article><b>54 tutorial-equivalent h</b><h3>Teaching</h3><p>40 h of experimental methodology in Year 1 undergraduate courses and 14 h of Year 3 research tutorials. The 6 h of Master's practical classes are shown separately from the total.</p></article><article><b>60 h</b><h3>Doctoral training</h3><p>University pedagogy, teaching, AI and education, research integrity, economic intelligence and Zotero.</p></article><article><b>M1</b><h3>Supervision</h3><p>Supervision of Master's projects around temporal paradigms and Boundary Extension.</p></article></div>`,\n    notes:'Keep it concise. The goal is to show the construction of the doctoral profile, not to detail each session.'\n  }));\n\n  fresh.push(bi('Méthodes',{\n    kicker:'Instrumentation',title:'Plateforme expérimentale',lead:'La difficulté principale est de faire fonctionner une chaîne multimodale avec des événements temporels comparables et traçables.',\n    content:`<div class=\"v16-hardware\"><article><img src=\"https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto5.jpg\" alt=\"CyNexo\"><span>Olfactométrie</span><h3>CyNexo Sniff-0 / Spir-0</h3><p>Délivrance contrôlée, suivi respiratoire et déclenchement sur inspiration.</p></article><article><img src=\"https://www.biosemi.com/pics/cap_128_medium1_large.jpg\" alt=\"BioSemi ActiveTwo\"><span>EEG</span><h3>BioSemi ActiveTwo</h3><p>EEG haute densité, marqueurs événementiels et synchronisation avec la tâche.</p></article><article><img src=\"https://sensorlab.arizona.edu/sites/default/files/styles/az_card_image/public/2023-06/biopac.jpg.webp?itok=KDhaWerq\" alt=\"BIOPAC\"><span>Psychophysiologie</span><h3>BIOPAC / BioNomadix</h3><p>EDA, ECG, EMG, SKT et marqueurs TTL synchronisés.</p></article></div>${ref('Mainland & Sobel, 2006; Luck, 2014; Boucsein, 2012; Shaffer & Ginsberg, 2017.')}`,\n    notes:'Montrer les appareils comme une chaîne de mesure, et non comme une liste de matériel.'\n  },{\n    kicker:'Instrumentation',title:'Experimental platform',lead:'The main challenge is to operate a multimodal chain with comparable and traceable temporal events.',\n    content:`<div class=\"v16-hardware\"><article><img src=\"https://www.cynexo.com/wp-content/uploads/2018/09/sniff-O-foto5.jpg\" alt=\"CyNexo\"><span>Olfactometry</span><h3>CyNexo Sniff-0 / Spir-0</h3><p>Controlled delivery, respiratory monitoring and triggering on inspiration.</p></article><article><img src=\"https://www.biosemi.com/pics/cap_128_medium1_large.jpg\" alt=\"BioSemi ActiveTwo\"><span>EEG</span><h3>BioSemi ActiveTwo</h3><p>High-density EEG, event markers and synchronization with the task.</p></article><article><img src=\"https://sensorlab.arizona.edu/sites/default/files/styles/az_card_image/public/2023-06/biopac.jpg.webp?itok=KDhaWerq\" alt=\"BIOPAC\"><span>Psychophysiology</span><h3>BIOPAC / BioNomadix</h3><p>EDA, ECG, EMG, SKT and synchronized TTL markers.</p></article></div>${ref('Mainland & Sobel, 2006; Luck, 2014; Boucsein, 2012; Shaffer & Ginsberg, 2017.')}`,\n    notes:'Show the devices as a measurement chain, not as a list of equipment.'\n  }));\n\n  fresh.push(bi('Méthodes',{\n    kicker:'Retour d’expérience',title:'Problèmes rencontrés et solutions',lead:'Les difficultés de la première année ont surtout porté sur le timing olfactif, la synchronisation matérielle et la robustesse des sessions.',\n    content:`<div class=\"v16-issues\"><header><span>Problème</span><span>Solution mise en place</span><span>Point restant</span></header>\n      <div><strong>Onset olfactif incertain</strong><p>La commande logicielle ne correspond pas directement à l'arrivée perceptive.</p><p>Déclenchement sur inspiration, séparation commande / délivrance / estimation d'onset et logs dédiés.</p><p>Valider les latences physiques sur les configurations finales.</p></div>\n      <div><strong>Plusieurs appareils à synchroniser</strong><p>EEG, BIOPAC, olfactomètre, respiration et PsychoPy doivent partager les mêmes événements.</p><p>Codage unifié des triggers, TTL, horodatage centralisé et tests pré-session.</p><p>Maintenir une procédure de contrôle systématique avant collecte.</p></div>\n      <div><strong>Compatibilité et pannes</strong><p>Matériel ancien, pilotes, ports série et PC expérimental imposent des contraintes fortes.</p><p>Contrôleurs modulaires, reconnexion, fail-safe, dashboards et configurations explicites.</p><p>Prévoir matériel de secours et environnement logiciel figé.</p></div>\n      <div><strong>Charge participant</strong><p>Sessions longues, EEG, physiologie et olfaction augmentent fatigue et habituation.</p><p>Blocs, pauses, ITI contrôlés et critères de simplification testés au pilote.</p><p>Fixer la durée maximale acceptable après SOFT pilote.</p></div>\n      <div><strong>Analyses complexes</strong><p>Multiplication des conditions, mesures et sorties augmente le risque d'erreurs.</p><p>Pipelines reproductibles, agrégation intra-sujet, exports standardisés et versionnement.</p><p>Conserver des analyses principales parcimonieuses et des extensions clairement secondaires.</p></div>\n    </div>`,\n    notes:'Cette diapositive doit montrer que les problèmes ont produit des solutions concrètes. Distinguer ce qui est résolu de ce qui doit encore être validé.'\n  },{\n    kicker:'Lessons learned',title:'Problems encountered and solutions',lead:'First-year difficulties mainly concerned olfactory timing, hardware synchronization and session robustness.',\n    content:`<div class=\"v16-issues\"><header><span>Problem</span><span>Implemented solution</span><span>Remaining point</span></header>\n      <div><strong>Uncertain olfactory onset</strong><p>The software command does not directly correspond to perceptual arrival.</p><p>Triggering on inspiration, separation of command / delivery / onset estimate, and dedicated logs.</p><p>Validate physical latencies on final configurations.</p></div>\n      <div><strong>Several devices to synchronize</strong><p>EEG, BIOPAC, olfactometer, respiration and PsychoPy must share the same events.</p><p>Unified trigger coding, TTL, centralized timestamps and pre-session tests.</p><p>Maintain a systematic control procedure before data collection.</p></div>\n      <div><strong>Compatibility and failures</strong><p>Legacy hardware, drivers, serial ports and the experimental PC impose strong constraints.</p><p>Modular controllers, reconnection, fail-safe behavior, dashboards and explicit configurations.</p><p>Provide backup hardware and a frozen software environment.</p></div>\n      <div><strong>Participant burden</strong><p>Long sessions, EEG, physiology and olfaction increase fatigue and habituation.</p><p>Blocks, breaks, controlled ITIs and simplification criteria tested in the pilot.</p><p>Set the maximum acceptable duration after the SOFT pilot.</p></div>\n      <div><strong>Complex analyses</strong><p>Many conditions, measures and outputs increase the risk of errors.</p><p>Reproducible pipelines, within-participant aggregation, standardized exports and version control.</p><p>Keep primary analyses parsimonious and clearly label secondary extensions.</p></div>\n    </div>`,\n    notes:'This slide should show that problems produced concrete solutions. Distinguish what is solved from what still needs validation.'\n  }));\n\n  fresh.push(bi('Méthodes',{\n    kicker:'Bilan',title:'Ce que l’année 1 a sécurisé',lead:'La plateforme est suffisamment structurée pour passer d’une phase de prototypage à une phase de collectes priorisées.',\n    content:`<div class=\"v16-checks\"><article><b>01</b><h3>Timing</h3><p>Logs, triggers et gestion respiratoire explicités.</p></article><article><b>02</b><h3>Instrumentation</h3><p>Contrôleurs séparés et tests matériels avant session.</p></article><article><b>03</b><h3>Analyse</h3><p>Pipelines comportementaux et physiologiques reproductibles.</p></article><article><b>04</b><h3>Priorisation</h3><p>SOFT, OASIS puis TWIXOLF comme séquence opérationnelle.</p></article></div>`,\n    notes:'Faire la transition entre bilan de première année et programme de deuxième année.'\n  },{\n    kicker:'Review',title:'What year 1 secured',lead:'The platform is structured enough to move from prototyping to prioritized data collection.',\n    content:`<div class=\"v16-checks\"><article><b>01</b><h3>Timing</h3><p>Logs, triggers and respiratory handling made explicit.</p></article><article><b>02</b><h3>Instrumentation</h3><p>Separate controllers and hardware tests before sessions.</p></article><article><b>03</b><h3>Analysis</h3><p>Reproducible behavioral and physiological pipelines.</p></article><article><b>04</b><h3>Prioritization</h3><p>SOFT, OASIS then TWIXOLF as the operational sequence.</p></article></div>`,\n    notes:'Transition from the first-year review to the second-year program.'\n  }));\n\n  fresh.push(bi('Année 2',{\n    kicker:'Priorités 2026-2027',title:'Trois études prioritaires',lead:'L’année 2 est organisée autour de trois collectes centrales, dans un ordre dicté par la faisabilité méthodologique.',\n    content:`<div class=\"v16-priority\"><article data-study=\"SOFT\"><span>1</span><h3>SOFT</h3><p>Septembre - décembre 2026</p><small>Verrou temporel et charge de session.</small></article><article data-study=\"OASIS\"><span>2</span><h3>OASIS</h3><p>Janvier - mars 2027</p><small>Étude spatiale olfactive prioritaire.</small></article><article data-study=\"TWIXOLF\"><span>3</span><h3>TWIXOLF</h3><p>Avril - juin 2027</p><small>Fenêtre temporelle impliquant l’olfaction.</small></article></div><div class=\"v16-callout\"><strong>Principe d’organisation :</strong> les analyses et la rédaction de TWIXAV et VIBEX continuent en parallèle, sans interrompre les collectes prioritaires.</div>`,\n    notes:'Rappeler explicitement que OASIS passe avant TWIXOLF dans le calendrier.'\n  },{\n    kicker:'2026-2027 priorities',title:'Three priority studies',lead:'Year 2 is organized around three central data collections, in an order determined by methodological feasibility.',\n    content:`<div class=\"v16-priority\"><article data-study=\"SOFT\"><span>1</span><h3>SOFT</h3><p>September - December 2026</p><small>Temporal bottleneck and session burden.</small></article><article data-study=\"OASIS\"><span>2</span><h3>OASIS</h3><p>January - March 2027</p><small>Priority olfactory spatial study.</small></article><article data-study=\"TWIXOLF\"><span>3</span><h3>TWIXOLF</h3><p>April - June 2027</p><small>Temporal window involving olfaction.</small></article></div><div class=\"v16-callout\"><strong>Organizational principle:</strong> analyses and writing for TWIXAV and VIBEX continue in parallel without interrupting priority data collection.</div>`,\n    notes:'Explicitly recall that OASIS comes before TWIXOLF in the schedule.'\n  }));\n\n  p=studyPage('SOFT',{\n    statusFr:'Pilote - automne 2026',statusEn:'Pilot - autumn 2026',statusKind:'progress',\n    principleFr:\"Comparer la précision avec laquelle le début, la fin et la durée d'un stimulus sont perçus en audition, vision et olfaction.\",\n    principleEn:'Compare the precision with which stimulus onset, offset and duration are perceived in audition, vision and olfaction.',\n    hypFr:\"Les modalités diffèrent dans la précision de l'onset et de l'offset; l'olfaction devrait présenter une variabilité temporelle plus importante, susceptible de contribuer aux asymétries de liaison.\",\n    hypEn:'Modalities differ in onset and offset precision; olfaction should show greater temporal variability, which may contribute to binding asymmetries.',\n    designFr:'Réponse maintenue entre onset et offset perçus, plusieurs durées, blocs unimodaux ou pseudo-randomisés, déclenchement olfactif sur inspiration.',\n    designEn:'Response held between perceived onset and offset, several durations, unimodal or pseudorandomized blocks, olfactory triggering on inspiration.',\n    measureFr:'Erreur onset, erreur offset, erreur de durée, variabilité intra-sujet, EEG et physiologie selon faisabilité.',\n    measureEn:'Onset error, offset error, duration error, within-participant variability, EEG and physiology depending on feasibility.',\n    extraFr:'<div class=\"v16-callout\"><strong>Décision du pilote :</strong> déterminer la durée maximale de session et la place exacte de l’EEG / physiologie avant la collecte complète.</div>',\n    extraEn:'<div class=\"v16-callout\"><strong>Pilot decision:</strong> determine maximum session duration and the exact role of EEG / physiology before full data collection.</div>',\n    refs:'Vroomen & Keetels, 2010; Kopp-Scheinpflug et al., 2018; Van Pelt et al., 2025; Mainland & Sobel, 2006.'\n  });\n  fresh.push(bi('Année 2',{kicker:'Axe 1 - priorité 1',title:'SOFT',lead:'Mesurer le temps propre de chaque modalité.',content:p.fr,notes:'Insister sur le lien direct avec l\\'asymétrie observée dans TWIXAV et sur le rôle du pilote.'},{kicker:'Axis 1 - priority 1',title:'SOFT',lead:'Measure the intrinsic timing of each modality.',content:p.en,notes:'Emphasize the direct link with the asymmetry observed in TWIXAV and the role of the pilot.'},'SOFT'));\n\n  p=studyPage('OASIS',{\n    statusFr:'Collecte prévue - T1 2027',statusEn:'Planned collection - Q1 2027',statusKind:'future',\n    principleFr:\"Tester si la valence olfactive et les tendances d'approche-évitement modifient la représentation spatiale d'une scène.\",\n    principleEn:'Test whether olfactory valence and approach-avoidance tendencies modify the spatial representation of a scene.',\n    hypFr:\"Une odeur négative pourrait favoriser une représentation plus restreinte, tandis qu'une odeur positive pourrait favoriser une représentation plus étendue; la direction exacte reste à tester.\",\n    hypEn:'A negative odor may favor a more restricted representation, whereas a positive odor may favor a more extended representation; the exact direction remains to be tested.',\n    designFr:'Scènes visuelles associées à des odeurs positives, négatives ou neutres; comparaison de limites mémorisées et réponses d’approche-évitement.',\n    designEn:'Visual scenes associated with positive, negative or neutral odors; comparison of remembered boundaries and approach-avoidance responses.',\n    measureFr:'Indice spatial, exactitude, RT, ratings de valence / arousal, EDA et ECG selon configuration.',\n    measureEn:'Spatial index, accuracy, RT, valence / arousal ratings, EDA and ECG depending on configuration.',\n    extraFr:'<div class=\"v16-callout\"><strong>Position dans le calendrier :</strong> OASIS est lancé avant TWIXOLF afin de répartir la charge technique et de sécuriser progressivement la chaîne olfactive.</div>',\n    extraEn:'<div class=\"v16-callout\"><strong>Position in the schedule:</strong> OASIS is launched before TWIXOLF to distribute technical load and progressively secure the olfactory chain.</div>',\n    refs:'Intraub & Richardson, 1989; Takarangi et al., 2016; Bainbridge & Baker, 2020; Rekow et al.     async function start(){
