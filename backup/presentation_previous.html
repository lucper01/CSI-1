<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>CSI 1 - sauvegarde précédente</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #presentation{display:block;width:100%;height:100%;border:0;background:#07130f}
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#07130f;color:#edf8f0}.box{padding:24px 28px;border:1px solid rgba(255,255,255,.15);border-radius:22px;background:rgba(255,255,255,.06)}
  </style>
</head>
<body>
  <div id="boot"><div class="box">Chargement de la sauvegarde précédente...</div></div>
  <iframe id="presentation" title="CSI 1 - sauvegarde précédente" allowfullscreen></iframe>
  <script>
  (()=>{
    const SOURCE='aeaf79c79eda7e1e984ff867fbc231a99aa35c88';
    const ROOT=`https://raw.githubusercontent.com/lucper01/CSI-1/${SOURCE}/`;
    const files=['csi-v11-core.js','csi-v11-doctoral.js','csi-v11-ui.js','csi-v11-enfix.js','csi-v11-polish.js','csi-v11-clean.js','csi-v12.js'];
    const frame=document.getElementById('presentation'),boot=document.getElementById('boot');
    const get=async path=>{const r=await fetch(ROOT+path,{cache:'force-cache'});if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);return r.text()};
    Promise.all([get('presentation-base.html'),...files.map(get)]).then(([base,...scripts])=>{
      scripts.forEach((code,i)=>(0,eval)(`${code}\n//# sourceURL=previous-${files[i]}`));
      frame.addEventListener('load',()=>setTimeout(()=>boot.remove(),220),{once:true});
      frame.srcdoc=base;
    }).catch(e=>{boot.querySelector('.box').textContent='Erreur de chargement de la sauvegarde : '+e.message});
  })();
  </script>
</body>
</html>
